<h2 id="refaktoryzacja-a-zmiana-projektu">Refaktoryzacja a zmiana projektu</h2>
<ul>
<li>Refaktoryzacja zachowuje obserwowalne zachowanie w przyjętej granicy - wprowadzenie wzorca tego nie zmienia.</li>
<li>Kusi, by przy okazji dodać warianty, zmienić obsługę nieznanego kodu, przejść na asynchroniczność lub kontynuować po błędzie listenera.</li>
<li>Podobnie kuszą: dowolna liczba odbiorców, cache i współdzielenie instancji, zmiana formatu trwałych danych.</li>
<li>Każdy taki krok może być wartościowy, ale jest <strong>rozszerzeniem zachowania</strong> - należy go oddzielić od transformacji strukturalnej i zatwierdzić osobno.</li>
</ul>
</section>

<h2 id="co-trzeba-zachowa%C4%87">Co trzeba zachować</h2>
<ul>
<li>Sama wartość zwracana to za mało: liczy się dokładny typ wyjątku (i komunikat, jeśli jest kontraktem) oraz stan obiektu po sukcesie i po błędzie.</li>
<li>Liczba i kolejność efektów ubocznych, moment wyboru wariantu i odczytu konfiguracji muszą pozostać takie same.</li>
<li>W callbackach ważne są: wątek wykonania, kolejność odbiorców, polityka błędów i tożsamość przekazanego obiektu.</li>
<li>Trzeba też zachować zachowanie dla <code>null</code>, wartości nieznanej i gałęzi domyślnej, atomowość przejść i używany monitor.</li>
<li>Nie wolno zapominać o zgodności danych, refleksji i publicznego API.</li>
</ul>
</section>

<h2 id="bezpieczna-p%C4%99tla-pracy">Bezpieczna pętla pracy</h2>
<ol>
<li>Nazwij konkretny problem w aktualnym kodzie i zapisz granicę obserwowalnego zachowania.</li>
<li>Dodaj test charakterystyki dla każdej gałęzi i każdej awarii.</li>
<li>Wprowadź minimalny kontrakt, początkowo delegujący do starego kodu.</li>
<li>Przenoś jedną gałąź, odpowiedzialność albo efekt naraz i po każdym ruchu uruchamiaj mały zestaw testów.</li>
<li>Stary warunek lub klasę usuń dopiero po migracji wszystkich klientów.</li>
<li>W osobnym kroku oceń uproszczenie i usuń niepotrzebne elementy wzorca.</li>
</ol>
</section>

<h2 id="istotne-mechanizmy-javy-25">Istotne mechanizmy Javy 25</h2>
<ul>
<li>Interfejs funkcyjny pozwala na lambdę, ale nie może być <code>sealed</code>; <code>sealed</code> służy zamkniętemu modelowi domenowemu, a nie otwartemu punktowi wstrzykiwania strategii.</li>
<li>Lambda nie ma stabilnej tożsamości - nie porównuj jej przez <code>==</code>, nie używaj jako monitora i nie wyrejestrowuj listenera „taką samą” nową lambdą.</li>
<li>Rekord jest płytko niemutowalny, dlatego <code>DeploymentGroup</code> kopiuje listę przez <code>List.copyOf</code>.</li>
<li><code>List.copyOf</code>/<code>Map.copyOf</code> dają niemodyfikowalne widoki i odrzucają <code>null</code>, ale nie gwarantują nowej tożsamości ani nie chronią samych elementów.</li>
<li><code>sealed</code> nie czyni obiektów niemutowalnymi ani bezpiecznymi wątkowo, a <code>volatile</code> daje widoczność referencji, nie atomowość sekwencji przejścia.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="replace-conditional-logic-with-strategy---intencja">Replace Conditional Logic with Strategy - intencja</h2>
<ul>
<li>Strategy zastępuje warunek wybierający jeden z kilku wariantów algorytmu; kontekst zachowuje proces i wspólną walidację, a obliczenie deleguje do polityki.</li>
<li>Dobry kandydat ma kilka wariantów tego samego obliczenia, wybieranych niezależnie od klasy obiektu domenowego.</li>
<li>Nowe warianty pojawiają się częściej niż zmienia się otaczający proces, a test algorytmu nie wymaga całego kontekstu.</li>
<li>Wybór wariantu może zostać wykonany na granicy składania aplikacji.</li>
<li>Samo <code>if</code> w metodzie nie uzasadnia Strategy - dla prostego, stabilnego warunku dodatkowy interfejs pogarsza czytelność.</li>
</ul>
</section>

    <span class="hljs-keyword">case</span> STANDARD -&gt; baseCostInCents;

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// po: kontekst z wstrzykniętą polityką</span>
<span class="hljs-meta">@FunctionalInterface</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DeploymentCostPolicy</span> { <span class="hljs-type">long</span> <span class="hljs-title function_">calculate</span><span class="hljs-params">(<span class="hljs-type">long</span> baseCostInCents)</span>; }

<span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">calculate</span><span class="hljs-params">(<span class="hljs-type">long</span> baseCostInCents)</span> {
    <span class="hljs-keyword">if</span> (baseCostInCents &lt; <span class="hljs-number">0</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;base cost must not be negative&quot;</span>);
    <span class="hljs-keyword">return</span> policy.calculate(baseCostInCents);
}
</code></pre>
<ul>
<li>Walidacja nieujemnej wartości pozostaje wspólnym kontraktem kalkulatora; konkretne strategie są bezstanowe i można je współdzielić.</li>
</ul>
</section>

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="strategy---bezpieczna-sekwencja">Strategy - bezpieczna sekwencja</h2>
<ol>
<li>Zapisz tabelę decyzji, w tym <code>null</code>, przypadek nieznany i przepełnienie; wydziel obliczenie do metody bez zmiany warunku.</li>
<li>Wprowadź interfejs strategii o identycznym kontrakcie wyniku i wyjątków oraz strategię przejściową ze starym warunkiem.</li>
<li>Przenoś gałęzie do osobnych strategii, a wybór polityki do fabryki lub korzenia kompozycji; stary selektor usuń na końcu.</li>
</ol>
<ul>
<li>Wybór strategii w konstruktorze <strong>zamraża</strong> go na czas życia obiektu - to nie jest równoważne kodowi, który czytał konfigurację przy każdym wywołaniu.</li>
<li><code>Function</code> i <code>ToLongFunction</code> nie deklarują wyjątków kontrolowanych, więc przy takich wyjątkach potrzebny jest własny interfejs z <code>throws</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="replace-conditional-with-polymorphism---kiedy">Replace Conditional with Polymorphism - kiedy?</h2>
<ul>
<li>Polimorfizm pasuje, gdy selektor opisuje <strong>stabilny rodzaj</strong> obiektu, a zachowanie naturalnie do tego rodzaju należy - klasa instancji nie zmienia się w trakcie życia.</li>
<li>Jeśli zmienność to przejściowy tryb, rozważ State; jeśli klient wybiera algorytm niezależnie od rodzaju - Strategy.</li>
<li>Przed zmianą znajdź wszystkie miejsca tworzenia, deserializacji, mapowania ORM i odtwarzania historycznego kodu typu.</li>
<li>Usunięcie centralnego <code>switch</code> nic nie da, jeśli podobne rozgałęzienia zostają w innych usługach.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="polimorfizm---przed-i-po">Polimorfizm - przed i po</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: pole value ma znaczenie zależne od kind</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">LegacyDeploymentStep</span><span class="hljs-params">(Kind kind, String value)</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">switch</span> (kind) {
            <span class="hljs-keyword">case</span> SCRIPT -&gt; <span class="hljs-string">&quot;executed:&quot;</span> + value;
            <span class="hljs-keyword">case</span> APPROVAL -&gt; <span class="hljs-string">&quot;approved-by:&quot;</span> + value;
        };
    }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// po: zamknięty zestaw rodzajów, każdy z własnymi danymi</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DeploymentStep</span> <span class="hljs-keyword">permits</span> ScriptStep, ApprovalStep { <span class="hljs-type">String</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span>; }
<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">ScriptStep</span><span class="hljs-params">(String command)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">DeploymentStep</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;executed:&quot;</span> + command; }
}
</code></pre>
<ul>
<li>Stary model dopuszczał niepoprawne kombinacje danych; <code>sealed</code> jest tu świadomym wyborem, w systemie wtyczek byłby nieodpowiedni.</li>
</ul>
</section>

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="polimorfizm---sekwencja-migracji-i-pu%C5%82apki">Polimorfizm - sekwencja migracji i pułapki</h2>
<ul>
<li>Scharakteryzuj każdą gałąź (z domyślną), zamknij tworzenie obiektów za kontrolowaną granicą i wprowadź wspólną operację w nadtypie.</li>
<li>Twórz podtypy pojedynczo, przenosząc po jednej gałęzi; kod typu usuń dopiero, gdy nie steruje inną osią zachowania, i uruchom jeden test kontraktowy dla wszystkich implementacji.</li>
<li>Dyspozycja dynamiczna dotyczy tylko zwykłych metod instancyjnych: pola nie są polimorficzne, <code>static</code> są ukrywane, <code>private</code> i <code>final</code> nie są nadpisywane.</li>
<li>Nie wywołuj nowego hooka z konstruktora bazy - trafi do częściowo zainicjalizowanego podtypu.</li>
<li>Nowy podtyp w hierarchii <code>sealed</code> może ujawnić stare wyczerpujące <code>switch</code>, także poza bieżącym modułem.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="replace-type-code-with-class---intencja">Replace Type Code with Class - intencja</h2>
<ul>
<li>Surowy <code>String</code> czy liczba nie pilnuje poprawnych wartości, normalizacji ani operacji pojęcia domenowego - nowy typ przejmuje ten kontrakt.</li>
<li>Technika nie oznacza automatycznie podklas: do nazwanych wariantów wystarczy klasa wartości albo enum.</li>
<li>Gdy kod steruje zachowaniem trwałych rodzajów, kolejnym krokiem może być polimorfizm; gdy przejściowym trybem - State.</li>
<li>W przykładzie <code>LegacyDeploymentRequest</code> trzyma <code>zoneCode</code> jako <code>String</code>, a reguła zatwierdzenia (<code>PROD</code>, <code>DR</code>) jest rozproszona - każdy klient może inaczej traktować wielkość liter, nieznane kody i <code>null</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="obiekt-typu-deploymentzone">Obiekt typu <code>DeploymentZone</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DeploymentZone</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">DeploymentZone</span> <span class="hljs-variable">TEST</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DeploymentZone</span>(<span class="hljs-string">&quot;TEST&quot;</span>, <span class="hljs-literal">false</span>);
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">DeploymentZone</span> <span class="hljs-variable">PRODUCTION</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DeploymentZone</span>(<span class="hljs-string">&quot;PROD&quot;</span>, <span class="hljs-literal">true</span>);
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">DeploymentZone</span> <span class="hljs-variable">DISASTER_RECOVERY</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DeploymentZone</span>(<span class="hljs-string">&quot;DR&quot;</span>, <span class="hljs-literal">true</span>);

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">DeploymentZone</span> <span class="hljs-title function_">fromCode</span><span class="hljs-params">(String code)</span> {
        <span class="hljs-keyword">if</span> (code == <span class="hljs-literal">null</span> || code.isBlank()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;zoneCode must not be blank&quot;</span>);
        <span class="hljs-type">String</span> <span class="hljs-variable">normalized</span> <span class="hljs-operator">=</span> code.toUpperCase(Locale.ROOT);

        <span class="hljs-keyword">return</span> zone;

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">requiresApproval</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> approvalRequired; }
}

<ul>
<li>Prywatny konstruktor i fabryka kanonizują trzy instancje; gdyby mogły powstawać niezależnie, potrzebne byłyby <code>equals</code>/<code>hashCode</code> lub rekord.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="type-code---enum-czy-klasa-i-granica-trwa%C5%82o%C5%9Bci">Type Code - enum czy klasa i granica trwałości</h2>
<ul>
<li>Enum wystarcza dla zamkniętego, prostego zestawu; osobna klasa przydaje się przy migracji kodów zewnętrznych, aliasach i własnej polityce tworzenia.</li>
<li>W bazie i komunikatach może zostać stabilny kod <code>PROD</code>, mapowany wewnątrz aplikacji przez <code>DeploymentZone.fromCode</code>.</li>
<li>Nie zapisuj nazwy klasy implementacyjnej ani wyniku <code>toString</code>, jeśli nie jest jawnie częścią formatu.</li>
<li>Migracja musi zachować normalizację przez <code>Locale.ROOT</code>, obsługę <code>null</code>, pustego i nieznanego kodu oraz dokładny kod zapisywany na granicy.</li>
<li>Równie ważne są reguły równości w mapach i zbiorach oraz zgodność historycznych danych.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="encapsulate-composite-with-builder---problem">Encapsulate Composite with Builder - problem</h2>
<ul>
<li>Composite upraszcza używanie elementu i grupy, ale ręczne budowanie drzewa bywa powtarzalne i podatne na błędy.</li>
<li>Klient musi znać kolejność tworzenia węzłów, zasady dodawania dzieci i moment zamknięcia struktury.</li>
<li>Builder jest uzasadniony, gdy budowa jest skomplikowana, wieloetapowa albo ma własne niezmienniki.</li>
<li>Nie powinien powielać logiki drzewa ani udostępniać częściowo zbudowanego wyniku.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="builder-planu-wdro%C5%BCenia">Builder planu wdrożenia</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">DeploymentGroup</span> <span class="hljs-variable">plan</span> <span class="hljs-operator">=</span> PlanBuilder.group(<span class="hljs-string">&quot;release&quot;</span>)
        .group(<span class="hljs-string">&quot;database&quot;</span>, group -&gt; group
                .task(<span class="hljs-string">&quot;backup&quot;</span>, <span class="hljs-number">5</span>)
                .task(<span class="hljs-string">&quot;migrate&quot;</span>, <span class="hljs-number">8</span>))
        .task(<span class="hljs-string">&quot;deploy&quot;</span>, <span class="hljs-number">3</span>)
        .build();
</code></pre>
<ul>
<li><code>PlanBuilder</code> jest <strong>jednorazowy</strong>: <code>ensureOpen()</code> rzuca <code>IllegalStateException</code> po <code>build()</code>.</li>
<li><code>build()</code> tworzy <code>DeploymentGroup</code>, którego konstruktor kopiuje listę, więc późniejsza mutacja bufora Buildera nie zmieni gotowego planu.</li>
<li>Lambda definiująca grupę ma kontrakt synchroniczny - zachowanie jej na później, w innym wątku lub ponowne wywołanie byłoby zmianą zachowania.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="builder---warunki-bezpiecze%C5%84stwa">Builder - warunki bezpieczeństwa</h2>
<ul>
<li>Przed wprowadzeniem Buildera zdecyduj: czy pusty Composite jest poprawny, czy nazwy dzieci muszą być unikalne i czy kolejność dzieci jest obserwowalna.</li>
<li>Ustal, czy węzeł może mieć kilku rodziców, czy struktura to drzewo, czy graf skierowany, i jak wykrywane są cykle.</li>
<li>Określ, czy Builder można użyć ponownie i czy częściowy wynik może go opuścić.</li>
<li>W przykładzie Builder buduje dzieci od dołu z typów niemutowalnych, więc cykl nie powstanie.</li>
<li>Publiczny konstruktor <code>DeploymentGroup</code> pozwala jednak współdzielić podplan (DAG) - akumulacja policzy go dla każdej ścieżki; ścisłe drzewo wymaga jawnej własności rodzica.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="encapsulate-classes-with-factory-i-extract-factory-class">Encapsulate Classes with Factory i Extract Factory Class</h2>
<ul>
<li><strong>Encapsulate Classes with Factory</strong> ukrywa klasy konkretne wspólnej rodziny - klient dostaje obiekt przez fabrykę i zależy tylko od interfejsu.</li>
<li><strong>Extract Factory Class</strong> wydziela tworzenie z klasy, która miesza konstrukcję z inną odpowiedzialnością.</li>
<li>Fabryka nie powinna przejmować cyklu życia, logiki biznesowej ani używania produktu, jeśli nie należą do kontraktu tworzenia.</li>
<li>Przed zmianą klienci znają <code>HttpProbe</code>/<code>QueueProbe</code> i ich konstruktory, a <code>LegacyProbeService</code> sam wybiera i konstruuje sondę, choć ma ją tylko uruchomić.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="fabryka-jako-publiczna-granica">Fabryka jako publiczna granica</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DeploymentProbeFactory</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">DeploymentProbe</span> <span class="hljs-title function_">create</span><span class="hljs-params">(ProbeKind kind, String target)</span> {
        Objects.requireNonNull(kind, <span class="hljs-string">&quot;kind&quot;</span>);
        <span class="hljs-comment">// walidacja target ...</span>
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">switch</span> (kind) {
            <span class="hljs-keyword">case</span> HTTP -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">HttpProbe</span>(target);
            <span class="hljs-keyword">case</span> QUEUE -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">QueueProbe</span>(target);
        };
    }

<h2 id="factory---procedura-i-pu%C5%82apki">Factory - procedura i pułapki</h2>
<ul>
<li>Zinwentaryzuj konstruktory, refleksję, DI i deserializatory; wprowadź interfejs produktu i fabrykę używającą początkowo tych samych konstruktorów.</li>
<li>Przekierowuj miejsca tworzenia pojedynczo, a widoczność klas ogranicz dopiero po migracji klientów; dodaj testy kontraktowe produktów i mapowania wejścia na typ.</li>
<li>Tworzenie wszystkich wariantów z wyprzedzeniem może uruchomić kosztowne konstruktory i efekty wcześniej niż stara gałąź.</li>
<li>Fabryka nie powinna zamieniać jawnej zależności w globalny rejestr usług.</li>
<li>Ukrycie publicznego konstruktora łamie klientów zewnętrznych - w bibliotece potrzebny jest etap przejściowy z <code>@Deprecated</code> i usunięciem w wersji głównej.</li>
</ul>
</section>

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="move-embellishment-to-decorator">Move Embellishment to Decorator</h2>
<ul>
<li>Embellishment to opcjonalne zachowanie wokół rdzenia, np. audyt, pomiar czasu, retry albo cache.</li>
<li>Decorator implementuje ten sam kontrakt co rdzeń i przechowuje delegata.</li>
<li>Kolejność dekoratorów jest częścią zachowania: <code>audit(retry(core))</code> zapisze jedną operację obejmującą wszystkie próby, a <code>retry(audit(core))</code> - każdą próbę osobno.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">run</span><span class="hljs-params">(String releaseId)</span> {
    audit.accept(<span class="hljs-string">&quot;start:&quot;</span> + releaseId);
    <span class="hljs-keyword">try</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> delegate.run(releaseId);
        audit.accept(<span class="hljs-string">&quot;success:&quot;</span> + releaseId);
        <span class="hljs-keyword">return</span> result;
    } <span class="hljs-keyword">catch</span> (RuntimeException exception) {
        audit.accept(<span class="hljs-string">&quot;failure:&quot;</span> + releaseId + <span class="hljs-string">&quot;:&quot;</span> + exception.getClass().getSimpleName());
        <span class="hljs-keyword">throw</span> exception;
    }
}
</code></pre>
</section>

<h2 id="decorator---wyj%C4%85tki-i-sekwencja-migracji">Decorator - wyjątki i sekwencja migracji</h2>
<ul>
<li>Kod zachowuje dokładną instancję wyjątku delegata, ale wyjątek z samego audytu może zasłonić błąd rdzenia.</li>
<li>Polityka produkcyjna musi zdecydować: przerwać operację, dołączyć błąd jako suppressed czy skierować go do kanału awaryjnego.</li>
<li>Migracja: wąski interfejs komponentu, zapis kolejności rdzenia i dodatku dla sukcesu i awarii, dekorator przekazujący bez zmian.</li>
<li>Następnie przenoś po jednym dodatku z zachowaniem pozycji, testuj propagację wyniku i instancji wyjątku oraz istotne kolejności składania.</li>
<li>Składanie łańcucha przenieś do kontrolowanej fabryki, a dawną flagę usuń po migracji wszystkich punktów tworzenia.</li>
</ul>
</section>

<h2 id="decorator---granice-przezroczysto%C5%9Bci">Decorator - granice przezroczystości</h2>
<ul>
<li>Decorator <strong>nie jest przezroczysty</strong> dla <code>getClass</code> i refleksji, tożsamości referencyjnej oraz automatycznej serializacji.</li>
<li>Nie przenosi też monitora <code>synchronized</code>, metod fluent zwracających <code>this</code>, samowywołań wewnątrz delegata ani później dodanych metod <code>default</code>.</li>
<li><code>synchronized</code> w dekoratorze blokuje inny monitor niż w delegacie, więc mechaniczne przeniesienie synchronizacji może naruszyć wykluczanie.</li>
<li>Ślepe delegowanie <code>equals</code> może złamać symetrię między rdzeniem a obiektem opakowującym.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Release</span> {

    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">deploy</span><span class="hljs-params">()</span>  { state = state.deploy(); }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="state---kolejno%C5%9B%C4%87-przej%C5%9Bcia-i-efekt%C3%B3w">State - kolejność przejścia i efektów</h2>
<ul>
<li>Przy efektach zewnętrznych trzeba wybrać kontrakt: efekt, potem zmiana stanu; zmiana stanu, potem efekt; atomowy zapis przez outbox; albo rozdzielenie stanu procesu i próby efektu.</li>
<li>Żaden wariant nie jest uniwersalnie poprawny - refaktoryzacja zachowuje dotychczasowy moment zmiany, dopóki zespół nie zatwierdzi innego modelu.</li>
<li><code>volatile</code> daje widoczność referencji, ale nie czyni sekwencji sprawdzenie-efekt-zapis atomową.</li>
<li>Funkcja w <code>AtomicReference.updateAndGet</code> może wykonać się wielokrotnie przy sporze, więc nie umieszczaj w niej nieidempotentnych efektów.</li>
<li>Mały <code>switch</code> po dwóch stanach bywa czytelniejszy; State zyskuje wartość przy rosnącej tabeli przejść, a kilka niezależnych osi stanu grozi eksplozją klas.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="replace-hard-coded-notifications-with-observer">Replace Hard-coded Notifications with Observer</h2>
<ul>
<li>Observer usuwa zależność od konkretnych odbiorców: subject zna minimalny interfejs listenera, a skład aplikacji rejestruje odbiorców.</li>
<li>Pierwszy bezpieczny krok zachowuje relację jeden do jednego przez nowy interfejs; kolekcja obserwatorów to późniejszy, osobny krok.</li>
<li>Powiadamianie dowolnej liczby odbiorców może być <strong>rozszerzeniem</strong> zachowania, a nie czystą refaktoryzacją.</li>
<li>Kontrakt publikacji musi określać: synchroniczność i wątek listenera, kolejność, duplikaty, reakcję na wyjątek, usuwanie w trakcie callbacku, koniec subskrypcji, siłę referencji i widoczność stanu.</li>
<li>Przykład: publikacja synchroniczna na wątku wywołującym, kolejność rejestracji, duplikaty dozwolone, polityka fail-fast.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="observer---implementacja">Observer - implementacja</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">CopyOnWriteArrayList</span>&lt;Registration&gt; <span class="hljs-variable">listeners</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CopyOnWriteArrayList</span>&lt;&gt;();

<span class="hljs-keyword">public</span> <span class="hljs-type">Subscription</span> <span class="hljs-title function_">subscribe</span><span class="hljs-params">(ReleaseListener listener)</span> {
    <span class="hljs-type">Registration</span> <span class="hljs-variable">registration</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Registration</span>(Objects.requireNonNull(listener, <span class="hljs-string">&quot;listener&quot;</span>));
    listeners.add(registration);
    <span class="hljs-type">AtomicBoolean</span> <span class="hljs-variable">active</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">AtomicBoolean</span>(<span class="hljs-literal">true</span>);
    <span class="hljs-keyword">return</span> () -&gt; {
        <span class="hljs-keyword">if</span> (active.compareAndSet(<span class="hljs-literal">true</span>, <span class="hljs-literal">false</span>)) listeners.remove(registration);
    };
}

<span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">publish</span><span class="hljs-params">(ReleasePublished event)</span> {
    <span class="hljs-keyword">for</span> (Registration registration : listeners) registration.notifyListener(event);
}
</code></pre>
<ul>
<li><code>Subscription</code> rozszerza <code>AutoCloseable</code>; każde <code>subscribe</code> tworzy osobny <code>Registration</code> z tożsamościowym <code>equals</code>, więc uchwyt usuwa dokładnie własną rejestrację.</li>
</ul>
</section>

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="observer---semantyka-i-migracja">Observer - semantyka i migracja</h2>
<ul>
<li><code>CopyOnWriteArrayList</code> kopiuje tablicę przy każdej modyfikacji - sensowna, gdy publikacji jest dużo więcej niż rejestracji, a listenerów umiarkowanie.</li>
<li>Iterator pracuje na migawce: listener usunięty podczas publikacji może zostać wywołany jeszcze w tej publikacji, ale nie w następnej.</li>
<li><code>AtomicBoolean</code> czyni zamknięcie uchwytu idempotentnym; subject trzyma silną referencję do <code>close</code>, więc brak zamknięcia wydłuża życie grafu obiektów.</li>
<li>Migracja: oddziel pracę odbiorcy, wyodrębnij interfejs, zarejestruj dotychczasowego odbiorcę raz i przenieś wywołanie bez kolekcji; wielu odbiorców dodaj osobno.</li>
<li>Globalna szyna zdarzeń może ukryć zależności; dla jednego stabilnego odbiorcy jawna zależność bywa prostsza.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="replace-implicit-tree-with-composite---ukryte-drzewo">Replace Implicit Tree with Composite - ukryte drzewo</h2>
<ul>
<li>Drzewo bywa zakodowane w ścieżkach tekstowych, wcięciach, identyfikatorach rodzica, indeksach albo równoległych kolekcjach.</li>
<li>Operacje drzewa wykonuje się wtedy przez parsowanie reprezentacji prymitywnej.</li>
<li><code>LegacyPathPlan</code> przechowuje zadania jako ścieżki typu <code>release/database/backup</code> i wyszukuje je po prefiksie <code>path + &quot;/&quot;</code>.</li>
<li>Hierarchia istnieje tylko w konwencji tekstu, więc separator, reguły maskowania, pusta ścieżka i wyszukiwanie prefiksu stają się częścią algorytmu każdego klienta.</li>
</ul>
</section>

<h2 id="jawny-model-composite">Jawny model Composite</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">PlanComponent</span> <span class="hljs-keyword">permits</span> DeploymentTask, DeploymentGroup {

    &lt;R&gt; <span class="hljs-type">R</span> <span class="hljs-title function_">accept</span><span class="hljs-params">(PlanVisitor&lt;R&gt; visitor)</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">DeploymentGroup</span><span class="hljs-params">(String name, List&lt;PlanComponent&gt; components)</span>
        <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PlanComponent</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">totalMinutes</span><span class="hljs-params">()</span> {
        <span class="hljs-type">long</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
        <span class="hljs-keyword">for</span> (PlanComponent c : components) total = Math.addExact(total, c.totalMinutes());
        <span class="hljs-keyword">return</span> total;
    }
}
</code></pre>
<ul>
<li>Liść <code>DeploymentTask</code> realizuje ten sam kontrakt (zwraca <code>minutes</code>, dodaje siebie do kolekcji), a grupa wykonuje operacje rekurencyjnie i kopiuje listę dzieci.</li>
</ul>
</section>

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="mapper-migracyjny-legacypathplanmapper">Mapper migracyjny <code>LegacyPathPlanMapper</code></h2>
<ul>
<li>Ręczne zbudowanie podobnego drzewa nie sprawdza transformacji starego formatu - potrzebny jest mapper starych wpisów na Composite.</li>
<li>Jawne <code>rootName</code> pozwala odwzorować także pusty plan; wpisy spoza korzenia są odrzucane.</li>
<li>Mapper zachowuje powtórzone zadania, ale odrzuca ścieżkę używaną jednocześnie jako zadanie i grupa.</li>
<li>Kolejności płaskiej listy nie zawsze da się zachować: <code>release/a/first</code>, <code>release/b/second</code>, <code>release/a/third</code> wymagałoby ponownego wejścia do zamkniętej grupy <code>a</code>.</li>
<li>Dlatego mapper wymaga kolejności zgodnej z przejściem w głąb i zgłasza błąd zamiast po cichu zmienić zachowanie; alternatywy to sortowanie, pole kolejności lub zmiana kontraktu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="implicit-tree---procedura-i-ryzyka">Implicit Tree - procedura i ryzyka</h2>
<ul>
<li>Scharakteryzuj reguły starej reprezentacji, wprowadź liść i Composite bez usuwania tekstu, napisz mapper i przenieś jedną operację, np. sumowanie.</li>
<li>Porównuj wynik i kolejność obu reprezentacji, przenoś kolejne operacje pojedynczo, a granicę trwałości zmień dopiero po przygotowaniu migracji danych.</li>
<li>Określ zachowanie dla głębokich drzew, cykli, współdzielonych poddrzew i przepełnienia - rekurencja grozi <code>StackOverflowError</code>, a cykl nieskończoną wędrówką.</li>
<li>Dla danych niezaufanych potrzebny jest limit głębokości, wykrywanie cykli albo iteracyjne przechodzenie.</li>
<li><code>Math.addExact</code> czyni przepełnienie jawnym błędem; <code>List.copyOf</code> chroni strukturę listy, ale nie elementy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="unify-interfaces-with-adapter">Unify Interfaces with Adapter</h2>
<ul>
<li>Adapter pozwala klientowi używać preferowanego kontraktu mimo innego interfejsu biblioteki lub komponentu legacy.</li>
<li>Tłumaczy nazwy, parametry, wyniki i błędy, ale nie powinien udawać zgodności semantycznej, której nie ma.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LegacyGatewayAdapter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ReleaseNotifier</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> LegacyMessageGateway gateway;

    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">send</span><span class="hljs-params">(ReleaseMessage message)</span> {
        Objects.requireNonNull(message, <span class="hljs-string">&quot;message&quot;</span>);
        <span class="hljs-keyword">return</span> gateway.transmit(message.recipient(), <span class="hljs-string">&quot;release:&quot;</span> + message.releaseId());
    }
}
</code></pre>
<ul>
<li><code>NotificationService</code> zależy wyłącznie od interfejsu docelowego <code>ReleaseNotifier</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="adapter---co-naprawd%C4%99-trzeba-przet%C5%82umaczy%C4%87">Adapter - co naprawdę trzeba przetłumaczyć</h2>
<ul>
<li>Podobne sygnatury nie gwarantują podobnego kontraktu - adapter jawnie rozstrzyga jednostki, zakresy, strefę czasową, precyzję i kodowanie znaków.</li>
<li>Musi określić znaczenie <code>null</code> i pustej wartości, kolejność i indeksowanie oraz mutowalność wejścia i wyniku.</li>
<li>Ważne są też własność i zamykanie zasobów, idempotencja, mapowanie wyjątków z zachowaniem przyczyny oraz synchroniczność i kontekst wątku.</li>
<li>Adapter <code>AutoCloseable</code> musi wiedzieć, czy jest właścicielem obiektu - nie zawsze powinien zamykać współdzielone połączenie.</li>
<li>Migracja: interfejs z potrzeb klienta, najprostszy adapter, mapowanie operacji pojedynczo z testem porównawczym; jeśli wystarczy Rename Method lub Move Method, adapter może być zbędny.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="replace-conditional-dispatcher-with-command">Replace Conditional Dispatcher with Command</h2>
<ul>
<li>Dispatcher odczytuje selektor i uruchamia akcję; Command zamienia każdą akcję w obiekt o wspólnej operacji, a rejestr mapuje selektor na komendę.</li>
<li>Mapa jest równoważna tylko przy <strong>rozłącznym kluczu</strong> - łańcucha nakładających się predykatów („wygrywa pierwszy”) nie da się mechanicznie zastąpić mapą.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">public</span> <span class="hljs-title function_">DeploymentCommandDispatcher</span><span class="hljs-params">(Map&lt;DeploymentAction, DeploymentCommand&gt; commands)</span> {
    <span class="hljs-type">Map</span>&lt;DeploymentAction, DeploymentCommand&gt; <span class="hljs-variable">copy</span> <span class="hljs-operator">=</span> Map.copyOf(commands);
    <span class="hljs-type">EnumSet</span>&lt;DeploymentAction&gt; <span class="hljs-variable">missing</span> <span class="hljs-operator">=</span> EnumSet.allOf(DeploymentAction.class);
    missing.removeAll(copy.keySet());
    <span class="hljs-keyword">if</span> (!missing.isEmpty()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;missing commands: &quot;</span> + missing);
    <span class="hljs-built_in">this</span>.commands = copy;
}
</code></pre>
<ul>
<li><code>Map.copyOf</code> odłącza rejestr od mapy wejściowej, a sprawdzenie kompletności przenosi błąd konfiguracji na moment składania aplikacji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

pre, code { font-size: 18px; }
;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="command---sekwencja-i-ograniczenia">Command - sekwencja i ograniczenia</h2>
<ul>
<li>Scharakteryzuj klucz, priorytet gałęzi, <code>default</code> i <code>null</code>; wydziel ciało gałęzi do metod, pozostawiając <code>switch</code>, i przenieś je do komend.</li>
<li>Ustal najmniejszą wspólną sygnaturę <code>execute</code>, pozwól staremu dispatcherowi uruchamiać gotowe komendy, a potem zbuduj rejestr z polityką duplikatów i kompletności.</li>
<li>Command <strong>nie daje automatycznie</strong> asynchroniczności, kolejki, retry ani undo - <code>Executor</code> zmienia wątek, wyjątki, transakcję i kontekst diagnostyczny.</li>
<li>Retry może powielić nieidempotentne efekty, a undo wymaga osobnego modelu kompensacji.</li>
<li>Współdzielone komendy muszą być bezstanowe lub bezpieczne wątkowo; dane żądania powinny być argumentem.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

pre, code { font-size: 18px; }
;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="apply-template-method">Apply Template Method</h2>
<ul>
<li>Klasyczna nazwa to Form Template Method: podklasy wykonują podobne kroki w tej samej kolejności, różniąc się implementacją wybranych kroków.</li>
<li>W przykładzie importery: walidują wejście, parsują format, walidują pola i tworzą <code>ReleaseDraft</code> - zmienne jest tylko parsowanie.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ReleaseImporter</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-type">ReleaseDraft</span> <span class="hljs-title function_">importRelease</span><span class="hljs-params">(String raw)</span> {
        <span class="hljs-keyword">if</span> (raw == <span class="hljs-literal">null</span> || raw.isBlank()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;input must not be blank&quot;</span>);
        <span class="hljs-type">Fields</span> <span class="hljs-variable">fields</span> <span class="hljs-operator">=</span> parse(raw);
        <span class="hljs-comment">// walidacja releaseId i service</span>
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ReleaseDraft</span>(fields.releaseId(), fields.service());
    }
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">Fields</span> <span class="hljs-title function_">parse</span><span class="hljs-params">(String raw)</span>;
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Fields</span> <span class="hljs-title function_">fields</span><span class="hljs-params">(String releaseId, String service)</span> { ... }
}
</code></pre>
<ul>
<li><code>final</code> chroni kolejność, ale dodanie go do opublikowanej, nadpisywanej metody łamie klientów; chroniona fabryka <code>fields</code> pozwala podklasom spoza pakietu tworzyć <code>Fields</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="template-method---sekwencja-i-ryzyka">Template Method - sekwencja i ryzyka</h2>
<ul>
<li>Zapisz kolejność kroków w każdej klasie, użyj Extract Method, ujednolicaj nazwy i sygnatury po jednym kroku i przenieś identyczne kroki do bazy.</li>
<li>Szkielet przenieś przez Pull Up Method, wymagane kroki oznacz jako abstrakcyjne, a opcjonalny hook dodawaj tylko przy poprawnym domyślnym zachowaniu dla wszystkich.</li>
<li>Nowa metoda abstrakcyjna wymusza zmianę podklas konkretnych, a stara implementacja binarna ujawni brak dopiero podczas wywołania.</li>
<li>Hook wywołany z konstruktora bazy zobaczy domyślne wartości pól podklasy; <code>synchronized</code> w szablonie trzyma monitor podczas hooków, co grozi reentrancją i zakleszczeniem.</li>
<li>Dużo hooków lub potrzeba zmiany ich kolejności sygnalizuje, że kompozycja lub Strategy będą elastyczniejsze.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

" lang="C" data-marpit-pagination="42" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }
section.lead h1 { font-size: 48px; }
pre, code { font-size: 18px; }
;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="replace-distinctions-with-composite">Replace Distinctions with Composite</h2>
<ul>
<li>Klient często ma dwie ścieżki: <code>execute</code> dla jednego elementu i <code>executeAll</code> dla kolekcji, z powielonymi warunkami i regułami błędów.</li>
<li>Replace One/Many Distinctions with Composite pozwala przekazać liść albo grupę przez jeden kontrakt.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">List</span>&lt;String&gt; <span class="hljs-title function_">execute</span><span class="hljs-params">(PlanComponent component)</span> {
    Objects.requireNonNull(component, <span class="hljs-string">&quot;component&quot;</span>);
    <span class="hljs-type">List</span>&lt;DeploymentTask&gt; <span class="hljs-variable">tasks</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
    component.collectTasks(tasks);
    <span class="hljs-keyword">return</span> tasks.stream().map(task -&gt; <span class="hljs-string">&quot;executed:&quot;</span> + task.name()).toList();
}
</code></pre>
<ul>
<li>Ujednolicenie nie może zmienić kolejności, zachowania pustej grupy, polityki przerwania po błędzie, raportowania częściowego sukcesu, liczby transakcji, duplikatów, równoległości ani granicy retry.</li>
<li>W przykładzie kolejność to preorder zgodny z listami dzieci, a pierwszy wyjątek przerywa wykonanie.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

" lang="C" data-marpit-pagination="43" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }
section.lead h1 { font-size: 48px; }
pre, code { font-size: 18px; }
;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="transparent-vs-safe-composite">Transparent vs Safe Composite</h2>
<ul>
<li><strong>Transparent Composite</strong> umieszcza zarządzanie dziećmi we wspólnym kontrakcie - wywołanie <code>add</code> na liściu wymaga wtedy wyjątku albo pustego zachowania.</li>
<li><strong>Safe Composite</strong> udostępnia zarządzanie dziećmi tylko typowi grupy.</li>
<li>Przykład jest bliższy wariantowi Safe: wspólny interfejs opisuje operacje biznesowe, a <code>components()</code> należy do <code>DeploymentGroup</code>.</li>
<li>Klient czasem musi znać rodzaj węzła, ale niemożliwa operacja nie zanieczyszcza kontraktu liścia.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }
section.lead h1 { font-size: 48px; }
pre, code { font-size: 18px; }
" lang="C" data-marpit-pagination="44" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }
section.lead h1 { font-size: 48px; }
pre, code { font-size: 18px; }
;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="limit-instantiation-with-singleton">Limit Instantiation with Singleton</h2>
<ul>
<li>Singleton to <strong>decyzja o cyklu życia</strong>: uzasadniony, gdy wiele równoważnych, kosztownych instancji nie daje wartości albo domena wymaga jednej tożsamości.</li>
<li>Nie wprowadzaj go na podstawie przypuszczeń o pamięci - zmierz koszt i sprawdź, czy współdzielenie zachowuje semantykę stanu, blokad i cyklu życia.</li>
<li>Katalog Kerievsky'ego zawiera transformację odwrotną - Inline Singleton, przywracającą jawne przekazywanie zależności.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">DeploymentDefaults</span> {
    INSTANCE;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Duration</span> <span class="hljs-variable">healthCheckTimeout</span> <span class="hljs-operator">=</span> Duration.ofSeconds(<span class="hljs-number">30</span>);
    <span class="hljs-keyword">public</span> <span class="hljs-type">Duration</span> <span class="hljs-title function_">healthCheckTimeout</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> healthCheckTimeout; }
}
</code></pre>
<ul>
<li>Enum daje jedną instancję w obrębie loadera klas, bezpieczną publikację, kanoniczną deserializację i zakaz tworzenia refleksją - ale dwa loadery mogą mieć dwie definicje.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }
section.lead h1 { font-size: 48px; }
pre, code { font-size: 18px; }
" lang="C" data-marpit-pagination="45" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }
section.lead h1 { font-size: 48px; }
pre, code { font-size: 18px; }
;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="singleton---mutowalno%C5%9B%C4%87-i-sekwencja">Singleton - mutowalność i sekwencja</h2>
<ul>
<li>Globalny mutowalny Singleton tworzy ukryte zależności, łączy testy przez pozostawiony stan i wymaga synchronizacji.</li>
<li>Utrudnia też konfigurację wielu tenantów i zamykanie zasobów, wydłuża życie referencji i może stać się wąskim gardłem.</li>
<li>Nawet dla niemutowalnego <code>Duration</code> jawne wstrzyknięcie ustawień jest zwykle lepsze; kontener DI ograniczy liczbę instancji w zakresie, zachowując podmianę w testach.</li>
<li>Sekwencja: zmierz koszt, udowodnij równoważność instancji, scharakteryzuj inicjalizację i zamykanie, przekieruj tworzenie przez jednego dostawcę, przetestuj współbieżność - konstruktor ogranicz na końcu.</li>
<li>Usunięcie publicznego konstruktora zmienia API, a odrębne cache, liczniki lub blokady per instancja wykluczają refaktoryzację bez zmiany zachowania.</li>
</ul>
</section>

<h2 id="collecting-parameter-i-visitor---dwie-techniki">Collecting Parameter i Visitor - dwie techniki</h2>
<ul>
<li>Gdy długa metoda rozpoznaje wiele elementów i mutuje lokalny wynik, rozważ <strong>Collecting Parameter</strong> - elementy same dopisują wynik do przekazanego akumulatora.</li>
<li><strong>Visitor</strong> pozwala dodawać wiele operacji do stabilnej hierarchii bez umieszczania ich w elementach, kosztem podwójnej dyspozycji i silnego powiązania z typami.</li>
<li>Kontrakt <code>collectTasks(Collection&lt;? super DeploymentTask&gt;)</code>: liść dodaje siebie, grupa przekazuje akumulator dzieciom, a wywołujący zachowuje własność kolekcji.</li>
<li>Trzeba zdefiniować, czy metoda czyści kolekcję, czy dopisuje, i co zostaje po wyjątku - w przykładzie może zostać wynik częściowy.</li>
<li>Ogólna mutowalna mapa lub kontekst ukrywa zbyt wiele; dobry parametr zbierający ma wąski typ i jasną własność.</li>
</ul>
</section>

<h2 id="extract-composite">Extract Composite</h2>
<ul>
<li>To nie ogólne „zrób drzewo”: punktem wyjścia jest hierarchia, w której kilka klas powiela przechowywanie i przetwarzanie dzieci - wspólną część wydziela się do klasy Composite.</li>
<li>W przykładzie <code>ReleaseGroup</code> i <code>RollbackGroup</code> osobno trzymają listę dzieci, kopiują ją przy odczycie i sumują czas.</li>
</ul>

<li>Prywatne pole i metody <code>final</code> chronią wspólną reprezentację, ale nie zabraniają podklasie drugiego pola z dziećmi - to trzeba wykryć w przeglądzie i testach.</li>

<h2 id="extract-composite---sekwencja">Extract Composite - sekwencja</h2>
<ul>
<li>Znajdź wszystkie klasy przechowujące dzieci z tej samej hierarchii i porównaj rzeczywiste kontrakty, nie tylko podobieństwo kodu.</li>
<li>Ujednolij nazwy i typy kolekcji bez przenoszenia, wyodrębnij bazę implementującą kontrakt węzła i przenoś pole dzieci oraz operacje pojedynczo.</li>
<li>Duplikaty usuń dopiero po sprawdzeniu kolejności, mutowalności i wyjątków.</li>
<li>Podobne pętle mogą znaczyć co innego: pomijanie nieaktywnych dzieci, kontynuacja po błędzie, wykonanie równoległe - wspólna implementacja jest poprawna tylko, gdy te różnice nie należą do kontraktu.</li>
<li>Mutowalny model nadal pozwala utworzyć cykl; jego wykrywanie to osobna zmiana zachowania po refaktoryzacji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="warsztat---zasada-pracy">Warsztat - zasada pracy</h2>
<ol>
<li>Uruchom testy bazowe i nazwij zachowanie chronione w bieżącym kroku.</li>
<li>Wykonaj jedną transformację.</li>
<li>Uruchom test celowany, a potem test różnicowy.</li>
<li>Zapisz decyzję projektową.</li>
<li>Przejdź dalej dopiero po zielonym wyniku.</li>
</ol>
<ul>
<li>Nie zaczynamy od tworzenia wszystkich klas wzorca - pierwszy commit ma być mały i odwracalny.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-1-wyb%C3%B3r-w%C5%82a%C5%9Bciwego-mechanizmu">Ćwiczenie 1: wybór właściwego mechanizmu</h2>
<p>Serwis zawiera cztery warunki: wariant kalkulacji kosztu, rodzaj kroku wdrożenia, bieżący stan wydania i akcję operatora.</p>
<ul>
<li>Przypisz każdą oś do Strategy, polimorfizmu, State albo Command i uzasadnij wybór jednym zdaniem.</li>
<li>Dodaj test charakterystyki dla gałęzi domyślnej i <code>null</code>, wprowadzaj jeden kontrakt naraz i nie usuwaj warunku przed migracją wszystkich punktów tworzenia.</li>
<li><strong>Kryteria akceptacji:</strong> brak kombinatorycznej hierarchii podtypów, stan przejściowy nie jest strategią, komendy nie przechowują danych poprzedniego żądania.</li>
<li>Fabryka lub korzeń kompozycji jest jedynym miejscem mapowania konfiguracji na Strategy, a testy porównują wyniki i wyjątki przed i po.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="%C4%87wiczenie-2-state-observer-i-decorator">Ćwiczenie 2: State, Observer i Decorator</h2>
<p>Rozbuduj przykład wydania o zapis audytu i powiadomienie odbiorców po udanym wdrożeniu.</p>
<ul>
<li>Ustal, czy audyt jest częścią przejścia State, dekoracją operacji, czy osobnym zdarzeniem, i zapisz kolejność stanu, audytu i publikacji.</li>
<li>Dodaj listener usuwający inną subskrypcję podczas callbacku oraz listener rzucający wyjątek; udokumentuj politykę fail-fast albo kontynuacji.</li>
<li>Przetestuj stan po awarii audytu i listenera.</li>
<li><strong>Kryteria akceptacji:</strong> brak wywołań listenerów pod nieudokumentowaną blokadą, idempotentne zamykanie subskrypcji, test ustala los usuniętego listenera w bieżącej publikacji.</li>
<li>Nie ma niejawnego przejścia na asynchroniczność, a błąd dodatku nie zasłania pierwotnej przyczyny bez jawnej decyzji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="%C4%87wiczenie-3-rodzina-refaktoryzacji-composite">Ćwiczenie 3: rodzina refaktoryzacji Composite</h2>
<p>Punkt wyjścia: lista zadań ze ścieżkami tekstowymi oraz osobne metody dla jednego zadania i listy.</p>
<ul>
<li>Scharakteryzuj separator, kolejność i niepoprawne ścieżki; wprowadź <code>PlanComponent</code>, liść i grupę oraz mapper starego formatu.</li>
<li>Zastąp rozróżnienie jeden/wiele jednym kontraktem, enkapsuluj budowę w Builderze, przenieś zbieranie liści do parametru zbierającego i dodaj Visitor liczący czas.</li>
<li>Przetestuj puste drzewo, głęboką strukturę, przepełnienie i współdzielone poddrzewo.</li>
<li><strong>Kryteria akceptacji:</strong> wynik Buildera niemutowalny, jawna kolejność przechodzenia, przepełnienie nie zawija wartości.</li>
<li>Każdy Visitor obsługuje wszystkie rodzaje węzłów, a zmiana formatu trwałego jest oddzielona od refaktoryzacji modelu.</li>
</ul>
</section>

<h2 id="lista-kontrolna-12-kontrakt-tworzenie-i-cykl-%C5%BCycia">Lista kontrolna (1/2): kontrakt, tworzenie i cykl życia</h2>
<ul>
<li><strong>Kontrakt:</strong> czy nazwano zachowanie niezmienione i czy testy obejmują każdą gałąź, <code>null</code> i wartość nieznaną?</li>
<li>Czy zachowano typy wyjątków, stan po błędzie, kolejność i liczbę efektów oraz moment wyboru strategii lub komendy?</li>
<li><strong>Tworzenie:</strong> czy znaleziono wszystkie punkty tworzenia, a fabryka nie stała się globalnym rejestrem usług?</li>
<li>Czy współdzielone strategie, komendy i State są bezstanowe lub bezpieczne wątkowo?</li>
<li>Czy Singleton jest jeden w wymaganym zakresie (nie tylko w jednym loaderze), a zasoby mają jawnego właściciela i moment zamknięcia?</li>
</ul>
</section>

<h2 id="lista-kontrolna-22-struktury-i-integracje">Lista kontrolna (2/2): struktury i integracje</h2>
<ul>
<li><strong>Struktury:</strong> czy gotowy Composite jest niemutowalny zgodnie z kontraktem, a kolejność dzieci jawna?</li>
<li>Czy przy danych niezaufanych wykrywane są cykle i nadmierna głębokość; czy akumulacja ma politykę przepełnienia i błędu częściowego; czy zachowanie Buildera po <code>build()</code> jest zdefiniowane?</li>
<li><strong>Integracje:</strong> czy format trwałego kodu pozostał stabilny, a adapter zachowuje jednostki, strefy czasu, kodowanie i idempotencję?</li>
<li>Czy obiekt opakowujący nie zmienił wymaganej tożsamości, monitora ani serializacji?</li>
<li>Czy nowy podtyp <code>sealed</code> sprawdzono we wszystkich <code>switch</code>, a klienci binarni i refleksyjni są uwzględnieni w zgodności?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="66" data-size="16:9">
<h2 id="pytania-sprawdzaj%C4%85ce-13">Pytania sprawdzające (1/3)</h2>
<ol>
<li>Dlaczego usunięcie <code>switch</code> nie wystarcza do uzasadnienia Strategy? - Warunek może oznaczać stan, typ, komendę albo zwykłą lokalną regułę.</li>
<li>Kiedy kod typu staje się klasą wartości, a kiedy podtypem? - Klasa wartości dla pojęcia i jego reguł, podtyp dla stabilnego rodzaju z własnym zachowaniem.</li>
<li>Dlaczego wybór strategii w konstruktorze może zmienić zachowanie? - Zamraża decyzję wcześniej niż warunek odczytywany przy każdym wywołaniu.</li>
<li>Co odróżnia State od Strategy? - Strategy wykonuje wybrany algorytm, State reprezentuje bieżący stan i dozwolone przejścia.</li>
<li>Dlaczego kolejność Decoratorów jest kontraktem? - Warstwy zmieniają zasięg retry, audytu, transakcji i obsługi wyjątków.</li>
<li>Jak działa iterator <code>CopyOnWriteArrayList</code> po usunięciu listenera? - Używa migawki, więc usunięcie działa od następnej iteracji.</li>
<li>Kiedy kolekcja Observerów jest rozszerzeniem? - Gdy stary kontrakt gwarantował dokładnie jeden efekt.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="pytania-sprawdzaj%C4%85ce-23">Pytania sprawdzające (2/3)</h2>
<ol start="8">
<li>Co tłumaczy Adapter poza nazwami? - Semantykę danych, jednostki, <code>null</code>, błędy, własność zasobów, idempotencję i model wykonania.</li>
<li>Kiedy mapa komend nie jest równoważna warunkom? - Gdy predykaty się nakładają, liczy się kolejność lub wybór nie jest pojedynczym kluczem.</li>
<li>Dlaczego rekord z <code>List</code> nie jest głęboko niemutowalny? - Referencja jest finalna, ale lista może być mutowalna; potrzebna kopia.</li>
<li>Jaki wymiar zmian preferuje Visitor? - Częste nowe operacje przy stabilnym zestawie rodzajów elementów.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="pytania-sprawdzaj%C4%85ce-33">Pytania sprawdzające (3/3)</h2>
<ol start="12">
<li>Extract Composite vs Replace Implicit Tree? - Pierwsza wydziela powieloną obsługę dzieci, druga zastępuje ukrytą reprezentację jawnym drzewem.</li>
<li>Dlaczego enum Singleton to nie zawsze jedna instancja? - Każdy loader klas może mieć własną definicję.</li>
<li>Częściowy błąd akumulacji? - Ustal, czy wynik zostaje, jest wycofywany, czy błędy są agregowane.</li>
<li>Kiedy prosty <code>switch</code> jest lepszy? - Gdy warunek jest mały, lokalny, stabilny i czytelniejszy niż dodatkowe typy.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="podsumowanie---najwa%C5%BCniejsze-wnioski">Podsumowanie - najważniejsze wnioski</h2>
<ul>
<li>Refaktoryzacja do wzorca zaczyna się od <strong>kontraktu</strong>, a nie od diagramu klas - najpierw nazwij zachowanie, które ma pozostać niezmienione.</li>
<li>Strategy, polimorfizm, State i Command usuwają podobnie wyglądające warunki, ale modelują różne przyczyny zmiany.</li>
<li>Factory i Builder kontrolują tworzenie; Decorator, Observer i Adapter - współpracę; Composite i Visitor - struktury i operacje na nich.</li>
<li>Najbezpieczniejsza transformacja wprowadza jeden kontrakt, przenosi jedną odpowiedzialność i po każdym kroku porównuje zachowanie.</li>
<li>Rozszerzenia zachowania (asynchroniczność, wielu odbiorców, cache) zatwierdzaj osobno od zmian strukturalnych.</li>
<li>Wzorzec zostaje tylko, gdy upraszcza realny problem - nadmiar pośrednictwa usuń w ostatnim kroku.</li>
</ul>
</section>
