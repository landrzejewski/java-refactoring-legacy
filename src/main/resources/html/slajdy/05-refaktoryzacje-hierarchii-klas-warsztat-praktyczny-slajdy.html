<li>Studium przypadku: hierarchia powiadomień + dodatkowe przypadki przed/po</li>

<h2 id="11-hierarchia-jest-cz%C4%99%C5%9Bci%C4%85-zachowania">1.1. Hierarchia jest częścią zachowania</h2>
<ul>
<li>Dziedziczenie nie służy tylko redukcji duplikacji - deklaruje, że podklasa może wystąpić <strong>wszędzie tam, gdzie klient oczekuje nadklasy</strong>.</li>
<li>Klient polega nie tylko na metodach, ale też na warunkach wstępnych, wynikach, wyjątkach, efektach ubocznych i niezmiennikach.</li>
<li>Poprawny podtyp przyjmuje wszystkie dane dopuszczone przez bazę, nie wzmacnia warunków wstępnych i nie osłabia gwarancji wyniku.</li>
<li>Nie dodaje nieoczekiwanych wyjątków ani efektów oraz zachowuje obserwowalny kontrakt tożsamości, kolejności i współbieżności.</li>
<li><strong>Zgodna sygnatura nie dowodzi zastępowalności</strong>: <code>ReadOnlyAccount</code> z <code>withdraw</code> rzucającym zawsze wyjątek kompiluje się, ale nie jest poprawnym podtypem konta.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }

<h2 id="12-wsp%C3%B3%C5%82dzielenie-implementacji-a-podtypowanie">1.2. Współdzielenie implementacji a podtypowanie</h2>
<ul>
<li>Przed utworzeniem nadklasy zadaj dwa osobne pytania: czy klasy mają <strong>ten sam kod lub stan</strong> oraz czy są <strong>wariantami tego samego pojęcia</strong> o wspólnym kontrakcie.</li>
<li>Wspólny kod uzasadnia co najwyżej wydzielenie współpracownika, funkcji lub obiektu wartości - dopiero wspólny kontrakt uzasadnia dziedziczenie.</li>
<li>Jeśli klasy łączy wyłącznie algorytm techniczny, kompozycja jest zwykle kierunkiem mniej zobowiązującym.</li>
<li>Dobra nadklasa nie jest magazynem wszystkiego, co się powtarza - to stabilna abstrakcja, której operacje znaczą to samo dla każdej podklasy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="13-warstwy-zgodno%C5%9Bci">1.3. Warstwy zgodności</h2>
<table>
<thead>
<tr>
<th>Warstwa</th>
<th>Pytanie kontrolne</th>
</tr>
</thead>
<tbody>
<tr>
<td>zachowanie wykonania</td>
<td>Czy wyniki, wyjątki, stan i efekty pozostają zgodne?</td>
</tr>
<tr>
<td>zgodność źródłowa</td>
<td>Czy kod klienta nadal się kompiluje?</td>
</tr>
<tr>
<td>zgodność binarna</td>
<td>Czy stary skompilowany klient nadal się linkuje?</td>
</tr>
<tr>
<td>kontrakt refleksyjny</td>
<td>Czy nazwy, deklarujący typ, członkowie i adnotacje są znajdowane?</td>
</tr>
<tr>
<td>zgodność serializacyjna</td>
<td>Czy nowy kod czyta dane zapisane przez starą wersję?</td>
</tr>
<tr>
<td>integracje</td>
<td>Czy ORM, DI, proxy, konfiguracja i generatory rozumieją model?</td>
</tr>
<tr>
<td>właściwości operacyjne</td>
<td>Czy zachowano blokady, transakcje, kolejność, wydajność?</td>
</tr>
</tbody>
</table>
<p>Zgodność binarna oznacza tylko, że stare <code>.class</code> się połączą - nie dowodzi zgodności źródłowej ani zachowania.</p>
</section>

<h2 id="14-mapa-hierarchii-przed-zmian%C4%85">1.4. Mapa hierarchii przed zmianą</h2>
<ul>
<li>Zinwentaryzuj wszystkie nadklasy, interfejsy i podklasy - także spoza bieżącego modułu i wcześniej skompilowane rozszerzenia.</li>
<li>Zbierz członków <code>public</code>/<code>protected</code>, dostęp pakietowy, konstruktory, fabryki, kontenery DI i deserializatory tworzące obiekty.</li>
<li>Znajdź wywołania przez typ bazowy, rzutowania, <code>instanceof</code>, <code>switch</code>, <code>super</code> oraz metody <code>static</code>, <code>private</code>, <code>final</code>, <code>synchronized</code>.</li>
<li>Uwzględnij pola ukrywające inne pola, adnotacje, refleksję, mapowania ORM, format serializacji i granice modułów/pakietów.</li>
<li><strong>Samo wyszukanie <code>extends</code> nie wystarczy</strong> - hierarchia bywa zakodowana w konfiguracji, danych, <code>ServiceLoader</code>, ORM czy proxy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="15-p%C4%99tla-bezpiecznej-transformacji">1.5. Pętla bezpiecznej transformacji</h2>
<ol>
<li>Nazwij obserwowalny kontrakt, który ma pozostać niezmieniony, i dodaj najmniejszy wiarygodny test na jego poziomie.</li>
<li>Wykonaj <strong>jeden</strong> ruch metody, pola albo relacji typu, po czym skompiluj całą dotkniętą hierarchię.</li>
<li>Uruchom testy wszystkich podtypów przez typ bazowy.</li>
<li>Sprawdź klientów źródłowych, binarnych i integracyjnych proporcjonalnie do ryzyka.</li>
<li>Stary członek lub poziom hierarchii usuń dopiero po migracji.</li>
</ol>
<p>Refaktoryzacja IDE zmienia deklaracje widoczne w modelu programu, ale <strong>nie potwierdza</strong> zgodności starych binariów, danych historycznych, nazw tekstowych ani zewnętrznych podklas.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="21-overriding-i-dynamiczna-dyspozycja">2.1. Overriding i dynamiczna dyspozycja</h2>
<ul>
<li>Kompilator wybiera sygnaturę, a JVM w runtime wybiera najbardziej szczegółową implementację według klasy odbiorcy - rzutowanie na nadtyp tego nie wyłącza.</li>
<li>Metoda <code>static</code> jest ukrywana, a nie nadpisywana; <code>private</code> nie jest dziedziczona; <code>final</code> nie może zostać nadpisana.</li>
<li><code>super.method()</code> omija zwykłą dyspozycję i zaczyna wyszukiwanie od bezpośredniego nadtypu.</li>
<li>Override nie może ograniczyć dostępności ani poszerzyć wyjątków kontrolowanych, ale może kowariantnie zawęzić typ wyniku.</li>
<li><strong>Wniosek:</strong> Pull Up Method może utworzyć nowy punkt dyspozycji - metoda w zewnętrznej podklasie nagle staje się nieplanowanym override.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="22-23-overloading-i-pola---wyb%C3%B3r-statyczny">2.2-2.3. Overloading i pola - wybór statyczny</h2>
<ul>
<li><strong>Przeciążenie</strong> wybierane jest w czasie kompilacji według typów kompilacyjnych; klasa runtime argumentu nie zmienia wyboru.</li>
<li>Po Pull Up Method identyczny tekst kodu może wywołać inną metodę pomocniczą, bo zmieniają się widoczne typy i zestaw przeciążeń.</li>
<li>Nowe przeciążenie może zmienić wybór w ponownie skompilowanym kliencie, a stary <code>.class</code> nadal wywoła dawną sygnaturę.</li>
<li><strong>Pola nie są polimorficzne</strong>: dostęp zależy od typu kompilacyjnego, a ukryte pole instancyjne to dwa niezależne sloty w jednym obiekcie.</li>
<li>Rzutowanie lub <code>super.field</code> może czytać inny slot; scalenie pól usuwa niezależny stan - przenoś pola ze względu na znaczenie, nie zgodność nazwy i typu.</li>
</ul>
</section>

<h2 id="24-konstruktory-i-inicjalizacja">2.4. Konstruktory i inicjalizacja</h2>
<ul>
<li>Konstruktory nie są dziedziczone; dodanie pierwszego jawnego konstruktora usuwa konstruktor domyślny.</li>
<li>Java 25 dopuszcza ograniczony <strong>prolog</strong> przed <code>super(...)</code>/<code>this(...)</code>; potem konstruktor nadklasy, inicjalizatory pól i bloki bieżącej klasy, na końcu epilog.</li>
<li>Inicjalizatory pól nadklasy zawsze kończą się przed inicjalizatorami podklasy - nowa składnia tego nie zmienia.</li>
<li>Dyspozycja dynamiczna działa podczas konstrukcji: konstruktor bazy może wywołać override zanim pola podklasy zostaną zainicjalizowane.</li>
<li>Pole <code>final</code> bez inicjalizatora musi być przypisane dokładnie raz w klasie deklarującej - <strong>podklasa nie może przypisać odziedziczonego pola <code>final</code></strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="25-26-monitory-static-i-granice-pakiet%C3%B3w">2.5-2.6. Monitory, <code>static</code> i granice pakietów</h2>
<ul>
<li><code>synchronized</code> instancyjne blokuje <code>this</code>; zamiana na delegowanie może przenieść blokadę z wrappera na delegata.</li>
<li><code>static synchronized</code> blokuje obiekt <code>Class</code> typu deklarującego - Pull Up takiej metody <strong>zmienia monitor</strong>.</li>
<li>Przeniesienie pola <code>static</code> może zmienić moment inicjalizacji klasy (wyjątek: zmienne stałe wstawiane do kodu klienta przy kompilacji).</li>
<li>Członek pakietowy nie jest dziedziczony przez podklasę z innego pakietu, więc metoda o tej samej sygnaturze nie jest override.</li>
<li><code>protected</code> poza pakietem działa tylko przez odbiorcę typu podklasy; przeniesienie klasy między pakietami może zmienić dziedziczenie mimo tej samej sygnatury.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="27-28-generyki-bridge-methods-i-hierarchie-sealed">2.7-2.8. Generyki, bridge methods i hierarchie <code>sealed</code></h2>
<ul>
<li>Sygnaturę przenoszonej metody analizuj <strong>po erasure</strong> - dwie różne deklaracje mogą mieć ten sam deskryptor i utworzyć name clash.</li>
<li>Kowariantny override generuje syntetyczne metody bridge, widoczne dla refleksji i frameworków; porównuj wynik <code>javap -p -s -v</code> (deskryptory, flagi <code>bridge</code>, <code>synthetic</code>).</li>
<li><code>permits</code> obejmuje tylko bezpośrednie podtypy, a każdy z nich musi być <code>final</code>, <code>sealed</code> lub <code>non-sealed</code> - wstawienie pośredniej nadklasy zmienia oba poziomy.</li>
<li>Nowy dozwolony wariant może być zgodny binarnie, ale stary wyczerpujący <code>switch</code> rzuci w runtime <code>MatchException</code>.</li>
<li>Klasa <code>final</code>, rekord i enum nie dają się zwykle rozszerzyć; rekord nie może mieć nowej nadklasy, bo zawsze rozszerza <code>Record</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="3-pull-up-method-i-pull-up-field---cel-i-warunki">3. Pull Up Method i Pull Up Field - cel i warunki</h2>
<ul>
<li>Pull Up Method przenosi wspólne zachowanie do nadklasy, Pull Up Field zastępuje pola podklas jednym polem bazy.</li>
<li>Celem nie jest opróżnienie podklas, lecz umieszczenie kontraktu na <strong>najniższym poziomie, na którym jest prawdziwy dla wszystkich potomków</strong>.</li>
<li>Metodę przenieś, gdy implementacje realizują ten sam kontrakt, a różnice da się wyrazić istniejącym punktem polimorficznym.</li>
<li>Metoda musi używać tylko stanu dostępnego w bazie, nie kolidować po erasure i nie tworzyć przypadkowego override; zachowane zostają <code>super</code>, przeciążenia i monitor.</li>
<li>Identyczne ciało nie oznacza tego samego zachowania - np. <code>calculateLimit()</code> w kredycie i limicie technicznym może się rozwijać inaczej.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="33-procedura-pull-up-method">3.3. Procedura Pull Up Method</h2>
<ol>
<li>Uruchom test kontraktowy dla każdego podtypu i porównaj <strong>kontrakty</strong>, nie tylko tekst implementacji.</li>
<li>Ujednolić nazwy i sygnatury małymi krokami.</li>
<li>Przenieś potrzebne operacje pomocnicze albo wprowadź abstrakcyjny punkt rozszerzenia.</li>
<li>Umieść jedną implementację w nadklasie i usuń identyczne implementacje z podklas.</li>
<li>Uruchom testy przez referencję typu bazowego i konkretnego; sprawdź zewnętrzne podklasy, refleksję i zgodność binarną.</li>
</ol>
<p>Nie wywołuj overridable metody z konstruktora tylko po to, by umożliwić Pull Up - powstaje hak działający na częściowo zainicjalizowanym obiekcie.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="34-35-pull-up-field---warunki-i-procedura">3.4-3.5. Pull Up Field - warunki i procedura</h2>
<ul>
<li>Pola łączymy tylko przy tym samym znaczeniu domenowym, typie, cyklu życia, regułach walidacji i zgodnym momencie inicjalizacji.</li>
<li>Pole w nadklasie powinno zwykle pozostać <strong><code>private</code></strong> - konstruktor bazowy i nazwane operacje lepiej chronią niezmienniki niż surowe pole <code>protected</code>.</li>
<li>Procedura: znajdź wszystkie deklaracje tej nazwy w hierarchii, sprawdź odczyty, zapisy, rzutowania i <code>super.field</code>, ustal jednego właściciela stanu.</li>
<li>Dodaj prywatne pole i parametr konstruktora bazy, przekaż wartości przez <code>super(...)</code>, przekieruj metody do wspólnego stanu.</li>
<li>Pola podklas usuń po zniknięciu odwołań; na końcu sprawdź kolejność inicjalizacji, serializację i stare binaria.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="36-ryzyka-pull-up">3.6. Ryzyka Pull Up</h2>
<ul>
<li>Pola <code>static</code> - dwa stany podklas mogą zostać scalone; inicjalizatory z efektami ubocznymi wykonają się wcześniej.</li>
<li>Pola <code>final</code> - przypisanie musi zostać w dozwolonym kontekście klasy deklarującej; metody z <code>super</code> - zmienia się bezpośredni nadtyp.</li>
<li><code>static synchronized</code> zmienia monitor, a metody generyczne mogą zmienić deskryptor i bridge.</li>
<li>Prywatne haki serializacji dotyczą konkretnego segmentu klasy, a frameworki z <code>getDeclaredField</code>/<code>getDeclaredMethod</code> zobaczą inny typ deklarujący.</li>
<li>Pull Up Method może być zgodny binarnie przy tej samej nazwie, deskryptorze i dostępności - ale <strong>to nie gwarantuje zgodności zachowania</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="41-push-down-method-i-push-down-field---cel">4.1. Push Down Method i Push Down Field - cel</h2>
<ul>
<li>Push Down przenosi operację lub stan z typu bazowego do gałęzi, która <strong>rzeczywiście ich potrzebuje</strong>, zawężając zbyt szeroki kontrakt.</li>
<li>Sygnał: członek bazy ma sens tylko dla jednego rodzaju obiektu albo w części podklas pozostaje nieużywany.</li>
<li>Sygnał: wymusza wartości <code>null</code>, puste kolekcje lub flagi bez znaczenia, albo w podklasach rzuca <code>UnsupportedOperationException</code>.</li>
<li>Sygnał: jest używany tylko po sprawdzeniu <code>instanceof</code> i sprawia, że klient typu bazowego zna szczegóły jednego wariantu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="42-push-down-method---warunki-i-sekwencja">4.2. Push Down Method - warunki i sekwencja</h2>
<ul>
<li>Metoda nie może być prawdziwą częścią kontraktu bazy - znajdź wywołania przez referencję bazową i wewnątrz nadklasy.</li>
<li>Jeśli potrzebuje jej kilka podklas jednej gałęzi, trafia do <strong>najbliższego wspólnego przodka</strong>, a nie jest kopiowana do liści.</li>
<li>Sekwencja: przestaw klientów na właściwy podtyp lub węższy interfejs → dodaj metodę w podklasie → opcjonalnie przekieruj bazę → testy → usuń metodę bazową.</li>
<li>W opublikowanej bibliotece usunięcie metody bazowej łamie API: stary <code>.class</code> szuka jej w nadklasie, nie w podklasach.</li>
<li>Samo pozostawienie deklaracji abstrakcyjnej nie chroni zgodności - stara podklasa bez implementacji zawiedzie w runtime.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="43-44-push-down-field-i-asymetria-przesuni%C4%99%C4%87">4.3-4.4. Push Down Field i asymetria przesunięć</h2>
<ul>
<li>Stan przesuwamy w dół, gdy ma znaczenie tylko dla jednej gałęzi, a nadklasa i pozostali potomkowie go nie używają (także przez refleksję).</li>
<li>Procedura: najpierw przenieś <strong>zachowanie</strong> korzystające z pola, potem dodaj pole w gałęzi, przekieruj odczyty/zapisy i usuń pole z bazy.</li>
<li>Równoczesne deklaracje w bazie i podklasie tworzą dwa niezależne sloty - publicznego pola nie da się zachować przez delegowanie.</li>
<li><strong>Pull Up i Push Down nie są symetryczne</strong>: stary odnośnik do metody podklasy może znaleźć implementację w nadklasie, ale nie odwrotnie.</li>
<li>Dlatego ruch w dół publicznego członka częściej wymaga jawnej migracji API i planu dla danych historycznych.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="51-extract-superclass---cel-i-w%C5%82a%C5%9Bciwy-sygna%C5%82">5.1. Extract Superclass - cel i właściwy sygnał</h2>
<ul>
<li>Tworzy wspólną nadklasę dla klas, które są <strong>wariantami jednego pojęcia</strong> i dzielą część stanu lub zachowania.</li>
<li>Właściwym sygnałem jest wspólny kontrakt - podobne linie kodu to za mało.</li>
<li>Pytaj: jak klient nazwie wspólną rolę, które operacje są prawdziwe dla każdego wariantu i czy każdy wariant zadziała przez referencję nadklasy.</li>
<li>Sprawdź, czy wspólne pola mają identyczne znaczenie i cykl życia oraz czy klasy nie potrzebują już innej istotnej nadklasy.</li>
<li>Jeśli nazwa wymaga słów <code>Base</code>, <code>Common</code> albo <code>Abstract</code>, to często znak ekstrakcji motywowanej tylko duplikacją.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="52-extract-superclass---procedura">5.2. Extract Superclass - procedura</h2>
<ol>
<li>Zabezpiecz osobno kontrakt każdej klasy i utwórz pustą abstrakcyjną nadklasę.</li>
<li>Dołączaj klasy <strong>pojedynczo</strong>, uruchamiając testy po każdej.</li>
<li>Przenieś wspólne pola (Pull Up Field), potem wspólne metody (Pull Up Method).</li>
<li>Różnice zostaw za punktami rozszerzeń tylko wtedy, gdy są częścią stabilnego algorytmu.</li>
<li>Dodaj test kontraktowy dla wszystkich konkretnych podtypów i zmigruj klientów, którzy rzeczywiście potrzebują wspólnego typu.</li>
</ol>
<p>W przykładzie <code>Notification</code> ma prywatny wspólny stan, normalizację i podsumowanie; podklasy określają kanał i wysyłkę.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="53-54-konstruktory-fabryki-i-ograniczenia">5.3-5.4. Konstruktory, fabryki i ograniczenia</h2>
<ul>
<li>Nadklasa nie przenosi konstruktorów - każdą publiczną sygnaturę trzeba świadomie zachować lub zmigrować; wspólny stan idzie przez <code>super(...)</code>.</li>
<li>Sprawdź, czy istniał niejawny konstruktor bezargumentowy i jaką miał dostępność oraz czy framework nie wymaga konstruktora <code>public</code>/<code>protected</code>.</li>
<li>Zweryfikuj, że fabryki zachowują typ wyniku, kolejność walidacji i wyjątków, a konstruktor bazy nie wywołuje metod overridable.</li>
<li>Java pozwala rozszerzyć tylko jedną klasę - gdy klasy mają już istotne nadklasy, lepszy bywa interfejs i kompozycja.</li>
<li>Pusty nowy poziom może być zgodny binarnie, ale zmienia <code>getSuperclass</code>, typ deklarujący członków, miejsce adnotacji i założenia mapperów.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="6-extract-subclass">6. Extract Subclass</h2>
<ul>
<li>Tworzy podklasę dla <strong>stabilnego podzbioru instancji</strong> z dodatkowym stanem lub odmiennym zachowaniem; reszta zachowuje prostszy typ bazowy.</li>
<li>Sygnały: pole opcjonalne sensowne tylko dla części obiektów, wiele metod zaczyna się od tego samego sprawdzenia, konstrukcja kontrolowana przez fabryki.</li>
<li>Nie nadaje się dla roli dynamicznej - gdy obiekt zmienia tryb w czasie życia, lepsze są State lub Strategy; wiele osi zmienności wskazuje na kompozycję.</li>
<li>Procedura: zabezpiecz warianty → fabryka lub inwentaryzacja <code>new</code> → podklasa → zmiana punktów tworzenia → Push Down Method/Field → usuń warunek z bazy.</li>
<li>Technika celowo <strong>zmienia klasę runtime</strong>: wpływa na <code>getClass()</code>, <code>equals</code>, ORM, JSON, serializację, DI, <code>instanceof</code> i <code>switch</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="71-72-extract-interface---rola-klienta-i-kontrakt">7.1-7.2. Extract Interface - rola klienta i kontrakt</h2>
<ul>
<li>Interfejs wyodrębnia spójny podzbiór operacji potrzebnych <strong>określonej grupie klientów</strong> - nie kopiujemy całego publicznego API klasy.</li>
<li>Dobry interfejs ma nazwę rozpoznawalnej roli, minimalny zestaw operacji, opisane błędy i efekty, i nie istnieje tylko dla frameworka mockującego.</li>
<li><code>implements</code> wymusza zgodność sygnatur, ale <strong>nie behawioralną</strong> - wszystkie implementacje przechodzą ten sam test kontraktowy.</li>
<li>Test obejmuje dane graniczne i <code>null</code>, typy i kolejność wyjątków, efekty uboczne, idempotencję, atomowość oraz <code>equals</code>/<code>hashCode</code>, jeśli klient ich używa.</li>
<li>Pola interfejsu są niejawnie <code>public static final</code> - interfejs nie jest miejscem na przenoszony stan instancji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="73-extract-interface---bezpieczna-procedura">7.3. Extract Interface - bezpieczna procedura</h2>
<ol>
<li>Zidentyfikuj konkretnych klientów i używany przez nich podzbiór API; zapisz kontrakt tego podzbioru.</li>
<li>Utwórz interfejs z minimalnymi metodami i dodaj <code>implements</code> <strong>bez zmiany</strong> publicznych sygnatur klasy.</li>
<li>Uruchom test kontraktowy i zmieniaj zależności klientów z klasy na interfejs pojedynczo.</li>
<li>Dopiero po migracji rozważ ograniczenie niepotrzebnego API klasy.</li>
</ol>
<ul>
<li>Zmiana typu parametru z klasy na interfejs <strong>zmienia deskryptor JVM</strong> - w bibliotece zostaw stare przeciążenie delegujące.</li>
<li>Zmiany typu wyniku nie obsłuży przeciążenie - potrzebna jest stara metoda albo nowa nazwa.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="74-metody-domy%C5%9Blne">7.4. Metody domyślne</h2>
<ul>
<li>Metoda <code>default</code> musi być poprawna dla każdej implementacji i używać wyłącznie operacji kontraktu - nie jest uniwersalnym sposobem dodawania zachowania.</li>
<li>Metoda klasy wygrywa z <code>default</code>, a bardziej szczegółowy interfejs z mniej szczegółowym; konflikt dwóch niespokrewnionych interfejsów wymaga jawnego rozstrzygnięcia.</li>
<li><code>default</code> nie zastąpi <code>equals</code>, <code>hashCode</code> ani <code>toString</code>, a sekwencja wywołań w niej nie staje się atomowa.</li>
<li>Dla interfejsu używanego z lambdą rozważ <code>@FunctionalInterface</code> - druga metoda abstrakcyjna odbierze mu funkcyjność.</li>
<li>Nowa metoda abstrakcyjna w opublikowanym interfejsie może zakończyć się <code>AbstractMethodError</code> na starych implementacjach.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="8-collapse-hierarchy">8. Collapse Hierarchy</h2>
<ul>
<li>Scala nadklasę i podklasę, gdy rozróżnienie nie reprezentuje już odrębnego kontraktu, wariantu domenowego ani używanego punktu rozszerzenia.</li>
<li>Sygnały: podklasa nie dodaje stanu ani zachowania, override tylko woła <code>super</code>, nadklasa ma jednego potomka, a historyczny powód podziału zniknął.</li>
<li>Mała liczba linii nie wystarcza - pusty typ może być markerem, punktem rozszerzenia, granicą modułu, typem w protokole lub kontraktem DI.</li>
<li>Procedura: wybierz typ-właściciela kontraktu, znajdź konstrukcje, rzutowania, <code>instanceof</code> i refleksję, przenieś członków, przekieruj DI i mapowania.</li>
<li>Usunięcie publicznej klasy łamie klientów - w bibliotece przejściowo zostaw cienki, przestarzały typ zgodności i zaplanuj wydanie łamiące.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="91-replace-inheritance-with-composition---kiedy">9.1. Replace Inheritance with Composition - kiedy?</h2>
<ul>
<li>Gdy podklasa <strong>nie jest zastępowalnym wariantem</strong> nadklasy, a <code>extends</code> służy głównie do ponownego użycia niewielkiej części implementacji.</li>
<li>Gdy odziedziczone API jest znacznie szersze niż potrzeby klientów albo podklasa musi blokować odziedziczone operacje.</li>
<li>Gdy zachowanie ma być wymienne w czasie życia obiektu lub trzeba połączyć kilka niezależnych zachowań.</li>
<li>Gdy zmiany w nadklasie nie powinny automatycznie poszerzać API potomka.</li>
<li>Dziedziczenie pozostaje właściwe przy prawdziwym, stabilnym kontrakcie podtypowania - celem nie jest likwidacja wszystkich hierarchii.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="92-93-procedura-i-granice-zgodno%C5%9Bci">9.2-9.3. Procedura i granice zgodności</h2>
<ul>
<li>Zinwentaryzuj <strong>całe</strong> odziedziczone API, zabezpiecz zachowanie testami charakterystyki i określ wąski kontrakt, który ma zostać.</li>
<li>Dodaj pole delegata o jednoznacznej własności i cyklu życia, wprowadzaj jawne metody przekazujące tylko potrzebne operacje.</li>
<li>Zmigruj klientów zależnych od nadklasy, usuń <code>extends</code> i dodaj testy specyficzne dla delegowania.</li>
<li>Po usunięciu <code>extends ArrayList&lt;String&gt;</code> obiekt przestaje być <code>List</code> - przypisania, rzutowania i parametry <code>List</code> przestają działać.</li>
<li>To poprawna migracja w kontrolowanej aplikacji, ale <strong>nie zgodny zamiennik</strong> publicznego <code>List</code>; tam trzeba wiernie delegować pełny interfejs.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="94-pu%C5%82apki-delegowania">9.4. Pułapki delegowania</h2>
<ul>
<li>Odziedziczona metoda wywoływała hook na tym samym <code>this</code>, a delegat wywoła własny hook; <code>super.method()</code> nie ma wiernego odpowiednika.</li>
<li>Metoda fluent lub callback mogą zwrócić/przekazać <strong>delegata zamiast wrappera</strong>.</li>
<li><code>synchronized</code> blokuje monitor delegata; odziedziczone <code>equals</code>/<code>hashCode</code> znikają; członkowie <code>protected</code> nie są dostępni przez kompozycję.</li>
<li>Współdzielony delegat może nieplanowanie połączyć stan kilku wrapperów, a kolejność konstrukcji się zmienia.</li>
<li>Test kontraktowy nie wykryje liczby wywołań, kolejności efektów, tożsamości <code>this</code> ani monitora - potrzebne recording fake, spy, callback i test współbieżności.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="101-macierz-typowych-skutk%C3%B3w">10.1. Macierz typowych skutków</h2>
<table>
<thead>
<tr>
<th>Transformacja</th>
<th>Typowe ryzyko dla publicznego kontraktu</th>
</tr>
</thead>
<tbody>
<tr>
<td>Pull Up Method</td>
<td>przypadkowy override, inne <code>super</code>, przeciążenia, monitor <code>static</code></td>
</tr>
<tr>
<td>Pull Up Field</td>
<td>scalenie slotów, wcześniejsza inicjalizacja, segment serializacji</td>
</tr>
<tr>
<td>Push Down Method/Field</td>
<td>klient bazowy traci członka; kopia pola = dwa stany</td>
</tr>
<tr>
<td>Extract Superclass</td>
<td>nowy nadtyp, konstruktory, refleksja, ORM, serializacja</td>
</tr>
<tr>
<td>Extract Subclass</td>
<td>inny typ runtime, fabryki, mapowanie, postać danych</td>
</tr>
<tr>
<td>Extract Interface</td>
<td>deskryptory parametrów/wyników, metody domyślne</td>
</tr>
<tr>
<td>Collapse Hierarchy</td>
<td>usunięta nazwa klasy, utrata nadtypu i konfiguracji</td>
</tr>
<tr>
<td>Replace Inh. with Composition</td>
<td>utrata przypisywalności, API, hooków, monitora</td>
</tr>
</tbody>
</table>
</section>

<h2 id="102-103-test-zgodno%C5%9Bci-binarnej-refleksja-i-adnotacje">10.2-10.3. Test zgodności binarnej, refleksja i adnotacje</h2>
<ul>
<li>Pełny test biblioteki: skompiluj klienta przeciw <code>v1</code>, zachowaj jego <code>.class</code>, uruchom z <code>v2</code>, osobno skompiluj ponownie przeciw <code>v2</code> i porównaj oba uruchomienia.</li>
<li>Sam pełny build sprawdza głównie zgodność źródłową - nie odtwarza sytuacji wtyczki skompilowanej przeciw starej wersji.</li>
<li>Przeniesienie członka zmienia wyniki <code>getDeclaredFields/Methods()</code>, <code>Method.getDeclaringClass()</code>, <code>getSuperclass()</code> oraz liczbę metod bridge.</li>
<li><code>@Inherited</code> działa tylko dla adnotacji klas z nadklasy - nie z interfejsów i nie dla metod; oceniaj według sposobu skanowania frameworka.</li>
<li>W systemie modułowym publiczny interfejs musi być w eksportowanym pakiecie, a głęboka refleksja może wymagać otwarcia pakietu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="104-serializacja-javy">10.4. Serializacja Javy</h2>
<ul>
<li>Domyślna postać serializowana jest opisana <strong>osobno dla każdego poziomu hierarchii</strong> - przeniesienie pola zmienia segment strumienia.</li>
<li>Bez jawnej migracji historyczna wartość może zostać odrzucona, a nowe pole dostanie wartość domyślną.</li>
<li>Stały <code>serialVersionUID</code> nie przenosi stanu między segmentami i nie naprawia zmienionego modelu obiektu.</li>
<li>Testuj na zachowanym pliku <code>.ser</code> z <code>v1</code> odczytywanym przez <code>v2</code>; stabilny format zapewnij przez <code>serialPersistentFields</code>, <code>writeObject</code>/<code>readObject</code> lub serialization proxy.</li>
<li>Prywatne haki serializacji nie podlegają overridingowi; przy deserializacji uruchamia się konstruktor pierwszej <strong>nieserializowalnej</strong> nadklasy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="105-106-orm-di-proxy-i-testy-wysokiego-ryzyka">10.5-10.6. ORM, DI, proxy i testy wysokiego ryzyka</h2>
<ul>
<li>Zmiana hierarchii encji to migracja modelu trwałego: strategia dziedziczenia, dyskryminator, tabele, zapytania polimorficzne, lazy loading, proxy.</li>
<li>Test ORM z rzeczywistym dostawcą: zapis, <code>flush</code>, czyszczenie kontekstu, ponowny odczyt, proxy i zapytanie polimorficzne.</li>
<li>Kontener DI zależy od nazw, konstruktorów, adnotacji i typów proxy - uruchom kontekst aplikacji, a nie tylko test z ręcznym <code>new</code>.</li>
<li>Minimalny zestaw: test kontraktowy dla każdego podtypu, test różnicowy z niezależnym oczekiwaniem, test wyboru pól i kolejności konstrukcji.</li>
<li>Do tego <code>javap</code>, stary <code>.class</code> z nową biblioteką, historyczny plik serializacji, skanowanie adnotacji i wszystkie wyczerpujące <code>switch</code> dla <code>sealed</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="111-studium-przypadku-kontrakt-szkoleniowy">11.1. Studium przypadku: kontrakt szkoleniowy</h2>
<ul>
<li>System obsługuje powiadomienia <strong>e-mail i SMS</strong>: oba wymagają niepustego identyfikatora, nadawcy i treści oraz usuwają białe znaki.</li>
<li>Nadawca normalizowany jest do wielkich liter niezależnie od ustawień regionalnych, a wynik wysyłki to stabilne podsumowanie z <code>SENT</code> lub <code>FAILED</code>.</li>
<li>Tylko udana wysyłka SMS może zawierać <code>RECEIPT</code> - mimo to kod początkowy kopiuje pole i metodę potwierdzenia także do e-maila.</li>
<li>Kontrakt obejmuje publiczne konstruktory, wyniki, typy walidacji i kolejność elementów tekstu - nie obejmuje refleksji ani serializacji.</li>
<li>Abstrakcyjna <code>Notification</code> ma dostęp pakietowy, a klasy konkretne są finalne - ta jawna granica pozwala zrobić Push Down Field jako refaktoryzację.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="112-etap-0-niezale%C5%BCne-klasy-i-duplikacja">11.2. Etap 0: niezależne klasy i duplikacja</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SmsNotification</span> {        <span class="hljs-comment">// EmailNotification - prawie identyczna</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String messageId, senderId, body;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">boolean</span> deliveryReceipt;   <span class="hljs-comment">// w e-mailu też jest, choć bez znaczenia</span>

    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">summary</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> messageId + <span class="hljs-string">&quot;|&quot;</span> + senderId + <span class="hljs-string">&quot;|&quot;</span> + body + <span class="hljs-string">&quot;|SMS&quot;</span>;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">dispatch</span><span class="hljs-params">(<span class="hljs-type">boolean</span> successful)</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> summary() + (successful ? <span class="hljs-string">&quot;|SENT&quot;</span> : <span class="hljs-string">&quot;|FAILED&quot;</span>);
        <span class="hljs-keyword">return</span> successful ? appendReceipt(result) : result;
    }
    <span class="hljs-keyword">private</span> <span class="hljs-type">String</span> <span class="hljs-title function_">appendReceipt</span><span class="hljs-params">(String result)</span> {
        <span class="hljs-keyword">return</span> deliveryReceipt ? result + <span class="hljs-string">&quot;|RECEIPT&quot;</span> : result;
    }
}
</code></pre>
<p>Duplikacja wskazuje kierunek, ale nie dowodzi poprawnej nadklasy - najpierw test charakterystyki.</p>
</section>

<h2 id="112-test-charakterystyki-jako-punkt-odniesienia">11.2. Test charakterystyki jako punkt odniesienia</h2>
<ul>
<li><code>NotificationCharacterizationTest</code> zapisuje niezależne oczekiwania dla obu kanałów, sukcesu, błędu, flagi potwierdzenia i walidacji.</li>
<li>Przykład: <code>&quot; msg-1 &quot;, &quot; ops &quot;, &quot; Deployment ready &quot;</code> → <code>msg-1|OPS|Deployment ready|EMAIL|SENT</code>.</li>
<li>Dla SMS z potwierdzeniem wynik to <code>...|SMS|SENT|RECEIPT</code>, a przy błędzie <code>...|SMS|FAILED</code> - bez znacznika.</li>
<li>Walidacja: pusta wartość rzuca <code>IllegalArgumentException</code>, <code>null</code> rzuca <code>NullPointerException</code>.</li>
<li>Test nie ocenia, czy zachowanie jest idealne - oddziela <strong>ruch struktury</strong> od ewentualnych późniejszych zmian funkcjonalnych.</li>
</ul>
</section>

<h2 id="113-etap-1-extract-superclass-oraz-pull-up">11.3. Etap 1: Extract Superclass oraz Pull Up</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Notification</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String messageId, senderId, body;
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">boolean</span> deliveryReceipt;   <span class="hljs-comment">// celowo niedoskonały stan przejściowy</span>

    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-type">String</span> <span class="hljs-title function_">summary</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> messageId + <span class="hljs-string">&quot;|&quot;</span> + senderId + <span class="hljs-string">&quot;|&quot;</span> + body + <span class="hljs-string">&quot;|&quot;</span> + channel();
    }
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">final</span> <span class="hljs-type">String</span> <span class="hljs-title function_">dispatchResult</span><span class="hljs-params">(<span class="hljs-type">boolean</span> successful)</span> {
        <span class="hljs-keyword">return</span> summary() + (successful ? <span class="hljs-string">&quot;|SENT&quot;</span> : <span class="hljs-string">&quot;|FAILED&quot;</span>);
    }
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">final</span> <span class="hljs-type">String</span> <span class="hljs-title function_">appendReceipt</span><span class="hljs-params">(String result)</span> { ... }
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">String</span> <span class="hljs-title function_">channel</span><span class="hljs-params">()</span>;
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">String</span> <span class="hljs-title function_">dispatch</span><span class="hljs-params">(<span class="hljs-type">boolean</span> successful)</span>;
}
</code></pre>
<p><code>channel()</code> to świadomy punkt polimorficzny; <code>final</code> na <code>summary()</code> dokumentuje wspólny algorytm (w bibliotece - tylko po sprawdzeniu zewnętrznych override).</p>
</section>

<h2 id="114-etap-2-push-down-cechy-sms">11.4. Etap 2: Push Down cechy SMS</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SmsNotification</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Notification</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">boolean</span> deliveryReceipt;           <span class="hljs-comment">// stan tylko tam, gdzie ma sens</span>

    <span class="hljs-type">public</span> <span class="hljs-title function_">SmsNotification</span><span class="hljs-params">(String id, String sender, String body, <span class="hljs-type">boolean</span> receipt)</span> {
        <span class="hljs-built_in">super</span>(id, sender, body);
        <span class="hljs-built_in">this</span>.deliveryReceipt = receipt;
    }
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">dispatch</span><span class="hljs-params">(<span class="hljs-type">boolean</span> successful)</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> dispatchResult(successful);
        <span class="hljs-keyword">return</span> successful ? appendReceipt(result) : result;
    }
    <span class="hljs-keyword">private</span> <span class="hljs-type">String</span> <span class="hljs-title function_">appendReceipt</span><span class="hljs-params">(String r)</span> { <span class="hljs-keyword">return</span> deliveryReceipt ? r + <span class="hljs-string">&quot;|RECEIPT&quot;</span> : r; }
}
</code></pre>
<ul>
<li>Testy pokazały, że flaga nie wpływa na e-mail - baza odzyskuje kontrakt prawdziwy dla wszystkich podtypów.</li>
<li>E-mail zachowuje przejściowy konstruktor 4-argumentowy (ignoruje flagę) i dostaje docelowy 3-argumentowy.</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@FunctionalInterface</span>

<h2 id="116-test-r%C3%B3wnowa%C5%BCno%C5%9Bci-wszystkich-etap%C3%B3w">11.6. Test równoważności wszystkich etapów</h2>
<ul>
<li><code>NotificationHierarchyEquivalenceTest</code> porównuje każdy etap (<code>stage0</code>-<code>stage3</code>) z <strong>niezależnym oczekiwaniem</strong>, a nie wersję „przed” z „po”.</li>
<li>Macierz obejmuje obie wartości dawnej flagi e-mail, obie wartości potwierdzenia SMS, sukces, błąd oraz typy wyjątków dla pustej wartości i <code>null</code>.</li>
<li>Samo <code>before.equals(after)</code> byłoby niewystarczające, bo obie wersje mogłyby zawierać ten sam błąd.</li>
<li><code>OutboundNotificationContractTest</code> uruchamia te same reguły przez interfejs i sprawdza niemodyfikowalność listy wynikowej.</li>
<li>Test odrzucenia <code>null</code> potwierdza, że błąd jest wykrywany <strong>przed</strong> pierwszym wywołaniem <code>dispatch</code>.</li>
</ul>
</section>

<h2 id="121-extract-subclass-zadanie-zaplanowane">12.1. Extract Subclass: zadanie zaplanowane</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DeliveryJob</span> {
    DeliveryJob() { }                                   <span class="hljs-comment">// konstruktor pakietowy</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">DeliveryJob</span> <span class="hljs-title function_">immediate</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DeliveryJob</span>(); }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">DeliveryJob</span> <span class="hljs-title function_">scheduled</span><span class="hljs-params">(Instant at)</span> { <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ScheduledDeliveryJob</span>(at); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">dispatchAt</span><span class="hljs-params">(Instant now)</span> { Objects.requireNonNull(now); <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;SENT&quot;</span>; }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ScheduledDeliveryJob</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">DeliveryJob</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> Instant scheduledAt;
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">dispatchAt</span><span class="hljs-params">(Instant now)</span> {
        Objects.requireNonNull(now, <span class="hljs-string">&quot;now must not be null&quot;</span>);
        <span class="hljs-keyword">if</span> (now.isBefore(scheduledAt)) <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;WAITING_UNTIL &quot;</span> + scheduledAt;
        <span class="hljs-keyword">return</span> <span class="hljs-built_in">super</span>.dispatchAt(now);
    }
}
</code></pre>
<p>Przed: jedna klasa z <code>Optional&lt;Instant&gt;</code>. Po: fabryka nadal zwraca <code>DeliveryJob</code>, a <code>now == scheduledAt</code> oznacza <code>SENT</code>.</p>
</section>

<h2 id="121-extract-subclass---decyzje-projektowe">12.1. Extract Subclass - decyzje projektowe</h2>
<ul>
<li><code>scheduledAt</code> jest niezmienne, więc wariant <strong>nie zmienia się w czasie życia</strong> obiektu - to warunek sensowności podklasy.</li>
<li>Fabryka zachowuje typ wyniku <code>DeliveryJob</code>, a specjalna podklasa nie jest częścią publicznego API konstrukcji.</li>
<li><code>super.dispatchAt(now)</code> świadomie ponownie używa zachowania bazowego po osiągnięciu terminu.</li>
<li><code>DeliveryJobEquivalenceTest</code> sprawdza zadanie natychmiastowe i zaplanowane przed, dokładnie w i po terminie - bez wymagania tej samej klasy runtime.</li>
<li>Gdyby zadanie można było wielokrotnie planować, wstrzymywać i wznawiać, lepszy byłby obiekt polityki albo State.</li>
</ul>
</section>

<h2 id="122-collapse-hierarchy-zb%C4%99dny-formatter">12.2. Collapse Hierarchy: zbędny formatter</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LegacyNotificationFormatter</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">format</span><span class="hljs-params">(String recipient, String message)</span> { ... }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NotificationFormatter</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">LegacyNotificationFormatter</span> { }

<span class="hljs-comment">// po</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">NotificationFormatter</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">format</span><span class="hljs-params">(String recipient, String message)</span> {

<h2 id="123-replace-inheritance-with-composition-lista-odbiorc%C3%B3w">12.3. Replace Inheritance with Composition: lista odbiorców</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: public final class RecipientList extends ArrayList&lt;String&gt; { snapshot() }</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RecipientList</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Iterable</span>&lt;String&gt; {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">List</span>&lt;String&gt; <span class="hljs-variable">recipients</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();

    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">add</span><span class="hljs-params">(String r)</span>         { <span class="hljs-keyword">return</span> recipients.add(r); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">remove</span><span class="hljs-params">(Object r)</span>      { <span class="hljs-keyword">return</span> recipients.remove(r); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">contains</span><span class="hljs-params">(Object r)</span>    { <span class="hljs-keyword">return</span> recipients.contains(r); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">size</span><span class="hljs-params">()</span>                    { <span class="hljs-keyword">return</span> recipients.size(); }
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">Iterator</span>&lt;String&gt; <span class="hljs-title function_">iterator</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> Collections.unmodifiableList(recipients).iterator();
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">List</span>&lt;String&gt; <span class="hljs-title function_">snapshot</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">return</span> Collections.unmodifiableList(<span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;(recipients));
    }
}

<p>Jawnie zadeklarowany wąski podzbiór operacji; <code>Iterable</code> dodaje jeszcze <code>forEach</code> i <code>spliterator</code>.</p>

<h2 id="123-co-zmiana-%C5%9Bwiadomie-pomija">12.3. Co zmiana świadomie pomija</h2>
<ul>
<li><code>RecipientListEquivalenceTest</code> sprawdza duplikaty, kolejność iteracji, <code>remove(Object)</code>, izolację migawek i niezależność stanu dwóch wrapperów.</li>
<li>Test potwierdza też, że iterator wersji po zmianie <strong>nie pozwala ominąć</strong> jawnego API mutacji.</li>
<li>Poza kontraktem pozostają: przypisywalność do <code>List&lt;String&gt;</code>, <code>add(int, E)</code>, <code>set</code>, <code>clear</code>, <code>sort</code>, <code>remove(int)</code> i inne odziedziczone metody.</li>
<li>Tracone są też <code>Iterator.remove()</code>, semantyka <code>equals</code>/<code>hashCode</code> kolekcji, charakterystyki <code>Spliterator</code>, serializowalność i klasa runtime.</li>
<li>Wycofanie tych właściwości jest dopuszczalne tylko po potwierdzeniu, że nie należą do kontraktu, albo po zaplanowanej migracji klientów.</li>
</ul>
</section>

<h2 id="13-warsztat-praktyczny---zasady">13. Warsztat praktyczny - zasady</h2>
<ul>
<li>Każde ćwiczenie zaczyna się od <strong>działających testów</strong> i kończy krótką retrospektywą.</li>
<li>Wykonuj małe kroki i uruchamiaj testy po każdym z nich.</li>
<li>Nie łącz w jednym kroku ruchu członka, zmiany zachowania i usunięcia publicznego API.</li>
<li>Kod ćwiczeń: pakiety <code>pl.training.module5.stage0…stage3</code>, <code>extractsubclass</code>, <code>collapse</code>, <code>composition</code> (warianty <code>before</code>/<code>after</code>).</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-1-extract-superclass-i-pull-up">Ćwiczenie 1: Extract Superclass i Pull Up</h2>
<p><strong>Start:</strong> <code>stage0</code>. <strong>Cel:</strong> wspólna <code>Notification</code> z zachowaniem wyników i walidacji obu kanałów.</p>
<ul>
<li>Uruchom <code>NotificationCharacterizationTest</code>, wypisz wspólne pola i metody i oceń ich znaczenie, cykl życia i kontrakt.</li>
<li>Utwórz pustą abstrakcyjną <code>Notification</code>, dołącz jedną klasę, przenieś stan przez konstruktor bazowy, normalizację, <code>messageId</code> i podsumowanie.</li>
<li>Wprowadź minimalny punkt polimorficzny kanału, dołącz drugą klasę i uruchom test różnicowy.</li>
<li>Pytania: dlaczego pola bazowe są prywatne? czy <code>deliveryReceipt</code> należy do kontraktu? co zmieniłoby wywołanie <code>channel()</code> z konstruktora?</li>
<li>Akceptacja: te same sygnatury konstruktorów, jedno źródło każdej reguły, brak surowych pól <code>protected</code>.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-2-push-down-i-extract-interface">Ćwiczenie 2: Push Down i Extract Interface</h2>
<p><strong>Start:</strong> <code>stage1</code>. <strong>Cel:</strong> usunąć potwierdzenie z kontraktu bazowego i utworzyć rolę dla klienta partii.</p>
<ul>
<li>Znajdź odczyty <code>deliveryReceipt</code> i wywołania <code>appendReceipt</code>; potwierdź testem, że e-mail ignoruje flagę.</li>
<li>Przenieś pole i metodę do <code>SmsNotification</code>, usuń parametr z konstruktora bazy, zachowaj przejściowy konstruktor e-mail.</li>
<li>Zdefiniuj minimalny interfejs dla <code>NotificationBatch</code>, dodaj <code>implements</code> bez zmiany sygnatur i przestaw klienta na interfejs.</li>
<li>Zaprojektuj ścieżkę wycofania starego konstruktora dla publicznej biblioteki.</li>
<li>Akceptacja: brak stanu SMS w bazie, <code>NotificationBatch</code> nie zależy od klasy abstrakcyjnej, test kontraktowy przez <code>OutboundNotification</code>.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-3-extract-subclass-i-collapse-hierarchy">Ćwiczenie 3: Extract Subclass i Collapse Hierarchy</h2>
<p><strong>Część A</strong> (<code>extractsubclass.before</code>):</p>
<ul>
<li>Zapisz tabelę wyników zadania natychmiastowego i zaplanowanego przed, w i po terminie; utwórz <code>ScheduledDeliveryJob</code>.</li>
<li>Zmień tylko fabrykę wariantu zaplanowanego, przenieś <code>scheduledAt</code> i warunek, usuń <code>Optional</code> z bazy; wypisz kontrakty celowo niezachowane.</li>
</ul>
<p><strong>Część B</strong> (<code>collapse.before</code>):</p>
<ul>
<li>Ustal nazwę używaną przez klientów, przenieś zachowanie, usuń zbędny poziom i uruchom test formatu oraz walidacji.</li>
<li>Zaproponuj kompatybilny etap przejściowy, gdyby oba typy były publiczne.</li>
</ul>
<p><strong>Akceptacja:</strong> jawny test terminu granicznego, stan specjalny tylko w podtypie, rozpoznana zmiana klasy runtime.</p>
</section>

<h2 id="%C4%87wiczenie-4-replace-inheritance-with-composition">Ćwiczenie 4: Replace Inheritance with Composition</h2>
<p><strong>Start:</strong> <code>composition.before</code>. <strong>Cel:</strong> zastąpić dziedziczenie po <code>ArrayList</code> wąską fasadą bez przypadkowej obietnicy pełnego <code>List</code>.</p>
<ul>
<li>Wyszukaj metody wywoływane przez klientów i zapisz skrypt zachowania: duplikaty, kolejność, usuwanie, migawka.</li>
<li>Dodaj prywatny delegate, wprowadzaj po jednej metodzie przekazującej, zaimplementuj <code>Iterable&lt;String&gt;</code> i usuń <code>extends</code>.</li>
<li>Sprawdź, co przestało się kompilować; oceń <code>equals</code>, <code>hashCode</code>, serializację, iterator i własność delegata.</li>
<li>Przygotuj wariant planu dla publicznej klasy, której klienci wymagają pełnego <code>List</code>.</li>
<li>Akceptacja: każdy wrapper ma własny delegate, migawki są izolowane, znasz różnicę <code>remove(Object)</code> vs <code>remove(int)</code>.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-retrospektywa-po-warsztacie">Ćwiczenie: retrospektywa po warsztacie</h2>
<p>Zespół odpowiada na pięć pytań:</p>
<ol>
<li>Jaki kontrakt był chroniony?</li>
<li>Który krok był mechaniczny, a który wymagał decyzji projektowej?</li>
<li>Jaki test wykryłby najgroźniejszą regresję?</li>
<li>Której warstwy zgodności nie sprawdziły testy jednostkowe?</li>
<li>Czy końcowa hierarchia opisuje domenę, czy tylko ponownie używa kodu?</li>
</ol>

<h2 id="14-rozwi%C4%85zania---%C4%87wiczenia-1-i-2">14. Rozwiązania - ćwiczenia 1 i 2</h2>
<ul>
<li><strong>Ćw. 1</strong> (wynik = <code>stage1</code>): pusta <code>Notification</code> → prywatne pola w konstruktorze bazy → <code>normalized</code> → <code>messageId()</code> → <code>channel()</code> + <code>summary()</code> → <code>dispatchResult</code>.</li>
<li><code>channel()</code> to jedyna różnica potrzebna wspólnemu algorytmowi - nie trzeba getterów dla wszystkich pól ani pól <code>protected</code>.</li>
<li><code>deliveryReceipt</code> w bazie zachowuje wyniki, ale jest sygnałem złego modelu: e-mail przyjmuje wartość bez znaczenia.</li>
<li><strong>Ćw. 2</strong> (wynik = <code>stage2</code>/<code>stage3</code>): najpierw przenieś zachowanie <code>appendReceipt</code>, potem stan - baza przestaje zależeć od pola przed jego usunięciem.</li>
<li><code>OutboundNotification</code> zawiera tylko <code>dispatch</code>; w publicznej bibliotece stary deskryptor klienta zostaje jako przeciążenie delegujące.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="14-rozwi%C4%85zania---%C4%87wiczenia-3-i-4">14. Rozwiązania - ćwiczenia 3 i 4</h2>
<ul>
<li><strong>Ćw. 3:</strong> krytyczna jest zmiana punktu tworzenia <strong>przed</strong> Push Down - obiekt zaplanowany musi już być <code>ScheduledDeliveryJob</code>.</li>
<li><code>now.isBefore(scheduledAt)</code> oznacza, że równość z terminem daje <code>SENT</code>; bez testu granicznego zmiana operatora przeszłaby niezauważona.</li>
<li>Collapse: pozostaje <code>NotificationFormatter</code>, bo tej nazwy używają klienci; w publicznym API - cienka klasa zgodności lub wydanie łamiące.</li>
<li><strong>Ćw. 4:</strong> własny delegate zapobiega dzieleniu stanu; ujawnienie <code>remove(int)</code> sprawiłoby, że literał liczbowy usuwałby po indeksie.</li>
<li>Dla publicznego <code>List</code>: zachowaj dziedziczenie, zaimplementuj pełny <code>List</code> z precyzyjnymi testami albo wprowadź nowy wąski typ i wydanie łamiące.</li>
</ul>
</section>

<h2 id="15-sprawdzenie-wiedzy-12">15. Sprawdzenie wiedzy (1/2)</h2>
<ol>
<li>Dlaczego podobny kod nie wystarcza do Extract Superclass? - <em>nadklasa deklaruje wspólne pojęcie i kontrakt, podobieństwo może być przypadkowe.</em></li>
<li>Czym overriding różni się od overloading? - <em>override wybierany w runtime wg klasy odbiorcy, overload w kompilacji wg typów statycznych.</em></li>
<li>Czy rzutowanie na nadtyp wyłącza dyspozycję dynamiczną? - <em>nie; omija ją m.in. jawne <code>super</code>.</em></li>
<li>Jaki monitor blokuje <code>static synchronized</code>? - <em>obiekt <code>Class</code> klasy deklarującej, więc przeniesienie zmienia monitor.</em></li>
<li>Dlaczego Push Down publicznej metody łamie stare binaria? - <em>stary odnośnik wskazuje nadklasę, a JVM nie szuka w podklasach.</em></li>
</ol>
</section>

<h2 id="15-sprawdzenie-wiedzy-22">15. Sprawdzenie wiedzy (2/2)</h2>
<ol start="6">
<li>Kiedy Extract Subclass przegrywa ze State/Strategy? - <em>gdy rola zmienia się w czasie życia lub jest kilka niezależnych osi zmienności.</em></li>
<li>Dlaczego zmiana parametru z klasy na interfejs łamie stare <code>.class</code>? - <em>typ parametru jest częścią deskryptora metody.</em></li>
<li>Kiedy pusta podklasa ma znaczenie? - <em>jako marker, punkt rozszerzenia, typ w protokole, cel DI lub część formatu danych.</em></li>
<li>Dlaczego <code>serialVersionUID</code> nie wystarcza po Pull Up Field? - <em>stan zapisywany jest per poziom hierarchii; UID nie migruje wartości.</em></li>
<li>Dlaczego <code>RecipientList</code> po kompozycji nie zastąpi <code>List</code>? - <em>traci przypisywalność, odziedziczone operacje, <code>equals</code>/<code>hashCode</code> i serializację.</em></li>
</ol>
</section>

<h2 id="16-listy-kontrolne---przed-zmian%C4%85-i-ruchy-cz%C5%82onk%C3%B3w">16. Listy kontrolne - przed zmianą i ruchy członków</h2>
<ul>
<li><strong>Przed zmianą:</strong> umiem nazwać kontrakt i klientów, znam wszystkie podtypy (także zewnętrzne), punkty tworzenia, <code>super</code>, <code>instanceof</code>, rzutowania.</li>
<li>Sprawdziłem pola o tych samych nazwach, metody <code>static</code>/<code>final</code>/<code>synchronized</code>, pakiety i <code>protected</code>, erasure i bridge, refleksję, ORM, DI, serializację.</li>
<li><strong>Pull Up:</strong> ten sam kontrakt i znaczenie pól, te same przeciążenia i <code>super</code>, brak przypadkowego override, pole bazowe prywatne, brak scalania pól <code>static</code>.</li>
<li><strong>Push Down:</strong> członek nie należy do kontraktu bazy, klienci przestawieni na podtyp, członek trafia do najbliższej wspólnej gałęzi, jedno źródło stanu.</li>
<li>Publiczny członek ma plan wycofania, a dane historyczne - plan migracji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="16-listy-kontrolne---ekstrakcje-scalanie-kompozycja">16. Listy kontrolne - ekstrakcje, scalanie, kompozycja</h2>
<ul>
<li><strong>Extract Superclass/Subclass:</strong> nazwa opisuje pojęcie, podtypy spełniają kontrakt, konstruktory i fabryki świadomie zachowane, cecha podklasy stabilna.</li>
<li><strong>Extract Interface:</strong> rola konkretnych klientów, minimalny podzbiór, wspólny test kontraktowy, poprawne <code>default</code>, plan dla zmian deskryptorów.</li>
<li><strong>Collapse Hierarchy:</strong> usuwany poziom nie jest markerem ani punktem rozszerzenia, wybrana właściwa nazwa, klienci starej nazwy mają warstwę zgodności.</li>
<li><strong>Composition:</strong> podtypowanie fałszywe, znane całe odziedziczone API, delegate ma jasną własność, sprawdzone hooki, fluent <code>this</code>, monitor, <code>equals</code>, serializacja.</li>
<li><strong>Na koniec modułu:</strong> testy charakterystyki, kontraktowe i różnicowe przechodzą, brak dwóch źródeł stanu, zmiana łamiąca jest nazwana i zaplanowana osobno.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="60" data-size="16:9">
<h2 id="podsumowanie---najwa%C5%BCniejsze-wnioski">Podsumowanie - najważniejsze wnioski</h2>
<ul>
<li>Refaktoryzacja hierarchii jest bezpieczna dopiero, gdy <strong>struktura typów odpowiada kontraktom</strong>, a testy obserwują właściwy poziom systemu.</li>
<li>Pull Up centralizuje prawdziwie wspólny stan i zachowanie; Push Down usuwa z bazy cechy właściwe tylko części obiektów.</li>
<li>Extract Superclass/Subclass zmieniają model typów i wymagają kontroli konstrukcji oraz zastępowalności; Extract Interface wydziela rolę klienta.</li>
<li>Collapse Hierarchy usuwa rozróżnienie bez znaczenia; Replace Inheritance with Composition ogranicza fałszywe podtypowanie i nadmiarowe API.</li>
<li>W Javie metody, przeciążenia i pola mają różne reguły wyboru - poprawna składnia nie wystarcza, gdy kontrakt obejmuje binaria, refleksję, serializację czy ORM.</li>
<li>Rozdzielaj trzy decyzje: <strong>gdzie należy stan i zachowanie, jaki typ widzi klient i które formy zgodności muszą zostać zachowane</strong>.</li>
