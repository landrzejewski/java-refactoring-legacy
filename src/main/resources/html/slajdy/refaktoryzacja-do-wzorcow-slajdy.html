<h2 id="jak-czyta%C4%87-ten-materia%C5%82">Jak czytać ten materiał</h2>
<ul>
<li>Każdy slajd przedstawia jedną myśl: tytuł mówi, <strong>co</strong> twierdzimy, a punkty wyjaśniają, <strong>dlaczego</strong> tak jest i <strong>jakie są tego konsekwencje</strong>.</li>
<li>Wzorce i refaktoryzacje nazywamy po polsku, tak jak w polskich wydaniach książek Bandy Czworga i Martina Fowlera. Nazwę angielską, której używają narzędzia i dokumentacja, podajemy w nawiasie.</li>
<li>Przykłady kodu pochodzą z systemu kina <strong>CineLegacy</strong>, na którym prowadzony jest warsztat. Dopisek „Warsztat: m5/s08” wskazuje scenę z pełnym kodem, testami i kolejnymi krokami.</li>
<li>Części I-III to podstawy, bez których refaktoryzacja do wzorca nie jest bezpieczna. Części IV-VI omawiają refaktoryzacje do wzorców oraz usuwanie wzorców, które przestały być potrzebne.</li>
</ul>
</section>

<h2 id="11-refaktoryzacja-zmienia-struktur%C4%99-nie-zachowanie">1.1. Refaktoryzacja zmienia strukturę, nie zachowanie</h2>
<ul>
<li><strong>Refaktoryzacja</strong> to przebudowa wewnętrznej struktury kodu bez zmiany jego zachowania obserwowalnego z zewnątrz. Celem jest kod łatwiejszy do zrozumienia i tańszy w kolejnych zmianach.</li>
<li>Refaktoryzację przeprowadza się serią <strong>małych kroków</strong>. Po każdym z nich kod się kompiluje, testy przechodzą, a pracę można przerwać albo cofnąć ostatni krok.</li>
<li>Jeśli podczas „porządków” zmienia się wynik, komunikat błędu albo kolejność efektów, to nie jest już refaktoryzacja, lecz zmiana zachowania. Bywa potrzebna, ale wprowadzamy ją świadomie i osobno.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" data-style="section { font-size: 22px; padding: 40px 56px; }

<h2 id="12-zachowanie-obserwowalne-to-wi%C4%99cej-ni%C5%BC-wynik-metody">1.2. Zachowanie obserwowalne to więcej niż wynik metody</h2>
<p>Klient, czyli kod wywołujący, może zauważyć każdy z tych wymiarów. Test, który sprawdza tylko jeden z nich, przepuści regresję w pozostałych.</p>
<table>
<thead>
<tr>
<th>Wymiar</th>
<th>Przykład z kina</th>
</tr>
</thead>
<tbody>
<tr>
<td>wynik</td>
<td>kwota do zapłaty <code>74.00</code></td>
</tr>
<tr>
<td>wyjątki</td>
<td>typ, komunikat i moment błędu dla nieznanego programu zniżek</td>
</tr>
<tr>
<td>stan po sukcesie i po błędzie</td>
<td>rezerwacja zostaje w stanie <code>NEW</code>, gdy bramka płatności odmówi</td>
</tr>
<tr>
<td>współpracownicy</td>
<td>jeden mail i jedno obciążenie karty, w tej kolejności</td>
</tr>
<tr>
<td>czas i środowisko</td>
<td>godzina wygenerowania dokumentu, ustawienia regionalne (<code>Locale</code>) użyte przy formatowaniu kwot</td>
</tr>
<tr>
<td>granice</td>
<td>dane zapisane w bazie, nagłówek pliku CSV, nazwy w konfiguracji</td>
</tr>
</tbody>
</table>
<p class="ref">Warsztat: m3/s03 (wektor obserwowalnego zachowania)</p>

<h2 id="13-refaktoryzacja-zmiana-zachowania-przepisanie">1.3. Refaktoryzacja, zmiana zachowania, przepisanie</h2>
<table>
<thead>
<tr>
<th>Rodzaj zmiany</th>
<th>Co się zmienia</th>
<th>Jak ją weryfikujemy</th>
</tr>
</thead>
<tbody>
<tr>
<td>refaktoryzacja</td>
<td>tylko struktura kodu</td>
<td>ten sam test przed każdym krokiem i po nim</td>
</tr>
<tr>
<td>naprawa błędu, nowa funkcja</td>
<td>zachowanie, celowo</td>
<td>nowy test, który opisuje nowe zachowanie</td>
</tr>
<tr>
<td>zmiana kontraktu</td>
<td>typ, format, moment błędu</td>
<td>uzgodnienie z klientami, osobne zatwierdzenie zmian</td>
</tr>
<tr>
<td>przepisanie</td>
<td>wszystko naraz</td>
<td>trudno, bo brakuje punktu odniesienia</td>
</tr>
</tbody>
</table>
<ul>
<li>Tych rodzajów zmian <strong>nie łączymy w jednym kroku</strong>. Gdy wiemy, który krok zmienił zachowanie, łatwo go przejrzeć, uzasadnić i wycofać.</li>
<li>Przepisanie od zera kusi, ale grozi utratą wiedzy zapisanej w starym kodzie, także w jego „dziwnych” regułach. Seria małych refaktoryzacji zwykle prowadzi do celu taniej.</li>
</ul>
</section>

<h2 id="14-kiedy-refaktoryzowa%C4%87">1.4. Kiedy refaktoryzować</h2>
<ul>
<li>Najlepszy moment to chwila <strong>tuż przed zmianą</strong>, którą i tak trzeba wprowadzić: najpierw ułatw zmianę (refaktoryzacja), a potem wprowadź łatwą już zmianę (nowa funkcja).</li>
<li>Refaktoryzujemy kod, który <strong>często się zmienia</strong> albo jest trudny do sprawdzenia. Brzydki, ale stabilny kod, którego nikt nie rusza, może poczekać.</li>
<li>Każda refaktoryzacja ma cel: konkretną zmianę, którą chcemy uczynić tańszą. Bez celu łatwo przebudowywać kod bez końca.</li>
<li>Warunkiem wstępnym jest siatka bezpieczeństwa, czyli testy, które potwierdzą, że zachowanie się nie zmieniło (część III).</li>
</ul>
</section>

<h2 id="15-zapachy-kodu-to-hipotezy-nie-wyroki">1.5. Zapachy kodu to hipotezy, nie wyroki</h2>
<ul>
<li><strong>Zapach kodu</strong> (ang. code smell) to objaw, który <em>sugeruje</em> problem projektowy: powielona instrukcja <code>switch</code>, długa metoda, klasa, która zna zbyt wiele innych klas.</li>
<li>Zapach nie mówi, co zrobić. Ten sam <code>switch</code> może oznaczać wymienny algorytm (Strategia), cykl życia obiektu (Stan) albo po prostu dwa stabilne przypadki, które najlepiej zostawić w spokoju.</li>
<li>Zanim sięgniemy po wzorzec, opisujemy problem <strong>bez nazwy wzorca</strong>: co się zmienia, jak często, kto o tym decyduje i ile miejsc trzeba dziś poprawić przy jednej zmianie.</li>
</ul>
</section>

<h2 id="21-ma%C5%82e-kroki-i-szybka-informacja-zwrotna">2.1. Małe kroki i szybka informacja zwrotna</h2>
<ul>
<li>Im szybciej dowiadujemy się o błędzie, tym taniej go naprawić. Kompilator odpowiada w kilka sekund, testy jednostkowe w kilka minut, przegląd kodu po kilku godzinach, a użytkownicy po kilku dniach.</li>
<li>Dlatego dzielimy zmianę na kroki, które kompilator i testy mogą sprawdzić od razu. Błąd w małym kroku ma mały zasięg, a sam krok łatwo wycofać.</li>
<li>Warto zawsze pracować w tej samej pętli: jeden ruch, kompilacja, testy, zatwierdzenie zmian w repozytorium (ang. commit). Duża zmiana to wiele takich pętli, a nie jeden wielki skok.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" data-style="section { font-size: 22px; padding: 40px 56px; }

<h2 id="22-bramki-jako%C5%9Bci-w-starym-kodzie-stan-bazowy-i-zapadka">2.2. Bramki jakości w starym kodzie: stan bazowy i zapadka</h2>
<ul>
<li><strong>Bramka jakości</strong> to automatyczne sprawdzenie, które przerywa budowanie projektu, gdy kod łamie regułę, np. ostrzeżenia kompilatora traktowane jak błędy (<code>-Xlint:all -Werror</code>), zakaz <code>System.out</code> albo wymóg testów dla nowych metod.</li>
<li>W dużym, starym kodzie nie włącza się bramki z dnia na dzień, bo budowanie kończyłoby się błędem przez tygodnie. Najpierw zapisujemy <strong>stan bazowy</strong>, potem wymagamy, żeby nie pojawiały się nowe naruszenia, i stopniowo podnosimy poprzeczkę. Poziom może tylko rosnąć, jak w zapadce (ang. ratchet).</li>
<li>Bramka musi działać powtarzalnie, wskazywać konkretne miejsce i nie zgłaszać fałszywych alarmów. W przeciwnym razie zespół szybko ją wyłączy.</li>
</ul>
<p class="ref">Warsztat: m2/s03 (bramka kompilatora), m2/s04 (minimalna bramka jakości zapisana w kodzie)</p>
</section>

<h2 id="23-yagni-buduj-dla-dzisiejszej-potrzeby">2.3. YAGNI: buduj dla dzisiejszej potrzeby</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// TicketPricer: silnik reguł z rejestrem wtyczek i kontekstem w Map, a reguły są tylko dwie</span>
<span class="hljs-type">Map</span>&lt;String, Object&gt; <span class="hljs-variable">context</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HashMap</span>&lt;&gt;();
context.put(<span class="hljs-string">&quot;start&quot;</span>, quote.start());
context.put(<span class="hljs-string">&quot;row&quot;</span>, quote.row());
<span class="hljs-keyword">for</span> (PricingRule rule : registry.resolve(activeRules)) {
    <span class="hljs-keyword">if</span> (rule.appliesTo(context)) price = rule.apply(context, price);
}
</code></pre>
<ul>
<li><strong>YAGNI</strong> (ang. You Aren't Gonna Need It, „nie będziesz tego potrzebować”): nie buduj mechanizmu dla wymagania, które dopiero <em>może</em> się pojawić. Tutaj pięć klas obsługuje dwie reguły, a literówka w nazwie reguły ujawnia się dopiero w czasie działania programu.</li>
<li>YAGNI nie zabrania pisania testów ani nadawania czytelnych nazw. To właśnie one pozwalają bezpiecznie odłożyć abstrakcję do chwili, gdy realna potrzeba pokaże, jak powinna wyglądać (zasada ostatniego odpowiedzialnego momentu).</li>
</ul>
<p class="ref">Warsztat: m2/s01</p>
</section>

<h2 id="24-pi%C4%99%C4%87-pyta%C5%84-przed-dodaniem-abstrakcji">2.4. Pięć pytań przed dodaniem abstrakcji</h2>
<p>Zanim dodasz interfejs, fabrykę albo wzorzec, odpowiedz na pięć pytań. Jeśli odpowiedzi są słabe, lepszy jest prostszy kod.</p>
<ol>
<li>Jakie <strong>dzisiejsze</strong> wymaganie wymusza tę abstrakcję? Ile wariantów istnieje teraz, a nie „kiedyś”?</li>
<li>Czy potrafię ją nazwać w języku problemu, a nie technologii (<code>DiscountPolicy</code>, a nie <code>PricingPluginManager</code>)?</li>
<li>Jaka jest prostsza alternatywa i dlaczego nie wystarczy?</li>
<li>Ile kosztuje? Nowe typy, pośredniość, konfiguracja, trudniejsze śledzenie przepływu.</li>
<li>Czy da się ją później łatwo usunąć? Decyzje odwracalne podejmujemy szybko, nieodwracalne ostrożnie.</li>
</ol>
</section>

<h2 id="25-adr-zapisz-decyzj%C4%99-a-najlepiej-j%C4%85-sprawdzaj">2.5. ADR: zapisz decyzję, a najlepiej ją sprawdzaj</h2>
<ul>
<li><strong>ADR</strong> (ang. Architecture Decision Record, zapis decyzji architektonicznej) to krótki dokument opisujący decyzję o trwałych skutkach: kontekst, rozważane opcje, wybór i konsekwencje. Przyjętego ADR się nie edytuje; gdy decyzja się zmienia, zastępuje się go nowym.</li>
<li>Przykład: „cennik jest czystym modułem: nie wysyła maili i nie liczy pieniędzy w <code>double</code>”. Taka reguła łatwo się zaciera, jeśli zna ją tylko autor.</li>
<li>Regułę z ADR warto zamienić w <strong>test architektury</strong>, który sprawdza ją przy każdym budowaniu projektu. Wtedy dokument wyjaśnia, dlaczego reguła istnieje, a test sprawdza, czy nadal jest przestrzegana.</li>
<li>ADR nie powstaje przy każdej zmianie nazwy, tylko przy decyzjach, które trudno odwrócić.</li>
</ul>
<p class="ref">Warsztat: m2/s02</p>
</section>

<h2 id="26-zasada-pojedynczej-odpowiedzialno%C5%9Bci-jeden-aktor-jeden-pow%C3%B3d-zmiany">2.6. Zasada pojedynczej odpowiedzialności: jeden aktor, jeden powód zmiany</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-type">BigDecimal</span> <span class="hljs-title function_">revenue</span><span class="hljs-params">(Sale sale)</span> {                         <span class="hljs-comment">// wspólna metoda pomocnicza</span>
    <span class="hljs-keyword">return</span> sale.ticketRevenue().add(sale.barRevenue());
}
total = total.add(revenue(sale));                               <span class="hljs-comment">// księgowość</span>
byTitle.merge(sale.title(), revenue(sale), BigDecimal::add);    <span class="hljs-comment">// marketing</span>
</code></pre>
<ul>
<li><strong>Zasada pojedynczej odpowiedzialności</strong> (SRP) mówi, że moduł odpowiada przed jednym aktorem, czyli ma tylko jeden powód do zmiany. Nie oznacza to, że klasa ma „robić jedną rzecz”.</li>
<li>Raport dzienny obsługuje tu dwóch aktorów: księgowość (VAT, sumy) i marketing (ranking najpopularniejszych filmów). Obie części liczą przychód tą samą metodą, więc gdy marketing zmieni sposób wyłaniania hitów, na przykład pominie przychód z baru, po cichu zmienią się też kwoty księgowe.</li>
<li>Rozwiązanie: osobna klasa dla każdego aktora (<code>AccountingSection</code>, <code>MarketingSection</code>). Dwie formuły, dziś identyczne, nie są powieleniem wiedzy, bo zmieniają się z różnych powodów.</li>
</ul>
<p class="ref">Warsztat: m2/s07</p>
</section>

<h2 id="27-zasada-odwr%C3%B3cenia-zale%C5%BCno%C5%9Bci-liczy-si%C4%99-kierunek-import%C3%B3w">2.7. Zasada odwrócenia zależności: liczy się kierunek importów</h2>
<ul>
<li><strong>Zasada odwrócenia zależności</strong> (DIP) mówi, że reguły biznesowe i przypadki użycia nie powinny zależeć od szczegółów technicznych. To szczegóły mają zależeć od abstrakcji zdefiniowanej po stronie reguł.</li>
<li>Przypadek użycia <code>ConfirmReservation</code> sam tworzy klienta poczty SMTP i zna protokół. Przekazanie <code>SmtpMailSender</code> przez konstruktor niczego nie odwraca, bo przypadek użycia nadal importuje klasę techniczną.</li>
<li>Do odwrócenia dochodzi dopiero wtedy, gdy przypadek użycia definiuje port we własnym języku (<code>CustomerNotifier</code>), a adapter SMTP w warstwie infrastruktury go implementuje. Wywołania nadal płyną do SMTP, ale zależność w kodzie źródłowym biegnie w przeciwną stronę.</li>
</ul>
<p class="ref">Warsztat: m2/s08</p>
</section>

<h2 id="28-regu%C5%82a-zale%C5%BCno%C5%9Bci-porty-i-korze%C5%84-kompozycji">2.8. Reguła zależności, porty i korzeń kompozycji</h2>
<ul>
<li><strong>Reguła zależności:</strong> importy są skierowane do środka, od adapterów (HTTP, baza, poczta) do przypadków użycia i domeny. Domena nie importuje <code>java.sql</code> ani typów z bibliotek zewnętrznych.</li>
<li><strong>Port</strong> to interfejs należący do tej strony, która zgłasza potrzebę. Przez granicę przechodzą proste rekordy, a nie wiersze z bazy czy obiekty HTTP.</li>
<li><strong>Korzeń kompozycji</strong> (ang. composition root) to jedno miejsce, w którym przy starcie aplikacji tworzy się obiekty i łączy je w graf zależności. Nie zawiera reguł biznesowych.</li>
<li>Regułę zależności warto sprawdzać automatycznie (ArchUnit, moduły Maven, moduły Javy), bo reguła zapisana tylko w dokumencie szybko przestaje obowiązywać w kodzie.</li>
</ul>
<p class="ref">Warsztat: m2/s09 (czysta architektura), m2/s10 (automatyczna ochrona granicy)</p>
</section>

<h2 id="29-zasada-harcerza-i-ma%C5%82e-porcje-zmian">2.9. Zasada harcerza i małe porcje zmian</h2>
<ul>
<li><strong>Zasada harcerza</strong> (ang. Boy Scout Rule): kod, który i tak zmieniasz, zostaw w nieco lepszym stanie, niż go zastałeś. To wskazówka, a nie przyzwolenie na przebudowę całego modułu. Poprawka jest lokalna i nie zmienia zachowania.</li>
<li>Nadużycie wygląda tak: „skoro już tu jestem, posortuję miejsca na bilecie”. Wydruk biletu się zmienia, a w historii zmian widnieje tylko „porządki”.</li>
<li>Dobra porcja zmian ma jeden cel i własny dowód poprawności. Oddzielamy refaktoryzację od nowej funkcji, formatowanie od logiki, zmianę automatyczną od ręcznej.</li>
<li>Przykładowa seria: wyodrębnienie metody, następnie zmiana sygnatury, a dopiero na końcu nowa reguła „tani wtorek”. Przy każdym zatwierdzeniu recenzent sprawdza tylko jedną rzecz.</li>
</ul>
<p class="ref">Warsztat: m2/s05 (zasada harcerza), m2/s06 (seria zmian gotowych do przeglądu)</p>
</section>

<h2 id="31-test-charakteryzuj%C4%85cy-zapisz-co-kod-robi-dzi%C5%9B">3.1. Test charakteryzujący: zapisz, co kod robi dziś</h2>
<ul>
<li>Gdy kod nie ma testów, nie wiemy, co jest jego kontraktem. <strong>Test charakteryzujący</strong> zapisuje to, co kod <em>faktycznie robi</em>, a nie to, co <em>powinien</em> robić.</li>
<li>Utrwalamy także dziwne reguły. Przykład: rabat grupowy przysługuje dopiero od 11 biletów, choć reguła mówi o 10. Test nazywa to wprost („ZASTANE: 10 biletów bez rabatu”), ale niczego nie poprawia.</li>
<li>Elementy, które zmieniają się między uruchomieniami (bieżący czas, ustawienia regionalne), najpierw maskujemy w teście, a potem eliminujemy, przekazując zależność z zewnątrz, np. zegar <code>Clock</code>.</li>
<li>Taki test powstaje <strong>przed pierwszą zmianą</strong> i jest uruchamiany po każdym kolejnym kroku.</li>
</ul>
<p class="ref">Warsztat: m3/s01</p>
</section>

<h2 id="32-wynik-wzorcowy-i-dob%C3%B3r-przypadk%C3%B3w">3.2. Wynik wzorcowy i dobór przypadków</h2>
<ul>
<li><strong>Wynik wzorcowy</strong> (ang. golden master) to pełny wynik działania programu zapisany w pliku i zatwierdzony przez człowieka. W CineLegacy są to odpowiedzi starej klasy <code>CinemaManager</code> na kilkadziesiąt operacji (rezerwacje, błędy, płatności, raporty). Każda różnica przy kolejnym uruchomieniu kończy test błędem.</li>
<li>Przypadki dobieramy tak, żeby objąć <strong>każdą gałąź</strong>, granice warunków (100,00 i 100,01 zł, 120 i 121 minut), wartości <code>null</code> i nieznane oraz awarie w połowie sekwencji.</li>
<li>Pokrycie kodu pomaga znaleźć gałęzie, przez które nie przeszedł żaden przypadek. Nie mówi jednak, czy test sprawdza właściwe rzeczy: linia może zostać wykonana, a jej skutek pozostać niesprawdzony.</li>
</ul>
</section>

<h2 id="33-test-r%C3%B3wnowa%C5%BCno%C5%9Bci-przed-zmian%C4%85-i-po-niej">3.3. Test równoważności przed zmianą i po niej</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">Scene.&lt;PriceRequest, String&gt;variants()
    .variant(<span class="hljs-string">&quot;start&quot;</span>, r -&gt; run(() -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">start</span>.PriceBoard().priceFor(r)))   <span class="hljs-comment">// pakiety skrócone</span>
    .variant(<span class="hljs-string">&quot;step3&quot;</span>, r -&gt; run(() -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">step3</span>.PriceBoard().priceFor(r)))
    .expect(<span class="hljs-string">&quot;STANDARD student 3D&quot;</span>, request(<span class="hljs-string">&quot;32.00&quot;</span>, <span class="hljs-string">&quot;S&quot;</span>, <span class="hljs-string">&quot;STANDARD&quot;</span>), <span class="hljs-string">&quot;24.00&quot;</span>)
    .expect(<span class="hljs-string">&quot;PREMIERE nie sprawdza typu&quot;</span>, request(<span class="hljs-string">&quot;40.00&quot;</span>, <span class="hljs-string">&quot;X&quot;</span>, <span class="hljs-string">&quot;PREMIERE&quot;</span>), <span class="hljs-string">&quot;40.00&quot;</span>)
    .expect(<span class="hljs-string">&quot;nieznany program&quot;</span>, request(<span class="hljs-string">&quot;25.00&quot;</span>, <span class="hljs-string">&quot;N&quot;</span>, <span class="hljs-string">&quot;BLACK_FRIDAY&quot;</span>),
            <span class="hljs-string">&quot;ERROR: unknown program: BLACK_FRIDAY&quot;</span>)
</code></pre>
<ul>
<li>Stara i nowa wersja istnieją obok siebie, a ten sam zestaw oczekiwań uruchamiamy na obu. Porównujemy wynik <strong>i</strong> błąd, łącznie z treścią komunikatu.</li>
<li>Oczekiwania są zapisane niezależnie od kodu, jako dosłowne wartości. Test, który porównuje tylko starą wersję z nową, nie wykryje błędu obecnego w obu.</li>
</ul>
<p class="ref">Warsztat: każda scena m5 ma test równoważności, np. m5/s01</p>
</section>

<h2 id="34-szew-miejsce-w-kt%C3%B3rym-podstawiamy-zale%C5%BCno%C5%9B%C4%87">3.4. Szew: miejsce, w którym podstawiamy zależność</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">run</span><span class="hljs-params">()</span> {
    <span class="hljs-type">LegacyDatabase</span> <span class="hljs-variable">database</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">LegacyDatabase</span>();     <span class="hljs-comment">// prawdziwa baza</span>
    <span class="hljs-type">LocalDateTime</span> <span class="hljs-variable">now</span> <span class="hljs-operator">=</span> LocalDateTime.now();            <span class="hljs-comment">// zegar systemowy</span>
    ...
    ReminderMailer.send(booking.email(), <span class="hljs-string">&quot;Przypomnienie: &quot;</span> + booking.title(), ...);
    database.markReminded(booking.id());
}
</code></pre>
<ul>
<li>Tej klasy nie da się uruchomić w teście: sama otwiera połączenie z bazą, odczytuje zegar systemowy i wywołuje statyczną metodę wysyłającą maile.</li>
<li><strong>Szew</strong> (ang. seam, pojęcie z książki M. Feathersa „Working Effectively with Legacy Code”) to miejsce, w którym można podstawić inną implementację bez zmieniania algorytmu. Wybieramy najwęższy szew, który wystarczy: parametr, zależność w konstruktorze, zegar <code>Clock</code> albo interfejs funkcyjny.</li>
<li>Rozrywanie zależności zmienia miejsce, w którym tworzone są obiekty, a nie reguły biznesowe.</li>
</ul>
</section>

<h2 id="35-rozrywanie-zale%C5%BCno%C5%9Bci-po-zmianie">3.5. Rozrywanie zależności: po zmianie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">public</span> <span class="hljs-title function_">ShowtimeReminderJob</span><span class="hljs-params">()</span> {                                  <span class="hljs-comment">// wersja produkcyjna: jak dawniej</span>
    <span class="hljs-built_in">this</span>(LegacyDatabase::<span class="hljs-keyword">new</span>, Clock.systemDefaultZone(), ReminderMailer::send);
}
<span class="hljs-type">public</span> <span class="hljs-title function_">ShowtimeReminderJob</span><span class="hljs-params">(Supplier&lt;BookingStore&gt; stores, Clock clock, ReminderSender sender)</span> {
    <span class="hljs-built_in">this</span>.stores = Objects.requireNonNull(stores, <span class="hljs-string">&quot;stores&quot;</span>);
    <span class="hljs-built_in">this</span>.clock = Objects.requireNonNull(clock, <span class="hljs-string">&quot;clock&quot;</span>);
    <span class="hljs-built_in">this</span>.sender = Objects.requireNonNull(sender, <span class="hljs-string">&quot;sender&quot;</span>);
}
</code></pre>
<ul>
<li>Domyślny konstruktor tworzy dokładnie te same implementacje co wcześniej, więc w działającym systemie nic się nie zmienia, łącznie z połączeniem z bazą otwieranym przy każdym <code>run()</code>.</li>
<li>Test podstawia udawaną bazę, zegar o stałym czasie i wyrażenie lambda zamiast wysyłki maila. Pierwszy test sprawdza granicę 120 i 121 minut, której wcześniej nikt nie weryfikował.</li>
</ul>

<h2 id="36-refaktoryzacje-automatyczne-w-ide-co-daj%C4%85-a-czego-nie-widz%C4%85">3.6. Refaktoryzacje automatyczne w IDE: co dają, a czego nie widzą</h2>
<ul>
<li>Zmiana nazwy, wyodrębnienie metody, wchłonięcie, przeniesienie i zmiana sygnatury (w IDE: Rename, Extract Method, Inline, Move, Change Signature) działają na <strong>modelu symboli</strong> programu. Są więc znacznie bezpieczniejsze niż „znajdź i zamień”, a gdy brakuje testów, to najbezpieczniejszy sposób zmieniania kodu.</li>
<li>IDE nie widzi jednak nazw używanych poza kodem Javy: w refleksji, plikach konfiguracyjnych, szablonach, JSON, kolumnach bazy, nagłówkach CSV i u odbiorców spoza repozytorium.</li>
<li>Narzędzie nie rozumie znaczenia kodu: nie wie, czy dwa podobne fragmenty wyrażają tę samą regułę.</li>
<li>Zasada: jedna automatyczna refaktoryzacja, kompilacja, testy, zatwierdzenie. Ręczne poprawki robimy w osobnym kroku.</li>
</ul>
</section>

<h2 id="37-zmiana-nazwy-i-wyodr%C4%99bnienie-metody-w-drodze-do-wzorca">3.7. Zmiana nazwy i wyodrębnienie metody w drodze do wzorca</h2>
<ul>
<li><strong>Zmiana nazwy</strong> (Rename) nadaje nazwę opisującą rolę w kontekście (<code>calc2</code> → <code>revenueCsv</code>). Jeśli nazwa metody występuje w konfiguracji na serwerze (<code>report.method=calc2</code>), stara metoda zostaje jako przestarzała metoda pośrednicząca, oznaczona <code>@Deprecated</code>, dopóki ktoś nie zmieni konfiguracji.</li>
<li><strong>Wyodrębnienie metody</strong> (Extract Method) to zwykle pierwszy krok w drodze do każdego wzorca: gałąź <code>switch</code> staje się metodą, a ta później klasą strategii, stanu albo polecenia.</li>
<li>Przy wydzielaniu analizujemy przepływ danych: co wchodzi jako parametr, a co wychodzi jako wynik. Fragment, który daje dwa wyniki (sumę i liczbę miejsc VIP), najpierw dzielimy na dwie pętle (Split Loop), zamiast zwracać tablicę.</li>
<li>Uważaj na <code>return</code>, <code>break</code>, <code>try/finally</code> i efekty uboczne: wydzielenie metody nie może zmienić liczby ani kolejności wywołań.</li>
</ul>
<p class="ref">Warsztat: m5/s24 (zmiana nazwy), m5/s25 (wyodrębnienie metody)</p>
</section>

<h2 id="38-weryfikacja-w-cieniu">3.8. Weryfikacja w cieniu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">Money</span> <span class="hljs-title function_">price</span><span class="hljs-params">(TicketQuery query)</span> {
    <span class="hljs-type">Money</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> legacy.price(query);              <span class="hljs-comment">// klient dostaje wynik starej wersji</span>
    report.record(verify(query, result));
    <span class="hljs-keyword">return</span> result;
}
<span class="hljs-keyword">private</span> <span class="hljs-type">Verification</span> <span class="hljs-title function_">verify</span><span class="hljs-params">(TicketQuery query, Money legacyPrice)</span> {
    <span class="hljs-keyword">try</span> {
        <span class="hljs-type">Money</span> <span class="hljs-variable">candidatePrice</span> <span class="hljs-operator">=</span> candidate.price(query);
        <span class="hljs-keyword">return</span> legacyPrice.equals(candidatePrice) ? <span class="hljs-keyword">new</span> <span class="hljs-title class_">Agreement</span>(query, legacyPrice)
                : <span class="hljs-keyword">new</span> <span class="hljs-title class_">Divergence</span>(query, legacyPrice, candidatePrice);
    } <span class="hljs-keyword">catch</span> (RuntimeException failure) {             <span class="hljs-comment">// awaria nowej wersji jest izolowana</span>
        <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CandidateFailure</span>(query, legacyPrice, failure.getMessage());
    }
}
</code></pre>
<ul>
<li>Nowa implementacja liczy wynik <strong>w cieniu</strong>, na prawdziwych żądaniach, ale klient nadal dostaje wynik starej. Rozbieżności trafiają do raportu (ang. parallel run, shadow mode).</li>
<li>W CineLegacy raport wykazał, że nowa wersja stosuje rabat poranny i zniżkę procentową w złej kolejności, zanim jeszcze zaczęła obsługiwać klientów.</li>
<li>Zgodność obu wersji nie dowodzi poprawności: obie mogą mieć ten sam błąd.</li>
</ul>
<p class="ref">Warsztat: m3/s04</p>
</section>

<h2 id="39-granice-weryfikacji-w-cieniu-efekty-uboczne">3.9. Granice weryfikacji w cieniu: efekty uboczne</h2>
<ul>
<li>Podwójne wykonanie jest bezpieczne tylko w przypadku <strong>czystych obliczeń</strong>. Jeśli nowa wersja działająca w cieniu wysyła maile i obciąża kartę, klient dostaje dwa maile, a jego karta zostaje obciążona dwa razy.</li>
<li>Rozwiązanie: oddziel decyzję od wykonania. Nowa wersja zwraca <strong>plan efektów w postaci danych</strong> („wyślij mail o treści X, obciąż kartę kwotą Y”). Plany można porównać, a wykonuje się tylko jeden z nich.</li>
<li>Bezpieczeństwo najlepiej zagwarantować systemem typów: kod planujący w ogóle nie ma dostępu do portu, który wykonuje efekty.</li>
<li>Zgodny wynik metody nie oznacza zgodnych efektów, dlatego porównujemy jedno i drugie.</li>
</ul>
<p class="ref">Warsztat: m3/s05</p>
</section>

<h2 id="310-bezpieczna-p%C4%99tla-refaktoryzacji-do-wzorca">3.10. Bezpieczna pętla refaktoryzacji do wzorca</h2>
<ol>
<li><strong>Nazwij problem</strong> i granicę zachowania, którą chronisz: co jest wynikiem, co efektem, a co błędem.</li>
<li><strong>Dodaj test</strong> charakteryzujący dla każdej gałęzi, wartości nieznanej, <code>null</code> i awarii.</li>
<li><strong>Wprowadź minimalny kontrakt</strong>, który na początku deleguje do starego kodu. Pierwsze zatwierdzenie jest małe i łatwe do wycofania.</li>
<li><strong>Przenoś po jednej gałęzi</strong> i uruchamiaj testy po każdym ruchu.</li>
<li><strong>Usuń stary kod</strong> dopiero po przełączeniu wszystkich klientów. Zmiany zachowania, jeśli są potrzebne, zatwierdź osobno.</li>
</ol>
<p>Ten schemat powtarza się w każdej refaktoryzacji z części V.</p>
</section>

<h2 id="41-czym-jest-wzorzec-projektowy">4.1. Czym jest wzorzec projektowy</h2>
<ul>
<li>Wzorzec to nazwane, sprawdzone rozwiązanie powtarzającego się problemu projektowego w określonym kontekście. Opis wzorca obejmuje problem, okoliczności, które na niego wpływają, rozwiązanie i <strong>konsekwencje</strong>.</li>
<li>Wzorzec nie jest gotowym kodem do skopiowania. Ta sama idea może przyjąć postać hierarchii klas, typu wyliczeniowego (<code>enum</code>), rekordu albo zwykłego wyrażenia lambda.</li>
<li>Klasyczny katalog <strong>Bandy Czworga</strong> (ang. Gang of Four, GoF: Gamma, Helm, Johnson, Vlissides, 1994) opisuje 23 wzorce i dzieli je na <strong>konstrukcyjne</strong> (jak tworzyć obiekty), <strong>strukturalne</strong> (jak składać obiekty) i <strong>operacyjne</strong> (jak rozdzielać odpowiedzialność i współpracę).</li>
<li>Największą wartością wzorców jest wspólne słownictwo: zdanie „to jest Dekorator” mówi zespołowi więcej niż opis pięciu klas.</li>
</ul>
</section>

<h2 id="42-najpierw-rodzaj-zmienno%C5%9Bci-potem-wzorzec">4.2. Najpierw rodzaj zmienności, potem wzorzec</h2>
<table>
<thead>
<tr>
<th>Pytanie o kod</th>
<th>Typowa technika</th>
</tr>
</thead>
<tbody>
<tr>
<td>Czy zmienia się algorytm, który klient wybiera dla operacji?</td>
<td>Strategia</td>
</tr>
<tr>
<td>Czy zachowanie wynika z trwałego rodzaju obiektu?</td>
<td>polimorfizm podtypów</td>
</tr>
<tr>
<td>Czy zachowanie zależy od bieżącego stanu i przejść między stanami?</td>
<td>Stan</td>
</tr>
<tr>
<td>Czy żądanie trzeba nazwać, zapisać w dzienniku lub cofnąć?</td>
<td>Polecenie</td>
</tr>
<tr>
<td>Czy reguły sprawdzamy po kolei, a działa dokładnie jedna?</td>
<td>Łańcuch zobowiązań</td>
</tr>
<tr>
<td>Czy dodatek opakowuje rdzeń o tym samym kontrakcie?</td>
<td>Dekorator</td>
</tr>
<tr>
<td>Czy problem dotyczy tylko utworzenia właściwego obiektu?</td>
<td>Fabryka</td>
</tr>
</tbody>
</table>
<p>Ten sam <code>switch</code> może sygnalizować każdy z tych problemów. O wyborze decyduje to, <strong>co naprawdę się zmienia</strong>, oraz to, czy zbiór wariantów jest otwarty, czy zamknięty.</p>
<p class="ref">Warsztat: m5/s20 (jedna tabela cen, dwie różne struktury docelowe)</p>

<h2 id="43-wzorzec-ma-sw%C3%B3j-koszt">4.3. Wzorzec ma swój koszt</h2>
<ul>
<li>Każdy wzorzec dodaje typy, pośredniość i konfigurację. Przepływ, który dotąd był widoczny w jednej metodzie, rozkłada się na kilka klas.</li>
<li>Zysk musi być <strong>widoczny już przy najbliższych zmianach</strong>: nowy wariant to nowa klasa zamiast poprawek w pięciu miejscach, test nie wymaga bazy danych, a kolejności kroków pilnuje jedno miejsce.</li>
<li>Jeśli wzorzec przestanie się opłacać, można go usunąć. <strong>Usunięcie</strong> wzorca jest taką samą refaktoryzacją jak jego <strong>wprowadzenie</strong> (sekcja 17).</li>
</ul>
</section>

<h2 id="44-podobna-struktura-r%C3%B3%C5%BCna-intencja">4.4. Podobna struktura, różna intencja</h2>
<p>Kilka wzorców ma ten sam kształt: obiekt opakowuje inny obiekt i przekazuje mu wywołania. Różni je <strong>cel</strong>, w jakim to robią.</p>
<table>
<thead>
<tr>
<th>Wzorzec</th>
<th>Po co opakowuje</th>
<th>Kontrakt widoczny z zewnątrz</th>
</tr>
</thead>
<tbody>
<tr>
<td>Adapter</td>
<td>tłumaczy obcy interfejs na nasz</td>
<td>inny niż obiekt wewnątrz</td>
</tr>
<tr>
<td>Dekorator</td>
<td>dodaje zachowanie wokół rdzenia</td>
<td>taki sam jak rdzeń</td>
</tr>
<tr>
<td>Pełnomocnik (Proxy)</td>
<td>kontroluje dostęp (leniwe tworzenie, uprawnienia, dostęp zdalny)</td>
<td>taki sam jak obiekt wewnątrz</td>
</tr>
<tr>
<td>Fasada</td>
<td>upraszcza dostęp do kilku podsystemów</td>
<td>nowy, prostszy</td>
</tr>
<tr>
<td>Łańcuch zobowiązań</td>
<td>przekazuje żądanie dalej, gdy sam go nie obsłuży</td>
<td>taki sam w każdym ogniwie</td>
</tr>
</tbody>
</table>
</section>

<h2 id="45-s%C5%82owniczek-wzorc%C3%B3w-12-zachowanie-i-wsp%C3%B3%C5%82praca">4.5. Słowniczek wzorców (1/2): zachowanie i współpraca</h2>
<table>
<thead>
<tr>
<th>Wzorzec (nazwa angielska)</th>
<th>Na czym polega</th>
<th>Sekcja</th>
</tr>
</thead>
<tbody>
<tr>
<td>Strategia (Strategy)</td>
<td>rodzina wymiennych algorytmów za wspólnym interfejsem; klient wybiera jeden z nich i przekazuje go obiektowi</td>
<td>6</td>
</tr>
<tr>
<td>Stan (State)</td>
<td>obiekt przekazuje zachowanie obiektowi bieżącego stanu, a stan decyduje o przejściu do następnego</td>
<td>6</td>
</tr>
<tr>
<td>Polecenie (Command)</td>
<td>żądanie zamknięte w obiekcie, który można zapisać w dzienniku, ustawić w kolejce, wykonać później lub cofnąć</td>
<td>6</td>
</tr>
<tr>
<td>Metoda szablonowa (Template Method)</td>
<td>klasa bazowa ustala kolejność kroków, a podklasy nadpisują wybrane kroki</td>
<td>7</td>
</tr>
<tr>
<td>Łańcuch zobowiązań (Chain of Responsibility)</td>
<td>żądanie przechodzi przez łańcuch obiektów, aż jeden z nich je obsłuży</td>
<td>8</td>
</tr>
<tr>
<td>Obserwator (Observer)</td>
<td>obiekt powiadamia zarejestrowanych odbiorców o zdarzeniu, nie znając ich klas</td>
<td>13</td>
</tr>
<tr>
<td>Mediator (Mediator)</td>
<td>komponenty komunikują się przez jeden obiekt koordynujący, a nie bezpośrednio ze sobą</td>
<td>14</td>
</tr>
<tr>
<td>Odwiedzający (Visitor)</td>
<td>operacje na strukturze obiektów są wydzielone do osobnych klas, po jednej klasie na operację</td>
<td>15</td>
</tr>
</tbody>
</table>
</section>

<h2 id="46-s%C5%82owniczek-wzorc%C3%B3w-22-struktura-tworzenie-i-granice">4.6. Słowniczek wzorców (2/2): struktura, tworzenie i granice</h2>
<table>
<thead>
<tr>
<th>Wzorzec (nazwa angielska)</th>
<th>Na czym polega</th>
<th>Sekcja</th>
</tr>
</thead>
<tbody>
<tr>
<td>Dekorator (Decorator)</td>
<td>obiekt opakowuje inny obiekt o tym samym interfejsie i dodaje zachowanie przed wywołaniem lub po nim</td>
<td>8</td>
</tr>
<tr>
<td>Adapter (Adapter)</td>
<td>obiekt tłumaczy interfejs obcej klasy na interfejs, którego oczekuje klient</td>
<td>9</td>
</tr>
<tr>

<td>11</td>

<tr>

<td>9</td>

<tr>
<td>Warstwa antykorupcyjna (Anti-Corruption Layer)</td>

<td>11</td>

<h2 id="51-wzorzec-jest-rezultatem-nie-celem">5.1. Wzorzec jest rezultatem, nie celem</h2>
<ul>
<li>Kolejność pracy: zabezpiecz zachowanie testami → nazwij oś zmienności, czyli to, co zmienia się niezależnie od reszty → wyodrębnij role w kodzie → wprowadź <strong>najwęższy</strong> kontrakt, który rozwiązuje problem.</li>
<li>Przenosimy po jednym wariancie i <strong>przerywamy</strong>, gdy problem jest rozwiązany. Celem nie jest pełna postać wzorca z katalogu, ze wszystkimi klasami z diagramu.</li>
<li>Przed podjęciem decyzji potrzebujemy czterech rzeczy: znanego problemu, wariantów istniejących już <strong>dziś</strong>, rozważonej prostszej alternatywy oraz warunku, po którym poznamy, że wzorzec przestał być potrzebny.</li>
</ul>
</section>

<h2 id="52-kiedy-wzorzec-si%C4%99-nie-op%C5%82aca">5.2. Kiedy wzorzec się nie opłaca</h2>
<table>
<thead>
<tr>
<th>Sytuacja</th>
<th>Lepszy ruch</th>
</tr>

</tr>
<tr>

</tr>
<tr>
<td>jeden klient i jedna implementacja</td>
<td>konkretna klasa; interfejs można dodać później</td>
</tr>
<tr>
<td>problemem są nazwy lub długość metody</td>
<td>zmiana nazwy, wyodrębnienie metody</td>
</tr>
<tr>
<td>zespół nie zna wzorca, a kod jest krytyczny</td>
<td>prostsza struktura i dobry test</td>
</tr>
<tr>
<td>wariant wygasa (umowy festiwalowe się kończą)</td>
<td>usuń wariant, a razem z nim wzorzec</td>
</tr>
</tbody>

<h2 id="53-refaktoryzacja-a-zmiana-kontraktu">5.3. Refaktoryzacja a zmiana kontraktu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">refund = refund - <span class="hljs-number">3.00</span>;                                   <span class="hljs-comment">// przed: double</span>
refund = Math.round(refund * <span class="hljs-number">100</span>) / <span class="hljs-number">100.0</span>;
<span class="hljs-keyword">return</span> String.format(Locale.ROOT, <span class="hljs-string">&quot;%.2f&quot;</span>, refund);

<span class="hljs-type">BigDecimal</span> <span class="hljs-variable">refund</span> <span class="hljs-operator">=</span> BigDecimal.valueOf(ticketsPaid)       <span class="hljs-comment">// po: BigDecimal</span>
        .multiply(share(minutesBeforeStart)).subtract(FEE)
        .max(BigDecimal.ZERO).setScale(<span class="hljs-number">2</span>, RoundingMode.HALF_UP);
</code></pre>
<ul>
<li>Przejście z <code>double</code> na <code>BigDecimal</code> wygląda na zwykłe porządki, ale zmienia wynik. Przy rezygnacji na 2 godziny przed seansem zwrot za bilety warte 64.35 zł wynosi 50% minus 3.00 zł opłaty, czyli dokładnie 29.175 zł. Typ <code>double</code> przechowuje tę wartość jako 29.17499…, więc wynik zaokrągla się do 29.17, a <code>BigDecimal</code> liczy dokładnie i daje 29.18.</li>
<li>Kryterium refaktoryzacji: klient nie dostrzega żadnej różnicy, której z nim nie uzgodniono. Zmiana typu, zaokrąglenia, formatu czy wyjątku to zmiana kontraktu. Wprowadzamy ją świadomie, w osobnym zatwierdzeniu.</li>
</ul>
<p class="ref">Warsztat: m5/s23</p>
</section>

<h2 id="54-co-trzeba-zachowa%C4%87-przy-wprowadzaniu-wzorca">5.4. Co trzeba zachować przy wprowadzaniu wzorca</h2>
<ul>
<li><strong>Wyjątki:</strong> typ, komunikat (jeśli ktoś go odczytuje) i moment zgłoszenia błędu. Wybór strategii w konstruktorze sprawia, że błąd „nieznany program” pojawia się wcześniej niż dotąd.</li>
<li><strong>Stan:</strong> po sukcesie i po błędzie. Nieudana płatność zostawia rezerwację w stanie <code>NEW</code>, tak jak przed zmianą.</li>
<li><strong>Efekty:</strong> liczba, kolejność i warunki wysłania maili, zapisów do bazy i obciążeń karty.</li>
<li><strong>Granice:</strong> format danych zapisanych w bazie lub pliku, nazwy widoczne przez refleksję, publiczne API.</li>
<li>Każdą taką zmianę trzeba <strong>nazwać, zatwierdzić i opisać</strong> w teście albo wycofać.</li>
</ul>
</section>

<h2 id="61-strategia-polecenie-czy-stan-kto-wybiera-wariant-i-kiedy">6.1. Strategia, Polecenie czy Stan? Kto wybiera wariant i kiedy</h2>
<table>
<thead>
<tr>
<th></th>
<th>Strategia</th>
<th>Polecenie</th>
<th>Stan</th>
</tr>
</thead>
<tbody>
<tr>
<td>kto wybiera wariant</td>
<td>klient, raz, przy konfiguracji</td>
<td>nadawca, przy każdym żądaniu</td>
<td>sam obiekt, przy przejściu między stanami</td>
</tr>
<tr>
<td>co zamykamy w obiekcie</td>
<td>algorytm</td>
<td>żądanie (dziennik, kolejka, cofanie)</td>
<td>stan i dozwolone przejścia</td>
</tr>
<tr>
<td>typowy zapach</td>
<td><code>if</code> po trybie w każdym wywołaniu</td>
<td><code>if</code> po nazwie polecenia</td>
<td><code>if (status == ...)</code> w każdej operacji</td>
</tr>
<tr>
<td>przykład z kina</td>
<td>program zniżek</td>
<td>polecenie kasjera</td>
<td>status rezerwacji</td>
</tr>
</tbody>
</table>
<p>W kodzie wszystkie trzy problemy wyglądają tak samo: jak <code>switch</code>. Zamiast pytać, który wzorzec pasuje do tego <code>switch</code>, pytamy: <strong>kto zmienia wariant i kiedy?</strong></p>
</section>

<h2 id="62-strategia-sygna%C5%82-w-kodzie">6.2. Strategia: sygnał w kodzie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span> (program.equals(<span class="hljs-string">&quot;PREMIERE&quot;</span>)) {
    discount = Money.ZERO;
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (program.equals(<span class="hljs-string">&quot;STUDENT_WEEK&quot;</span>) &amp;&amp; ticketType.equals(<span class="hljs-string">&quot;S&quot;</span>)) {
    discount = base.percent(<span class="hljs-number">50</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (program.equals(<span class="hljs-string">&quot;STANDARD&quot;</span>) || program.equals(<span class="hljs-string">&quot;STUDENT_WEEK&quot;</span>)) {
    <span class="hljs-type">int</span> <span class="hljs-variable">percent</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">switch</span> (ticketType) { <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;N&quot;</span> -&gt; <span class="hljs-number">0</span>; <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;S&quot;</span> -&gt; <span class="hljs-number">25</span>; ... };
    discount = base.percent(percent);
} <span class="hljs-keyword">else</span> {
    <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;unknown program: &quot;</span> + program);
}
</code></pre>
<ul>
<li><code>TicketPricer</code> wybiera sposób liczenia zniżki na podstawie nazwy programu ustawionego w kinie. W tej samej metodzie znajduje się też sprawdzanie poprawności ceny.</li>
<li>Program zniżek wynika z konfiguracji kina, a nie z klasy żadnego obiektu. Zmienia się rzadko, ale każda zmiana wymaga dziś edycji łańcucha <code>if</code>. To klasyczny kandydat na Strategię (Strategy): wymienny algorytm wybierany z zewnątrz.</li>
</ul>

<h2 id="63-strategia-kroki-i-wynik">6.3. Strategia: kroki i wynik</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@FunctionalInterface</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DiscountPolicy</span> { <span class="hljs-type">Money</span> <span class="hljs-title function_">discount</span><span class="hljs-params">(Money base, String ticketType)</span>; }

<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TicketPricer</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> DiscountPolicy policy;                 <span class="hljs-comment">// wybrana raz, w konstruktorze</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">Money</span> <span class="hljs-title function_">price</span><span class="hljs-params">(Money base, String ticketType)</span> {
        <span class="hljs-keyword">if</span> (base.compareTo(Money.ZERO) &lt; <span class="hljs-number">0</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(...);
        <span class="hljs-keyword">return</span> base.minus(policy.discount(base, ticketType));
    }
}
<span class="hljs-comment">// PriceBoard: new TicketPricer(DiscountPrograms.forName(request.program()))</span>
</code></pre>
<ul>
<li>Kroki: interfejs i strategia przejściowa (wyrażenie lambda wywołujące stary łańcuch <code>if</code>) → przeniesienie każdej gałęzi do osobnej klasy → wybór programu w jednym miejscu (<code>DiscountPrograms</code>).</li>
<li>Sprawdzanie ceny zostaje w klasie, która korzysta ze strategii (<code>TicketPricer</code>), a same strategie nie mają stanu. Nowy program to nowa klasa (albo wyrażenie lambda) i jeden wpis w <code>DiscountPrograms</code>.</li>
<li>Uwaga: wybór strategii w konstruktorze <strong>utrwala decyzję</strong> na cały czas życia obiektu i zmienia kolejność zgłaszania błędów. Taką zmianę trzeba zatwierdzić.</li>
</ul>
</section>

<h2 id="64-stan-sygna%C5%82-i-tabela-przej%C5%9B%C4%87">6.4. Stan: sygnał i tabela przejść</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">cancel</span><span class="hljs-params">()</span> {
    <span class="hljs-keyword">if</span> (status == Status.NEW) {
        status = Status.CANCELLED;
        effects.add(<span class="hljs-string">&quot;seats released&quot;</span>);
    } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (status == Status.PAID) {
        status = Status.CANCELLED;
        effects.add(<span class="hljs-string">&quot;refund&quot;</span>);
        effects.add(<span class="hljs-string">&quot;seats released&quot;</span>);
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;cannot cancel in &quot;</span> + status);
    }
}
</code></pre>
<ul>
<li><code>Reservation</code> w każdej operacji (<code>pay</code>, <code>use</code>, <code>expire</code>, <code>cancel</code>) sprawdza i zmienia pole <code>status</code>. Reguły przejść są rozproszone po wielu metodach.</li>
<li>Zanim powstanie pierwsza klasa stanu, zapisujemy w teście <strong>tabelę przejść</strong>: stan × operacja → nowy stan i efekty albo wyjątek. Ta tabela jest specyfikacją całej refaktoryzacji do wzorca Stan (State).</li>
</ul>
</section>

<h2 id="65-stan-wynik">6.5. Stan: wynik</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-type">ReservationState</span> <span class="hljs-variable">state</span> <span class="hljs-operator">=</span> NewState.INSTANCE;
<span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">cancel</span><span class="hljs-params">()</span> { state.cancel(<span class="hljs-built_in">this</span>); }                <span class="hljs-comment">// rezerwacja tylko deleguje</span>

<span class="hljs-keyword">private</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">ReservationState</span> <span class="hljs-keyword">permits</span> NewState, PaidState, ClosedState {
    <span class="hljs-keyword">default</span> <span class="hljs-type">void</span> <span class="hljs-title function_">cancel</span><span class="hljs-params">(Reservation r)</span> { <span class="hljs-keyword">throw</span> invalid(<span class="hljs-string">&quot;cancel&quot;</span>); }   <span class="hljs-comment">// domyślnie: błąd</span>
}
<span class="hljs-keyword">private</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">PaidState</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ReservationState</span> {
    INSTANCE;
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">cancel</span><span class="hljs-params">(Reservation r)</span> {
        r.moveTo(ClosedState.CANCELLED); r.record(<span class="hljs-string">&quot;refund&quot;</span>); r.record(<span class="hljs-string">&quot;seats released&quot;</span>);
    }
}
</code></pre>
<ul>
<li>Tabelę przejść można odczytać bezpośrednio z kodu stanów. Niedozwolona operacja domyślnie rzuca wyjątek; pusta metoda po cichu zmieniłaby zachowanie.</li>
<li>Obiekty stanów to stałe typu wyliczeniowego bez własnych pól, a dane rezerwacji zostają w klasie <code>Reservation</code>. Kolejność „obciążenie karty, zmiana stanu, zapis efektu” pozostaje taka sama jak przed zmianą.</li>
</ul>

<h2 id="66-polecenie-%C5%82a%C5%84cuch-warunk%C3%B3w-zamieniony-na-rejestr-polece%C5%84">6.6. Polecenie: łańcuch warunków zamieniony na rejestr poleceń</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: if (command.equals(&quot;SELL&quot;)) { ... } else if (command.equals(&quot;REFUND&quot;)) { ... }</span>
<span class="hljs-type">ConsoleCommand</span> <span class="hljs-variable">command</span> <span class="hljs-operator">=</span> commands.get(parts[<span class="hljs-number">0</span>].toUpperCase(Locale.ROOT));
<span class="hljs-keyword">if</span> (command == <span class="hljs-literal">null</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Nieznana komenda: &quot;</span> + parts[<span class="hljs-number">0</span>];
}
<span class="hljs-keyword">return</span> command.execute(parts.length &gt; <span class="hljs-number">1</span> ? parts[<span class="hljs-number">1</span>] : <span class="hljs-string">&quot;&quot;</span>, till);
</code></pre>
<ul>
<li>Metoda <code>CashierConsole.handle</code> była łańcuchem <code>if</code> sprawdzającym nazwę polecenia, z pełną logiką w każdej gałęzi. Każda gałąź staje się obiektem polecenia (wzorzec Polecenie, ang. Command), a wybór gałęzi zamienia się w wyszukanie w mapie.</li>
<li>Mapa może zastąpić warunki tylko wtedy, gdy klucze się nie nakładają i zachowane zostaje ujednolicanie wielkości liter (<code>sell</code> działa jak <code>SELL</code>). Przy nakładających się warunkach lepiej sprawdza się Łańcuch zobowiązań.</li>
<li>Sam wzorzec Polecenie nie zapewnia kolejki, ponawiania ani cofania. Cofanie wymaga osobnego mechanizmu, który odwraca skutki operacji.</li>
</ul>
<p class="ref">Warsztat: m5/s15</p>
</section>

<h2 id="67-trzy-osie-w-jednej-klasie-ka%C5%BCda-dostaje-w%C5%82asny-mechanizm">6.7. Trzy osie w jednej klasie: każda dostaje własny mechanizm</h2>
<ul>
<li>Pulpit kasjera obsługuje polecenia <code>BOOK</code>, <code>PAY</code>, <code>USE</code>, <code>CANCEL</code>, <code>UNDO</code> i <code>REPORT</code> jedną instrukcją <code>switch</code>. Wewnątrz jest kolejny <code>switch</code> po statusie rezerwacji, a w samej rezerwacji jeszcze jeden, po typie biletu.</li>
<li>To trzy różne osie zmienności, choć kod wygląda jednakowo:
<ul>
<li><strong>cena biletu</strong> zależy od typu biletu wybranego raz, przy sprzedaży → Strategia (<code>TicketPricing</code>),</li>
<li><strong>polecenia kasjera</strong> trzeba zapisać w dzienniku i umieć cofnąć → Polecenie (<code>DeskCommand</code>),</li>
<li><strong>cykl życia rezerwacji</strong> zmienia się w wyniku jej własnych operacji → Stan (<code>Booking</code>).</li>
</ul>
</li>
<li>Rozplątujemy po jednej osi. Potem nowy typ biletu, nowe polecenie i nowy status to zmiany w trzech niezależnych miejscach.</li>
</ul>
<p class="ref">Warsztat: m5/s26</p>
</section>

<h2 id="68-typowe-pomy%C5%82ki-przy-wyborze">6.8. Typowe pomyłki przy wyborze</h2>
<ul>
<li><strong>Strategia zamiast Stanu</strong>, „bo to też <code>switch</code>”. Jeśli wariant zmienia się w trakcie życia obiektu na skutek jego własnych operacji, to jest stan.</li>
<li><strong>Stan zamiast polimorfizmu</strong>: rodzaj seansu (premiera, maraton) nigdy się nie zmienia, więc wystarczą podtypy.</li>
<li><strong>Polecenie bez potrzeby</strong>: gdy nie ma dziennika, kolejki ani cofania, wystarczy metoda albo mapa funkcji.</li>
<li><strong>Polecenie, które pamięta dane poprzedniego żądania</strong>, albo pole konkretnej rezerwacji w obiekcie stanu. Obiekty współdzielone nie mogą przechowywać danych pojedynczych żądań.</li>
<li><strong>Hierarchia klas dla każdej kombinacji</strong> (<code>PremiumPaidStudentTicket</code>) zamiast złożenia niezależnych osi.</li>
</ul>
</section>

<h2 id="71-utworzenie-metody-szablonowej-wsp%C3%B3lny-szkielet-r%C3%B3%C5%BCne-kroki">7.1. Utworzenie Metody szablonowej: wspólny szkielet, różne kroki</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SalesReport</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-type">String</span> <span class="hljs-title function_">render</span><span class="hljs-params">(List&lt;Sale&gt; sales)</span> {   <span class="hljs-comment">// stała kolejność kroków</span>
        <span class="hljs-comment">// sortowanie, header(), row() dla każdej sprzedaży z sumą, footer()</span>
    }
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">String</span> <span class="hljs-title function_">header</span><span class="hljs-params">()</span>;
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">String</span> <span class="hljs-title function_">row</span><span class="hljs-params">(Sale sale)</span>;
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">String</span> <span class="hljs-title function_">footer</span><span class="hljs-params">(<span class="hljs-type">int</span> tickets, Money total)</span>;
}
</code></pre>
<ul>
<li>Raporty CSV i HTML miały ten sam szkielet (sortowanie, nagłówek, wiersze, suma, stopka), ale w każdej klasie zapisany nieco inaczej.</li>
<li>Kroki refaktoryzacji (ang. Form Template Method): wydziel różnice do metod <code>header</code>, <code>row</code> i <code>footer</code> → doprowadź <code>render</code> do identycznej postaci w obu klasach → przenieś ją do nadklasy jako metodę <code>final</code>. Metody nadpisywane przez podklasy nazywamy <strong>punktami zaczepienia</strong>.</li>
<li>Metoda szablonowa (Template Method) sprawdza się, gdy kolejność kroków jest stała, a warianty różnią się tylko <strong>jednym</strong> rodzajem szczegółów.</li>
</ul>
<p class="ref">Warsztat: m5/s16</p>
</section>

<h2 id="72-gdy-punkty-zaczepienia-obejmuj%C4%85-dwie-niezale%C5%BCne-osie">7.2. Gdy punkty zaczepienia obejmują dwie niezależne osie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ScreeningReport</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-type">String</span> <span class="hljs-title function_">render</span><span class="hljs-params">(LocalDate day, List&lt;ScreeningSale&gt; sales)</span> {
        ... <span class="hljs-keyword">if</span> (includes(day, sale.day())) ...                 <span class="hljs-comment">// punkt zaczepienia: okres</span>
        <span class="hljs-type">StringBuilder</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringBuilder</span>(header(label(day)));
        ... text.append(row(title, tickets, revenue));        <span class="hljs-comment">// punkt zaczepienia: format</span>
        <span class="hljs-keyword">return</span> text.append(footer(total.tickets(), total.revenue())).toString();
    }
}
<span class="hljs-comment">// DailyCsvReport, DailyTextReport, WeeklyCsvReport, WeeklyTextReport</span>
</code></pre>
<ul>
<li>Pięć punktów zaczepienia układa się w dwie osie: <strong>okres</strong> (<code>includes</code>, <code>label</code>) i <strong>format</strong> (<code>header</code>, <code>row</code>, <code>footer</code>).</li>
<li>Dziedziczenie mnoży klasy: 2 okresy × 2 formaty = 4 podklasy, a kod okresów i formatów jest między nimi kopiowany. Trzeci format oznacza dwie kolejne podklasy.</li>
</ul>
</section>

<h2 id="73-zast%C4%85pienie-dziedziczenia-delegacj%C4%85-osie-jako-strategie">7.3. Zastąpienie dziedziczenia delegacją: osie jako strategie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ScreeningReport</span> {

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> ReportFormat format;     <span class="hljs-comment">// header(), row(), footer()</span>

    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">render</span><span class="hljs-params">(LocalDate day, List&lt;ScreeningSale&gt; sales)</span> {
        ... <span class="hljs-keyword">if</span> (period.includes(day, sale.day())) ...
        <span class="hljs-type">StringBuilder</span> <span class="hljs-variable">text</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringBuilder</span>(format.header(period.label(day)));
        ...
    }
}
<span class="hljs-comment">// Reports.of(&quot;WEEKLY&quot;, &quot;CSV&quot;) -&gt; new ScreeningReport(new WeeklyPeriod(), new CsvFormat())</span>
</code></pre>
<ul>
<li>Kroki refaktoryzacji (ang. Replace Inheritance with Delegation), po jednej osi: pogrupuj punkty zaczepienia → wyodrębnij interfejs dla grupy → przekaż obiekt pomocniczy w konstruktorze → przenieś implementacje → usuń podklasy po przełączeniu klientów.</li>
<li>Przy składaniu obiektów liczby klas się dodają, a nie mnożą: N okresów + M formatów. Kolejności kroków nadal pilnuje jedna metoda, a <code>final</code> przechodzi z metody na klasę.</li>
</ul>

<h2 id="74-strategia-czy-metoda-szablonowa">7.4. Strategia czy Metoda szablonowa?</h2>
<table>
<thead>
<tr>
<th>Kryterium</th>
<th>Metoda szablonowa</th>
<th>Strategia</th>
</tr>
</thead>
<tbody>
<tr>
<td>liczba osi zmienności</td>
<td>jedna</td>
<td>jedna lub kilka niezależnych</td>
</tr>
<tr>
<td>wymiana wariantu</td>
<td>przez wybór podklasy</td>
<td>przy tworzeniu obiektu, a nawet w trakcie działania</td>
</tr>
<tr>
<td>dostęp do stanu klasy bazowej</td>
<td>tak, przez pola <code>protected</code></td>
<td>tylko przez parametry</td>
</tr>
<tr>
<td>typowe ryzyko</td>
<td>kruche punkty zaczepienia, mnożenie podklas</td>
<td>więcej obiektów i konfiguracji</td>
</tr>
<tr>
<td>test wariantu</td>
<td>podklasa testowa</td>
<td>wyrażenie lambda lub atrapa</td>
</tr>
</tbody>
</table>
<p>Metoda szablonowa dobrze się sprawdza, gdy szkielet jest stabilny, a zmienia się jeden krok. Gdy punkty zaczepienia obejmują dwie osie, przejdź na Strategię przez delegację.</p>
</section>

<h2 id="81-przeniesienie-dodatk%C3%B3w-do-dekoratora">8.1. Przeniesienie dodatków do Dekoratora</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: flagi w rdzeniu i te same warunki w price() oraz description()</span>
<span class="hljs-keyword">return</span> title + <span class="hljs-string">&quot; &quot;</span> + format + (vip ? <span class="hljs-string">&quot; +VIP&quot;</span> : <span class="hljs-string">&quot;&quot;</span>) + (glasses ? <span class="hljs-string">&quot; +okulary 3D&quot;</span> : <span class="hljs-string">&quot;&quot;</span>) + ...;

<span class="hljs-comment">// po: każdy dodatek to obiekt o tym samym kontrakcie co bilet</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">Insurance</span><span class="hljs-params">(PricedTicket inner)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PricedTicket</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">Money</span> <span class="hljs-title function_">price</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> inner.price().plus(Money.of(<span class="hljs-string">&quot;4.00&quot;</span>)); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">description</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> inner.description() + <span class="hljs-string">&quot; +ubezpieczenie&quot;</span>; }
}
<span class="hljs-comment">// TicketAssembler: if (order.vip()) ticket = new VipSeat(ticket); ...</span>
</code></pre>
<ul>
<li>Każdy opcjonalny dodatek do biletu (miejsce VIP, okulary 3D, ubezpieczenie) przenosimy do osobnego obiektu, który ma <strong>ten sam kontrakt</strong> co bilet i przekazuje wywołania opakowanemu obiektowi (ang. Move Embellishment to Decorator).</li>
<li>Kroki: wąski interfejs <code>PricedTicket</code> → pierwszy dekorator (ubezpieczenie) → kolejne dodatki → rdzeń bez flag.</li>
</ul>

<h2 id="82-dekorator-na-co-uwa%C5%BCa%C4%87">8.2. Dekorator: na co uważać</h2>
<ul>
<li><strong>Kolejność opakowywania jest częścią zachowania.</strong> Opis biletu kończy się na „+ubezpieczenie”, bo ubezpieczenie jest warstwą zewnętrzną. Dlatego cały łańcuch składamy w jednym miejscu (<code>TicketAssembler</code>).</li>
<li>Dekorator nie jest przezroczysty dla <code>instanceof</code>, <code>getClass()</code>, porównania tożsamości i <code>equals</code>. Kod, który sprawdzał, czy to bilet VIP, potrzebuje teraz osobnej metody.</li>
<li>Błąd w samym dekoratorze (np. w dodatku, który zapisuje dziennik zdarzeń) może zasłonić błąd rdzenia. Trzeba jawnie ustalić, który wyjątek dostaje klient.</li>
<li>Dekorator, który niczego nie dodaje, jest zbędną warstwą i należy go usunąć.</li>
</ul>
</section>

<h2 id="83-%C5%82a%C5%84cuch-ifelse-w-kt%C3%B3rym-kolejno%C5%9B%C4%87-jest-regu%C5%82%C4%85">8.3. Łańcuch <code>if/else</code>, w którym kolejność jest regułą</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span> (!request.requestedAt().isBefore(request.screeningStart())) {
    <span class="hljs-keyword">return</span> RefundDecision.rejected(<span class="hljs-string">&quot;seans juz sie rozpoczal&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (Duration.between(request.requestedAt(), request.screeningStart()).toHours() &gt;= <span class="hljs-number">24</span>) {
    <span class="hljs-keyword">return</span> RefundDecision.approvedBy(<span class="hljs-string">&quot;AUTO&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (!request.amount().isGreaterThan(CASHIER_LIMIT)) {        <span class="hljs-comment">// 100.00</span>
    <span class="hljs-keyword">return</span> RefundDecision.approvedBy(<span class="hljs-string">&quot;CASHIER&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (!request.amount().isGreaterThan(MANAGER_LIMIT)) {        <span class="hljs-comment">// 1000.00</span>
    <span class="hljs-keyword">return</span> RefundDecision.approvedBy(<span class="hljs-string">&quot;MANAGER&quot;</span>);
}
<span class="hljs-keyword">return</span> RefundDecision.rejected(<span class="hljs-string">&quot;brak uprawnionego zatwierdzajacego&quot;</span>);
</code></pre>
<ul>
<li>Zwrot automatyczny nie ma limitu kwoty tylko dlatego, że jego gałąź stoi <strong>przed</strong> gałęzią kasjera. Kolejność gałęzi jest regułą biznesową ukrytą w układzie kodu.</li>
<li>Uporządkowane reguły, z których zawsze działa dokładnie jedna, to sygnał, by sięgnąć po Łańcuch zobowiązań (Chain of Responsibility).</li>
</ul>
</section>

<h2 id="84-%C5%82a%C5%84cuch-zobowi%C4%85za%C5%84-ogniwo-i-z%C5%82o%C5%BCenie-%C5%82a%C5%84cucha">8.4. Łańcuch zobowiązań: ogniwo i złożenie łańcucha</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CashierHandler</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">RefundHandler</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">RefundDecision</span> <span class="hljs-title function_">handle</span><span class="hljs-params">(RefundRequest request)</span> {
        <span class="hljs-keyword">if</span> (!request.amount().isGreaterThan(limit)) <span class="hljs-keyword">return</span> RefundDecision.approvedBy(<span class="hljs-string">&quot;CASHIER&quot;</span>);
        <span class="hljs-keyword">return</span> next.handle(request);                        <span class="hljs-comment">// nie mój przypadek: przekaż dalej</span>
    }
}
<span class="hljs-type">public</span> <span class="hljs-title function_">RefundApprover</span><span class="hljs-params">()</span> {                                   <span class="hljs-comment">// kolejność widać w jednym miejscu</span>
    <span class="hljs-built_in">this</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AfterScreeningHandler</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AutoRefundHandler</span>(
         <span class="hljs-keyword">new</span> <span class="hljs-title class_">CashierHandler</span>(CASHIER_LIMIT, <span class="hljs-keyword">new</span> <span class="hljs-title class_">ManagerHandler</span>(MANAGER_LIMIT,
         <span class="hljs-keyword">new</span> <span class="hljs-title class_">NoApproverHandler</span>())))));
}
</code></pre>
<ul>
<li>Każde ogniwo samo decyduje: obsługuje żądanie i kończy albo przekazuje je następnemu ogniwu. Na końcu łańcucha stoi ogniwo, które zawsze zwraca decyzję (<code>NoApproverHandler</code>), zamiast <code>null</code>.</li>
<li>Inną ścieżkę zatwierdzania (np. festiwal bez zwrotów automatycznych) można złożyć bez zmieniania ogniw. Zmiana kolejności ogniw zmienia wynik, dlatego test sprawdza wszystkie granice progów.</li>
</ul>
<p class="ref">Warsztat: m5/s28</p>
</section>

<h2 id="85-%C5%82a%C5%84cuch-zobowi%C4%85za%C5%84-czy-dekorator">8.5. Łańcuch zobowiązań czy Dekorator?</h2>
<table>
<thead>
<tr>
<th></th>
<th>Dekorator</th>
<th>Łańcuch zobowiązań</th>
</tr>
</thead>
<tbody>
<tr>
<td>ile elementów wykonuje pracę</td>
<td>wszystkie warstwy</td>
<td>zwykle jedno ogniwo</td>
</tr>
<tr>
<td>przekazanie dalej</td>
<td>zawsze</td>
<td>tylko gdy ogniwo nie obsłuży żądania</td>
</tr>
<tr>
<td>wynik</td>
<td>wynik rdzenia z wkładem każdego dodatku</td>
<td>decyzja pierwszego właściwego ogniwa</td>
</tr>
<tr>
<td>kolejność oznacza</td>
<td>zasięg dodatków</td>
<td>pierwszeństwo reguł</td>
</tr>
</tbody>
</table>
<p>Pytanie kontrolne: czy po obsłużeniu żądania przez ten element <strong>ktoś dalej</strong> musi jeszcze coś zrobić? Tak → Dekorator. Nie → Łańcuch zobowiązań. Zapisywanie w dzienniku decyzji o zwrocie to dekorator wokół łańcucha, a nie kolejne ogniwo.</p>
</section>

<h2 id="91-ujednolicenie-interfejs%C3%B3w-adapterem">9.1. Ujednolicenie interfejsów Adapterem</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">PaymentGateway</span> {                      <span class="hljs-comment">// język kina: Money, wynik zamiast wyjątku</span>
    <span class="hljs-type">PaymentResult</span> <span class="hljs-title function_">pay</span><span class="hljs-params">(String reservationId, Money amount)</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RestPayAdapter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PaymentGateway</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">PaymentResult</span> <span class="hljs-title function_">pay</span><span class="hljs-params">(String reservationId, Money amount)</span> {
        <span class="hljs-keyword">try</span> {
            <span class="hljs-keyword">return</span> PaymentResult.accepted(rest.charge(
                    <span class="hljs-keyword">new</span> <span class="hljs-title class_">ChargeRequest</span>(amount.amount(), <span class="hljs-string">&quot;PLN&quot;</span>, reservationId)).transactionId());
        } <span class="hljs-keyword">catch</span> (RestPayException exception) {
            <span class="hljs-keyword">return</span> PaymentResult.declined(exception.code());
        }
    }
}
</code></pre>
<ul>
<li>Metoda <code>CheckoutService.pay</code> mówiła dwoma językami: dla starej bramki składała XML z kwotą w groszach, a dla nowej wywoływała usługę REST z kwotą w złotych i przechwytywała wyjątek odmowy.</li>
<li>Każda bramka dostaje adapter do jednego interfejsu, wygodnego dla kina (ang. Unify Interfaces with Adapter). Usługa zna tylko <code>PaymentGateway</code>, a trzeci dostawca to nowy adapter i jeden wpis w mapie.</li>
</ul>
<p class="ref">Warsztat: m5/s14</p>

<h2 id="92-co-adapter-naprawd%C4%99-musi-przet%C5%82umaczy%C4%87">9.2. Co adapter naprawdę musi przetłumaczyć</h2>
<ul>
<li>Podobna sygnatura nie oznacza podobnego kontraktu. Adapter tłumaczy <strong>jednostki</strong> (grosze i złote), strefy czasowe, precyzję i kodowanie znaków.</li>
<li>Tłumaczy też znaczenie <code>null</code> i pustej wartości oraz <strong>sposób zgłaszania błędów</strong>: wyjątek odmowy jednej bramki staje się zwykłym wynikiem „odmowa” (<code>declined</code>).</li>
<li>Adapter nie powinien udawać, że oba systemy działają identycznie. Jeśli obca bramka nie chroni przed podwójnym wykonaniem tej samej operacji, adapter tego nie zapewni.</li>
<li>Jeśli różnica sprowadza się do nazwy metody, wystarczy zmiana nazwy, a adapter byłby zbędną warstwą.</li>
</ul>
</section>

<h2 id="93-surowe-dane-z-zewn%C4%85trz-w-kodzie-domeny">9.3. Surowe dane z zewnątrz w kodzie domeny</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">raw</span> <span class="hljs-operator">=</span> terminal.authorize(bookingId, grosze);      <span class="hljs-comment">// np. &quot;OK;AUTH-R1;4500&quot;</span>
<span class="hljs-type">String</span>[] <span class="hljs-variable">parts</span> <span class="hljs-operator">=</span> raw.split(<span class="hljs-string">&quot;;&quot;</span>);
<span class="hljs-keyword">if</span> (!parts[<span class="hljs-number">0</span>].equals(<span class="hljs-string">&quot;OK&quot;</span>)) {
    <span class="hljs-keyword">return</span> parts[<span class="hljs-number">0</span>] + <span class="hljs-string">&quot; &quot;</span> + parts[<span class="hljs-number">1</span>];
}
<span class="hljs-type">long</span> <span class="hljs-variable">authorized</span> <span class="hljs-operator">=</span> Long.parseLong(parts[<span class="hljs-number">2</span>]);
<span class="hljs-keyword">if</span> (authorized &lt; grosze) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;PARTIAL &quot;</span> + parts[<span class="hljs-number">1</span>] + <span class="hljs-string">&quot; brakuje &quot;</span> + ...;
}
</code></pre>
<ul>
<li><code>PaymentService</code> dostaje od terminala płatniczego tekst (status, kod, kwota w groszach) i w każdej metodzie osobno go rozbiera: <code>split</code>, <code>startsWith</code>, <code>lastIndexOf</code>.</li>
<li>Zniekształcona odpowiedź powoduje awarię głęboko w domenie (<code>ArrayIndexOutOfBoundsException</code>, <code>NumberFormatException</code>) albo pusty kod autoryzacji na paragonie. Reguła płatności ginie wśród szczegółów formatu.</li>
</ul>
</section>

<h2 id="94-obiekt-graniczny-sprawdzone-dane-na-granicy-systemu">9.4. Obiekt graniczny: sprawdzone dane na granicy systemu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">PaymentConfirmation</span><span class="hljs-params">(Outcome outcome, String code, Money authorized)</span> {
    <span class="hljs-keyword">public</span> PaymentConfirmation {
        <span class="hljs-keyword">if</span> (code == <span class="hljs-literal">null</span> || code.isBlank()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(...);
        <span class="hljs-keyword">if</span> (outcome != Outcome.APPROVED &amp;&amp; authorized.isGreaterThan(Money.ZERO))
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;only approved payment can authorize money&quot;</span>);
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isPartialFor</span><span class="hljs-params">(Money requested)</span> {
        <span class="hljs-keyword">return</span> approved() &amp;&amp; authorized.compareTo(requested) &lt; <span class="hljs-number">0</span>;
    }
}
</code></pre>
<ul>
<li><strong>Obiekt graniczny</strong> (ang. Boundary Object) powstaje tylko z poprawnych danych: jeśli istnieje, to jest poprawny. Domena niczego już nie parsuje ani nie zgaduje, a format odpowiedzi terminala zna tylko konwerter <code>TerminalResponseMapper</code>.</li>
<li>Dla poprawnych odpowiedzi wynik jest identyczny. Dla zniekształconych zmienia się <strong>typ i moment błędu</strong>: odpowiedź zostaje odrzucona na granicy, zamiast wywołać awarię trzy metody dalej. To świadoma decyzja, którą trzeba zatwierdzić.</li>
</ul>
<p class="ref">Warsztat: m5/s29</p>
</section>

<h2 id="95-adapter-czy-obiekt-graniczny">9.5. Adapter czy obiekt graniczny?</h2>
<table>
<thead>
<tr>
<th></th>
<th>Adapter</th>
<th>Obiekt graniczny</th>
</tr>
</thead>
<tbody>
<tr>

<td>dane: format, typy, poprawność</td>
</tr>
<tr>
<td>na jakie pytanie odpowiada</td>

<td>co wpuszczamy do domeny?</td>
</tr>
<tr>
<td>typowy wynik</td>
<td>implementacja portu domenowego</td>
<td>niezmienny rekord, który pilnuje swoich reguł</td>
</tr>
<tr>
<td>ryzyko</td>
<td>pozorna zgodność działania</td>
<td>niepotrzebne kopiowanie każdej struktury danych</td>
</tr>
</tbody>
</table>
<p>Zwykle występują razem: adapter implementuje port (<code>PaymentTerminal</code>) i zwraca obiekt graniczny (<code>PaymentConfirmation</code>).</p>

<h2 id="101-ukrycie-klas-za-fabryk%C4%85">10.1. Ukrycie klas za Fabryką</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: klient zna klasy konkretne i regułę wyboru</span>
tickets.add(row &gt;= <span class="hljs-number">10</span> ? <span class="hljs-keyword">new</span> <span class="hljs-title class_">VipTicket</span>(title, base, row) : <span class="hljs-keyword">new</span> <span class="hljs-title class_">StandardTicket</span>(title, base, row));

<span class="hljs-comment">// po: klient zna tylko Ticket i Tickets</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Tickets</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">Ticket</span> <span class="hljs-title function_">forSeat</span><span class="hljs-params">(String title, Money base, <span class="hljs-type">int</span> row)</span> {
        <span class="hljs-keyword">return</span> row &gt;= <span class="hljs-number">10</span> ? <span class="hljs-keyword">new</span> <span class="hljs-title class_">VipTicket</span>(title, base, row) : <span class="hljs-keyword">new</span> <span class="hljs-title class_">StandardTicket</span>(title, base, row);
    }
}
<span class="hljs-keyword">record</span> <span class="hljs-title class_">VipTicket</span><span class="hljs-params">(String title, Money base, <span class="hljs-type">int</span> row)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Ticket</span> { ... }   <span class="hljs-comment">// bez public</span>
</code></pre>
<ul>
<li>Fabryka staje się jedynym publicznym sposobem tworzenia biletów, a klasy konkretne tracą modyfikator <code>public</code> (ang. Encapsulate Classes with Factory). Nowy rodzaj biletu nie wymaga zmian u żadnego klienta.</li>
<li>Kroki: przekierowuj tworzenie do fabryki po jednym miejscu → przenieś regułę wyboru → na końcu ogranicz widoczność klas.</li>
</ul>

<h2 id="102-wyodr%C4%99bnienie-klasy-fabryki">10.2. Wyodrębnienie klasy fabryki</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ReservationFactory</span> {             <span class="hljs-comment">// wie, JAK powstaje rezerwacja</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">Reservation</span> <span class="hljs-title function_">create</span><span class="hljs-params">(String channel, String email, List&lt;String&gt; seats)</span> {
        sequence++;                                 <span class="hljs-comment">// numer pobierany przed sprawdzeniem kanału</span>
        <span class="hljs-type">String</span> <span class="hljs-variable">id</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;R&quot;</span> + sequence;
        <span class="hljs-keyword">if</span> (!channel.equals(<span class="hljs-string">&quot;ONLINE&quot;</span>) &amp;&amp; !channel.equals(<span class="hljs-string">&quot;BOX_OFFICE&quot;</span>)) <span class="hljs-keyword">throw</span> ...;
        <span class="hljs-type">Money</span> <span class="hljs-variable">fee</span> <span class="hljs-operator">=</span> channel.equals(<span class="hljs-string">&quot;ONLINE&quot;</span>) ? Money.of(<span class="hljs-string">&quot;2.00&quot;</span>).times(seats.size()) : Money.ZERO;
        ...
    }
}
<span class="hljs-type">public</span> <span class="hljs-title function_">ReservationService</span><span class="hljs-params">(ReservationFactory factory)</span> { ... }   <span class="hljs-comment">// wie, KIEDY wolno ją utworzyć</span>
</code></pre>
<ul>
<li><code>ReservationService</code> pilnował zajętości miejsc, ale też budował rezerwacje (numer, opłata internetowa, termin ważności), i to w dwóch kopiach kodu. Tworzenie przenosimy najpierw do metody, potem do osobnej klasy (ang. Extract Factory Class), a fabrykę przekazujemy przez konstruktor.</li>
<li>Kolejność efektów przy tworzeniu jest częścią kontraktu: przy błędnym kanale numer rezerwacji przepada. Refaktoryzacja to zachowuje; naprawa byłaby osobną zmianą.</li>
<li>Różnica: ukrycie klas za fabryką chroni klasy konkretne przed klientami, a wyodrębnienie klasy fabryki zabiera tworzenie z klasy, która ma inną odpowiedzialność.</li>
</ul>
<p class="ref">Warsztat: m5/s05</p>
</section>

<h2 id="103-fabryka-jako-stra%C5%BCnik-sp%C3%B3jno%C5%9Bci">10.3. Fabryka jako strażnik spójności</h2>
<ul>
<li>Fabryka skupia w jednym miejscu wiedzę o tworzeniu obiektów: sprawdzanie danych, wybór klasy, współdzielone instancje, odczyt konfiguracji. Klient nie może utworzyć niespójnego obiektu z pominięciem tych reguł.</li>
<li>Zanim ukryjesz konstruktory, znajdź miejsca tworzenia niewidoczne dla kompilatora: refleksję, kontener wstrzykiwania zależności, odczyt obiektów z plików i sieci. W bibliotece publicznej potrzebny jest okres przejściowy z adnotacją <code>@Deprecated</code>.</li>
<li>Fabryka jest zwykłą zależnością przekazywaną przez konstruktor. Nie powinna zamienić się w globalny rejestr usług.</li>
<li>Fabryka to nie to samo co korzeń kompozycji: fabryka tworzy obiekty na żądanie w trakcie działania programu, a korzeń kompozycji składa graf obiektów raz, przy starcie.</li>
</ul>
</section>
