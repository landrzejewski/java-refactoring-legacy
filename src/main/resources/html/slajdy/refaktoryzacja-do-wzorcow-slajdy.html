<h2 id="111-klienci-sami-koordynuj%C4%85-podsystemy">11.1. Klienci sami koordynują podsystemy</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// BoxOffice.sell: kopia OnlineShop.buy sprzed lat</span>
<span class="hljs-type">Money</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> prices.price(order.ticketType()).times(order.seats().size());
<span class="hljs-keyword">try</span> {
    seats.reserve(order.screening(), order.seats());
} <span class="hljs-keyword">catch</span> (IllegalStateException exception) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;ERROR &quot;</span> + exception.getMessage();

<span class="hljs-keyword">if</span> (!payments.charge(order.card(), total)) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;ERROR payment declined&quot;</span>;         <span class="hljs-comment">// sklep w tym miejscu zwalnia miejsca</span>
}
mailer.send(order.email(), ...);
</code></pre>
<ul>
<li>Sklep internetowy i kasa znają cztery podsystemy (cennik, rezerwację miejsc, płatności, maile), kolejność ich wywołań i obsługę błędów.</li>
<li>Ta sama wiedza została skopiowana, a kopie już się rozjechały: kasa po odmowie płatności nie zwalnia miejsc.</li>
</ul>

<h2 id="112-wyodr%C4%99bnienie-fasady-jedna-operacja-zamiast-znajomo%C5%9Bci-krok%C3%B3w">11.2. Wyodrębnienie Fasady: jedna operacja zamiast znajomości kroków</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BookingFacade</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">book</span><span class="hljs-params">(TicketOrder order, Money feePerSeat)</span> {
        <span class="hljs-type">Money</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> prices.price(order.ticketType()).plus(feePerSeat).times(...);
        seats.reserve(order.screening(), order.seats());   <span class="hljs-comment">// (obsługa błędu pominięta)</span>
        <span class="hljs-type">boolean</span> <span class="hljs-variable">paid</span> <span class="hljs-operator">=</span> <span class="hljs-literal">false</span>;
        <span class="hljs-keyword">try</span> {
            paid = payments.charge(order.card(), total);
        } <span class="hljs-keyword">finally</span> {
            <span class="hljs-keyword">if</span> (!paid) seats.release(order.screening(), order.seats());
        }
        ...
    }
}
</code></pre>
<ul>
<li>Kroki (ang. Extract Facade): test efektów obu klientów → wyodrębnienie metody w sklepie → przeniesienie jej do fasady → przełączenie kasy na fasadę → ukrycie podsystemów. Fasada obejmuje jedną spójną operację; fasada udostępniająca wszystkie operacje podsystemów staje się klasą, która wie i robi wszystko.</li>
<li>Przełączenie kasy na fasadę zmienia jej zachowanie, bo naprawia błąd w kopii. To nie jest „czysta” refaktoryzacja, więc dokumentujemy tę zmianę osobnym testem.</li>
</ul>
<p class="ref">Warsztat: m5/s30</p>

<h2 id="113-obcy-model-w-regu%C5%82ach-domeny">11.3. Obcy model w regułach domeny</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span> (!record.statusCode().equals(<span class="hljs-string">&quot;A&quot;</span>)) {

}
<span class="hljs-type">int</span> <span class="hljs-variable">percent</span> <span class="hljs-operator">=</span> Integer.parseInt(record.share().replace(<span class="hljs-string">&quot;%&quot;</span>, <span class="hljs-string">&quot;&quot;</span>).strip());   <span class="hljs-comment">// &quot;45%&quot;, &quot; 40 %&quot;</span>
<span class="hljs-type">Money</span> <span class="hljs-variable">minimum</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Money</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(record.minGuaranteeCents()).movePointLeft(<span class="hljs-number">2</span>));

        + record.titleUpper().substring(<span class="hljs-number">1</span>).toLowerCase(Locale.ROOT);

<ul>
<li><code>SettlementService</code> rozlicza się z dystrybutorem, posługując się jego modelem danych: statusy <code>A</code>/<code>S</code>, daty w formacie <code>yyyyMMdd</code>, kwoty w groszach zapisane jako tekst, udział <code>&quot;45%&quot;</code> i tytuły pisane wielkimi literami.</li>
<li>Każda zmiana formatu po stronie dystrybutora przenika do reguł rozliczeń, a reguły można przetestować tylko na rekordach obcego systemu.</li>
</ul>

<h2 id="114-warstwa-antykorupcyjna-port-t%C5%82umacz-i-model-domenowy">11.4. Warstwa antykorupcyjna: port, tłumacz i model domenowy</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">FilmLicense</span><span class="hljs-params">(String filmCode, String title, <span class="hljs-type">boolean</span> active, LocalDate validFrom,
                          LocalDate validTo, <span class="hljs-type">int</span> sharePercent, Money minimumGuarantee)</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">allowsScreeningOn</span><span class="hljs-params">(LocalDate day)</span> { <span class="hljs-keyword">return</span> active &amp;&amp; covers(day); }
    <span class="hljs-keyword">public</span> <span class="hljs-type">Money</span> <span class="hljs-title function_">dueFor</span><span class="hljs-params">(Money revenue)</span> { <span class="hljs-keyword">return</span> revenue.percent(sharePercent).max(minimumGuarantee); }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DistributorAcl</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">FilmLicenses</span> {          <span class="hljs-comment">// port w języku kina</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">Optional</span>&lt;FilmLicense&gt; <span class="hljs-title function_">find</span><span class="hljs-params">(String filmCode)</span> {
        <span class="hljs-keyword">return</span> Optional.ofNullable(feed.fetch(filmCode)).map(translator::toLicense);
    }
}

<ul>
<li><strong>Warstwa antykorupcyjna</strong> (ang. Anti-Corruption Layer, ACL) chroni język domeny przed obcym modelem. Reguły (czy licencja obejmuje dany dzień, ile należy zapłacić) są metodami modelu domenowego i można je testować bez typów dystrybutora. Konwencje dystrybutora zna tylko tłumacz <code>DistributorTranslator</code>.</li>
<li>Tłumacz zaostrza sprawdzanie danych: błędna data albo udział spoza zakresu 0-100 powodują błąd już na granicy. To, co zrobić z błędnym rekordem (odrzucić, pominąć, odłożyć do wyjaśnienia), jest decyzją biznesową.</li>
</ul>

<h2 id="115-fasada-a-warstwa-antykorupcyjna">11.5. Fasada a warstwa antykorupcyjna</h2>
<table>

<ul>

<li>Warstwa antykorupcyjna dobrze sprawdza się przy stopniowym zastępowaniu starego systemu nowym, funkcja po funkcji (ang. Strangler Fig). Port domenowy pozostaje bez zmian, a za nim można zastąpić starego dostawcę nowym. Każdy element przejściowy potrzebuje właściciela i warunku, po którym zostanie usunięty.</li>

<h2 id="121-ukrycie-budowy-kompozytu-za-budowniczym">12.1. Ukrycie budowy Kompozytu za Budowniczym</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: ręczne new i add, węzły można zmieniać</span>
<span class="hljs-type">Hall</span> <span class="hljs-variable">hall2</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Hall</span>(<span class="hljs-string">&quot;Sala 2&quot;</span>);
<span class="hljs-keyword">if</span> (weekend) hall2.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Screening</span>(<span class="hljs-string">&quot;Kraina Lodu&quot;</span>, LocalTime.of(<span class="hljs-number">10</span>, <span class="hljs-number">0</span>)));
hall2.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Screening</span>(<span class="hljs-string">&quot;Amator&quot;</span>, LocalTime.of(<span class="hljs-number">17</span>, <span class="hljs-number">30</span>)));
day.add(hall2);

<span class="hljs-comment">// po: wcięcia kodu odpowiadają poziomom drzewa</span>
<span class="hljs-keyword">return</span> ScheduleBuilder.day(date)
        .hall(<span class="hljs-string">&quot;Sala 1&quot;</span>, hall -&gt; hall.screening(<span class="hljs-string">&quot;Diuna&quot;</span>, <span class="hljs-number">18</span>, <span class="hljs-number">0</span>).screening(<span class="hljs-string">&quot;Diuna&quot;</span>, <span class="hljs-number">21</span>, <span class="hljs-number">0</span>))

<h2 id="122-budowniczy-kiedy-i-na-co-uwa%C5%BCa%C4%87">12.2. Budowniczy: kiedy i na co uważać</h2>
<ul>
<li>Budowniczy jest uzasadniony, gdy budowa jest wieloetapowa i ma <strong>własne reguły</strong>, np. kolejność elementów, zasady dla pustej grupy, unikalność nazw. Dla rekordu z trzema wymaganymi polami konstruktor jest czytelniejszy.</li>
<li>Moment sprawdzania danych jest częścią kontraktu: sprawdzanie w każdym kroku szybko zgłasza błąd, a sprawdzanie w <code>build()</code> widzi całość. Od tego wyboru zależy, kiedy pojawi się wyjątek.</li>
<li>Budowniczy jest jednorazowy: każde wywołanie po <code>build()</code> rzuca wyjątek, a gotowy obiekt nie współdzieli wewnętrznej listy z budowniczym.</li>
<li>Wymóg unikalnych nazw sal to nowa reguła, której wcześniej nie było. Dla błędnych danych zachowanie się więc zmienia i trzeba to zatwierdzić.</li>
</ul>
</section>

<h2 id="131-zast%C4%85pienie-zakodowanych-powiadomie%C5%84-obserwatorem">13.1. Zastąpienie zakodowanych powiadomień Obserwatorem</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: usługa płatności zna wszystkich odbiorców</span>
mailer.send(payment.email(), <span class="hljs-string">&quot;Potwierdzenie platnosci &quot;</span> + ...);

<span class="hljs-comment">// po: usługa publikuje zdarzenie, odbiorców rejestruje korzeń kompozycji</span>
<span class="hljs-keyword">for</span> (Registration registration : listeners) {
    registration.listener().onPaid(event);

<ul>
<li>Obserwator (ang. Observer) odwraca zależność: nadawca zna tylko interfejs odbiorcy (<code>PaymentListener</code>), a konkretnych odbiorców rejestruje się z zewnątrz (ang. Replace Hard-coded Notifications with Observer).</li>
<li><code>PaymentService</code> nie importuje już klas <code>Mailer</code>, <code>SmsGateway</code> ani <code>LoyaltyProgram</code>.</li>

<h2 id="132-obserwator-zasady-powiadamiania-musz%C4%85-by%C4%87-jawne">13.2. Obserwator: zasady powiadamiania muszą być jawne</h2>
<ul>
<li><strong>Kolejność i wątek:</strong> odbiorcy są wywoływani w kolejności rejestracji, w tym samym wątku, tak samo jak wcześniej wywołania zapisane na sztywno.</li>
<li><strong>Błędy:</strong> awaria wysyłki SMS przerywa naliczanie punktów, dokładnie tak jak przed zmianą. Kontynuowanie pracy po błędzie odbiorcy byłoby nową decyzją, a nie refaktoryzacją.</li>
<li><strong>Wyrejestrowanie:</strong> <code>subscribe</code> zwraca uchwyt, który usuwa dokładnie tę jedną rejestrację, a ponowne użycie uchwytu niczego nie psuje. Odbiorca, którego nikt nie wyrejestruje, może niepotrzebnie zatrzymywać obiekty w pamięci.</li>
<li>Dodanie nowych odbiorców to <strong>rozszerzenie</strong> zachowania. Pierwszy krok zachowuje dokładnie te same efekty co wcześniej.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SeatSelectionScreen</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">SelectionMediator</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">SeatMap</span> <span class="hljs-variable">seatMap</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">SeatMap</span>(<span class="hljs-built_in">this</span>);
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Basket</span> <span class="hljs-variable">basket</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Basket</span>(<span class="hljs-built_in">this</span>);
    ...
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">seatToggled</span><span class="hljs-params">(String seat, <span class="hljs-type">boolean</span> selected)</span> {

        refresh();
    }
    <span class="hljs-keyword">private</span> <span class="hljs-type">void</span> <span class="hljs-title function_">refresh</span><span class="hljs-params">()</span> {                        <span class="hljs-comment">// kolejność odświeżania w jednym miejscu</span>

        payButton.refresh(basket.seats().size(), summary.total());

}

<ul>
<li>Komponent zgłasza, <strong>co się stało</strong>, a mediator decyduje, kto i w jakiej kolejności reaguje. Komponenty znają tylko interfejs mediatora.</li>
<li>Ryzykiem jest mediator, który przejmuje całą logikę ekranu i staje się nową, ogromną klasą. Do mediatora trafia tylko koordynacja, a logika komponentów (cena, limit miejsc) pozostaje w komponentach.</li>
</ul>

<h2 id="143-obserwator-czy-mediator">14.3. Obserwator czy Mediator?</h2>
<table>
<thead>
<tr>
<th></th>
<th>Obserwator</th>
<th>Mediator</th>
</tr>
</thead>
<tbody>
<tr>
<td>kierunek komunikacji</td>
<td>nadawca → wielu niezależnych odbiorców</td>
<td>komponenty ↔ jeden koordynator</td>
</tr>
<tr>
<td>gdzie są reguły współpracy</td>
<td>rozproszone w odbiorcach</td>
<td>skupione w mediatorze</td>
</tr>
<tr>
<td>kto kogo zna</td>
<td>odbiorcy nie znają się nawzajem</td>
<td>mediator zna wszystkich uczestników</td>
</tr>
<tr>
<td>typowe ryzyko</td>
<td>ukryte zależności, kolejność powiadomień, wycieki pamięci</td>
<td>mediator, który robi wszystko</td>
</tr>
<tr>
<td>pasuje do</td>
<td>zdarzeń domenowych, powiadomień</td>
<td>formularzy, ekranów, koordynacji</td>
</tr>
</tbody>
</table>
<p>Mediator często korzysta z Obserwatora do przekazywania powiadomień. Różnica polega na tym, <strong>gdzie znajdują się reguły</strong> współpracy.</p>
</section>

<h2 id="151-odwiedzaj%C4%85cy-i-macierz-zmian">15.1. Odwiedzający i macierz zmian</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: łańcuch instanceof w każdej operacji, błąd dopiero w czasie działania</span>
<span class="hljs-keyword">if</span> (item <span class="hljs-keyword">instanceof</span> TicketItem ticket) <span class="hljs-keyword">return</span> vatOf(ticket.price(), <span class="hljs-number">8</span>);
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (item <span class="hljs-keyword">instanceof</span> SnackItem snack) <span class="hljs-keyword">return</span> vatOf(snack.price(), <span class="hljs-number">23</span>);
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (item <span class="hljs-keyword">instanceof</span> VoucherItem) <span class="hljs-keyword">return</span> Money.ZERO;
<span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;unknown item: &quot;</span> + item);
</code></pre>
<table>
<thead>
<tr>
<th>Co zmienia się częściej</th>
<th>Naturalny kierunek</th>
</tr>
</thead>
<tbody>
<tr>
<td>nowe operacje, stały zestaw rodzajów elementów</td>
<td>Odwiedzający</td>
</tr>
<tr>
<td>nowe rodzaje elementów, stały zestaw operacji</td>
<td>metody polimorficzne w elementach</td>
</tr>
<tr>
<td>jedno proste zbieranie wyników</td>
<td>parametr zbierający</td>
</tr>
</tbody>
</table>
<ul>
<li><code>ReceiptPrinter</code> (paragon z biletami, przekąskami i bonami) ma trzy takie operacje: wiersz paragonu, kwotę i VAT. Odwiedzający (ang. Visitor) przenosi każdą z nich do osobnej klasy, a element sam wybiera właściwą metodę w <code>accept(visitor)</code>. Dodanie operacji jest tanie, ale nowy rodzaj elementu wymaga zmian we wszystkich klasach odwiedzających.</li>
</ul>

<h2 id="152-odwiedzaj%C4%85cy-albo-hierarchia-sealed-i-switch">15.2. Odwiedzający albo hierarchia <code>sealed</code> i <code>switch</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">OrderItem</span> <span class="hljs-keyword">permits</span> TicketItem, SnackItem, VoucherItem { }

<span class="hljs-type">Money</span> <span class="hljs-title function_">vat</span><span class="hljs-params">(OrderItem item)</span> {
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">switch</span> (item) {                         <span class="hljs-comment">// bez default: kompilator pilnuje kompletności</span>
        <span class="hljs-keyword">case</span> TicketItem ticket -&gt; vatOf(ticket.price(), <span class="hljs-number">8</span>);
        <span class="hljs-keyword">case</span> SnackItem snack -&gt; vatOf(snack.price(), <span class="hljs-number">23</span>);
        <span class="hljs-keyword">case</span> VoucherItem voucher -&gt; Money.ZERO;
    };
}
</code></pre>
<ul>
<li>We współczesnej Javie <code>switch</code> obejmujący wszystkie podtypy zamkniętej (<code>sealed</code>) hierarchii daje tę samą kontrolę kompilatora co Odwiedzający, bez podwójnego wywołania metod.</li>
<li>Nieobsłużona pozycja oznacza błąd kompilacji, a nie awarię przy kasie. Klasyczny Odwiedzający ma sens, gdy hierarchii nie da się zamknąć.</li>
</ul>

<h2 id="161-zast%C4%85pienie-instrukcji-warunkowej-polimorfizmem">16.1. Zastąpienie instrukcji warunkowej polimorfizmem</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: pole value oznacza raz długość filmu w minutach, a raz liczbę filmów</span>
<span class="hljs-keyword">return</span> <span class="hljs-keyword">switch</span> (kind) {
    <span class="hljs-keyword">case</span> REGULAR -&gt; <span class="hljs-number">20</span> + value;

    <span class="hljs-keyword">case</span> MARATHON -&gt; value * <span class="hljs-number">120</span> + (value - <span class="hljs-number">1</span>) * <span class="hljs-number">15</span>;
};
<span class="hljs-comment">// po: zamknięta hierarchia rekordów z nazwanymi danymi</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">MarathonScreening</span><span class="hljs-params">(String title, <span class="hljs-type">int</span> films)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Screening</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">durationMinutes</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> films * <span class="hljs-number">120</span> + (films - <span class="hljs-number">1</span>) * <span class="hljs-number">15</span>; }
}
</code></pre>
<ul>
<li>Ta refaktoryzacja (ang. Replace Conditional with Polymorphism) pasuje, gdy pole sterujące opisuje <strong>trwały rodzaj</strong> obiektu. Jeśli rodzaj zmienia się w czasie, właściwy jest Stan; jeśli algorytm wybiera klient, Strategia.</li>
<li>Zaczynamy od znalezienia wszystkich miejsc, w których obiekty są tworzone i odczytywane z zapisu. Zostaje jeden <code>switch</code> w <code>fromRow</code>, czyli tam, gdzie jest miejsce na wiedzę o tworzeniu obiektów.</li>
</ul>
<p class="ref">Warsztat: m5/s02</p>
</section>

<h2 id="162-zast%C4%85pienie-kodu-typu-klas%C4%85">16.2. Zastąpienie kodu typu klasą</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">Format</span> {                              <span class="hljs-comment">// przed: int 1, 2, 3 w trzech instrukcjach switch</span>
    TWO_D(<span class="hljs-string">&quot;2D&quot;</span>, <span class="hljs-string">&quot;25.00&quot;</span>, <span class="hljs-literal">false</span>), THREE_D(<span class="hljs-string">&quot;3D&quot;</span>, <span class="hljs-string">&quot;32.00&quot;</span>, <span class="hljs-literal">true</span>), IMAX(<span class="hljs-string">&quot;IMAX&quot;</span>, <span class="hljs-string">&quot;40.00&quot;</span>, <span class="hljs-literal">false</span>);
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">label</span><span class="hljs-params">()</span> { ... }
    <span class="hljs-keyword">public</span> <span class="hljs-type">Money</span> <span class="hljs-title function_">basePrice</span><span class="hljs-params">()</span> { ... }
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">requiresGlasses</span><span class="hljs-params">()</span> { ... }
}
<span class="hljs-type">Format</span> <span class="hljs-variable">format</span> <span class="hljs-operator">=</span> FormatCodes.fromCode(Integer.parseInt(parts[<span class="hljs-number">1</span>].trim()));   <span class="hljs-comment">// tuż po odczycie</span>
</code></pre>
<ul>
<li>Format seansu był zwykłą liczbą <code>int</code> z pliku CSV, a wiedza o kodach była rozproszona po trzech metodach (etykieta, cena, okulary). Nowy typ (ang. Replace Type Code with Class) przejmuje całą tę wiedzę.</li>
<li>W zapisie do pliku zostaje stabilny kod liczbowy, który przelicza konwerter <code>FormatCodes</code>, a nigdy <code>ordinal()</code> ani <code>toString()</code>. Format pliku CSV się nie zmienia.</li>
<li>Typ wyliczeniowy wystarcza dla małego, zamkniętego zbioru wartości. Klasa jest lepsza, gdy pojawiają się nazwy zastępcze, kody z innych systemów albo własne reguły tworzenia.</li>
</ul>
<p class="ref">Warsztat: m5/s03</p>

<h2 id="163-zast%C4%85pienie-ukrytego-drzewa-kompozytem">16.3. Zastąpienie ukrytego drzewa Kompozytem</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: drzewo ukryte w konwencji, pierwszy element listy to nazwa zestawu</span>
List.of(<span class="hljs-string">&quot;Zestaw Duo&quot;</span>, <span class="hljs-string">&quot;Popcorn L=18.00&quot;</span>,
        List.of(<span class="hljs-string">&quot;Napoje&quot;</span>, <span class="hljs-string">&quot;Cola 0.5=9.00&quot;</span>, <span class="hljs-string">&quot;Cola 0.5=9.00&quot;</span>), <span class="hljs-string">&quot;Nachos=14.00&quot;</span>)

<span class="hljs-comment">// po: jawny liść (Product) i węzeł (Combo) o wspólnym kontrakcie</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">MenuItem</span> <span class="hljs-keyword">permits</span> Product, Combo {
    <span class="hljs-type">Money</span> <span class="hljs-title function_">price</span><span class="hljs-params">()</span>;
    <span class="hljs-type">void</span> <span class="hljs-title function_">render</span><span class="hljs-params">(<span class="hljs-type">int</span> depth, StringBuilder text)</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">Combo</span><span class="hljs-params">(String name, List&lt;MenuItem&gt; items)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">MenuItem</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">Money</span> <span class="hljs-title function_">price</span><span class="hljs-params">()</span> { <span class="hljs-comment">/* suma price() wszystkich items */</span> }
}
<span class="hljs-comment">// stary format tłumaczy konwerter: MenuMapper.fromNested(combo).render(0, text)</span>
</code></pre>
<ul>
<li>Klasa <code>BarMenu</code> wielokrotnie używała <code>instanceof</code> i rzutowań, żeby odczytać zagnieżdżone listy. Obok budujemy jawny Kompozyt (ang. Composite: <code>Product</code>, <code>Combo</code>) i konwerter, który tłumaczy stary format (ang. Replace Implicit Tree with Composite).</li>
<li>Operacje (<code>price</code>, <code>render</code>) przenosimy po jednej, a stara i nowa postać danych istnieją obok siebie. Konwerter zgłasza błąd dla danych, których nie da się wiernie odwzorować.</li>

<h2 id="164-kompozyt-przezroczysty-czy-bezpieczny">16.4. Kompozyt przezroczysty czy bezpieczny</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Kompozyt przezroczysty: add() jest we wspólnym MenuComponent, więc liść musi go „obsłużyć”</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">add</span><span class="hljs-params">(MenuComponent child)</span> {                    <span class="hljs-comment">// w klasie Product</span>
    <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnsupportedOperationException</span>(<span class="hljs-string">&quot;cannot add to &quot;</span> + name());
}
</code></pre>
<ul>
<li>W wariancie <strong>przezroczystym</strong> metoda <code>add()</code> jest we wspólnym interfejsie. Wywołanie <code>add</code> na produkcie się kompiluje, ale kończy się błędem dopiero w czasie działania.</li>
<li>W wariancie <strong>bezpiecznym</strong> zarządzanie elementami podrzędnymi jest tylko w węźle (<code>Combo</code>). Błąd wychodzi już przy kompilacji, ale klient musi wiedzieć, czy ma do czynienia z węzłem.</li>
<li>Gdy drzewo powstaje raz i potem się nie zmienia, dylemat znika: niezmienne rekordy w ogóle nie potrzebują metody <code>add</code>.</li>
<li>Rzutowanie <code>(Combo)</code> w kodzie klienta oznacza powrót do problemu, który Kompozyt miał rozwiązać.</li>
</ul>
<p class="ref">Warsztat: m5/s11</p>
</section>

<h2 id="165-jeden-element-lub-wiele-oraz-wyodr%C4%99bnienie-kompozytu">16.5. Jeden element lub wiele oraz wyodrębnienie Kompozytu</h2>
<ul>
<li><strong>Zastąpienie rozróżnienia „jeden lub wiele” Kompozytem</strong> (ang. Replace One/Many Distinctions with Composite): zamiast metod <code>refund(ticket)</code> i <code>refundAll(tickets)</code>, w których ta sama reguła jest zapisana dwa razy, powstaje jedna metoda <code>refund(Refundable, now)</code>. <code>Refundable</code> ma dwie implementacje: pojedynczy bilet (<code>SingleTicket</code>) i grupę (<code>TicketGroup</code>), która sama też jest <code>Refundable</code>.</li>
<li>Przy tej zmianie nie wolno zmienić kolejności przetwarzania, wyniku dla pustej grupy ani liczby efektów naliczanych raz na wywołanie. Potrącenie 3.00 zł jest nadal naliczane raz na cały zwrot, a nie za każdy bilet.</li>
<li><strong>Wyodrębnienie Kompozytu</strong> (ang. Extract Composite): klasy <code>Marathon</code> i <code>ShortsBlock</code> powielają listę elementów, metodę <code>add</code> i sumowanie minut. Wspólne części przenosimy do nadklasy <code>CompositeProgramItem</code>.</li>
<li>Podobne pętle mogą znaczyć co innego: tylko maraton dolicza przerwy, więc <code>minutes()</code> zostaje w podklasach. Porównujemy kontrakty, a nie wygląd kodu.</li>
</ul>
<p class="ref">Warsztat: m5/s12, m5/s13</p>
</section>

<h2 id="166-przeniesienie-zbierania-wynik%C3%B3w-do-parametru-zbieraj%C4%85cego">16.6. Przeniesienie zbierania wyników do parametru zbierającego</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: każda metoda zwraca fragment tekstu z własnym separatorem</span>
warnings += checkEmail(draft.email());
warnings += checkSeats(draft.seats());
<span class="hljs-keyword">return</span> warnings.isEmpty() ? <span class="hljs-string">&quot;OK&quot;</span> : warnings.substring(<span class="hljs-number">0</span>, warnings.length() - <span class="hljs-number">2</span>);

<span class="hljs-comment">// po: metody dopisują ostrzeżenia do przekazanego obiektu Warnings</span>
<span class="hljs-type">Warnings</span> <span class="hljs-variable">warnings</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Warnings</span>();
checkEmail(draft.email(), warnings);
checkSeats(draft.seats(), warnings);
<span class="hljs-keyword">return</span> warnings.summary();
</code></pre>
<ul>
<li>Metody nie zwracają już fragmentów do sklejenia, tylko dopisują wyniki do przekazanego obiektu (ang. Move Accumulation to Collecting Parameter). Separator i format wyniku są teraz w jednym miejscu.</li>
<li>Właścicielem obiektu zbierającego wyniki jest kod wywołujący. Trzeba ustalić, czy metoda go czyści, czy tylko dopisuje, i co w nim zostaje, gdy w połowie pracy zostanie zgłoszony wyjątek.</li>
</ul>
<p class="ref">Warsztat: m5/s18</p>
</section>

<h2 id="167-ograniczenie-liczby-instancji-singletonem">16.7. Ograniczenie liczby instancji Singletonem</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: new PriceList().basePrice(format), czyli parsowanie taryfy przy każdej wycenie</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">PriceList</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Tariff</span> { INSTANCE; ... }     <span class="hljs-comment">// jedna instancja</span>
<span class="hljs-type">public</span> <span class="hljs-title function_">TicketDesk</span><span class="hljs-params">()</span> { <span class="hljs-built_in">this</span>(PriceList.INSTANCE); }             <span class="hljs-comment">// domyślnie globalna instancja</span>
<span class="hljs-type">public</span> <span class="hljs-title function_">TicketDesk</span><span class="hljs-params">(Tariff tariff)</span> { ... }                       <span class="hljs-comment">// test podaje własny cennik</span>
</code></pre>
<ul>
<li><code>TicketDesk</code> przy każdej wycenie tworzył nowy obiekt <code>PriceList</code> i od nowa parsował taryfę, choć cennik się nie zmienia.</li>
<li>Ograniczenie liczby instancji do jednej (ang. Limit Instantiation with Singleton) to <strong>decyzja o cyklu życia</strong> obiektu. Jest bezpieczne tylko wtedy, gdy obiekt jest niezmienny, a jego instancje są sobie równoważne. Najpierw mierzymy, ile kosztuje tworzenie.</li>
<li>Typ wyliczeniowy gwarantuje bezpieczne udostępnienie instancji wielu wątkom, ale oznacza jedną instancję na <code>ClassLoader</code>, a nie na całą JVM. Na końcu ukrywamy cennik za interfejsem <code>Tariff</code>, żeby testy nie zależały od stanu globalnego.</li>
</ul>
<p class="ref">Warsztat: m5/s17</p>
</section>

<h2 id="171-kiedy-wzorzec-jest-nadmiarem">17.1. Kiedy wzorzec jest nadmiarem</h2>
<p><strong>Usunięcie</strong> wzorca jest tak samo uprawnioną refaktoryzacją jak jego <strong>wprowadzenie</strong>. Typowe sygnały, że wzorzec jest zbędny:</p>
<ul>
<li>interfejs, który od dawna ma jedną implementację i powtarza metody jednej klasy,</li>
<li>fabryka, która wywołuje tylko jeden konstruktor, albo konfiguracja trudniejsza niż zwykłe <code>new</code>,</li>
<li>implementacje, których metody w większości rzucają <code>UnsupportedOperationException</code>,</li>
<li>nowy wariant nadal wymaga zmian w wielu centralnych miejscach, więc wzorzec niczego nie uprościł,</li>
<li>pośrednik, który tylko przekazuje wywołania,</li>
<li>globalna instancja (Singleton), która ukrywa zależność i sprawia, że testy wpływają na siebie nawzajem.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-theme="default" data-style="section { font-size: 22px; padding: 40px 56px; }

<h2 id="172-refaktoryzacje-kt%C3%B3re-usuwaj%C4%85-wzorzec">17.2. Refaktoryzacje, które usuwają wzorzec</h2>
<table>
<thead>
<tr>
<th>Nadmiar</th>
<th>Refaktoryzacja (nazwa angielska)</th>
</tr>
</thead>
<tbody>
<tr>
<td>pośrednik przekazujący wywołania 1:1</td>
<td>usunięcie pośrednika (Remove Middle Man)</td>
</tr>
<tr>
<td>globalny, modyfikowalny Singleton</td>
<td>wchłonięcie Singletona (Inline Singleton)</td>
</tr>
<tr>
<td>podklasa bez własnego stanu i zachowania</td>
<td>spłaszczenie hierarchii (Collapse Hierarchy)</td>
</tr>
<tr>
<td>Strategia z jedną, stałą implementacją</td>
<td>wchłonięcie klasy (Inline Class)</td>
</tr>
<tr>
<td>fabryka wywołująca jeden konstruktor</td>
<td>wchłonięcie metody (Inline Method), zwykłe <code>new</code></td>
</tr>
<tr>
<td>Dekorator, który niczego nie dodaje</td>
<td>usunięcie warstwy</td>
</tr>
<tr>
<td>Odwiedzający, gdy często dochodzą nowe rodzaje elementów</td>
<td>metody polimorficzne albo <code>switch</code> po <code>sealed</code></td>
</tr>
</tbody>
</table>
<p>Usunięcie wzorca to także refaktoryzacja: obowiązuje ten sam test równoważności i te same małe kroki.</p>
</section>

<h2 id="173-usuni%C4%99cie-po%C5%9Brednika">17.3. Usunięcie pośrednika</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">freeSeats</span><span class="hljs-params">(String id)</span> {          <span class="hljs-comment">// CinemaFacade: prawie wszystko deleguje 1:1...</span>
    <span class="hljs-keyword">try</span> {
        <span class="hljs-keyword">return</span> catalog.freeSeats(id);
    } <span class="hljs-keyword">catch</span> (NoSuchElementException e) {
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;                          <span class="hljs-comment">// ...ale tu po cichu zamienia błąd na wynik</span>
    }
}
</code></pre>
<ul>
<li>Zanim usuniesz pośrednika (ang. Remove Middle Man), sprawdź, czy nie robi czegoś więcej: kontroli uprawnień, transakcji, pomiarów, ponawiania, tłumaczenia błędów. Fasada modułu albo szew dla testów bywają cenne.</li>
<li>Tutaj fasada dla nieznanego seansu zwraca 0 wolnych miejsc. To zachowanie przenosimy do jedynego klienta, który go potrzebuje (<code>SeatBadge</code>), potem po kolei przełączamy klientów na katalog i usuwamy fasadę.</li>
<li>Dziwne zachowanie jest teraz widoczne i czeka na osobną decyzję.</li>
</ul>
<p class="ref">Warsztat: m5/s22</p>
</section>

<h2 id="174-wch%C5%82oni%C4%99cie-singletona">17.4. Wchłonięcie Singletona</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: ukryta zależność od stanu globalnego</span>
<span class="hljs-type">Money</span> <span class="hljs-variable">price</span> <span class="hljs-operator">=</span> PriceList.getInstance().basePrice(format);

<span class="hljs-comment">// po: jawna zależność; o „jednej instancji” decyduje korzeń kompozycji</span>
<span class="hljs-type">public</span> <span class="hljs-title function_">TicketDesk</span><span class="hljs-params">(Tariff tariff)</span> { <span class="hljs-built_in">this</span>.tariff = Objects.requireNonNull(tariff, <span class="hljs-string">&quot;tariff&quot;</span>); }
</code></pre>
<ul>
<li>Kroki (ang. Inline Singleton): parametr konstruktora (na początku z domyślną wartością <code>getInstance()</code>) → przełączanie klientów po jednym → tworzenie instancji w korzeniu kompozycji → usunięcie <code>getInstance()</code>.</li>
<li>Jeśli test musi zerować singleton między przypadkami, to znak, że stan globalny uzależnia testy od siebie.</li>
<li>Jeśli singleton był modyfikowalny, a staje się niezmienną wartością, to jest to <strong>zmiana kontraktu</strong>: przełączanie ustawień w trakcie działania przestaje działać. Ustal, czy ktoś z tego korzystał.</li>
</ul>
<p class="ref">Warsztat: m5/s17 (krok 3: przekazanie zależności zamiast dostępu globalnego)</p>
</section>

<h2 id="175-wzorzec-jako-decyzja-odwracalna">17.5. Wzorzec jako decyzja odwracalna</h2>
<ul>
<li>Rozliczenie z dystrybutorem miało dwa modele: procentowy oraz festiwalowy, pobierany z obcego systemu w groszach. Strategia z Adapterem były wtedy uzasadnione, bo istniały dwa rzeczywiste warianty i rzeczywista potrzeba tłumaczenia.</li>
<li>Gdy umowy festiwalowe wygasły, wzorzec stracił powód istnienia. Usuwamy wariant, adapter i interfejs. Zostaje prosta metoda, którą w razie potrzeby można rozbudować z powrotem tymi samymi krokami.</li>
<li>Usunięcie wariantu zmienia zachowanie (umowy <code>FESTIVAL</code> są teraz odrzucane), więc jest to osobny, wyraźnie nazwany krok.</li>
<li>Wniosek: wzorzec nie jest inwestycją na zawsze. Zostaje w kodzie tak długo, jak długo istnieją powody, które go uzasadniają.</li>
</ul>
<p class="ref">Warsztat: m5/s21</p>
</section>

<h2 id="183-lista-kontrolna">18.3. Lista kontrolna</h2>
<ul>
<li><strong>Decyzja:</strong> problem opisany bez nazwy wzorca; warianty istnieją już dziś; rozważono prostszą alternatywę, w tym usunięcie istniejącego wzorca.</li>
<li><strong>Kontrakt:</strong> testy obejmują każdą gałąź, <code>null</code>, wartość nieznaną i granice progów; zachowane są wyjątki, stan po błędzie i kolejność efektów.</li>
<li><strong>Kroki:</strong> jeden kontrakt naraz, automatyczne refaktoryzacje IDE wszędzie, gdzie to możliwe; użycia niewidoczne dla IDE (refleksja, konfiguracja) sprawdzone ręcznie.</li>
<li><strong>Granice:</strong> obcy model i surowe dane nie przechodzą do domeny; zmiana typu lub momentu błędu jest zatwierdzona osobno.</li>
<li><strong>Na koniec:</strong> stary warunek i elementy przejściowe usunięte; każda świadoma zmiana zachowania ma własny test i osobne zatwierdzenie.</li>
</ul>
</section>

<h2 id="184-najwa%C5%BCniejsze-wnioski">18.4. Najważniejsze wnioski</h2>
<ul>
<li>Refaktoryzacja do wzorca zaczyna się od <strong>kontraktu i osi zmienności</strong>, a nie od diagramu klas.</li>
<li>Bez siatki bezpieczeństwa nie ma refaktoryzacji: test charakteryzujący i test równoważności powstają przed pierwszym ruchem.</li>
<li>Podobne do siebie wzorce rozróżniamy dzięki prostym pytaniom: kto wybiera wariant i kiedy, ile elementów obsługuje żądanie, który model chronimy.</li>
<li>Wzorce na granicach (Adapter, obiekt graniczny, Fasada, warstwa antykorupcyjna) przesuwają wykrywanie błędów bliżej ich źródła. To świadoma zmiana kontraktu, a nie skutek uboczny.</li>
<li>Usuwanie zbędnych wzorców jest równie ważne jak ich wprowadzanie. Wzorzec zostaje tylko wtedy, gdy rozwiązuje <strong>rzeczywisty</strong> problem.</li>
</ul>
