<h1 id="modu%C5%82-3-zasady-dobrego-projektowania">Moduł 3. Zasady dobrego projektowania</h1>
<p>DRY, KISS, YAGNI, SOLID, spójność i sprzężenie, Clean Architecture oraz wzorce jako narzędzia oceny kosztu zmiany</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="agenda">Agenda</h2>
<ol>
<li>Jakość projektu w kontekście zmiany</li>
<li>DRY, KISS i YAGNI</li>
<li>Zasady SOLID w praktyce</li>
<li>Wysoka spójność i niskie sprzężenie</li>
<li>Clean Architecture i pokrewne podejścia inside/outside</li>
<li>Wzorce projektowe jako kierunek refaktoryzacji</li>
<li>Studium przypadku w Javie 25: wycena dostawy</li>
<li>Warsztat praktyczny, omówienie i listy kontrolne</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="dobry-projekt-nie-jest-cech%C4%85-absolutn%C4%85">Dobry projekt nie jest cechą absolutną</h2>
<ul>
<li>Projekt organizuje wiedzę, odpowiedzialności i zależności, a jego jakość ujawnia się przede wszystkim <strong>podczas zmiany</strong>.</li>
<li>Dobry projekt pozwala znaleźć właściwe miejsce modyfikacji, ogranicza promień oddziaływania i szybko daje wiarygodną informację zwrotną.</li>
<li>Ocena zależy od kontekstu: reguł domeny, rodzaju i częstotliwości zmian, krytyczności błędów, wymagań jakościowych, struktury zespołów i czasu życia rozwiązania.</li>
<li>Kod może być lokalnie elegancki, a mimo to utrudniać najczęstsze zmiany; kod proceduralny może poprawnie modelować mały, zamknięty problem.</li>
<li>Zasada projektowa ma pomóc <strong>postawić pytanie</strong>, a nie zakończyć analizę.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="zasady-s%C4%85-heurystykami">Zasady są heurystykami</h2>
<table>
<thead>
<tr>
<th>Zasada</th>
<th>Pytanie diagnostyczne</th>
<th>Ryzyko nadinterpretacji</th>
</tr>
</thead>
<tbody>
<tr>
<td>DRY</td>
<td>Gdzie jest autorytatywna reprezentacja wiedzy?</td>
<td>łączenie reguł, bo wyglądają podobnie</td>
</tr>
<tr>
<td>KISS</td>
<td>Czy jest mniej złożone poprawne rozwiązanie?</td>
<td>pomijanie przypadków, walidacji, błędów</td>
</tr>
<tr>
<td>YAGNI</td>
<td>Jakie aktualne wymaganie to uzasadnia?</td>
<td>zaniedbanie zdrowia kodu</td>
</tr>
<tr>
<td>SOLID</td>
<td>Jak podział ogranicza koszt konkretnej zmiany?</td>
<td>mechaniczne klasy i interfejsy</td>
</tr>
<tr>
<td>Clean Arch.</td>
<td>Czy polityka zależy od szczegółu technicznego?</td>
<td>kopiowanie szablonu warstw</td>
</tr>
<tr>
<td>wzorzec</td>
<td>Jaki problem i jakie siły równoważy?</td>
<td>katalog wzorców bez potrzeby</td>
</tr>
</tbody>
</table>
<p>Jeśli decyzji nie da się powiązać z wymaganiem, ryzykiem lub kierunkiem zmiany, sama nazwa zasady nie jest uzasadnieniem.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="projekt-obejmuje-wi%C4%99cej-ni%C5%BC-klasy">Projekt obejmuje więcej niż klasy</h2>
<ul>
<li>Na koszt zmiany wpływają też schematy danych, formaty komunikatów, granice transakcji oraz modele błędów i ponowień.</li>
<li>Liczą się również zależności wdrożeniowe, konfiguracja, proces budowania, publiczne API i zgodność danych historycznych.</li>
<li>Znaczenie mają kolejność operacji, wymagania czasowe oraz właściciele modułów i sposób współpracy zespołów.</li>
<li>Dodanie interfejsu nie naprawi niejasnej transakcji, a rozdzielenie klasy nie usunie sprzężenia przez wspólną tabelę.</li>
<li>Zmiana nazwy pakietu nie tworzy granicy, jeśli moduły nadal odwołują się do szczegółów infrastruktury.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="dow%C3%B3d-warto%C5%9Bci-zmiany-projektu">Dowód wartości zmiany projektu</h2>
<p>Przed refaktoryzacją opisz jeden lub dwa scenariusze zmiany:</p>
<ol>
<li>Co ma zostać zmienione i które pliki, moduły oraz zespoły trzeba dziś zaangażować?</li>
<li>Jakie ryzyka i testy uruchamia ta zmiana?</li>
<li>Jaki podział zmniejszy ten koszt i jaki <strong>nowy koszt</strong> wprowadzi proponowana abstrakcja?</li>
<li>Jak sprawdzimy, że cel został osiągnięty?</li>
</ol>
<p>Taki scenariusz jest lepszym uzasadnieniem niż stwierdzenie, że kod „nie jest wystarczająco zgodny z SOLID”.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="dry-dotyczy-wiedzy">DRY dotyczy wiedzy</h2>
<ul>
<li>DRY wymaga jednej, jednoznacznej i autorytatywnej reprezentacji danej porcji <strong>wiedzy</strong> - nie jest zakazem występowania podobnych linii.</li>
<li>Wiedzą jest np. reguła cenowa lub podatkowa, format komunikatu, sposób wyliczenia statusu, ograniczenie walidacyjne czy mapowanie pojęcia domenowego.</li>
<li>Wiedzą jest też konfiguracja wdrożenia oraz kontrakt, z którego generowane są inne artefakty.</li>
<li>Kluczowe pytanie: <strong>czy zmiana jednej decyzji wymaga znalezienia i zgodnej aktualizacji kilku miejsc?</strong></li>
<li>Jeśli tak - istnieje kandydat na duplikację wiedzy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="podobie%C5%84stwo-nie-wystarcza">Podobieństwo nie wystarcza</h2>
<table>
<thead>
<tr>
<th>Sytuacja</th>
<th>Ocena</th>
</tr>
</thead>
<tbody>
<tr>
<td>walidacja wieku i liczby produktów: <code>value &gt; 0</code></td>
<td>podobny kod, niezależna wiedza i właściciele</td>
</tr>
<tr>
<td>stawka opłaty paliwowej w dwóch wariantach usługi</td>
<td>jedna reguła - kandydat do centralizacji</td>
</tr>
<tr>
<td>dwa konteksty mają dziś rabat 10%</td>
<td>podobieństwo może być przypadkowe; ustal relację reguł</td>
</tr>
<tr>
<td>cache powiela dane źródłowe</td>
<td>kontrolowana duplikacja z właścicielem i synchronizacją</td>
</tr>
<tr>
<td>klient API i dokumentacja z jednego kontraktu</td>
<td>wiele artefaktów, jedno źródło wiedzy</td>
</tr>
</tbody>
</table>
<p>Wspólna metoda dla niezależnych reguł tworzy <strong>fałszywą zależność</strong> i wymusza nieuzasadnioną koordynację.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="fa%C5%82szywa-abstrakcja-i-dry-w-testach">Fałszywa abstrakcja i DRY w testach</h2>
<ul>
<li>Istniejącą fałszywą abstrakcję najpierw zabezpiecz testami, potem przenieś kod z powrotem do kontekstów i usuń zbędne gałęzie.</li>
<li>Dopiero wtedy wydziel wyłącznie potwierdzoną wspólną wiedzę - tymczasowe powtórzenie kodu bywa bezpiecznym etapem rozdzielania.</li>
<li>Testy mogą współdzielić czytelne fabryki danych i stabilne przygotowanie środowiska.</li>
<li>Test <strong>nie powinien</strong> liczyć oczekiwanej wartości tym samym algorytmem co produkcja, bo traci niezależną wyrocznię i powiela defekt.</li>
<li>Kilka jawnych wartości bywa tańsze niż ogólny kreator scenariuszy z wieloma flagami - czytelność przypadku to wymaganie testu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="kiss-prostota-po-poprawno%C5%9Bci">KISS: prostota po poprawności</h2>
<blockquote>
<p>Preferuj najmniej złożone rozwiązanie, które poprawnie realizuje aktualne wymagania i ograniczenia.</p>
</blockquote>
<ul>
<li>Prostota nie oznacza najmniejszej liczby linii ani klas, ani pierwszego rozwiązania, które udało się uruchomić.</li>
<li>Nie oznacza też technologii najlepiej znanej autorowi, braku abstrakcji ani pominięcia błędów, bezpieczeństwa, transakcji czy wydajności.</li>
<li>Rozdzielenie splątanych odpowiedzialności może zwiększyć liczbę plików, a jednocześnie zmniejszyć złożoność poznawczą i promień zmian.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="z%C5%82o%C5%BCono%C5%9B%C4%87-istotna-i-wprowadzona">Złożoność istotna i wprowadzona</h2>
<ul>
<li>Nie każdą złożoność można usunąć: reguły prawne, współbieżność, nieodwracalne efekty czy rozliczenia finansowe są naprawdę trudne.</li>
<li>KISS kieruje uwagę na złożoność <strong>wprowadzoną przez rozwiązanie</strong>, np. pośrednie warstwy bez odrębnej odpowiedzialności lub konfigurację zastępującą czytelny kod.</li>
<li>Przykłady nadmiaru: mechanizm pluginów bez rozszerzeń, generyczny silnik reguł dla dwóch przypadków, hierarchia typów bez kontraktu substytucji.</li>
<li>Ukryty przepływ sterowania oparty na refleksji lub globalnym rejestrze również jest złożonością wprowadzoną.</li>
<li>Gdy problem jest złożony, celem jest <strong>nazwanie i izolowanie trudności</strong>, a nie jej pozorne usunięcie.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="yagni-aktualna-potrzeba-przed-przewidywan%C4%85">YAGNI: aktualna potrzeba przed przewidywaną</h2>
<ul>
<li>YAGNI zaleca, by nie budować dziś zdolności potrzebnej wyłącznie dla przewidywanego wymagania - dotyczy to funkcji i spekulacyjnej elastyczności.</li>
<li>Typowe przykłady: parametry bez wariantu, fabryki tworzące jeden typ, interfejsy dla hipotetycznych implementacji, obsługa przyszłych formatów.</li>
<li>Do tej grupy należą też systemy pluginów, dynamiczne ładowanie oraz pola i metody, których nikt nie używa.</li>
<li>Przedwczesny element trzeba zaprojektować i przetestować, opóźnia aktualną wartość i podnosi bieżący koszt rozumienia.</li>
<li>Może też wymagać przebudowy, gdy rzeczywista potrzeba okaże się inna niż przewidywana.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="czego-yagni-nie-zabrania">Czego YAGNI nie zabrania</h2>
<ul>
<li>Nie uzasadnia pomijania refaktoryzacji upraszczającej aktualny kod ani rezygnacji z testów i ciągłej integracji.</li>
<li>Nie pozwala ignorować aktualnych wymagań bezpieczeństwa, zgodności, znanych limitów wydajności ani odkładać potwierdzonej migracji danych.</li>
<li>Nie usprawiedliwia usuwania kodu używanego przez refleksję, konfigurację lub zewnętrznych klientów bez sprawdzenia.</li>
<li>Ograniczony czasowo eksperyment techniczny może być aktualną potrzebą, jeśli rozwiązuje niewiadomą blokującą decyzję.</li>
<li>YAGNI działa, gdy system jest podatny na zmianę: testy, małe kroki i refaktoryzacja pozwalają bezpiecznie odraczać decyzje.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="napi%C4%99cia-mi%C4%99dzy-zasadami">Napięcia między zasadami</h2>
<table>
<thead>
<tr>
<th>Decyzja</th>
<th>DRY</th>
<th>KISS</th>
<th>YAGNI</th>
</tr>
</thead>
<tbody>
<tr>
<td>nazwanie potwierdzonej reguły opłaty</td>
<td>jedno źródło wiedzy</td>
<td>brak synchronizacji</td>
<td>aktualna reguła</td>
</tr>
<tr>
<td>ogólny silnik hipotetycznych taryf</td>
<td>brak korzyści</td>
<td>więcej pojęć i trybów</td>
<td>przewidywana elastyczność</td>
</tr>
<tr>
<td>podobne reguły niezależnych działów</td>
<td>brak wspólnej wiedzy</td>
<td>lokalność prostsza</td>
<td>brak spekulacji</td>
</tr>
<tr>
<td>wspólna biblioteka niezależnych usług</td>
<td>brak wspólnej wiedzy</td>
<td>droższa nawigacja</td>
<td>narusza, jeśli dla hipotetycznego współdzielenia</td>
</tr>
</tbody>
</table>
<p><strong>Reguła trzech</strong> pomaga poczekać na kształt abstrakcji, ale nie definiuje DRY: dwie kopie tej samej reguły mogą wymagać natychmiastowej centralizacji.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="filtr-decyzyjny-przed-dodaniem-abstrakcji">Filtr decyzyjny przed dodaniem abstrakcji</h2>
<ol>
<li>Jakie aktualne wymaganie lub ryzyko ją uzasadnia?</li>
<li>Jaką konkretną wiedzę reprezentują podobne miejsca?</li>
<li>Czy zmieniają się z tego samego powodu i na żądanie tego samego właściciela?</li>
<li>Czy abstrakcja ma nazwę w języku problemu?</li>
<li>Czy upraszcza aktualny przypadek, czy tylko przyszły scenariusz?</li>
<li>Ile nowych trybów, warunków i zależności wprowadza - i jak łatwo będzie ją zmienić lub usunąć?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="solid-jako-narz%C4%99dzie-analizy-zmian">SOLID jako narzędzie analizy zmian</h2>
<p>SOLID to zbiór heurystyk, a nie system punktowy ani nakaz maksymalizacji polimorfizmu.</p>
<table>
<thead>
<tr>
<th>Zasada</th>
<th>Główna troska</th>
</tr>
</thead>
<tbody>
<tr>
<td>SRP</td>
<td>grupowanie elementów zmieniających się dla tego samego aktora</td>
</tr>
<tr>
<td>OCP</td>
<td>ochrona stabilnej części przed wybraną osią rozszerzeń</td>
</tr>
<tr>
<td>LSP</td>
<td>zachowanie kontraktu przy podstawieniu implementacji</td>
</tr>
<tr>
<td>ISP</td>
<td>ograniczenie zależności klienta do potrzebnej roli</td>
</tr>
<tr>
<td>DIP</td>
<td>kierowanie zależności od szczegółów ku polityce i abstrakcjom</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="srp-jeden-aktor-zmiany">SRP: jeden aktor zmiany</h2>
<ul>
<li>„Jeden powód do zmiany” oznacza odpowiedzialność wobec <strong>aktora</strong> lub spójnej grupy interesariuszy, a nie każdą możliwą edycję pliku.</li>
<li>Serwis oferty może łączyć regułę ceny (finanse), zapis (zespół danych) i format wiadomości (komunikacja z klientem) - jeden przebieg, różne przyczyny zmian.</li>
<li>Przypadek użycia może te operacje koordynować, ale nie powinien przejmować szczegółów każdej polityki.</li>
<li>SRP nie oznacza jednej metody na klasę, limitu linii ani zakazu koordynacji; dotyczy metod, klas, pakietów i komponentów.</li>
<li>Pytania: kto żąda zmiany, co zmienia się razem, czy zmiana domenowa wymaga edycji infrastruktury, czy moduł jest polem konfliktu zespołów?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="ocp-zamkni%C4%99cie-dla-wybranej-osi">OCP: zamknięcie dla wybranej osi</h2>
<ul>
<li>OCP to możliwość rozszerzenia <strong>wybranego</strong> zachowania bez modyfikowania stabilnej części - nie da się zamknąć systemu na wszystkie zmiany.</li>
<li>Przykładowe osie: otwarty zbiór polityk wyceny lub adapterów, zamknięty zbiór stanów protokołu, stabilny algorytm z wymiennym źródłem danych.</li>
<li>Dodanie implementacji może nadal wymagać zmiany composition root, konfiguracji lub rejestru - OCP nie jest zakazem edycji plików.</li>
<li>Nie każdy <code>switch</code> narusza OCP: może jasno modelować mały, celowo zamknięty zbiór wariantów.</li>
<li>Polimorfizm się opłaca, gdy zbiór rozszerza się niezależnie, a centralne rozgałęzienia wymuszają powtarzalne modyfikacje.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="lsp-substytucja-behawioralna-12">LSP: substytucja behawioralna (1/2)</h2>
<ul>
<li>LSP dotyczy <strong>zachowania</strong>, a nie tylko zgodności sygnatur: klient typu bazowego musi móc użyć każdego podtypu bez wiedzy o implementacji.</li>
<li>Kontrakt obejmuje dopuszczalne wejście, gwarancje wyniku, inwarianty, obserwowalne wyjątki, efekty uboczne i protokół wywołań.</li>
<li>Obejmuje też mutowalność, kolejność, idempotencję czy bezpieczeństwo wątkowe - jeśli zostały obiecane.</li>
<li>Podtyp <strong>nie wzmacnia warunków wstępnych</strong> (przyjmuje co najmniej to, co typ bazowy) i <strong>nie osłabia warunków końcowych</strong> (może dać silniejszą gwarancję, nie słabszą).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="lsp-substytucja-behawioralna-22">LSP: substytucja behawioralna (2/2)</h2>
<ul>
<li>Kompilator Javy sprawdza część zgodności typów i wyjątków kontrolowanych, ale nie kontrakty domenowe, inwarianty ani znaczenie wyniku.</li>
<li>Test kontraktowy uruchamiany dla wszystkich implementacji dostarcza <strong>dowodów</strong> substytucyjności, lecz jej formalnie nie dowodzi.</li>
<li>Testuje wybrane przykłady, a nie całą przestrzeń stanów - jego zakres musi rosnąć razem z publicznymi gwarancjami.</li>
<li><code>UnsupportedOperationException</code> nie jest automatycznie naruszeniem LSP, bo niektóre interfejsy Javy jawnie opisują operacje opcjonalne.</li>
<li>Ocena zawsze zaczyna się od rzeczywistego kontraktu typu bazowego.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="isp-interfejs-z-perspektywy-klienta">ISP: interfejs z perspektywy klienta</h2>
<ul>
<li>Klient nie powinien zależeć od metod, których nie potrzebuje - interfejsy projektujemy według <strong>ról klientów</strong> i ich powodów zmian.</li>
<li>ISP nie wymaga jednej metody w interfejsie: jednometodowy port jest dobry, gdy reprezentuje jedną spójną rolę.</li>
<li>Szeroki interfejs też może być właściwy, jeśli jego operacje tworzą nierozdzielny kontrakt klienta.</li>
<li>Typowe naruszenie: ogólny <code>CrudRepository&lt;T&gt;</code> przekazany przypadkowi użycia, który potrzebuje jednej operacji.</li>
<li>Klient staje się wtedy źródłowo zależny od zapisu, usuwania i wyszukiwania, których wcale nie używa.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="dip-kierunek-zale%C5%BCno%C5%9Bci-nie-spos%C3%B3b-wstrzykiwania">DIP: kierunek zależności, nie sposób wstrzykiwania</h2>
<ul>
<li>DIP kieruje zależności źródłowe od szczegółów technicznych ku stabilniejszej polityce i abstrakcjom.</li>
<li>Moduł wysokiego poziomu nie powinien importować klienta bazy, biblioteki HTTP czy modelu frameworka, gdy potrzebuje jedynie informacji lub efektu.</li>
<li><strong>DIP ≠ dependency injection</strong>: wstrzyknięcie konkretnej klasy wciąż wiąże ze szczegółem, a DIP działa bez kontenera IoC.</li>
<li>Ręczne składanie grafu w composition root jest poprawne; <code>new</code> dla obiektów wartości i kolekcji nie narusza DIP; interfejs dla każdej klasy nie jest wymagany.</li>
<li>Port nazywa potrzeba klienta: przypadek użycia definiuje <code>QuoteRepository</code>, a adapter bazodanowy go implementuje.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="jak-zasady-solid-si%C4%99-uzupe%C5%82niaj%C4%85">Jak zasady SOLID się uzupełniają</h2>
<ul>
<li><strong>SRP</strong> pomaga znaleźć niezależne osie zmian, a <strong>OCP</strong> chroni wybraną oś przez stabilny kontrakt.</li>
<li><strong>LSP</strong> zapewnia, że nowe implementacje nie psują tego kontraktu.</li>
<li><strong>ISP</strong> ogranicza kontrakt do roli potrzebnej klientowi, a <strong>DIP</strong> ustawia zależności implementacji w stronę kontraktu i polityki.</li>
<li>Łatwość utworzenia mocka nie dowodzi zgodności z SOLID - wskazuje jedynie, że istnieje punkt podmiany.</li>
<li>Jakość granicy zależy od znaczenia kontraktu i kosztu zmian, a nie od samej obecności interfejsu.</li>
</ul>
</section>

<h2 id="b%C5%82%C4%99dne-uproszczenia-solid">Błędne uproszczenia SOLID</h2>
<table>
<thead>
<tr>
<th>Uproszczenie</th>
<th>Korekta</th>
</tr>
</thead>
<tbody>
<tr>
<td>SRP: klasa robi jedną rzecz</td>
<td>odpowiedzialność wynika z aktora i powodu zmiany</td>
</tr>
<tr>
<td>każdy <code>switch</code> łamie OCP</td>
<td>zamknięty zbiór wariantów może być poprawnym modelem</td>
</tr>
<tr>
<td>dziedziczenie gwarantuje LSP</td>
<td>potrzebna jest zgodność behawioralna</td>
</tr>
<tr>
<td>ISP: jedna metoda na interfejs</td>
<td>interfejs odpowiada spójnej roli klienta</td>
</tr>
<tr>
<td>DIP: konstruktor lub <code>@Autowired</code></td>
<td>chodzi o kierunek zależności źródłowej</td>
</tr>
<tr>
<td>interfejs dla każdej klasy</td>
<td>abstrakcja musi chronić znaczącą granicę lub zmienność</td>
</tr>
</tbody>
</table>
</section>

<h2 id="sp%C3%B3jno%C5%9B%C4%87">Spójność</h2>
<ul>
<li>Spójność opisuje, jak silnie elementy modułu - metody, klasy, pakietu, komponentu, usługi - współpracują na rzecz wspólnego celu.</li>
<li>Wysoko spójny moduł da się opisać jednym zdaniem domenowym, a jego elementy zmieniają się z tego samego powodu.</li>
<li>Elementy potrzebują podobnego kontekstu i danych, a testy skupiają się na jednym obszarze zachowania.</li>
<li>Nazwa wyjaśnia rolę bez ogólników typu <code>Manager</code> czy <code>Utils</code>.</li>
<li>Mała klasa nie musi być spójna, a duża może reprezentować bogaty, nierozdzielny koncept - liczba metod to sygnał, nie definicja.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="sprz%C4%99%C5%BCenie-i-dlaczego-nie-da-si%C4%99-go-usun%C4%85%C4%87">Sprzężenie i dlaczego nie da się go usunąć</h2>
<ul>
<li>Praktyczne pytanie: czy zmiana jednego modułu wymusza edycję, testy, wdrożenie lub koordynację drugiego?</li>
<li>Sprzężenie dotyczy importów, formatu i znaczenia danych, kolejności wywołań, czasu i dostępności, wspólnego stanu, technologii, wdrożeń i wiedzy zespołów.</li>
<li>Jedna zależność od niestabilnego, szerokiego kontraktu może kosztować więcej niż kilka zależności od małych, stabilnych pojęć.</li>
<li>Celem jest silne sprzężenie wewnątrz spójnej granicy, jawne kontrakty, zależności ku stabilnym pojęciom i brak cykli.</li>
<li><strong>Interfejs nie usuwa sprzężenia</strong> - zastępuje zależność od implementacji zależnością od kontraktu i przenosi wybór implementacji gdzie indziej.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="koszt-wydzielenia-i-ukrywana-decyzja">Koszt wydzielenia i ukrywana decyzja</h2>
<ul>
<li>Extract Class może zwiększyć spójność, ale dodaje współpracownika, wydłuża nawigację i tworzy nowy kontrakt.</li>
<li>Może też wymagać koordynacji cyklu życia obiektów lub rozdzielić dane, które muszą zmieniać się atomowo - porównuj koszt zmiany przed i po.</li>
<li>Dobry moduł ukrywa decyzję trudną lub prawdopodobnie zmienną, zamiast dzielić system tylko według etapów przetwarzania.</li>
<li>Warto izolować politykę cenową, sposób zapisu, format komunikatu, wybór algorytmu oraz szczegóły biblioteki lub protokołu.</li>
<li>Zmiana ukrytej decyzji powinna mieć lokalny zasięg: konsument zna operację i jej semantykę, a nie reprezentację szczegółu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="diagnostyka-sp%C3%B3jno%C5%9Bci-i-sprz%C4%99%C5%BCenia">Diagnostyka spójności i sprzężenia</h2>
<table>
<thead>
<tr>
<th>Pytanie</th>
<th>Sygnał problemu</th>
</tr>
</thead>
<tbody>
<tr>
<td>Ile miejsc zmienić dla jednej reguły?</td>
<td>rozproszona wiedza, shotgun surgery</td>
</tr>
<tr>
<td>Czy moduł ma kilku niezależnych właścicieli?</td>
<td>niska spójność odpowiedzialności</td>
</tr>
<tr>
<td>Czy typ frameworka trafia do domeny?</td>
<td>sprzężenie technologiczne przez granicę</td>
</tr>
<tr>
<td>Czy wywołania wymagają ukrytej kolejności?</td>
<td>sprzężenie protokołu lub czasu</td>
</tr>
<tr>
<td>Czy zmiana adaptera zmienia przypadek użycia?</td>
<td>zły kierunek zależności</td>
</tr>
<tr>
<td>Czy moduły importują się wzajemnie?</td>
<td>cykl blokujący niezależną zmianę</td>
</tr>
</tbody>
</table>
<p>Historia wspólnych zmian w repozytorium bywa dowodem sprzężenia, ale wymaga interpretacji (migracje, formatowanie, proces).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="clean-architecture-cel-i-regu%C5%82a-zale%C5%BCno%C5%9Bci">Clean Architecture: cel i reguła zależności</h2>
<ul>
<li>Clean Architecture organizuje granice i zależności tak, aby kod polityki biznesowej nie zależał od szczegółów technologicznych.</li>
<li><strong>Reguła zależności</strong>: zależności źródłowe przekraczające granicę wskazują w stronę polityki wyższego poziomu, a nie zewnętrznego mechanizmu.</li>
<li>Przypadek użycia nie importuje <code>ResultSet</code>, encji ORM, żądania HTTP ani modelu dostawcy wiadomości.</li>
<li>Adapter tłumaczy te typy na model wygodny dla wnętrza.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="kierunek-zale%C5%BCno%C5%9Bci-a-przep%C5%82yw-sterowania">Kierunek zależności a przepływ sterowania</h2>
<ol>
<li>Aplikacja definiuje port <code>QuoteRepository</code> potrzebny przypadkowi użycia.</li>
<li>Przypadek użycia wywołuje ten port.</li>
<li>Adapter bazodanowy implementuje port i importuje pakiet aplikacyjny.</li>
<li>Composition root tworzy adapter i przekazuje go do przypadku użycia.</li>
</ol>
<ul>
<li><strong>Sterowanie</strong> płynie od przypadku użycia do adaptera, a <strong>zależność źródłowa</strong> adaptera prowadzi do portu wewnętrznego.</li>
<li>To praktyczne zastosowanie DIP: wywołanie bazy w czasie wykonania nie wymaga źródłowej zależności od jej klas.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="kr%C4%99gi-nie-s%C4%85-obowi%C4%85zkowym-szablonem">Kręgi nie są obowiązkowym szablonem</h2>
<ul>
<li>Diagram z encjami, przypadkami użycia, adapterami i frameworkami jest schematem - system może mieć mniej lub więcej granic.</li>
<li>Istotne jest położenie polityki i kierunek zależności, a nie nazwy czterech folderów.</li>
<li>Architektura heksagonalna, Onion i Clean Architecture to rodzina podejść inside/outside, ale z różnymi pojęciami - nie są dokładnymi synonimami.</li>
<li>Clean Architecture nie wymaga mikroserwisów, DDD, rozbudowanego modelu obiektowego ani frameworka DI.</li>
<li>Może z powodzeniem działać wewnątrz modularnego monolitu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="elementy-praktyczne">Elementy praktyczne</h2>
<table>
<thead>
<tr>
<th>Element</th>
<th>Odpowiedzialność</th>
</tr>
</thead>
<tbody>
<tr>
<td>domena</td>
<td>stabilne pojęcia, inwarianty i reguły problemu</td>
</tr>
<tr>
<td>przypadek użycia</td>
<td>orkiestracja jednego celu użytkownika lub systemu</td>
</tr>
<tr>
<td>port wejściowy</td>
<td>opcjonalna stabilna granica wywołania przypadku użycia</td>
</tr>
<tr>
<td>port wyjściowy</td>
<td>potrzeba wnętrza wobec świata zewnętrznego</td>
</tr>
<tr>
<td>adapter wejściowy</td>
<td>mapowanie żądania na dane przypadku użycia</td>
</tr>
<tr>
<td>adapter wyjściowy</td>
<td>realizacja portu przez bazę, plik, HTTP, broker</td>
</tr>
<tr>
<td>composition root</td>
<td>wybór konkretów i składanie grafu zależności</td>
</tr>
</tbody>
</table>
<p>Port należy do strony formułującej potrzebę - nie jest odbiciem wszystkich możliwości bazy czy dostawcy.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="dane-na-granicy-i-composition-root">Dane na granicy i composition root</h2>
<ul>
<li>Wnętrze nie powinno przyjmować modelu wygodnego wyłącznie dla frameworka; granicę przekraczają proste rekordy, obiekty wartości, jawne argumenty i błędy kontraktu.</li>
<li>Mapowanie kosztuje, ale chroni wnętrze przed zmianą zewnętrznego schematu - osobny model ma sens, gdy granica oddziela różne semantyki lub tempo zmian.</li>
<li>Nie należy mechanicznie kopiować każdego obiektu tylko dla zasady.</li>
<li>Composition root zna porty i konkretne adaptery, wybiera implementacje i tworzy graf obiektów, ale <strong>nie zawiera reguł biznesowych</strong>.</li>
<li>Ręczne konstruktory to pełnoprawny composition root; kontener DI automatyzuje składanie, ale nie tworzy poprawnego kierunku zależności.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="koszty-i-ograniczenia-granic">Koszty i ograniczenia granic</h2>
<ul>
<li>Granice wprowadzają dodatkowe porty i modele, mapowanie, więcej plików, koszt nawigacji oraz testy kontraktowe i integracyjne.</li>
<li>Rośnie też złożoność konfiguracji composition root.</li>
<li>Mały CRUD, krótko żyjący prototyp czy stabilny skrypt mogą nie uzasadniać pełnego podziału.</li>
<li>Granica jest wartościowa, gdy chroni istotną politykę, rozdziela tempo zmian, umożliwia potrzebny test lub izoluje ryzykowny mechanizm.</li>
<li>Niezależność od bazy nie znaczy, że bazę wymienimy bez kosztu - adapter ogranicza propagację szczegółów, ale nie usuwa właściwości technologii.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="wzorzec-opisuje-decyzj%C4%99-w-kontek%C5%9Bcie">Wzorzec opisuje decyzję w kontekście</h2>
<ul>
<li>Wzorzec nazywa powtarzalny problem, kontekst, siły, strukturę rozwiązania i konsekwencje - nie jest kodem do skopiowania ani celem samym w sobie.</li>
<li>Przed użyciem trzeba znać występujący problem oraz aktualne warianty i właścicieli zmian.</li>
<li>Trzeba wiedzieć, jaki kontrakt wymaga stabilizacji i ile kosztuje dodatkowy poziom pośrednictwa.</li>
<li>Należy znać prostszą alternatywę oraz warunek, w którym wzorzec przestanie być potrzebny.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="refaktoryzacja-w-kierunku-wzorca">Refaktoryzacja w kierunku wzorca</h2>
<ol>
<li>Zabezpiecz obserwowalne zachowanie.</li>
<li>Nazwij konkretną oś zmienności.</li>
<li>Wykonaj małe refaktoryzacje odsłaniające role.</li>
<li>Wprowadź najwęższy potrzebny kontrakt.</li>
<li>Przenieś jeden wariant za granicę i uruchom testy zachowania oraz kontraktu.</li>
<li>Przenieś pozostałe warianty i <strong>zatrzymaj się</strong>, gdy aktualny problem jest rozwiązany.</li>
</ol>
<p>Wzorzec może wyłonić się z kolejnych transformacji - nie trzeba projektować jego najbardziej ogólnej postaci na starcie.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="strategy-i-adapter">Strategy i Adapter</h2>
<ul>
<li><strong>Strategy</strong> pasuje do rodziny wymiennych algorytmów o wspólnym kontrakcie; to, czy zbiór jest otwarty, czy zamknięty, to osobna decyzja OCP.</li>
<li>Czytelny <code>switch</code> bywa lepszy, gdy warianty są nieliczne, celowo zamknięte, zmieniają się razem, a logika jest lokalna.</li>
<li>W warsztacie <code>DeliveryPricePolicy</code> uzasadniają dwie istniejące polityki wyceny; mechanizmu pluginów nie ma, bo nie ma takiego wymagania.</li>
<li><strong>Adapter</strong> tłumaczy niezgodny interfejs lub model zewnętrzny na kontrakt klienta i ma sens na realnej granicy technologii lub semantyki.</li>
<li>Jego wartość to mapowanie formatów, tłumaczenie błędów, ukrycie protokołu, kontrola ponowień i czasu - nie puste przekazywanie wywołań 1:1.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:default;--style:section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="wzorzec-mo%C5%BCna-usun%C4%85%C4%87">Wzorzec można usunąć</h2>
<p>Refaktoryzacja <strong>od</strong> wzorca jest równie poprawna jak refaktoryzacja <strong>do</strong> wzorca, gdy warianty zniknęły lub zmienność okazała się inna.</p>
<p>Sygnały nadmiaru:</p>
<ul>
<li>jedna implementacja od długiego czasu lub interfejs powtarzający API jednej klasy,</li>
<li>fabryka zawierająca jeden konstruktor albo konfiguracja trudniejsza od jawnego <code>new</code>,</li>
<li>większość implementacji rzuca <code>UnsupportedOperationException</code>,</li>
<li>dodanie wariantu nadal wymaga zmian w wielu centralnych miejscach.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">DeliveryQuote</span> <span class="hljs-title function_">createQuote</span><span class="hljs-params">(String customerEmail,
        ShippingMethod method, Parcel parcel)</span> {
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">price</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">switch</span> (method) {
        <span class="hljs-keyword">case</span> STANDARD -&gt; { <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">base</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;10.00&quot;</span>)
                .add(parcel.weightKg().multiply(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;2.00&quot;</span>)));
            <span class="hljs-keyword">yield</span> money(base.add(base.multiply(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;0.08&quot;</span>)))); }
        <span class="hljs-keyword">case</span> EXPRESS -&gt; { <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">base</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;20.00&quot;</span>)
                .add(parcel.weightKg().multiply(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;3.00&quot;</span>)));
            <span class="hljs-keyword">yield</span> money(base.add(base.multiply(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;0.08&quot;</span>)))); }
    };
    <span class="hljs-type">DeliveryQuote</span> <span class="hljs-variable">quote</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">DeliveryQuote</span>(customerEmail, method, parcel, price);
    storedQuotes.add(quote);
    System.out.printf(<span class="hljs-string">&quot;Quote ready for %s: %s costs %s%n&quot;</span>,
            customerEmail, method, price);
    <span class="hljs-keyword">return</span> quote;

<p><code>LegacyDeliveryQuoteService</code> liczy cenę, zapisuje ofertę we własnej kolekcji, wypisuje powiadomienie i zwraca wynik.</p>

<h2 id="co-naprawd%C4%99-jest-problemem">Co naprawdę jest problemem</h2>
<p>Sam <code>switch</code> nie jest głównym problemem - kłopotem są niezależne decyzje zebrane w jednym miejscu.</p>
<table>
<thead>
<tr>
<th>Obserwacja</th>
<th>Konsekwencja</th>
</tr>
</thead>
<tbody>
<tr>
<td>stawka <code>0.08</code> w obu gałęziach</td>
<td>jedna reguła, dwie reprezentacje</td>
</tr>
<tr>
<td>polityki cenowe wewnątrz serwisu</td>
<td>zmiana wariantu modyfikuje koordynację</td>
</tr>
<tr>
<td>zapis w kolekcji serwisu</td>
<td>przypadek użycia zna mechanizm przechowywania</td>
</tr>
<tr>
<td>bezpośredni <code>System.out</code></td>
<td>zmiana kanału wymaga edycji serwisu</td>
</tr>
<tr>
<td>różni właściciele zmian</td>
<td>niska spójność klasy</td>
</tr>
<tr>
<td>ukryta kolejność zapis → powiadomienie</td>
<td>protokół wymaga kontraktu i testu</td>
</tr>
</tbody>
</table>
</section>

<h2 id="model-i-inwarianty-domeny">Model i inwarianty domeny</h2>
<ul>
<li>Rekordy <code>Parcel</code> i <code>DeliveryQuote</code> pilnują inwariantów: dodatnia masa, niepusty e-mail, nieujemna cena o skali dokładnie 2.</li>
<li>Cena w konstruktorze wyniku nie jest niejawnie zaokrąglana (<code>RoundingMode.UNNECESSARY</code>) - błędna skala zostaje wykryta, a nie ukryta.</li>
<li><code>record</code> ogranicza kod techniczny, ale znaczenie modelu nadal wynika z nazw i reguł konstruktora.</li>
<li><code>BigDecimal</code> tworzony z tekstu unika przybliżeń binarnych typu <code>double</code>; walidacja e-maila celowo ogranicza się do niepustości.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="dry-zastosowane-do-regu%C5%82y-op%C5%82aty">DRY zastosowane do reguły opłaty</h2>
<ul>
<li>Powtarzającą się decyzję - stawkę i sposób doliczenia opłaty paliwowej - nazwano <code>FuelSurcharge</code> z jednym właścicielem.</li>
<li>Nie wydzielono wspólnej <code>basePrice(base, rate, weight)</code>: formuły są podobne, ale to <strong>odrębne cenniki</strong>, które mogą zmieniać się niezależnie.</li>
<li>Inwariant stawki 0-1 (0-100%) jest jawną decyzją modelową, a nie cechą typu <code>BigDecimal</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">BigDecimal</span> <span class="hljs-title function_">addTo</span><span class="hljs-params">(BigDecimal baseAmount)</span> {
    <span class="hljs-keyword">return</span> baseAmount.add(baseAmount.multiply(rate))
            .setScale(<span class="hljs-number">2</span>, RoundingMode.HALF_UP);
}
</code></pre>
</section>

<h2 id="strategy-dla-istniej%C4%85cych-wariant%C3%B3w">Strategy dla istniejących wariantów</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DeliveryPricePolicy</span> {
    <span class="hljs-comment">/** Stable, non-null shipping method handled by this policy. */</span>
    <span class="hljs-type">ShippingMethod</span> <span class="hljs-title function_">method</span><span class="hljs-params">()</span>;

    <span class="hljs-comment">/** Deterministic, non-negative amount with scale two for every
     *  valid parcel, without changing the parcel or side effects. */</span>
    <span class="hljs-type">BigDecimal</span> <span class="hljs-title function_">priceFor</span><span class="hljs-params">(Parcel parcel)</span>;
}
</code></pre>
<ul>
<li>Kontrakt dokumentuje gwarancje, których same typy nie wyrażają: stabilna metoda, determinizm, nieujemność, skala 2, brak efektów ubocznych.</li>
<li><code>StandardDeliveryPricePolicy</code> i <code>ExpressDeliveryPricePolicy</code> mają własne stałe cennika i współdzielą tylko <code>FuelSurcharge</code>.</li>
<li>Strategy ma potwierdzone uzasadnienie: dwa istniejące algorytmy, wspólny kontrakt, wybór według metody dostawy - bez pluginów i dynamicznego odkrywania.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="%C5%9Bwiadomy-zakres-ocp-i-wyb%C3%B3r-polityki">Świadomy zakres OCP i wybór polityki</h2>
<ul>
<li><code>ShippingMethod</code> pozostaje enumem, więc nowa metoda dostawy wymaga zmiany enuma i composition root - zamknięta jest logika wyboru, nie cały system.</li>
<li><code>DeliveryPriceCalculator</code> indeksuje strategie raz w konstruktorze (<code>EnumMap</code>) i odrzuca pustą lub zduplikowaną konfigurację.</li>
<li><code>Map.copyOf</code> daje niemodyfikowalną kopię, więc późniejsza zmiana przekazanej kolekcji nie wpływa na kalkulator.</li>
<li>Brak polityki wykrywany jest przy żądaniu; alternatywą jest wymaganie kompletu metod w konstruktorze - zależy, czy częściowa konfiguracja jest legalna.</li>
<li>Przypadek użycia zależy od konkretnego kalkulatora bez interfejsu, bo brak drugiej sensownej implementacji - <strong>DIP nie wymaga interfejsu przed każdą klasą</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="test-kontraktowy-i-lsp">Test kontraktowy i LSP</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@ParameterizedTest(name = &quot;{0}&quot;)</span>
<span class="hljs-meta">@MethodSource(&quot;policies&quot;)</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">everyPolicyObeysTheSubstitutionContract</span><span class="hljs-params">(String description,
        ShippingMethod expectedMethod, DeliveryPricePolicy policy)</span> {
    <span class="hljs-type">Parcel</span> <span class="hljs-variable">parcel</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Parcel</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;100.00&quot;</span>));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">first</span> <span class="hljs-operator">=</span> policy.priceFor(parcel);
    assertAll(
        () -&gt; assertEquals(expectedMethod, policy.method()),
        () -&gt; assertTrue(first.signum() &gt;= <span class="hljs-number">0</span>),
        () -&gt; assertEquals(<span class="hljs-number">2</span>, first.scale()),
        () -&gt; assertEquals(first, policy.priceFor(parcel)));
}
</code></pre>
<ul>
<li>Każda strategia przechodzi ten sam zestaw sprawdzeń jawnych gwarancji kontraktu.</li>
<li>Test <strong>nie dowodzi</strong> LSP dla wszystkich stanów - nie sprawdza np. maksymalnej masy, każdego zaokrąglenia ani wydajności.</li>
</ul>
</section>

<h2 id="porty-definiowane-przez-potrzeby-przypadku-u%C5%BCycia">Porty definiowane przez potrzeby przypadku użycia</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@FunctionalInterface</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">QuoteRepository</span> { <span class="hljs-type">void</span> <span class="hljs-title function_">save</span><span class="hljs-params">(DeliveryQuote quote)</span>; }

</code></pre>
<ul>
<li>Przypadek użycia potrzebuje dwóch odrębnych ról - stąd dwa wąskie porty, a nie mechaniczne zastosowanie ISP.</li>
<li>Gdyby jedna spójna operacja wymagała odczytu i zapisu w jednym kontrakcie, dwie metody w porcie byłyby właściwe.</li>
<li><code>QuoteRepository</code> nie dziedziczy <code>CrudRepository</code>, więc wnętrze nie zależy od usuwania, stronicowania i wyszukiwania.</li>
<li>Nazwa portu opisuje potrzebę wnętrza, a nie technologię adaptera.</li>
</ul>

<h2 id="przypadek-u%C5%BCycia-jako-jawna-orkiestracja">Przypadek użycia jako jawna orkiestracja</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">DeliveryQuote</span> <span class="hljs-title function_">execute</span><span class="hljs-params">(Command command)</span> {

            priceCalculator.priceFor(command.method(), command.parcel()));
    repository.save(quote);
    notifier.quoteCreated(quote);
    <span class="hljs-keyword">return</span> quote;

<ul>
<li><code>CreateDeliveryQuote</code> ma wysoką spójność celu: koordynuje jedną wycenę, bez wzoru ceny, kodu zapisu i formatowania komunikatu.</li>
<li>Zależności wstrzykiwane są ręcznie przez konstruktor.</li>
</ul>

<h2 id="protok%C3%B3%C5%82-efekt%C3%B3w-i-test-przypadku-u%C5%BCycia">Protokół efektów i test przypadku użycia</h2>
<ul>
<li>Kolejność <code>save</code> → <code>quoteCreated</code> to <strong>decyzja protokołu</strong>: przy wyjątku zapisu powiadomienie nie jest wysyłane - musi to wynikać z wymagania biznesowego.</li>
<li>W systemie rozproszonym kolejność nie gwarantuje atomowości; może być potrzebna strategia ponowień, idempotencja lub transactional outbox (poza zakresem przykładu).</li>
<li>Test dokumentuje przebieg udany i zachowanie przy błędzie: <code>doesNotNotifyWhenSavingFails</code>.</li>
<li>Lambdy w teście (<code>savedQuotes::add</code>) to proste implementacje portów - nie udają bazy ani dostawcy wiadomości.</li>
<li>Test weryfikuje politykę przypadku użycia; rzeczywiste adaptery potrzebują osobnych testów integracyjnych.</li>
</ul>
</section>

<h2 id="adaptery-na-zewn%C4%99trznej-stronie-granicy">Adaptery na zewnętrznej stronie granicy</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ConsoleQuoteNotifier</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">QuoteNotifier</span> {

<h2 id="warsztat-praktyczny---zasady-pracy">Warsztat praktyczny - zasady pracy</h2>
<ul>
<li>Ćwiczenia korzystają z kodu w <code>pl.training.module3</code>; przed startem uruchom <code>mvn clean verify</code>.</li>
<li>Po każdym małym kroku uruchom odpowiedni test, a przed zakończeniem pełne <code>mvn verify</code>.</li>
<li>Nie zmieniaj jednocześnie zachowania biznesowego i struktury, chyba że zadanie wyraźnie tego wymaga.</li>
<li>Po każdym kroku notuj, którą oś zmiany chroni konstrukcja i jaki koszt dodaje.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="65" data-size="16:9">
<h2 id="%C4%87wiczenie-1-dry-kiss-i-yagni-20--10-min">Ćwiczenie 1: DRY, KISS i YAGNI (20 + 10 min)</h2>
<p>Dla każdej sytuacji zdecyduj: <strong>scalić teraz, zostawić lokalnie czy zebrać więcej informacji?</strong></p>
<ol>
<li>STANDARD i EXPRESS mają tę samą stawkę paliwową 8% i identyczne zaokrąglenie.</li>
<li><code>MaximumParcelWeight</code> i <code>MaximumWarehouseLoad</code> w niezależnych kontekstach wynoszą dziś 1000 kg.</li>
<li>Testy STANDARD i EXPRESS zawierają jawną oczekiwaną cenę dla 3 kg.</li>
<li>Zespół proponuje refleksyjny system pluginów, bo „za rok” mogą pojawić się taryfy partnerów.</li>
<li>Zatwierdzono trzecią metodę dostawy za trzy tygodnie; cache wycen powiela dane dla zmierzonego limitu czasu.</li>
</ol>
<p>Zapisz wiedzę, właściciela, wymaganie, najprostsze rozwiązanie, koszt błędu i sygnał ponownej oceny. Oceń, czy potrzebny jest interfejs <code>Surcharge</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="%C4%87wiczenie-2-solid-jako-seria-bezpiecznych-zmian-25--10-min">Ćwiczenie 2: SOLID jako seria bezpiecznych zmian (25 + 10 min)</h2>
<ul>
<li>Refaktoryzuj <code>LegacyDeliveryQuoteService</code>: wskaż aktorów zmiany i ustal z właścicielem procesu, czy po nieudanym zapisie wolno powiadomić.</li>
<li>Wydziel <code>FuelSurcharge</code> bez łączenia cenników, potem kontrakt polityki - przenieś jeden wariant i uruchom testy przed drugim.</li>
<li>Dodaj test kontraktowy dla każdej polityki, wydziel porty zapisu i powiadamiania, dopisz test awarii zapisu.</li>
<li>Przenieś efekty do adapterów, złóż rozwiązanie ręcznie i porównaj wynik przed i po.</li>
<li>Uzupełnij macierz kontraktu LSP (metoda, wejście, wynik, zaokrąglenie, determinizm, efekty, wyjątki).</li>
<li>Kryteria: ceny <code>17.28</code> / <code>31.32</code> dla 3 kg, brak importu adapterów w przypadku użycia, zielone <code>mvn verify</code>.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-3-granica-i-regu%C5%82a-zale%C5%BCno%C5%9Bci-25--10-min">Ćwiczenie 3: granica i reguła zależności (25 + 10 min)</h2>
<ul>
<li><strong>A.</strong> Oceń jako dozwoloną, podejrzaną lub niedozwoloną m.in.: <code>domain</code> → <code>BigDecimal</code>, <code>application</code> → <code>InMemoryQuoteRepository</code>, <code>domain</code> → encja ORM, port zwracający wyjątek JDBC.</li>
<li><strong>B.</strong> Dodaj <code>BufferingQuoteNotifier</code> implementujący istniejący <code>QuoteNotifier</code>, z niemodyfikowalnym widokiem komunikatów i własnym testem.</li>
<li>Podmień adapter <strong>wyłącznie w composition root</strong> - bez frameworka DI i bez plików konfiguracyjnych.</li>
<li><strong>C.</strong> Zaproponuj kontrolę zakazującą importu <code>adapter</code> w <code>application</code>/<code>domain</code>: test architektury, moduły Maven, JPMS lub kontrola w CI.</li>
<li>Porównaj siłę gwarancji, koszt utrzymania i jakość komunikatu błędu; narysuj osobno zależność źródłową i wywołanie w czasie wykonania.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-4-wzorzec-jako-decyzja-odwracalna-20--10-min">Ćwiczenie 4: wzorzec jako decyzja odwracalna (20 + 10 min)</h2>
<ul>
<li><strong>Scenariusz 1 - SAME_DAY:</strong> cena pochodzi z klienta przewoźnika (masa w gramach jako <code>long</code>, kwota w najmniejszych jednostkach bez waluty, własny typ błędu, operacja sieciowa).</li>
<li>Odpowiedz: kolejna <code>DeliveryPricePolicy</code>, adapter czy współpraca obu ról? Gdzie konwersja jednostek, jaki błąd przekracza granicę, gdzie timeout i ponowienia?</li>
<li>Nie dopasowuj klienta na siłę do kontraktu, którego obietnic nie spełnia.</li>
<li><strong>Scenariusz 2 - uproszczenie:</strong> EXPRESS zniknął, STANDARD jest jedyną regułą - czy <code>DeliveryPricePolicy</code> i rejestr wciąż chronią realną zmienność?</li>
<li>Upraszczaj tylko, gdy koszt abstrakcji przewyższa koszt prawdopodobnej zmiany; zielone testy umożliwiają refaktoryzację od wzorca.</li>
</ul>
</section>

<h2 id="om%C3%B3wienie-%C4%87wiczenia-4">Omówienie ćwiczenia 4</h2>
<ul>
<li>SAME_DAY nie powinien automatycznie implementować <code>DeliveryPricePolicy</code> - kontrakt obiecuje determinizm bez efektów, a klient sieciowy tego nie spełnia (naruszenie LSP).</li>
<li>Przypadek użycia definiuje port wyceny zewnętrznej z jawną semantyką błędu; adapter konwertuje jednostki, np. <code>movePointRight(3).longValueExact()</code>.</li>
<li>Kwota w najmniejszych jednostkach wymaga waluty i wykładnika; adapter odrzuca nieoczekiwaną walutę i tłumaczy błędy SDK - typy SDK nie trafiają do wnętrza.</li>
<li>Timeout należy do adaptera, a ponowienia wymagają analizy idempotencji; nazwanie wszystkiego <code>Strategy</code> nie usuwa różnicy semantycznej.</li>
<li>Po usunięciu EXPRESS można zwinąć strategię do jednego kalkulatora, zachowując testy ceny - ale <strong>porty zapisu i powiadomień zostają</strong>, bo chronią inne decyzje.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="sprawdzenie-wiedzy">Sprawdzenie wiedzy</h2>
<ul>
<li>Co jest przedmiotem DRY - tekst czy wiedza? Kiedy identycznych funkcji nie łączyć?</li>
<li>Dlaczego prostsze rozwiązanie nie zawsze ma mniej klas? Czy YAGNI zabrania testów?</li>
<li>Jak SRP definiuje powód zmiany? Czy każdy <code>switch</code> narusza OCP? Jakie warunki są kluczowe dla LSP?</li>
<li>Dlaczego <code>@Autowired</code> nie dowodzi DIP? Czy interfejs jednometodowy jest automatycznie zgodny z ISP?</li>
<li>Co interfejs robi ze sprzężeniem? Gdzie należy port wyjściowy? Czy Clean Architecture wymaga czterech warstw?</li>
<li>Kiedy Strategy jest gorsza od <code>switch</code>? Dlaczego test kontraktowy nie dowodzi LSP? Kiedy usunąć wzorzec?</li>
</ul>
</section>

<h2 id="listy-kontrolne-12">Listy kontrolne (1/2)</h2>
<p><strong>Przed wydzieleniem abstrakcji:</strong> potrafię nazwać reprezentowaną wiedzę, znam aktualne wymaganie, właściciela zmian, prostsze rozwiązanie lokalne i sygnał ponownej oceny.</p>
<p><strong>Przed zastosowaniem SOLID:</strong> SRP odnoszę do aktorów, dla OCP nazwałem oś rozszerzeń, kontrakt opisuje zachowanie dla LSP i jest sprawdzany testami kontraktowymi.</p>
<ul>
<li>Interfejs odpowiada roli klienta i należy do strony formułującej potrzebę.</li>
<li>Importy prowadzą ku polityce, a interfejs nie powstaje tylko dlatego, że istnieje klasa.</li>
</ul>
</section>

<h2 id="listy-kontrolne-22">Listy kontrolne (2/2)</h2>
<p><strong>Przed granicą architektoniczną:</strong> granica oddziela znaczenie, tempo zmian lub ryzyko; wnętrze nie importuje typów frameworka; błędy są tłumaczone; regułę zależności da się sprawdzić automatycznie.</p>
<p><strong>Przed zastosowaniem wzorca:</strong> opiszę problem bez nazwy wzorca, wariant istnieje dziś, znam prostszą alternatywę i wiem, kiedy wzorzec uprościć.</p>
<p><strong>Przed zakończeniem refaktoryzacji:</strong></p>
<ul>
<li>zachowanie z testów niezmienione, nowe kontrakty mają opisane gwarancje,</li>
<li>brak starej i nowej reprezentacji tej samej wiedzy oraz funkcji „na przyszłość”,</li>
<li>brak nowych cykli, zachowana semantyka błędów, pełny build na Javie 25 przechodzi.</li>
</ul>
</section>

<h2 id="podsumowanie---najwa%C5%BCniejsze-wnioski">Podsumowanie - najważniejsze wnioski</h2>
<ul>
<li><strong>DRY, KISS i YAGNI</strong> równoważą centralizację wiedzy, prostotę i odraczanie spekulacji - żadna nie działa przez mechaniczne liczenie linii, klas czy interfejsów.</li>
<li><strong>SOLID</strong> pomaga analizować aktorów zmian, osie rozszerzeń, kontrakty substytucji, role klientów i kierunek zależności; wartość ma tylko wtedy, gdy obniża koszt konkretnej zmiany.</li>
<li><strong>Spójność i sprzężenie</strong>: interfejs zastępuje jedno sprzężenie innym i ma sens, gdy nowy kontrakt jest stabilniejszy i należy do właściwej strony.</li>
<li><strong>Clean Architecture</strong> chroni politykę przez kierowanie zależności do wnętrza; porty, adaptery i composition root są użyteczne tylko przy realnych decyzjach i ryzykach.</li>
<li><strong>Wzorzec</strong> to możliwy kierunek serii refaktoryzacji: najpierw chroń zachowanie, potem wprowadź najwęższe rozwiązanie i bądź gotów je uprościć.</li>
</ul>
</section>
