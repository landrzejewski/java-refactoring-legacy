<h2 id="co-ma-pozosta%C4%87-niezmienione">Co ma pozostać niezmienione</h2>
<ul>
<li>Refaktoryzacja zmienia strukturę kodu <strong>bez zmiany ustalonego, obserwowalnego zachowania</strong> - ale zakres obserwacji zależy od systemu.</li>
<li>W aplikacji wdrażanej atomowo można zmienić wewnętrzną sygnaturę i jednocześnie zaktualizować wszystkich kontrolowanych klientów.</li>
<li>Dla publicznej biblioteki kontrakt obejmuje dodatkowo m.in.: kompatybilność źródłową i binarną, nazwy używane przez refleksję, format serializacji, nazwy w konfiguracji i skryptach.</li>
<li>Częścią kontraktu mogą być też kolejność wyjątków i efektów ubocznych, blokady, transakcje, proxy, a nawet wydajność.</li>
<li>Zielony test jednostkowy <strong>nie dowodzi</strong> kompatybilności binarnej ani integracji z frameworkiem - test musi działać na poziomie, na którym istnieje ryzyko.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="refaktoryzacja-a-zmiana-kontraktu">Refaktoryzacja a zmiana kontraktu</h2>
<ul>
<li>Niektóre wartościowe zmiany <strong>nie są</strong> czysto strukturalne: dodanie walidacji, zmiana publicznego pola na prywatne bez migracji klientów, zmiana typu wyjątku.</li>
<li>Zastąpienie żywej kolekcji niemodyfikowalną migawką albo wykonanie kopii defensywnej zmienia to, co widzą klienci.</li>
<li>Zmiana kolejności lub miejsca zaokrąglenia, usunięcie publicznej metody po przeniesieniu czy zmiana nazwy w formacie danych to zmiany zachowania.</li>
<li><strong>Wniosek:</strong> najpierw przenieś strukturę z zachowaniem starego kontraktu, a dopiero potem wykonaj świadomą zmianę zachowania z osobnym wymaganiem i testem.</li>
</ul>
</section>

<h2 id="p%C4%99tla-robocza-i-punkt-zatrzymania">Pętla robocza i punkt zatrzymania</h2>
<ul>
<li><strong>Pętla:</strong> wybierz jedną obserwowalną właściwość → potwierdź, że test wykrywa kontrolowaną zmianę → jedna transformacja → kompilacja → najwęższy wiarygodny test → mały commit.</li>
<li>Okresowo uruchamiaj pełny build i testy integracyjne, bo test lokalny nie widzi wszystkich ryzyk.</li>
<li>IDE poprawnie przepisuje składnię i odwołania ze swojego modelu programu, ale nie zna kontraktów zewnętrznych, ciągów tekstowych ani wymagań biznesowych.</li>
<li>Seria refaktoryzacji potrzebuje <strong>konkretnego celu</strong>: nazwania reguły, umożliwienia testu, przeniesienia odpowiedzialności, ograniczenia mutacji lub przygotowania zmiany funkcjonalnej.</li>
<li>Extract i Inline zmieniają poziom pośrednictwa w przeciwnych kierunkach - właściwy poziom zależy od kontekstu.</li>
</ul>
</section>

<h2 id="rename---cel">Rename - cel</h2>
<p>Rename zmienia nazwę tak, aby opisywała <strong>rolę w kontekście</strong>, a nie typ techniczny ani bieżącą implementację.</p>
<table>
<thead>
<tr>
<th>Słaba nazwa</th>
<th>Lepszy kierunek</th>
<th>Uzasadnienie</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>d</code></td>
<td><code>discount</code> / <code>deliveryDate</code></td>
<td>znaczenie z domeny, nie z litery</td>
</tr>
<tr>
<td><code>data</code></td>
<td><code>approvedPriceBreakdown</code></td>
<td>określa zawartość i stan</td>
</tr>
<tr>
<td><code>process()</code></td>
<td><code>createRentalQuote()</code></td>
<td>operacja komunikuje rezultat</td>
</tr>
<tr>
<td><code>manager</code></td>
<td>konkretna odpowiedzialność</td>
<td>ogólna rola ukrywa powód zmiany</td>
</tr>
<tr>
<td><code>list</code></td>
<td><code>dailyRates</code></td>
<td>kolekcja nazwana wg zawartości</td>
</tr>
</tbody>
</table>
</section>

<h2 id="rename---bezpieczna-mechanika-i-granice-automatyzacji">Rename - bezpieczna mechanika i granice automatyzacji</h2>
<ul>
<li>Ustal znaczenie elementu i zasięg kontraktu nazwy, wyszukaj użycia <strong>typowane i tekstowe</strong>, a dla symbolu lokalnego użyj automatycznego Rename z podglądem.</li>
<li>Skompiluj cały moduł i uruchom testy integracji zależne od nazwy; dla publicznego API rozważ starą metodę delegującą oznaczoną jako przestarzała.</li>
<li>Nazwa żyje też poza Javą: <code>getDeclaredMethod</code>, konfiguracja frameworka, JSON/XML/CSV, SQL i ORM, szablony, metryki, dane serializowane, niezależni klienci.</li>
<li>Zmiana nazwy publicznej metody może skończyć się błędem linkowania u klienta, a zmiana nazwy pola - zmianą refleksji i serializacji. Wtedy potrzebna jest <strong>strategia migracji</strong>, nie tylko operacja IDE.</li>
<li>Trudność z nazwaniem metody często sygnalizuje kilka odpowiedzialności i potrzebę Extract Method lub Extract Class.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="extract-method---cel-i-sygna%C5%82y">Extract Method - cel i sygnały</h2>
<ul>
<li>Extract Method przenosi spójny fragment do nazwanej metody, gdy nazwa wyrazi intencję lepiej niż szczegóły lub fragment jest samodzielną odpowiedzialnością.</li>
<li>Sygnały: komentarz opisuje cel bloku, metoda miesza poziomy abstrakcji, ta sama wiedza powtarza się w kilku miejscach.</li>
<li>Kolejne sygnały: predykat ma nazwę domenową, osobny test fragmentu istotnie zmniejszy ryzyko, a przeniesienie odpowiedzialności wymaga jej odseparowania.</li>
<li><strong>Długość nie jest wystarczającym kryterium</strong> - krótki predykat może zasługiwać na nazwę, a długa liniowa transformacja bywa czytelna jako całość.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="extract-method---analiza-przep%C5%82ywu-danych">Extract Method - analiza przepływu danych</h2>
<table>
<thead>
<tr>
<th>Sytuacja</th>
<th>Typowe rozwiązanie</th>
</tr>
</thead>
<tbody>
<tr>
<td>wartość tylko odczytywana</td>
<td>parametr lub spójny obiekt</td>
</tr>
<tr>
<td>wartość powstaje we fragmencie i jest używana później</td>
<td>wartość zwracana</td>
</tr>
<tr>
<td>modyfikowany jeden obiekt</td>
<td>jawna operacja, jeśli mutacja należy do kontraktu</td>
</tr>
<tr>
<td>modyfikowanych kilka wartości lokalnych</td>
<td>podziel fragment lub obiekt wyniku</td>
</tr>
<tr>
<td>używa wielu pól innego obiektu</td>
<td>możliwy sygnał Move Method</td>
</tr>
<tr>
<td>lista parametrów nadmiernie rośnie</td>
<td>zła granica lub brak spójnego pojęcia</td>
</tr>
</tbody>
</table>
<p>Przekazanie całego obiektu „na wszelki wypadek” ukrywa zależności, a rozbicie go na kilkanaście prymitywów zwiększa sprzężenie - zachowaj granicę semantyczną.</p>
</section>

<h2 id="extract-method---mechanika-i-trudne-przypadki">Extract Method - mechanika i trudne przypadki</h2>
<ul>
<li><strong>Mechanika:</strong> najmniejszy spójny fragment → nazwa rezultatu → parametry i wynik → kopia bez upraszczania → wywołanie → test → dopiero potem poprawa nowej metody.</li>
<li>Szczególnej analizy wymagają <code>return</code>, <code>break</code>, <code>continue</code> i etykiety przekraczające granicę fragmentu oraz modyfikacja kilku zmiennych lokalnych.</li>
<li>Ryzykowne są też <code>try-with-resources</code>, zasięg <code>catch</code>/<code>finally</code>, wyjątki kontrolowane w <code>throws</code> i sekcje <code>synchronized</code>.</li>
<li>Uwaga na <code>this</code>, <code>super</code>, metody przesłaniane, zmienne przechwytywane przez lambdy, generyki i przeciążenia oraz efekty ukryte w getterach.</li>
<li>Wydzielenie nie może przesunąć efektu przed warunek, zmienić liczby wywołań ani wydłużyć czasu trzymania zasobu lub blokady.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="extract-variable">Extract Variable</h2>
<ul>
<li>Extract Variable zapisuje wynik wyrażenia w nazwanej zmiennej lokalnej - rozdziela etapy obliczenia, nazywa pojęcie i ułatwia debugowanie.</li>
<li>Dobra zmienna wyjaśniająca nazywa <strong>znaczenie, nie składnię</strong>, ma najmniejszy potrzebny zasięg i nie jest wielokrotnie nadpisywana.</li>
<li>Nie powinna ukrywać istotnej mutacji ani jedynie powtarzać nazwy dobrze nazwanej metody.</li>
<li>Przeniesienie wyrażenia do zmiennej może zmienić <strong>moment ewaluacji</strong>, a zastąpienie kilku wystąpień jedną zmienną - <strong>liczbę ewaluacji</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="liczba-i-moment-ewaluacji">Liczba i moment ewaluacji</h2>
<ul>
<li>Ma to znaczenie, gdy wyrażenie zmienia stan, odczytuje czas lub losowość, sięga do sieci lub bazy albo inkrementuje licznik.</li>
<li>Istotne jest też, gdy wyrażenie może rzucić wyjątek lub zależy od mutowalnego stanu zmienianego między użyciami.</li>
<li>Zamiana dwóch wywołań <code>clock.instant()</code> na jeden lokalny <code>now</code> może być dobrą decyzją, ale <strong>nie jest neutralna semantycznie</strong>.</li>
<li>Najpierw trzeba ustalić, czy kontrakt wymaga jednego snapshotu czasu, czy dwóch niezależnych odczytów.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="extract-constant-i-final">Extract Constant i <code>final</code></h2>
<ul>
<li>Extract Constant przenosi stabilną wartość do nazwanego pola (zwykle <code>static final</code>), gdy reprezentuje wspólne pojęcie, nie zależy od instancji i ma tego samego właściciela.</li>
<li>Nie zamieniaj w stałą konfiguracji środowiska, danych regulacyjnych aktualizowanych bez wdrożenia ani reguły z innego kontekstu.</li>
<li><code>final</code> blokuje tylko ponowne przypisanie - <code>static final List</code> może wskazywać listę, którą da się modyfikować.</li>
<li>Publiczne <code>static final int</code> lub <code>String</code> z wyrażeniem stałym to <strong>stała czasu kompilacji</strong>: może zostać wklejona do klienta, który do rekompilacji widzi starą wartość.</li>
<li><code>static final BigDecimal</code> nie jest stałą czasu kompilacji - referencja jest nieprzypisywalna, ale wartość nie jest wklejana do kodu klienta.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="replace-magic-numbers-with-named-constants">Replace Magic Numbers with Named Constants</h2>
<ul>
<li>Magiczny literał to wartość, której znaczenia nie da się wiarygodnie odczytać w miejscu użycia - problemem jest <strong>ukryta decyzja</strong>, nie sama liczba.</li>
<li>W studium przypadku: <code>7</code> = próg długiego wynajmu, <code>0.10</code> = stawka rabatu, <code>8.00</code> = dzienne ubezpieczenie, <code>25.00</code> = dostawa, <code>0.23</code> = VAT.</li>
<li>Nazwy opisują rolę (<code>LONG_RENTAL_DAYS</code>), a nie wartość (<code>SEVEN</code>); <code>0</code> i <code>1</code> w indeksowaniu czy liczniku zwykle nie wymagają stałej.</li>
<li>Dwa identyczne literały nie muszą być tą samą wiedzą: 7 dni na zwrot i 7 dni progu rabatu to <strong>osobne pojęcia</strong>.</li>
<li>Extract Constant to mechanika, Replace Magic Literal to powód - sama transformacja nie gwarantuje dobrej nazwy ani właściwego właściciela.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="inline-variable">Inline Variable</h2>
<ul>
<li>Inline Variable zastępuje odczyty zmiennej jej inicjalizatorem, gdy nazwa nic nie wnosi, powtarza dobrze nazwaną metodę lub blokuje dalszą refaktoryzację.</li>
<li>Warunki: brak ponownego przypisania, ten sam wynik w każdym miejscu, zgodna liczba i moment ewaluacji, typ nie steruje przeciążeniem, nazwa nie jest ważnym pojęciem.</li>
<li>Mechanika: zastępuj <strong>jedno użycie na raz</strong>, kompiluj i testuj, a deklarację usuń dopiero po zniknięciu wszystkich odwołań.</li>
<li>Inicjalizator wykonany raz i czytany trzy razy - po naiwnym Inline wykona się trzy razy; podobnie przy przeniesieniu do pętli lub gałęzi warunkowej.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="typ-docelowy-i-przeci%C4%85%C5%BCenia">Typ docelowy i przeciążenia</h2>
<ul>
<li>Jawny typ lokalny może wybrać <strong>inne przeciążenie</strong> niż <code>var</code>.</li>
<li>Pusta kolekcja może brać typ z parametru metody, a po wydzieleniu jako <code>var</code> stać się kolekcją <code>Object</code>.</li>
<li>Lambda i referencja do metody wymagają typu docelowego i nie mogą być samodzielnym inicjalizatorem <code>var</code>.</li>
<li>Typ prymitywny i opakowanie mogą uruchomić inne przeciążenie albo unboxing.</li>
<li>Kompilator wykryje część różnic, ale kod skompilowany z innym przeciążeniem nadal może zmienić zachowanie - podgląd typu i test są częścią transformacji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="inline-method">Inline Method</h2>
<ul>
<li>Inline Method zastępuje wywołania ciałem metody i usuwa ją, gdy nie wnosi użytecznej nazwy, tylko deleguje bez ochrony granicy lub zaciemnia przepływ.</li>
<li>Typowi kandydaci to pozostałości po wcześniejszych transformacjach i metody utrudniające inną refaktoryzację.</li>
<li>Metoda domenowa o prostej implementacji może mieć wysoką wartość: <code>qualifiesForLongRentalDiscount()</code> wyjaśnia decyzję lepiej niż porównanie z liczbą.</li>
<li><strong>Liczba linii nie przesądza o Inline Method</strong> - decyduje, czy pośrednictwo przekazuje znaczenie.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

pre, code { font-size: 18px; }
;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="ryzyka-inline-method">Ryzyka Inline Method</h2>
<ul>
<li>Parametr użyty dwa razy nie może stać się dwoma wywołaniami argumentu z efektem ubocznym.</li>
<li>Wywołanie polimorficzne trafia do przesłoniętej implementacji; wklejenie ciała z jednej klasy <strong>usuwa dynamiczną dyspozycję</strong>.</li>
<li>Instancyjna metoda <code>synchronized</code> blokuje monitor odbiorcy, a statyczna - obiekt <code>Class</code>; usunięcie wywołania może usunąć blokadę.</li>
<li>Adnotacje transakcyjne, autoryzacyjne i przechwytujące działają na granicy metody; referencje do metod i refleksja nie wyglądają jak zwykłe wywołania.</li>
<li>Najbezpieczniejszy kandydat: <strong>prywatny, niepolimorficzny delegat użyty w jednym miejscu</strong> - jak między <code>stage2</code> a <code>stage3</code> studium.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="move-method-i-move-field---wyb%C3%B3r-w%C5%82a%C5%9Bciciela">Move Method i Move Field - wybór właściciela</h2>
<ul>
<li>Move Method przenosi metodę do typu, który powinien odpowiadać za jej zachowanie; Move Field przenosi stan do właściciela o właściwej odpowiedzialności i cyklu życia.</li>
<li>Sygnały: metoda częściej używa danych innego obiektu, zmiana reguły wymaga edycji klasy niebędącej właścicielem pojęcia.</li>
<li>Pole odczytywane i modyfikowane głównie przez inny komponent oraz dane i zachowanie tworzące spójny klaster to kolejne wskazówki.</li>
<li><strong>Feature Envy jest sygnałem do analizy, nie nakazem</strong> - metoda może celowo koordynować kilka obiektów na poziomie przypadku użycia.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="move-method-krok-po-kroku-i-ryzyka">Move Method krok po kroku i ryzyka</h2>
<ul>
<li>Zabezpiecz testem wynik, wyjątki, efekty i kolejność; sprawdź <code>this</code>, <code>super</code>, prywatne pola, metody wirtualne i zasoby.</li>
<li>Utwórz metodę w klasie docelowej z najmniejszą widocznością, przenieś ciało bez zmiany algorytmu, a starą metodę zamień w <strong>delegat</strong>.</li>
<li>Migruj wywołania pojedynczo; delegat usuń tylko, gdy nie jest częścią wymaganego kontraktu - może zostać jako fasada kompatybilności.</li>
<li>Ryzyka: niekwalifikowane nazwy wiążą się z innymi polami, pominięcie przesłonięcia w podklasie, zmiana dostępu pakietowego i <code>protected</code>.</li>
<li>Po przeniesieniu <code>synchronized</code> blokuje inny obiekt, a adnotacje transakcyjne mogą zostać na starym delegacie lub przestać być przechwytywane przez proxy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

pre, code { font-size: 18px; }
;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="move-field-krok-po-kroku-i-ryzyka">Move Field krok po kroku i ryzyka</h2>
<ul>
<li>Znajdź wszystkie odczyty, zapisy i użycia refleksyjne; ustal liczność, własność i cykl życia wartości.</li>
<li>Przenieś tę samą wartość lub referencję (zachowując aliasing), migruj najpierw odczyty, potem zapisy, a stare pole usuń po potwierdzeniu <strong>jednego źródła prawdy</strong>.</li>
<li>Nie utrzymuj dwóch niezależnie zapisywalnych kopii - dual write rozjeżdża się po wyjątku, błędzie współbieżności lub pominiętym zapisie.</li>
<li>Zachowaj znaczenie <code>final</code>, <code>volatile</code>, <code>transient</code>, <code>static</code>; kopia mutowalnego obiektu zmienia tożsamość, a pole statyczne - moment inicjalizacji klasy.</li>
<li>Sprawdź serializację, ORM, <code>equals</code>/<code>hashCode</code>/<code>toString</code>, schemat danych i komponenty rekordu - przeniesienie komponentu rekordu zmienia jego API.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="extract-class---cel-i-mechanika">Extract Class - cel i mechanika</h2>
<ul>
<li>Extract Class tworzy klasę dla spójnego zestawu pól i operacji z <strong>własną odpowiedzialnością i odrębnym powodem zmiany</strong>; liczba linii to tylko sygnał.</li>
<li>W studium: format dokumentu zmienia się z powodów prezentacyjnych, a reguły ceny z powodu polityki handlowej - stąd <code>RentalPricing</code>.</li>
<li>Mechanika: utwórz prywatną lub pakietową klasę, dodaj jedną relację własności, przenoś pola pojedynczo, potem metody, a publiczne operacje źródła zostaw jako delegującą fasadę.</li>
<li>Dopiero po ustabilizowaniu zdecyduj, czy nowy typ trafia do publicznego API.</li>
<li>Extract Class to <strong>decyzja projektowa</strong>; Move Field i Move Method to mechanika jej realizacji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="extract-class---pytania-o-w%C5%82asno%C5%9B%C4%87-i-z%C5%82y-wynik">Extract Class - pytania o własność i zły wynik</h2>
<ul>
<li>Czy nowy obiekt jest wartością, encją czy komponentem wewnętrznym? Czy ma ten sam cykl życia i czy może być współdzielony?</li>
<li>Kto go tworzy i waliduje, czy potrzebuje referencji zwrotnej i czy jego tożsamość ma znaczenie dla <code>==</code>, monitorów lub cache?</li>
<li>Referencja zwrotna tworzy cykl i zwiększa sprzężenie - często lepiej przekazać wymagane wartości lub wąski kontrakt.</li>
<li><strong>Zły wynik:</strong> dane przeniesione, ale logika nadal w źródle przez serię getterów - powstaje nawigacja bez przeniesienia odpowiedzialności.</li>
<li>Jeśli nowa klasa potrzebuje większości pól starej i wzajemnej referencji, granica prawdopodobnie jest źle wybrana.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="encapsulate-field">Encapsulate Field</h2>
<ul>
<li>Encapsulate Field kieruje dostęp do pola przez operacje właściciela, co pozwala kontrolować zmiany, utrzymywać inwariant i później zmienić reprezentację.</li>
<li>Getter i setter nie są automatycznie dobrym modelem - operacja <code>renameTo</code> lepiej komunikuje dozwoloną zmianę niż ogólne <code>setName</code>.</li>
<li><strong>Migracja:</strong> dodaj trywialne akcesory na tym samym polu, bez walidacji i synchronizacji; migruj klientów pojedynczo; zwęź widoczność dopiero po migracji.</li>
<li>Operację domenową zamiast ogólnego zapisu wprowadź w osobnym kroku - dodanie walidacji zmienia akceptowane dane i typy wyjątków.</li>
<li>Pułapki: zapis do publicznego pola nie wywoła settera, pola wiązane są statycznie, a akcesory dynamicznie; <code>volatile</code>, blokady i adnotacje nie przechodzą same na metodę.</li>
</ul>
</section>

<h2 id="encapsulate-collection---cel">Encapsulate Collection - cel</h2>
<ul>
<li>Encapsulate Collection daje właścicielowi kontrolę nad członkostwem: klient czyta przez określony kontrakt, a zmienia przez <code>add</code>, <code>remove</code>, <code>replace</code> lub polecenia domenowe.</li>
<li>Przed zmianą scharakteryzuj kolejność, duplikaty, dopuszczalność <code>null</code> i mutowalność elementów.</li>
<li>Ważne są też tożsamość zwracanej kolekcji, widoczność późniejszych zmian właściciela i zachowanie iteratorów.</li>
<li>Sprawdź alias do kolekcji przekazanej w konstruktorze i zasady współbieżności - każda z tych cech może być częścią kontraktu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="trzy-r%C3%B3%C5%BCne-kontrakty-kolekcji">Trzy różne kontrakty kolekcji</h2>
<table>
<thead>
<tr>
<th>Implementacja</th>
<th style="text-align:center">Klient zmienia członkostwo</th>
<th style="text-align:center">Widzi późniejsze zmiany</th>
<th style="text-align:center">Kopia głęboka</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Collections.unmodifiableList(internal)</code></td>
<td style="text-align:center">nie</td>
<td style="text-align:center">tak (żywy widok)</td>
<td style="text-align:center">nie</td>
</tr>
<tr>
<td><code>List.copyOf(internal)</code></td>
<td style="text-align:center">nie</td>
<td style="text-align:center">nie (migawka)</td>
<td style="text-align:center">nie</td>
</tr>
<tr>
<td><code>new ArrayList&lt;&gt;(internal)</code></td>
<td style="text-align:center">tak, we własnej kopii</td>
<td style="text-align:center">nie</td>
<td style="text-align:center">nie</td>
</tr>
</tbody>
</table>
<ul>
<li>Niemodyfikowalna kolekcja blokuje zmianę członkostwa, <strong>nie wnętrza elementów</strong> - mutowalny element nadal można zmienić.</li>
<li><code>List.copyOf</code> i <code>Map.copyOf</code> odrzucają <code>null</code>, a mogą zwrócić istniejący obiekt - nie opieraj kontraktu na tożsamości wyniku.</li>
</ul>
</section>

<h2 id="encapsulate-collection---bezpieczna-mechanika">Encapsulate Collection - bezpieczna mechanika</h2>
<ul>
<li>Wykonaj kopię wejścia w konstruktorze <strong>albo świadomie zachowaj</strong> stary alias.</li>
<li>Dodaj operacje kontrolujące członkostwo i zmigruj wszystkie zapisy klientów.</li>
<li>Zastąp wynik odczytu wybranym widokiem lub migawką i dodaj test rozróżniający te semantyki.</li>
<li>Wprowadzenie walidacji, zakazu <code>null</code> i nowych reguł duplikatów oddziel od samej hermetyzacji.</li>
<li>Zwracanie migawki <strong>nie zapewnia bezpieczeństwa wątkowego</strong> całemu obiektowi - współbieżność wymaga osobnego kontraktu.</li>
</ul>
</section>

<h2 id="encapsulate-conditional">Encapsulate Conditional</h2>
<ul>
<li>Wydzielenie predykatu zastępuje pytanie o implementację pytaniem o znaczenie: <code>request.days() &gt;= 7</code> → <code>qualifiesForLongRentalDiscount(request)</code>.</li>
<li>Wariant Decompose Conditional wydziela osobno predykat, gałąź prawdziwą i fałszywą - każdy krok kompiluj i testuj oddzielnie.</li>
<li><strong>Krótkie spięcie jest zachowaniem:</strong> nie obliczaj wcześniej prawej strony osłony przed <code>null</code> ani niewybranej gałęzi - możesz wprowadzić wyjątek lub efekt uboczny.</li>
<li>Przy <code>instanceof</code> z wzorcem zakres zmiennej zależy od przepływu - czasem trzeba zostawić dopasowanie w miejscu i wydzielić tylko resztę warunku.</li>
<li>Nazwa <code>is</code>/<code>has</code>/<code>qualifies</code> nie gwarantuje czystości - jeśli predykat ma efekty, test musi chronić ich liczbę i kolejność.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="studium-przypadku-kontrakt-generatora-oferty">Studium przypadku: kontrakt generatora oferty</h2>
<ul>
<li>Wiertnica kosztuje 39,99 za dzień, generator 120,00; wynajem ≥ 7 dni dostaje 10% rabatu <strong>od podstawowego kosztu wynajmu</strong>.</li>
<li>Ubezpieczenie kosztuje 8,00 za dzień, dostawa jednorazowo 25,00, a VAT wynosi 23% wartości netto.</li>
<li>Każda pośrednia kwota jest zaokrąglana do dwóch miejsc metodą HALF_UP; nazwa klienta jest przycinana i zamieniana na wielkie litery.</li>
<li>Zapis nie zależy od domyślnego locale, a dokument kończy się znakiem nowej linii.</li>
<li>Inny moment zaokrąglenia, rabat od dodatków czy brak końcowej nowej linii oznaczałyby <strong>zmianę zachowania</strong>; walidacja <code>RentalRequest</code> jest stabilnym warunkiem wstępnym wszystkich etapów.</li>
</ul>
</section>

<h2 id="etap-0-kod-pocz%C4%85tkowy">Etap 0: kod początkowy</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">createQuote</span><span class="hljs-params">(RentalRequest r)</span> {
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">a</span> <span class="hljs-operator">=</span> money(rates.get(r.equipmentType())
            .multiply(BigDecimal.valueOf(r.days())));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">d</span> <span class="hljs-operator">=</span> r.days() &gt;= <span class="hljs-number">7</span>
            ? money(a.multiply(disc)) : money(BigDecimal.ZERO);
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> r.insurance()
            ? money(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;8.00&quot;</span>)
                    .multiply(BigDecimal.valueOf(r.days())))
            : money(BigDecimal.ZERO);
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">f</span> <span class="hljs-operator">=</span> r.delivery() ? <span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;25.00&quot;</span>) : money(BigDecimal.ZERO);
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">n</span> <span class="hljs-operator">=</span> money(a.subtract(d).add(i).add(f));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">v</span> <span class="hljs-operator">=</span> money(n.multiply(<span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;0.23&quot;</span>)));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">t</span> <span class="hljs-operator">=</span> money(n.add(v));
    <span class="hljs-type">String</span> <span class="hljs-variable">q</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;RENTAL QUOTE\n&quot;</span> + <span class="hljs-string">&quot;Customer: &quot;</span> + ... + <span class="hljs-string">&quot;Total: &quot;</span> + t.toPlainString() + <span class="hljs-string">&quot;\n&quot;</span>;
    <span class="hljs-keyword">return</span> q;
}
</code></pre>
<p>Wynik jest poprawny, ale kod miesza reguły wyceny, formatowanie, nieczytelne nazwy i literały domenowe.</p>
</section>

<h2 id="test-charakterystyki-przed-pierwsz%C4%85-zmian%C4%85">Test charakterystyki przed pierwszą zmianą</h2>
<ul>
<li>Test obejmuje <strong>pełny dokument</strong>, oba boki granicy rabatu (6 i 7 dni) oraz niezależne warianty ubezpieczenia i dostawy.</li>
<li>Zawiera przypadki ujawniające sposób zaokrąglania VAT (1 dzień wiertnicy → VAT 9.20) i rabatu (15 dni → rabat 59.99).</li>
<li>Test charakterystyki <strong>nie ocenia</strong>, czy zastane reguły są biznesowo pożądane - rejestruje obserwacje, aby zmiana struktury nie „poprawiła” ich przypadkiem.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">assertEquals(<span class="hljs-string">&quot;&quot;&quot;
        RENTAL QUOTE
        Customer: ACME
        ...
        Net: 953.00
        VAT: 219.19
        Total: 1172.19
        &quot;&quot;&quot;</span>, service.createQuote(request));
</code></pre>
</section>

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="etap-1-lokalne-transformacje">Etap 1: lokalne transformacje</h2>
<ul>
<li><strong>Rename</strong> nadaje znaczenie parametrowi i zmiennym, <strong>Extract Constant</strong> i <strong>Replace Magic Numbers</strong> nazywają próg rabatu, stawki dodatków i VAT.</li>
<li><strong>Extract Variable</strong> nazywa stawkę dzienną i liczbę dni; <strong>Extract Method</strong> oddziela rabat, ubezpieczenie, dostawę i dokument.</li>
<li><strong>Encapsulate Conditional</strong> nazywa kwalifikację do rabatu, a <strong>Inline Variable</strong> usuwa zmienną <code>q</code> tuż przed <code>return</code>.</li>
<li>Po każdym kroku kod się kompiluje, a test charakterystyki pozostaje zielony.</li>
<li>Wydzielenia zwiększyły liczbę nazw, ale <strong>nie zmieniły kolejności obliczeń</strong> - rabat nadal liczony od podstawy, zaokrąglenia w tych samych miejscach, format identyczny.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">LONG_RENTAL_DAYS</span> <span class="hljs-operator">=</span> <span class="hljs-number">7</span>;
<span class="hljs-keyword">private</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">VAT_RATE</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BigDecimal</span>(<span class="hljs-string">&quot;0.23&quot;</span>);

<span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">createQuote</span><span class="hljs-params">(RentalRequest request)</span> {
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">dailyRate</span> <span class="hljs-operator">=</span> dailyRates.get(request.equipmentType());
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">rentalDays</span> <span class="hljs-operator">=</span> BigDecimal.valueOf(request.days());
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">baseRentalCost</span> <span class="hljs-operator">=</span> money(dailyRate.multiply(rentalDays));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">discount</span> <span class="hljs-operator">=</span> calculateDiscount(request, baseRentalCost);
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">insuranceCost</span> <span class="hljs-operator">=</span> calculateInsuranceCost(request);
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">deliveryCost</span> <span class="hljs-operator">=</span> calculateDeliveryCost(request);
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">netAmount</span> <span class="hljs-operator">=</span> money(baseRentalCost.subtract(discount)
            .add(insuranceCost).add(deliveryCost));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">vat</span> <span class="hljs-operator">=</span> money(netAmount.multiply(VAT_RATE));
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> money(netAmount.add(vat));
    <span class="hljs-keyword">return</span> buildDocument(request, baseRentalCost, discount, <span class="hljs-comment">/* ... */</span> total);

<h2 id="extract-class-rentalpricing-i-pricebreakdown">Extract Class: <code>RentalPricing</code> i <code>PriceBreakdown</code></h2>
<ul>
<li>Klasa etapu 1 ma dwie odpowiedzialności: <strong>wycenę i prezentację</strong>; reguły, stawki i zaokrąglenie trafiają do <code>RentalPricing</code>.</li>
<li>Wynik obliczenia dostaje jawny typ <code>PriceBreakdown</code> - rekord z nazwanymi kwotami, którego konstruktor kompaktowy chroni format (nieujemne, skala 2).</li>
<li>Sekwencja: prywatny punkt <code>calculatePrice</code> w źródle → nowy typ z implementacją i danymi → ciało źródła zamienione na delegowanie.</li>
<li>Po każdym kroku usuwaj ze źródła tylko dane bez odczytów i utrzymuj <strong>jedno źródło prawdy</strong> dla każdej stawki i reguły.</li>
<li>Konstruktor <code>RentalPricing</code> dodaje walidację nowego API (kompletność stawek, zakres rabatu) - dla poprawnych danych wynik jest ten sam, a w produkcji byłaby to osobna, świadoma decyzja.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="etap-2-delegat-po-przeniesieniu">Etap 2: delegat po przeniesieniu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">public</span> <span class="hljs-title function_">RentalQuoteService</span><span class="hljs-params">()</span> { <span class="hljs-built_in">this</span>(RentalPricing.standard()); }

<span class="hljs-type">public</span> <span class="hljs-title function_">RentalQuoteService</span><span class="hljs-params">(RentalPricing pricing)</span> {
    <span class="hljs-built_in">this</span>.pricing = Objects.requireNonNull(pricing);
}

<span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">createQuote</span><span class="hljs-params">(RentalRequest request)</span> {
    Objects.requireNonNull(request, <span class="hljs-string">&quot;request&quot;</span>);
    <span class="hljs-type">PriceBreakdown</span> <span class="hljs-variable">price</span> <span class="hljs-operator">=</span> calculatePrice(request);
    <span class="hljs-keyword">return</span> buildDocument(request, price);
}

<span class="hljs-keyword">private</span> <span class="hljs-type">PriceBreakdown</span> <span class="hljs-title function_">calculatePrice</span><span class="hljs-params">(RentalRequest request)</span> {
    <span class="hljs-keyword">return</span> pricing.calculate(request);
}
</code></pre>
<ul>
<li>Bezargumentowy konstruktor zachowuje publiczną sygnaturę etapów 0 i 1 (także deskryptor dla skompilowanych klientów); jego usunięcie byłoby odrębną zmianą API.</li>
</ul>

<h2 id="etap-3-inline-method">Etap 3: Inline Method</h2>
<ul>
<li>Delegat <code>calculatePrice</code> nie dodaje nazwy domenowej, nie ukrywa niestabilnej implementacji i ma jedno wywołanie - jest kandydatem do Inline Method.</li>
<li>Przed operacją sprawdzamy, czy nie jest punktem rozszerzenia, celem refleksji, miejscem przechwytywania przez proxy ani granicą synchronizacji - jest prywatny, niesynchronizowany i bez adnotacji.</li>
<li>Po Inline: <code>PriceBreakdown price = pricing.calculate(request);</code></li>
<li><code>buildDocument</code> <strong>pozostaje</strong>, bo nazywa osobną odpowiedzialność i trzyma metodę publiczną na jednym poziomie abstrakcji.</li>
<li><code>qualifiesForLongRentalDiscount</code> pozostaje w klasie wyceny, bo nazwa wyraża regułę domenową lepiej niż porównanie liczb.</li>
</ul>
</section>

<h2 id="test-r%C3%B3wnowa%C5%BCno%C5%9Bci-etap%C3%B3w">Test równoważności etapów</h2>
<ul>
<li>Porównywanie nowej implementacji wyłącznie ze starą nie wystarcza - <strong>obie mogą dzielić ten sam błąd</strong>.</li>
<li>Test parametryzowany porównuje każdy etap (0-3) z <strong>niezależnie zapisanym, zatwierdzonym wynikiem</strong>.</li>
<li>Zestaw obejmuje oba typy sprzętu, oba boki progu rabatu, wszystkie dodatki i przypadki zaokrągleń - nie dowodzi poprawności dla wszystkich danych, ale chroni wybrane ryzyka.</li>
<li><code>LocaleIndependentFormattingTest</code> ustawia locale <code>ar-EG</code>; dlatego kod używa <code>String.format(Locale.ROOT, ...)</code> - samo <code>formatted(...)</code> mogłoby zmienić cyfry w <code>%d</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">assertAll(
    () -&gt; assertEquals(expectedQuote, stage0.createQuote(request)),
    () -&gt; assertEquals(expectedQuote, stage3.createQuote(request)));
</code></pre>

<h2 id="encapsulate-field-i-collection-w-studium-12">Encapsulate Field i Collection w studium (1/2)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LegacyEquipmentCatalog</span> {
    <span class="hljs-keyword">public</span> String name;
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> Map&lt;EquipmentType, BigDecimal&gt; dailyRates;
    <span class="hljs-comment">// konstruktor przypisuje przekazaną mapę bez kopii</span>
}
</code></pre>
<ul>
<li><code>final</code> blokuje zmianę referencji, ale nie mutację mapy - klient może zmienić nazwę, stawkę, usunąć wpis lub modyfikować mapę wejściową.</li>
<li><code>AccessorBasedEquipmentCatalog</code> ukrywa pola po migracji klientów, ale akcesory <strong>zachowują aliasowanie</strong> i akceptują każdą wartość - to punkt kontrolny, nie projekt docelowy.</li>
<li>W opublikowanej bibliotece usunięcie publicznego pola łamie zgodność źródłową i binarną oraz zmienia refleksję - akcesor nie zachowuje API pola.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">renameTo</span><span class="hljs-params">(String newName)</span> { name = validName(newName); }

<span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">changeDailyRate</span><span class="hljs-params">(EquipmentType type, BigDecimal newRate)</span> {
    <span class="hljs-type">BigDecimal</span> <span class="hljs-variable">normalizedRate</span> <span class="hljs-operator">=</span> newRate.setScale(<span class="hljs-number">2</span>, RoundingMode.HALF_UP);
    <span class="hljs-keyword">if</span> (normalizedRate.signum() &lt;= <span class="hljs-number">0</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(...);
    dailyRates.put(type, normalizedRate);
}

<span class="hljs-keyword">public</span> <span class="hljs-type">Map</span>&lt;EquipmentType, BigDecimal&gt; <span class="hljs-title function_">dailyRates</span><span class="hljs-params">()</span> {
    <span class="hljs-keyword">return</span> Map.copyOf(dailyRates);
}

<li><code>EquipmentCatalog</code> to już <strong>świadoma zmiana kontraktu</strong>: kopia wejścia do <code>EnumMap</code>, normalizacja, inwarianty i niemodyfikowalne migawki.</li>
<li>Test nazywa każdą właściwość (alias, migawka, walidacja nazwy, normalizacja przed inwariantem); zmiana wymaga osobnego wymagania i komunikacji do klientów.</li>

<h2 id="uruchamialny-przyk%C5%82ad">Uruchamialny przykład</h2>
<ul>
<li><code>Module4Examples</code> porównuje wynik etapu 0 z etapem 3 dla tego samego żądania i rzuca wyjątek, jeśli refaktoryzacja zmieniła ofertę.</li>
<li>Następnie demonstruje, że migawka katalogu pobrana przed <code>changeDailyRate</code> zachowuje starą stawkę 39.99.</li>
<li>Oczekiwany wynik kończy się liniami: <code>Quote stages equivalent: true</code> oraz <code>Catalog snapshot isolated: true</code>.</li>
<li>Przykład pokazuje oba bieguny modułu: <strong>równoważność</strong> etapów refaktoryzacji i <strong>jawną zmianę</strong> kontraktu katalogu.</li>

<h2 id="warsztat---zasady-pracy">Warsztat - zasady pracy</h2>
<ul>
<li>Każde ćwiczenie zaczyna się od <strong>zielonego testu</strong>.</li>
<li>Kolejne kroki zapisuj osobno i po każdym uruchamiaj co najmniej test najbliższy zmienianemu kodowi.</li>
<li>Jeśli IDE odmawia wykonania operacji, najpierw ustal jej warunek wstępny - ręczne przepisanie kodu bez tej analizy nie rozwiązuje problemu.</li>
</ul>
</section>

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="%C4%87wiczenie-1-lokalne-porz%C4%85dkowanie-metody-30--10-min">Ćwiczenie 1: lokalne porządkowanie metody (30 + 10 min)</h2>
<p><strong>Start:</strong> <code>stage0.RentalQuoteService</code> + <code>RentalQuoteServiceCharacterizationTest</code></p>
<ul>
<li>Uruchom test, celowo zmień próg rabatu i sprawdź, czy test to wykrywa; cofnij zmianę.</li>
<li>Zmień nazwy, nazwij próg rabatu, stawkę ubezpieczenia, opłatę dostawy i VAT; wydziel rabat, ubezpieczenie, dostawę, predykat i budowę dokumentu.</li>
<li>Usuń zmienne, które tylko przekazują wynik dalej. <strong>Nie</strong> zmieniaj sygnatury <code>createQuote</code>, miejsc zaokrąglania ani nie twórz nowej klasy.</li>
<li><strong>Akceptacja:</strong> dokument identyczny bajt po bajcie, 6 dni bez rabatu / 7 z rabatem, VAT 9,20 dla 1 dnia wiertnicy, brak jednoliterowych nazw, spójny poziom abstrakcji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="%C4%87wiczenie-2-extract-i-inline-pod-presj%C4%85-semantyki-25--10-min">Ćwiczenie 2: Extract i Inline pod presją semantyki (25 + 10 min)</h2>
<p>Dla każdego przypadku oceń, czy transformacja zachowuje zachowanie, i jaki test jest potrzebny:</p>
<ul>
<li>Inline zmiennej <code>now</code> z <code>clock.instant()</code> użytej dwa razy; Extract Variable prawego operandu <code>account != null &amp;&amp; account.isActive()</code>.</li>
<li>Argument z zapisem audytowym trafia do dwóch wywołań; lambda przekazywana do przeciążonej metody wydzielona do <code>var</code> lub jawnego typu.</li>
<li>Inline jednoliniowej metody przesłanianej w podklasie oraz metody <code>synchronized</code> (instancyjnej i statycznej).</li>
<li>Inline prywatnego delegata <code>calculatePrice</code>; Extract Constant dla dwóch <code>new BigDecimal(&quot;0.23&quot;)</code>.</li>
<li>Następnie wykonaj Inline Method między etapami 2 i 3 i uruchom <code>RentalQuoteStagesEquivalenceTest</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="%C4%87wiczenie-3-extract-class-i-przeniesienie-odpowiedzialno%C5%9Bci-35--15-min">Ćwiczenie 3: Extract Class i przeniesienie odpowiedzialności (35 + 15 min)</h2>
<p><strong>Start:</strong> <code>stage1.RentalQuoteService</code></p>
<ul>
<li>Nazwij wydzielaną odpowiedzialność i klientów; wprowadź <code>PriceBreakdown</code> i prywatny punkt <code>calculatePrice</code>.</li>
<li>Utwórz <code>RentalPricing</code>, przenieś metody wyceny ze stawkami i stałymi, formatowanie zostaw w <code>RentalQuoteService</code>.</li>
<li>Dodaj konstruktor wstrzykujący wycenę, zachowaj bezargumentowy punkt wejścia, usuń duplikaty i dodaj testy.</li>
<li>Przed startem odpowiedz: kto jest właścicielem stawek, jaki jest cykl życia wyceny, czy są monitory, przesłonięcia, adnotacje i zewnętrzni klienci?</li>
<li><strong>Akceptacja:</strong> jedno źródło prawdy, dokument nie zna algorytmu wyceny, wycena nie zna formatu, zależności jawne, oferty identyczne na każdym etapie.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-4-kontrola-mutowalnego-stanu-30--15-min">Ćwiczenie 4: kontrola mutowalnego stanu (30 + 15 min)</h2>
<p><strong>Start:</strong> <code>LegacyEquipmentCatalog</code></p>
<ul>
<li><strong>Faza A (zachowanie kontraktu):</strong> scharakteryzuj zapis do <code>name</code> i alias do mapy, ukryj pola, dodaj najwęższe akcesory zachowujące obserwacje, zmigruj klientów.</li>
<li><strong>Faza B (zatwierdzona zmiana):</strong> zdecyduj o kopii w konstruktorze, zdefiniuj reguły nazwy i stawki, zastąp setter operacjami domenowymi.</li>
<li>W fazie B wybierz żywy widok lub migawkę, dodaj testy modyfikacji źródła, wyniku i właściciela, oceń <code>null</code>, mutowalne elementy i współbieżność.</li>
<li><strong>Akceptacja:</strong> faza A nie ukrywa zmiany zachowania, faza B ma jawny kontrakt, brak modyfikowalnego aliasu, test odróżnia migawkę od widoku.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="wsp%C3%B3lna-retrospektywa">Wspólna retrospektywa</h2>
<p>Po każdym ćwiczeniu zespół odpowiada na cztery pytania:</p>
<ol>
<li>Jaka obserwowalna właściwość była chroniona?</li>
<li>Który krok był czysto mechaniczny, a który wymagał decyzji projektowej?</li>
<li>Jaki najmniejszy test dawał wiarygodny sygnał?</li>
<li>W którym momencie należało zakończyć serię transformacji?</li>
</ol>
</section>

<h2 id="om%C3%B3wienie-%C4%87wiczenie-1">Omówienie: Ćwiczenie 1</h2>
<ul>
<li>Kierunek odpowiada etapowi 1; zaczynamy od <strong>Rename lokalnych symboli</strong>, bo zmienia najmniejszy obszar i ułatwia kolejne kroki.</li>
<li>Potem Extract Constant i Replace Magic Numbers (ujawniają reguły bez zmiany przepływu), Extract Variable, Extract Method i Encapsulate Conditional.</li>
<li>Na końcu Extract Method dla dokumentu i Inline Variable dla <code>q</code>, która tylko poprzedzała <code>return</code>.</li>
<li>Nie trzeba wydzielać każdej operacji - <code>netAmount</code>, <code>vat</code>, <code>total</code> wystarczająco opisują kroki, a nadmiar jednoliniowych metod utrudniłby czytanie.</li>
<li><code>ZERO_MONEY</code> informuje o skali wartości zerowej, a stawki zostają w mapie instancyjnej, bo przejdą razem z odpowiedzialnością za wycenę.</li>
</ul>
</section>

<h2 id="om%C3%B3wienie-%C4%87wiczenia-3-i-4">Omówienie: Ćwiczenia 3 i 4</h2>
<ul>
<li><code>RentalPricing</code> oblicza nazwany rozkład ceny dla poprawnego żądania; <code>RentalQuoteService</code> buduje dokument z żądania i wyniku wyceny.</li>
<li>Pola stawek i rabatu poruszają się razem z metodami, które je interpretują; formatowanie i normalizacja nazwy klienta zostają po stronie prezentacji.</li>
<li><code>PriceBreakdown</code> zastępuje długą listę równoległych wartości spójnym typem wyniku, a przejściowy delegat pozwala osobno sprawdzić Move Method i Inline Method.</li>
<li>W ćwiczeniu 4 <strong>fazy A i B nie łączymy w jeden commit</strong>: faza A migruje składnię dostępu bez zmiany aliasowania, faza B wprowadza kopię, walidację i migawki.</li>
<li>Gdyby klient musiał widzieć późniejsze zmiany, właściwy byłby żywy widok (<code>Collections.unmodifiableMap</code>) - to inny kontrakt, wybierany świadomie.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="sprawdzenie-wiedzy-12">Sprawdzenie wiedzy (1/2)</h2>
<ul>
<li><strong>Co musi pozostać niezmienione?</strong> Ustalony zakres obserwowalnego zachowania: wyniki, wyjątki, efekty, kolejność, a czasem zgodność API.</li>
<li><strong>Kiedy Extract Variable zmienia zachowanie?</strong> Gdy zmienia liczbę, kolejność lub moment ewaluacji - wpływając na wyjątki, stan, czas, I/O lub przeciążenie.</li>
<li><strong>Dlaczego publiczna stała <code>int</code>/<code>String</code> wymaga ostrożności?</strong> Może zostać wkompilowana do klienta, który bez rekompilacji widzi starą wartość.</li>
<li><strong>Co ginie przy Inline metody <code>synchronized</code>?</strong> Wejście w monitor odbiorcy lub obiektu <code>Class</code>, a z nim synchronizacja i widoczność pamięci.</li>
<li><strong>Jak bezpiecznie wykonać Move Field?</strong> Nowy właściciel, jedno źródło prawdy dla odczytów i zapisów, migracja klientów, usunięcie starego pola na końcu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="55" data-size="16:9">
<h2 id="sprawdzenie-wiedzy-22">Sprawdzenie wiedzy (2/2)</h2>
<ul>
<li><strong>Dlaczego prywatne pole z publicznym setterem to nie hermetyzacja?</strong> Setter nadal pozwala na dowolną zmianę - hermetyzacja to kontrola kontraktu, nie modyfikator dostępu.</li>
<li><strong>Widok a migawka?</strong> Widok blokuje mutację klienta, ale pokazuje późniejsze zmiany właściciela; migawka utrwala stan z chwili utworzenia.</li>
<li><strong>Czy <code>Map.copyOf</code> kopiuje głęboko lub daje bezpieczeństwo wątkowe?</strong> Nie i nie - kopiuje tylko strukturę i nie definiuje synchronizacji.</li>
<li><strong>Dlaczego porównanie ze starą implementacją nie wystarcza?</strong> Stara wersja może mieć ten sam błąd - potrzebne są niezależne oczekiwania.</li>
<li><strong>Czy Extract i Inline są sprzeczne?</strong> Nie - obie zmieniają poziom pośrednictwa, a wybór zależy od tego, czy nazwa przekazuje znaczenie.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="listy-kontrolne-12">Listy kontrolne (1/2)</h2>
<ul>
<li><strong>Przed każdym krokiem:</strong> znam chronione zachowanie, test pokrywa ryzyko, sprawdziłem liczbę i kolejność ewaluacji, wyjątki, efekty i publiczny/tekstowy kontrakt symbolu.</li>
<li><strong>Extract:</strong> nazwa wyraża intencję, wejścia i wyjścia są jawne, short-circuit i zasięg zmiennej wzorca zachowane, typ jawny zachowuje kontekst przeciążenia i lambdy.</li>
<li><strong>Inline:</strong> pośrednictwo nie niesie znaczenia, metoda nie jest przesłaniana ani używana przez refleksję, nie usuwam granicy proxy, transakcji ani blokady.</li>
<li><strong>Rename:</strong> nazwa opisuje rolę, przejrzałem użycia tekstowe, konfigurację, serializację, ORM i refleksję; dla publicznego API stara nazwa deleguje w okresie migracji.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="listy-kontrolne-22">Listy kontrolne (2/2)</h2>
<ul>
<li><strong>Move i Extract Class:</strong> nowy właściciel ma odpowiedzialność i dane, cykl życia się zgadza, cały czas jest jedno źródło prawdy, brak nowych cykli zależności.</li>
<li><strong>Encapsulate Field i Collection:</strong> znam aliasy i drogi zapisu, nie utożsamiam settera z hermetyzacją, świadomie wybrałem widok, migawkę lub kopię.</li>
<li>Uwzględniam <code>null</code>, kolejność, duplikaty, mutowalność elementów i nie przypisuję kolekcji niemodyfikowalnej bezpieczeństwa wątkowego.</li>
<li><strong>Na koniec warsztatu:</strong> każdy etap kompiluje się na Javie 25, testy charakterystyki, nowej odpowiedzialności i równoważności przechodzą, nie ma dwóch kopii reguły.</li>
<li>Potrafię wskazać, które kroki były refaktoryzacją, a które <strong>zmianą zachowania</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="podsumowanie---najwa%C5%BCniejsze-wnioski">Podsumowanie - najważniejsze wnioski</h2>
<ul>
<li>Podstawowe refaktoryzacje to małe transformacje, ale ich bezpieczeństwo zależy od <strong>precyzyjnego rozumienia semantyki</strong> Javy i kontraktu systemu.</li>
<li>Rename może dotknąć publicznego lub tekstowego kontraktu; Extract i Inline mogą zmienić liczbę ewaluacji, przeciążenie, dynamiczną dyspozycję lub blokadę.</li>
<li>Move wymaga jednego źródła prawdy i właściwego właściciela; hermetyzacja wymaga decyzji o dozwolonych operacjach, aliasowaniu i własności stanu.</li>
<li>Kluczowa umiejętność to nie nazwa techniki, lecz <strong>sekwencja kroków</strong> z jawnym celem, odpowiednim testem i małym promieniem zmiany.</li>
<li>Refaktoryzację oceniamy przez równoważność obserwacji (etapy 0-3), a nowe reguły własności i walidacji wymagają <strong>osobnej, świadomej decyzji</strong>.</li>
</ul>
</section>
