<h2 id="11-wzorzec-jest-rezultatem-nie-celem">1.1. Wzorzec jest rezultatem, nie celem</h2>
<ul>
<li>Wzorzec opisuje problem, kontekst, siły i konsekwencje - nie jest kodem do skopiowania.</li>
<li>Kierunek pracy: zabezpiecz zachowanie → nazwij oś zmienności → odsłoń role → wprowadź <strong>najwęższy</strong> kontrakt.</li>
<li>Przenoś po jednym wariancie z testami i <strong>zatrzymaj się</strong>, gdy problem jest rozwiązany - pełna postać z katalogu nie jest celem.</li>
<li>Przed decyzją: znany problem, warianty istniejące <strong>dziś</strong>, prostsza alternatywa, warunek, kiedy wzorzec przestanie być potrzebny.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="12-najpierw-rodzaj-zmienno%C5%9Bci">1.2. Najpierw rodzaj zmienności</h2>
<table>
<thead>
<tr>
<th>Pytanie</th>
<th>Typowa technika</th>
</tr>
</thead>
<tbody>
<tr>
<td>Czy zmienia się algorytm wybierany dla operacji?</td>
<td>Strategy</td>
</tr>
<tr>
<td>Czy zachowanie należy do trwałego rodzaju obiektu?</td>
<td>polimorfizm podtypów</td>
</tr>
<tr>
<td>Czy zachowanie zależy od bieżącego stanu i przejść?</td>
<td>State</td>
</tr>
<tr>
<td>Czy żądanie trzeba kolejkować, logować lub cofać?</td>
<td>Command</td>
</tr>
<tr>
<td>Czy reguły sprawdzamy po kolei, a obsługuje jedna?</td>
<td>Chain of Responsibility</td>
</tr>
<tr>
<td>Czy dodatek opakowuje rdzeń o tym samym kontrakcie?</td>
<td>Decorator</td>
</tr>
<tr>
<td>Czy kod jedynie tworzy właściwy obiekt?</td>
<td>Factory</td>
</tr>
</tbody>
</table>
<p>Ten sam <code>switch</code> może sygnalizować różne problemy - ustal, <strong>co naprawdę jest zmienne</strong> i czy zestaw wariantów jest otwarty, czy zamknięty.</p>
</section>

<h2 id="13-refaktoryzacja-a-zmiana-projektu">1.3. Refaktoryzacja a zmiana projektu</h2>
<ul>
<li>Refaktoryzacja zachowuje obserwowalne zachowanie w przyjętej granicy - wprowadzenie wzorca tego nie zmienia.</li>
<li>Kusi: nowe warianty, inna obsługa nieznanego kodu, asynchroniczność, kontynuacja po błędzie listenera.</li>
<li>Podobnie: dowolna liczba odbiorców, cache i współdzielenie instancji, nowy format trwałych danych.</li>
<li>Każdy taki krok to <strong>rozszerzenie zachowania</strong> - oddziel go od transformacji strukturalnej i zatwierdź osobno.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="14-kiedy-wzorzec-si%C4%99-nie-op%C5%82aca">1.4. Kiedy wzorzec się nie opłaca</h2>
<table>
<thead>
<tr>
<th>Sygnał</th>
<th>Lepszy ruch</th>
</tr>
</thead>
<tbody>
<tr>
<td>dwa stabilne warianty w jednym miejscu</td>
<td>czytelny <code>switch</code> lub <code>if</code></td>
</tr>
<tr>
<td>wariant „na przyszłość”, bez wymagania</td>
<td>YAGNI - poczekaj na drugi przypadek</td>
</tr>
<tr>
<td>jeden klient, jedna implementacja</td>
<td>konkretna klasa, interfejs później</td>
</tr>
<tr>
<td>problem leży w nazwach lub długości metody</td>
<td>Rename, Extract Method</td>
</tr>
<tr>
<td>zespół nie zna wzorca, kod jest krytyczny</td>
<td>prostsza struktura i dobry test</td>
</tr>
</tbody>
</table>
<p>Koszt wzorca: więcej typów, pośredniość, konfiguracja w korzeniu kompozycji, trudniejsze śledzenie przepływu. Zysk musi być <strong>widoczny w najbliższych zmianach</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="21-refaktoryzacja-od-wzorca">2.1. Refaktoryzacja od wzorca</h2>
<p>Refaktoryzacja <strong>od</strong> wzorca jest równie poprawna jak <strong>do</strong> wzorca. Sygnały nadmiaru:</p>
<ul>
<li>jedna implementacja od dawna lub interfejs powtarzający API jednej klasy,</li>
<li>fabryka z jednym konstruktorem, konfiguracja trudniejsza od <code>new</code>,</li>
<li>większość implementacji rzuca <code>UnsupportedOperationException</code>,</li>
<li>nowy wariant nadal wymaga zmian w wielu centralnych miejscach,</li>
<li>pośrednik, który tylko przekazuje wywołania (Middle Man),</li>
<li>globalna instancja, która ukrywa zależność i łączy testy (Singleton).</li>
</ul>
</section>

<h2 id="22-kierunki-odwrotne">2.2. Kierunki odwrotne</h2>
<table>
<thead>
<tr>
<th>Nadmiar</th>
<th>Refaktoryzacja od wzorca</th>
</tr>

<tbody>
<tr>
<td>pośrednik przekazujący 1:1</td>
<td>Remove Middle Man (odwrotność Hide Delegate)</td>
</tr>
<tr>
<td>globalny, mutowalny Singleton</td>
<td>Inline Singleton</td>
</tr>
<tr>
<td>podklasa bez stanu i zachowania</td>

</tr>
<tr>
<td>Strategy z jedną, stałą implementacją</td>

</tr>
<tr>
<td>fabryka z jednym konstruktorem</td>

</tr>
<tr>

</tr>

<td>metody polimorficzne, <code>switch</code> po <code>sealed</code></td>
</tr>
</tbody>
</table>
<p>Usunięcie wzorca to też refaktoryzacja: ten sam test, te same małe kroki. CineLegacy s21: Strategy z jedną implementacją po wygaśnięciu wariantu.</p>
</section>

<h2 id="23-remove-middle-man">2.3. Remove Middle Man</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: ReleaseDashboard → ReleaseService.statusOf → registry.statusOf</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">DeploymentStatus</span> <span class="hljs-title function_">statusOf</span><span class="hljs-params">(String deploymentId)</span> {
    <span class="hljs-keyword">return</span> registry.statusOf(deploymentId);          <span class="hljs-comment">// ReleaseService tylko przekazuje</span>
}
<span class="hljs-comment">// po: dashboard rozmawia z rejestrem bezpośrednio</span>
<span class="hljs-type">public</span> <span class="hljs-title function_">ReleaseDashboard</span><span class="hljs-params">(DeploymentRegistry registry)</span> {
    <span class="hljs-built_in">this</span>.registry = Objects.requireNonNull(registry, <span class="hljs-string">&quot;registry must not be null&quot;</span>);
}
</code></pre>
<ul>
<li>Najpierw potwierdź, że pośrednik nie realizuje autoryzacji, transakcji, telemetrii, retry ani translacji błędów.</li>
<li>Migruj jednego klienta naraz; stare metody jako forwardery w okresie zgodności.</li>
<li>CineLegacy s22: <code>CinemaFacade.freeSeats</code> po cichu tłumaczy brak seansu na <code>0</code> - to nie jest czysty pośrednik.</li>
</ul>
</section>

<h2 id="24-inline-singleton---przed-i-po">2.4. Inline Singleton - przed i po</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// przed: ukryta zależność od globalnego, mutowalnego stanu</span>
<span class="hljs-type">LegacyFeatureFlags</span> <span class="hljs-variable">flags</span> <span class="hljs-operator">=</span> LegacyFeatureFlags.getInstance();
<span class="hljs-type">String</span> <span class="hljs-variable">stages</span> <span class="hljs-operator">=</span> flags.isEnabled(<span class="hljs-string">&quot;canary&quot;</span>) ? <span class="hljs-string">&quot;10% -&gt; 50% -&gt; 100%&quot;</span> : <span class="hljs-string">&quot;100%&quot;</span>;

<span class="hljs-comment">// po: niezmienna wartość przekazana jawnie</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">FeatureFlags</span><span class="hljs-params">(Set&lt;String&gt; enabled)</span> {

}
<span class="hljs-type">public</span> <span class="hljs-title function_">RolloutService</span><span class="hljs-params">(FeatureFlags flags)</span> {
    <span class="hljs-built_in">this</span>.flags = Objects.requireNonNull(flags, <span class="hljs-string">&quot;flags&quot;</span>);
}

<h2 id="25-inline-singleton---procedura-i-ryzyka">2.5. Inline Singleton - procedura i ryzyka</h2>
<ul>
<li>Procedura: parametr konstruktora (przejściowo z domyślnym <code>getInstance()</code>) → migracja klientów pojedynczo → tworzenie w korzeniu kompozycji → usunięcie <code>getInstance()</code> i <code>reset()</code>.</li>
<li>Stary test wymaga <code>reset()</code> i <code>@ResourceLock</code> - dowód, że globalny stan łączy testy.</li>
<li>Mutowalny singleton → niezmienna wartość to <strong>zmiana kontraktu</strong>: <code>enable()</code> w trakcie działania przestaje działać. Ustal, czy ktoś przełączał flagi w locie.</li>
<li>Sprawdź wszystkie wywołania <code>getInstance()</code>, także z refleksji, skryptów i innych modułów.</li>
<li>Potrzebna zmienność w locie → jawny port źródła flag, nie globalny obiekt.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="31-refaktoryzacja-a-zmiana-kontraktu">3.1. Refaktoryzacja a zmiana kontraktu</h2>
<ul>
<li>Refaktoryzacja zachowuje <strong>obserwowalne zachowanie</strong> w przyjętej granicy - nie strukturę klas ani prywatne metody.</li>
<li>Kryterium: klient nie dostrzega żadnej nieuzgodnionej różnicy.</li>
<li>Nowa walidacja, inny typ wyjątku, kopia defensywna, ukrycie publicznej klasy - to <strong>zmiany kontraktu</strong>.</li>
<li>Takie kroki wykonuj i zatwierdzaj <strong>osobno</strong> od ruchów strukturalnych.</li>
<li>Pełny wektor obserwowalnego zachowania - moduł 3, sekcja 4.6. CineLegacy s23: <code>double</code> → <code>BigDecimal</code> „przy okazji” zmienia zaokrąglenie i format zera.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="32-co-trzeba-zachowa%C4%87-przy-wprowadzaniu-wzorca">3.2. Co trzeba zachować przy wprowadzaniu wzorca</h2>
<ul>
<li>Nie tylko wynik: typ wyjątku (i komunikat, jeśli jest kontraktem), stan po sukcesie i po błędzie.</li>
<li>Liczba i kolejność efektów ubocznych, moment wyboru wariantu i odczytu konfiguracji.</li>
<li>W callbackach: wątek, kolejność odbiorców, polityka błędów, tożsamość przekazanego obiektu.</li>
<li><code>null</code>, wartość nieznana, gałąź domyślna; atomowość przejść i używany monitor.</li>
<li>Zgodność danych, refleksji i publicznego API.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="35-zgodno%C5%9B%C4%87-refleksja-serializacja-orm-i-di">3.5. Zgodność, refleksja, serializacja, ORM i DI</h2>
<ul>
<li>Biblioteka: klient skompilowany przeciw <code>v1</code> uruchomiony z <code>v2</code> - pełny build sprawdza głównie zgodność <strong>źródłową</strong>.</li>
<li>Przeniesienie metody zmienia <code>getDeclaredMethods()</code> i <code>getDeclaringClass()</code>; <code>@Inherited</code> działa tylko dla adnotacji klas z nadklasy.</li>
<li>Serializacja Javy: osobna postać dla każdego poziomu hierarchii - testuj historyczny plik <code>.ser</code> z nową wersją.</li>
<li>ORM: hierarchia encji to migracja modelu (dyskryminator, tabele, proxy) - test z prawdziwym dostawcą i <code>flush</code>.</li>
<li>DI: nazwy, konstruktory, adnotacje, proxy - uruchom kontekst aplikacji, nie tylko <code>new</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="41-co-daje-ide-a-czego-nie-dowodzi">4.1. Co daje IDE, a czego nie dowodzi</h2>
<ul>
<li>Rename, Move, Extract, Inline, Change Signature i Safe Delete działają na <strong>modelu symboli</strong> - bezpieczniej niż szukaj-i-zamień.</li>
<li>IDE nie widzi refleksji, konfiguracji, szablonów, nazw serializowanych (JSON, kolumny, nagłówki CSV) ani konsumentów spoza repozytorium.</li>
<li>Automat nie zna semantyki: nie wie, czy dwa podobne fragmenty znaczą to samo.</li>
<li>Jeden ruch automatu = kompilacja, testy, commit; ręczne poprawki w osobnym kroku.</li>
<li>Receptury (np. OpenRewrite) zwiększają zasięg zmiany - także <strong>zasięg błędu</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<p>Extract Method to zwykle <strong>pierwszy krok</strong> do każdego wzorca: gałąź <code>switch</code> staje się metodą, potem klasą stanu, strategii lub komendy.</p>

<h2 id="44-extract-method---mechanika-i-trudne-przypadki">4.4. Extract Method - mechanika i trudne przypadki</h2>
<ul>
<li><strong>Mechanika:</strong> najmniejszy fragment → nazwa → parametry i wynik → kopia bez upraszczania → wywołanie → test.</li>
<li>Uwaga na <code>return</code>/<code>break</code>/<code>continue</code>, <code>try-with-resources</code>, <code>catch</code>/<code>finally</code>, <code>synchronized</code>.</li>
<li>Także <code>this</code>/<code>super</code>, metody przesłaniane, lambdy, przeciążenia, efekty w getterach.</li>
<li>Nie wolno przesunąć efektu przed warunek, zmienić liczby wywołań ani wydłużyć trzymania blokady.</li>
<li>CineLegacy s25: bloki opisane komentarzami; pętla liczy jednocześnie sumę i liczbę miejsc VIP (dwie wartości wyjściowe).</li>
</ul>
</section>

<h2 id="45-ruchy-ide-w-drodze-do-wzorca">4.5. Ruchy IDE w drodze do wzorca</h2>

</tr>
<tr>
<td>Template Method</td>
<td>Extract Method w podklasach → Change Signature → Pull Members Up</td>
</tr>
<tr>

<td>Replace Inheritance with Delegation → Extract Interface</td>
</tr>
<tr>

</tr>
<tr>

<td>Inline Method, Remove Middle Man, Inline Class, Introduce Parameter</td>
</tr>

<h2 id="51-bezpieczna-p%C4%99tla-pracy">5.1. Bezpieczna pętla pracy</h2>
<ol>
<li>Nazwij problem i granicę obserwowalnego zachowania.</li>
<li>Dodaj test charakterystyki dla każdej gałęzi i każdej awarii.</li>
<li>Wprowadź minimalny kontrakt, początkowo delegujący do starego kodu.</li>
<li>Przenoś jedną gałąź lub efekt naraz, testy po każdym ruchu.</li>
<li>Stary warunek usuń po migracji wszystkich klientów; nadmiar wzorca usuń w osobnym kroku.</li>
</ol>
<p>Pierwszy commit ma być <strong>mały i odwracalny</strong> - nie zaczynamy od tworzenia wszystkich klas wzorca.</p>
</section>

<h2 id="52-test-r%C3%B3wnowa%C5%BCno%C5%9Bci-przed-i-po">5.2. Test równoważności przed i po</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@ParameterizedTest</span>
<span class="hljs-meta">@EnumSource(CustomerTier.class)</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">strategyAxisPreservesEveryTierCost</span><span class="hljs-params">(CustomerTier tier)</span> {
    <span class="hljs-type">var</span> <span class="hljs-variable">before</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">LegacyReleaseConsole</span>(tier);
    <span class="hljs-type">var</span> <span class="hljs-variable">after</span> <span class="hljs-operator">=</span> ReleaseConsole.forTier(tier);
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> hours : <span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[] {<span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">10</span>, <span class="hljs-number">33</span>, <span class="hljs-number">100</span>}) {
        assertEquals(before.supportCost(hours), after.supportCost(hours));
    }
    assertEquals(
        assertThrows(IllegalArgumentException.class, () -&gt; before.supportCost(-<span class="hljs-number">1</span>)).getMessage(),
        assertThrows(IllegalArgumentException.class, () -&gt; after.supportCost(-<span class="hljs-number">1</span>)).getMessage());
}
</code></pre>
<ul>
<li>Obie wersje żyją obok siebie do końca migracji; test porównuje wynik <strong>i</strong> awarię.</li>
<li>Dodaj niezależne oczekiwanie (np. dosłowny log) - test różnicowy nie wykryje błędu obecnego w obu wersjach.</li>
</ul>

<h2 id="54-testy-struktury-i-ich-koszt">5.4. Testy struktury i ich koszt</h2>
<ul>
<li>Część celu wzorca to <strong>struktura</strong>: <code>final</code> eksporter, pakietowo-prywatne podsystemy fasady, komponenty znające tylko mediator.</li>
<li>Test refleksyjny utrwala taką decyzję (<code>subsystemsAreHiddenBehindTheFacade</code>, <code>componentsKnowOnlyTheMediator</code>).</li>
<li>Jest kruchy - stosuj go dla reguł, które naprawdę są kontraktem architektury; resztę zostaw przeglądowi.</li>
<li>Kontrolna mutacja: przestaw ogniwa łańcucha albo usuń <code>approverPicker.clear()</code> w mediatorze i sprawdź, który test to wykryje.</li>
<li><code>@ResourceLock(&quot;LegacyFeatureFlags&quot;)</code> w teście to dowód zapachu, który usuwa Inline Singleton.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">supportCost</span><span class="hljs-params">(<span class="hljs-type">int</span> hours)</span> {                 <span class="hljs-comment">// (a) taryfa klienta</span>

<h2 id="63-po-jeden-mechanizm-na-ka%C5%BCd%C4%85-o%C5%9B">6.3. Po: jeden mechanizm na każdą oś</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@FunctionalInterface</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">SupportCostPolicy</span> {                 <span class="hljs-comment">// Strategy</span>
    <span class="hljs-type">SupportCostPolicy</span> <span class="hljs-variable">PREMIUM</span> <span class="hljs-operator">=</span> hours -&gt; <span class="hljs-number">500</span> + hours * <span class="hljs-number">80L</span>;
    <span class="hljs-type">long</span> <span class="hljs-title function_">cost</span><span class="hljs-params">(<span class="hljs-type">int</span> hours)</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">OperatorCommand</span> {            <span class="hljs-comment">// Command</span>
    <span class="hljs-type">void</span> <span class="hljs-title function_">execute</span><span class="hljs-params">(Cluster cluster)</span>;
    <span class="hljs-type">void</span> <span class="hljs-title function_">undo</span><span class="hljs-params">(Cluster cluster)</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ReleaseLifecycle</span> {                <span class="hljs-comment">// State</span>
    <span class="hljs-keyword">private</span> <span class="hljs-type">State</span> <span class="hljs-variable">state</span> <span class="hljs-operator">=</span> State.PLANNED;
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">advance</span><span class="hljs-params">()</span> { state = state.advance(); }
}

<ul>
<li><code>ReleaseConsole</code> składa trzy mechanizmy; walidacja <code>hours &lt; 0</code> zostaje w kontekście.</li>
<li>Wykonanie i cofnięcie są obok siebie w jednej klasie polecenia, a nie w dwóch <code>switch</code>.</li>

<h2 id="64-strategy---intencja-sekwencja-ryzyka">6.4. Strategy - intencja, sekwencja, ryzyka</h2>
<ul>
<li>Kandydat: kilka wariantów tego samego obliczenia, wybieranych <strong>niezależnie od klasy obiektu</strong>.</li>
<li>Samo <code>if</code> nie uzasadnia Strategy - dla prostego, stabilnego warunku interfejs pogarsza czytelność.</li>
<li>Sekwencja: tabela decyzji (<code>null</code>, nieznany, przepełnienie) → interfejs ze strategią przejściową → gałęzie do strategii → wybór w korzeniu kompozycji lub fabryce.</li>
<li>Wybór w konstruktorze <strong>zamraża</strong> decyzję - nie jest równoważny odczytowi konfiguracji przy każdym wywołaniu.</li>
<li><code>Function</code>/<code>ToLongFunction</code> nie deklarują wyjątków kontrolowanych - wtedy własny interfejs z <code>throws</code>.</li>
</ul>
</section>

<h2 id="66-state---kolejno%C5%9B%C4%87-przej%C5%9Bcia-i-efekt%C3%B3w">6.6. State - kolejność przejścia i efektów</h2>
<ul>
<li>Kontrakt efektów: efekt, potem stan; stan, potem efekt; outbox; albo rozdzielenie stanu i próby efektu.</li>
<li>Żaden wariant nie jest uniwersalny - refaktoryzacja zachowuje dotychczasowy moment zmiany stanu.</li>
<li><code>volatile</code> daje widoczność referencji, nie atomowość sekwencji sprawdzenie-efekt-zapis.</li>
<li>Funkcja w <code>updateAndGet</code> może wykonać się wielokrotnie - bez nieidempotentnych efektów.</li>
<li>Przy dwóch stanach <code>switch</code> bywa czytelniejszy; kilka osi stanu grozi eksplozją klas.</li>
</ul>
</section>

<h2 id="67-command---rejestr-i-ograniczenia">6.7. Command - rejestr i ograniczenia</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">public</span> <span class="hljs-title function_">DeploymentCommandDispatcher</span><span class="hljs-params">(Map&lt;DeploymentAction, DeploymentCommand&gt; commands)</span> {

    <span class="hljs-type">EnumSet</span>&lt;DeploymentAction&gt; <span class="hljs-variable">missing</span> <span class="hljs-operator">=</span> EnumSet.allOf(DeploymentAction.class);
    missing.removeAll(copy.keySet());
    <span class="hljs-keyword">if</span> (!missing.isEmpty()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;missing commands: &quot;</span> + missing);

<ul>
<li>Mapa jest równoważna <code>switch</code> tylko przy <strong>rozłącznym kluczu</strong> - nie przy nakładających się predykatach (to Chain, sekcja 8).</li>
<li>Command <strong>nie daje automatycznie</strong> asynchroniczności, retry ani undo; <code>undo</code> wymaga modelu kompensacji (<code>OperatorCommand.undo</code>).</li>
<li>Komendy współdzielone są bezstanowe; dane żądania to argument.</li>
</ul>
</section>

<h2 id="68-typowe-pomy%C5%82ki-przy-wyborze">6.8. Typowe pomyłki przy wyborze</h2>
<ul>
<li>Strategy dla stanu („bo to też <code>switch</code>”) - wariant zmienia sam obiekt, więc to State.</li>
<li>State dla rodzaju obiektu, który się nie zmienia - to polimorfizm podtypów.</li>
<li>Command bez potrzeby kolejki, logu ani cofania - wystarczy metoda lub mapa funkcji.</li>
<li>Komenda pamiętająca dane poprzedniego żądania; pole konkretnego obiektu w enumie stanu.</li>
<li>Kombinatoryczna hierarchia (<code>PremiumDeployingScaleUp</code>) zamiast złożenia osi.</li>
</ul>
<p>CineLegacy s26: cena według typu biletu, operacje kasjera z cofaniem, cykl życia rezerwacji.</p>

<h2 id="72-template-method---sekwencja-i-ryzyka">7.2. Template Method - sekwencja i ryzyka</h2>
<ul>
<li>Extract Method w każdej klasie, ujednolicaj sygnatury po jednym kroku, Pull Up Method dla szkieletu.</li>
<li>Hook opcjonalny tylko przy poprawnym domyślnym zachowaniu dla wszystkich podklas.</li>
<li>Nowa metoda abstrakcyjna psuje podklasy; hook z konstruktora bazy widzi domyślne pola podklasy.</li>
<li><code>synchronized</code> w szablonie trzyma monitor podczas hooków - ryzyko zakleszczenia.</li>
<li>Wiele hooków lub zmienna kolejność → kompozycja lub Strategy.</li>
</ul>
</section>

<h2 id="74-po-szkielet-w-klasie-finalnej-osie-jako-strategie">7.4. Po: szkielet w klasie finalnej, osie jako strategie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ReleaseNotesExporter</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> NotesFormat format;          <span class="hljs-comment">// header, entry, footer</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> ContentSelection selection;  <span class="hljs-comment">// tytuł i Predicate&lt;ChangeEntry&gt;</span>

    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">export</span><span class="hljs-params">(String version, List&lt;ChangeEntry&gt; entries)</span> {

<h2 id="75-replace-inheritance-with-delegation">7.5. Replace Inheritance with Delegation</h2>
<ul>
<li>Kiedy: podklasa nie jest zastępowalnym wariantem, <code>extends</code> służy ponownemu użyciu, haki niosą <strong>niezależne</strong> osie, wariant ma być wymienny.</li>
<li>Procedura: zgrupuj haki według osi → Extract Interface dla każdej osi → delegat przejściowy wołający stary hak → przenieś implementacje → usuń podklasy po migracji klientów.</li>
<li>Hook woła się na delegacie, nie na <code>this</code>; stan <code>protected</code> bazy nie jest dostępny dla strategii.</li>
<li>Znika typ podklasy: <code>instanceof</code>, DI po typie, <code>synchronized</code> na innym monitorze.</li>
<li>Tytuł przechodzi z kodu podklasy do danych strategii; <code>HtmlFormat</code> ucieka wersję, tytułu nie - tak jak legacy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="76-strategy-czy-template-method">7.6. Strategy czy Template Method?</h2>
<table>
<thead>
<tr>
<th>Kryterium</th>
<th>Template Method</th>
<th>Strategy</th>
</tr>
</thead>
<tbody>
<tr>
<td>osie zmienności</td>
<td>jedna</td>
<td>jedna lub kilka niezależnych</td>
</tr>
<tr>
<td>wymiana wariantu</td>
<td>wybór podklasy</td>
<td>przy konstrukcji, także w czasie życia</td>
</tr>
<tr>
<td>dostęp do stanu bazy</td>
<td>tak (<code>protected</code>)</td>
<td>tylko przez parametry</td>
</tr>
<tr>
<td>typowe ryzyko</td>
<td>kruche haki, eksplozja podklas</td>
<td>więcej obiektów, konfiguracja</td>
</tr>
<tr>
<td>test wariantu</td>
<td>podklasa testowa</td>
<td>lambda lub fake</td>
</tr>
</tbody>
</table>
<p>Template Method jest dobry, gdy szkielet jest stabilny, a zmienny jest <strong>jeden</strong> krok. Dwie osie w hakach → Strategy. CineLegacy s27: okres × format raportu.</p>
</section>

<h2 id="81-move-embellishment-to-decorator">8.1. Move Embellishment to Decorator</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">run</span><span class="hljs-params">(String releaseId)</span> {
    audit.accept(<span class="hljs-string">&quot;start:&quot;</span> + releaseId);
    <span class="hljs-keyword">try</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> delegate.run(releaseId);
        audit.accept(<span class="hljs-string">&quot;success:&quot;</span> + releaseId);
        <span class="hljs-keyword">return</span> result;
    } <span class="hljs-keyword">catch</span> (RuntimeException exception) {
        audit.accept(<span class="hljs-string">&quot;failure:&quot;</span> + releaseId + <span class="hljs-string">&quot;:&quot;</span> + exception.getClass().getSimpleName());
        <span class="hljs-keyword">throw</span> exception;
    }
}
</code></pre>
<ul>
<li>Opcjonalny dodatek wokół rdzenia (audyt, retry, cache) z <strong>tym samym kontraktem</strong> co rdzeń.</li>
<li><strong>Kolejność jest zachowaniem:</strong> <code>audit(retry(core))</code> to jeden wpis, <code>retry(audit(core))</code> - wpis na próbę.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="82-decorator---wyj%C4%85tki-migracja-przezroczysto%C5%9B%C4%87">8.2. Decorator - wyjątki, migracja, przezroczystość</h2>
<ul>
<li>Zachowana jest instancja wyjątku delegata, ale błąd samego audytu może <strong>zasłonić</strong> błąd rdzenia - potrzebna jawna polityka.</li>
<li>Migracja: wąski interfejs, zapis kolejności dla sukcesu i awarii, dekorator przekazujący, potem po jednym dodatku.</li>
<li>Składanie łańcucha w kontrolowanej fabryce; dawną flagę usuń po migracji.</li>
<li>Nieprzezroczysty dla <code>getClass</code>, tożsamości, serializacji i monitora <code>synchronized</code>.</li>
<li>Ślepe delegowanie <code>equals</code> łamie symetrię.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="83-%C5%82a%C5%84cuch-ifelse-z-ukryt%C4%85-kolejno%C5%9Bci%C4%85">8.3. Łańcuch <code>if/else</code> z ukrytą kolejnością</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">if</span> (request.linesChanged() &gt; <span class="hljs-number">5_000</span>) {
    <span class="hljs-keyword">return</span> Decision.of(Approver.REJECTED, <span class="hljs-string">&quot;change too large&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (request.risk() == Risk.LOW
        &amp;&amp; (request.linesChanged() &lt;= <span class="hljs-number">50</span> || !request.production())) {
    <span class="hljs-keyword">return</span> Decision.of(Approver.AUTOMATIC, <span class="hljs-string">&quot;small low-risk change&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (request.risk() != Risk.HIGH &amp;&amp; request.linesChanged() &lt;= <span class="hljs-number">500</span>) {
    <span class="hljs-keyword">return</span> Decision.of(Approver.TEAM_LEAD, <span class="hljs-string">&quot;moderate change&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (request.risk() != Risk.HIGH || !request.production()) {
    <span class="hljs-keyword">return</span> Decision.of(Approver.RELEASE_MANAGER, <span class="hljs-string">&quot;large or non-production change&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (request.linesChanged() &lt;= <span class="hljs-number">2_000</span>) {
    <span class="hljs-keyword">return</span> Decision.of(Approver.CHANGE_ADVISORY_BOARD, <span class="hljs-string">&quot;high-risk production change&quot;</span>);
}
<span class="hljs-keyword">return</span> Decision.of(Approver.REJECTED, <span class="hljs-string">&quot;no approver for &quot;</span> + request.id());
</code></pre>
<p>Warunek <code>RELEASE_MANAGER</code> jest poprawny tylko dlatego, że wcześniejsze gałęzie odfiltrowały mniejsze zmiany - <strong>kolejność jest regułą</strong>.</p>
</section>

<h2 id="84-chain-of-responsibility---ogniwo-i-z%C5%82o%C5%BCenie">8.4. Chain of Responsibility - ogniwo i złożenie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ApprovalHandler</span> {
    <span class="hljs-keyword">private</span> ApprovalHandler next;
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-type">ApprovalHandler</span> <span class="hljs-title function_">then</span><span class="hljs-params">(ApprovalHandler next)</span> {
        <span class="hljs-built_in">this</span>.next = Objects.requireNonNull(next, <span class="hljs-string">&quot;next&quot;</span>);
        <span class="hljs-keyword">return</span> next;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">Decision</span> <span class="hljs-title function_">handle</span><span class="hljs-params">(ChangeRequest request)</span>;
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Decision</span> <span class="hljs-title function_">passOn</span><span class="hljs-params">(ChangeRequest request)</span> {
        <span class="hljs-keyword">if</span> (next == <span class="hljs-literal">null</span>) <span class="hljs-keyword">return</span> Decision.of(Approver.REJECTED, <span class="hljs-string">&quot;no approver for &quot;</span> + request.id());
        <span class="hljs-keyword">return</span> next.handle(request);
    }
}
<span class="hljs-comment">// ApprovalRouter.standard(): SizeLimit → Automatic → TeamLead → ReleaseManager → ChangeAdvisoryBoard</span>
</code></pre>
<p>Każde ogniwo samo decyduje: obsługuje i kończy albo <code>passOn</code>. Kolejność widać w <strong>jednym</strong> wyrażeniu.</p>
</section>

<h2 id="85-chain---sekwencja-i-ryzyka">8.5. Chain - sekwencja i ryzyka</h2>
<ul>
<li>Sekwencja: test różnicowy na granicach progów → Extract Method dla gałęzi → klasa ogniwa z <code>passOn</code> → złożenie w jednym miejscu → usunięcie <code>if/else</code>.</li>
<li>Ogniwa <strong>nie są niezależne</strong>: warunek ogniwa zakłada, że poprzednie odmówiły. Przestawienie zmienia wynik.</li>
<li>Koniec łańcucha to decyzja (<code>REJECTED</code>), nie <code>null</code>; dokładnie jedno ogniwo obsługuje żądanie.</li>
<li>Mutowalne <code>next</code>: złóż łańcuch raz, przy starcie; ogniw nie współdziel między łańcuchami.</li>
<li>Pięć gałęzi w jednej stabilnej metodzie bywa czytelniejsze - łańcuch opłaca się przy kilku procesach zatwierdzania.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="90" data-size="16:9">
<h2 id="86-chain-of-responsibility-czy-decorator">8.6. Chain of Responsibility czy Decorator?</h2>
<table>
<thead>
<tr>
<th></th>
<th>Decorator</th>
<th>Chain of Responsibility</th>
</tr>
</thead>
<tbody>
<tr>
<td>ile elementów pracuje</td>
<td>wszystkie warstwy</td>
<td>zwykle jedno ogniwo</td>
</tr>
<tr>
<td>delegowanie</td>
<td>zawsze do opakowanego</td>
<td>tylko gdy ogniwo nie obsłuży</td>
</tr>
<tr>
<td>wynik</td>
<td>rdzeń i dodatek (audyt, retry, cache)</td>
<td>decyzja jednego ogniwa</td>
</tr>
<tr>
<td>kolejność oznacza</td>
<td>zasięg dodatków</td>
<td>priorytet reguł</td>
</tr>
<tr>
<td>przerwanie</td>
<td>wyjątek lub skrót (cache)</td>
<td>normalny przepływ</td>
</tr>
</tbody>
</table>
<p>Pytanie kontrolne: czy po obsłużeniu przez ten element <strong>ktoś dalej</strong> musi pracować? Tak → Decorator, nie → Chain. Audyt decyzji to Decorator wokół <code>ApprovalRouter</code>, nie kolejne ogniwo. CineLegacy s28.</p>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LegacyGatewayAdapter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ReleaseNotifier</span> {

        Objects.requireNonNull(message, <span class="hljs-string">&quot;message&quot;</span>);

<ul>
<li>Klient (<code>NotificationService</code>) zależy tylko od <strong>preferowanego kontraktu</strong> <code>ReleaseNotifier</code>.</li>

<h2 id="92-adapter---co-naprawd%C4%99-trzeba-przet%C5%82umaczy%C4%87">9.2. Adapter - co naprawdę trzeba przetłumaczyć</h2>
<ul>
<li>Podobna sygnatura ≠ podobny kontrakt: jednostki, strefa czasowa, precyzja, kodowanie.</li>
<li>Znaczenie <code>null</code> i pustej wartości, indeksowanie, mutowalność wejścia i wyniku.</li>
<li>Wyjątki mapowane z zachowaniem przyczyny; idempotencja, wątek wykonania.</li>
<li>Adapter <code>AutoCloseable</code> musi wiedzieć, czy jest <strong>właścicielem</strong> zasobu.</li>
<li>Jeśli wystarczy Rename Method lub Move Method, adapter jest zbędny.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="93-surowy-%C5%82adunek-w-domenie">9.3. Surowy ładunek w domenie</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">canRelease</span><span class="hljs-params">(String buildId)</span> {
    <span class="hljs-type">Map</span>&lt;String, String&gt; <span class="hljs-variable">payload</span> <span class="hljs-operator">=</span> ciClient.fetchBuild(buildId);
    <span class="hljs-type">boolean</span> <span class="hljs-variable">succeeded</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;SUCCESS&quot;</span>.equals(payload.get(<span class="hljs-string">&quot;status&quot;</span>).trim().toUpperCase());
    <span class="hljs-type">int</span> <span class="hljs-variable">failed</span> <span class="hljs-operator">=</span> Integer.parseInt(payload.get(<span class="hljs-string">&quot;failed&quot;</span>).trim());
    <span class="hljs-type">double</span> <span class="hljs-variable">coverage</span> <span class="hljs-operator">=</span> Double.parseDouble(payload.get(<span class="hljs-string">&quot;coverage&quot;</span>).trim());
    <span class="hljs-keyword">return</span> succeeded &amp;&amp; failed == <span class="hljs-number">0</span> &amp;&amp; coverage &gt;= <span class="hljs-number">80.0</span>;
}
</code></pre>
<ul>
<li><code>LegacyReleaseGate</code> powtarza nazwy kluczy, parsowanie i normalizację w każdej metodzie.</li>
<li>Błędny ładunek wybucha <strong>głęboko w domenie</strong>: <code>NumberFormatException</code>, <code>NullPointerException</code>.</li>
<li>Reguła wydania (sukces, zero błędów, pokrycie ≥ 80) ginie wśród szczegółów formatu.</li>
</ul>
</section>

<h2 id="95-dane-na-granicy---decyzje">9.5. Dane na granicy - decyzje</h2>
<ul>
<li>Granicę przekraczają rekordy, obiekty wartości i błędy kontraktu, nie mapy ani modele frameworka.</li>
<li>Walidacja na granicy zmienia <strong>typ i moment</strong> błędu: <code>NumberFormatException</code> w domenie → <code>IllegalArgumentException(&quot;invalid CI payload: ...&quot;)</code> w adapterze. To zmiana kontraktu dla danych błędnych - do zatwierdzenia.</li>
<li>Dla danych poprawnych decyzje i podsumowania są identyczne (test różnicowy na pięciu ładunkach).</li>
<li>Drobna różnica do nazwania: normalizacja z <code>Locale.ROOT</code> zamiast domyślnego locale.</li>
<li>Osobny model ma sens, gdy granica oddziela różne semantyki lub tempo zmian - nie kopiuj mechanicznie każdego DTO.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="96-adapter-czy-boundary-object">9.6. Adapter czy Boundary Object?</h2>
<table>
<thead>
<tr>
<th></th>
<th>Adapter</th>
<th>Boundary Object</th>
</tr>

<tr>

<td>interfejs: wywołania, nazwy, protokół</td>
<td>dane: format, typy, walidację</td>
</tr>
<tr>
<td>odpowiada na pytanie</td>
<td>jak wywołać obcy system?</td>
<td>co wpuszczamy do domeny?</td>
</tr>
<tr>
<td>typowy produkt</td>

</tr>
<tr>
<td>ryzyko</td>
<td>udawana zgodność semantyczna</td>
<td>kopiowanie każdego DTO bez potrzeby</td>
</tr>
</tbody>
</table>
<p>Zwykle występują razem: adapter implementuje port i zwraca obiekt graniczny (<code>CiBuildReportsAdapter</code> → <code>BuildReport</code>). CineLegacy: s14 (Adapter), s29 (odpowiedź terminala <code>OK;AUTH-R1;4500</code>).</p>
</section>

<h2 id="102-factory---intencja-procedura-pu%C5%82apki">10.2. Factory - intencja, procedura, pułapki</h2>
<ul>
<li><strong>Encapsulate Classes with Factory</strong> ukrywa klasy konkretne; <strong>Extract Factory Class</strong> wydziela tworzenie z klasy o innej odpowiedzialności.</li>
<li>Zinwentaryzuj konstruktory, refleksję, DI, deserializatory; przekierowuj tworzenie pojedynczo, widoczność ogranicz na końcu.</li>
<li>Tworzenie wariantów z wyprzedzeniem lub cache może uruchomić kosztowne efekty wcześniej niż stara gałąź.</li>
<li>Fabryka nie może stać się <strong>globalnym rejestrem usług</strong>.</li>
<li>Ukrycie publicznego konstruktora w bibliotece wymaga etapu <code>@Deprecated</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="103-fabryka-jako-stra%C5%BCnik-sp%C3%B3jno%C5%9Bci">10.3. Fabryka jako strażnik spójności</h2>
<ul>
<li>Jedno miejsce wiedzy o konstrukcji: walidacja, wybór klasy, kanonizacja, mapowanie konfiguracji.</li>
<li>W module: <code>DeploymentZone.fromCode</code> (kanoniczne instancje), <code>SupportCostPolicy.forTier</code>, <code>OperatorCommand.byName</code> (nieznana akcja → wyjątek), <code>ApprovalRouter.standard()</code> (kolejność ogniw).</li>
<li>Produkty <code>private</code> lub pakietowo-prywatne - klient nie utworzy niespójnego obiektu z pominięciem walidacji.</li>
<li>Metoda fabrykująca vs klasa fabryki: wstrzykiwana klasa, gdy klient ma być testowany z innym produktem.</li>
<li>Fabryka ≠ korzeń kompozycji: fabryka tworzy obiekty na żądanie, korzeń składa graf raz, przy starcie.</li>
</ul>
<p>CineLegacy: s04 (Encapsulate Classes with Factory), s05 (Extract Factory Class).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="111-klient-orkiestruje-podsystemy">11.1. Klient orkiestruje podsystemy</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">publish</span><span class="hljs-params">(String releaseId, String environment)</span> {
    <span class="hljs-keyword">if</span> (releaseId == <span class="hljs-literal">null</span> || releaseId.isBlank()) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(...);
    <span class="hljs-type">String</span> <span class="hljs-variable">target</span> <span class="hljs-operator">=</span> environment.trim().toLowerCase(Locale.ROOT);
    <span class="hljs-keyword">if</span> (!Set.of(<span class="hljs-string">&quot;staging&quot;</span>, <span class="hljs-string">&quot;prod&quot;</span>).contains(target)) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(...);
    <span class="hljs-type">String</span> <span class="hljs-variable">artifact</span> <span class="hljs-operator">=</span> store.upload(releaseId);
    <span class="hljs-type">String</span> <span class="hljs-variable">config</span> <span class="hljs-operator">=</span> renderer.render(releaseId, target);
    queue.enqueue(artifact, config);
    notifier.announce(releaseId, target);
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;published &quot;</span> + releaseId + <span class="hljs-string">&quot; to &quot;</span> + target;
}

<ul>
<li><code>LegacyReleaseCli</code> i <code>LegacyReleaseScheduler</code> znają cztery podsystemy, ich kolejność i walidację.</li>

<h2 id="113-facade---procedura-i-ryzyka">11.3. Facade - procedura i ryzyka</h2>
<ul>
<li>Procedura: test efektów obu klientów → Extract Method orkiestracji → Move Method do fasady → przepięcie drugiego klienta → zawężenie widoczności podsystemów.</li>
<li>Zawężenie do pakietowo-prywatnych to <strong>zmiana API</strong> dla klientów spoza pakietu - osobny krok, po migracji.</li>
<li>Różnica do zapisania: <code>null</code> środowiska dawał <code>NullPointerException</code> bez komunikatu, teraz <code>requireNonNull(environment, &quot;environment&quot;)</code>.</li>
<li>Fasada to jedna spójna operacja, nie wszystkie operacje podsystemów (God Class); nie daje też transakcji.</li>
<li>Fasada przekazująca 1:1 bez reguł to Middle Man (sekcja 2).</li>
</ul>
</section>

<h2 id="124-acl---ryzyka-i-strangler-fig">12.4. ACL - ryzyka i Strangler Fig</h2>
<ul>
<li>Tłumaczenie <strong>zachłanne</strong> zmienia zachowanie dla danych błędnych: nieznany kod dawniej po cichu pomijany, teraz wyjątek; zła data w nieaktywnym rekordzie dawniej bez znaczenia, teraz zatrzymuje planowanie.</li>
<li>Polityka (odrzuć, pomiń z logiem, kwarantanna) to decyzja biznesowa, nie szczegół implementacji.</li>
<li>ACL to naturalny element <strong>Strangler Fig</strong> i <strong>Branch by Abstraction</strong>: port domenowy stoi, za nim stary i nowy dostawca.</li>
<li>Każdy element przejściowy potrzebuje właściciela, testów i <strong>kryterium usunięcia</strong>.</li>
<li>Koszt: drugi model, mapowanie, testy tłumacza - nie opłaca się, gdy model obcy jest zgodny z naszym.</li>
</ul>
</section>

<h2 id="131-encapsulate-composite-with-builder">13.1. Encapsulate Composite with Builder</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">DeploymentGroup</span> <span class="hljs-variable">plan</span> <span class="hljs-operator">=</span> PlanBuilder.group(<span class="hljs-string">&quot;release&quot;</span>)
        .group(<span class="hljs-string">&quot;database&quot;</span>, group -&gt; group
                .task(<span class="hljs-string">&quot;backup&quot;</span>, <span class="hljs-number">5</span>)
                .task(<span class="hljs-string">&quot;migrate&quot;</span>, <span class="hljs-number">8</span>))
        .task(<span class="hljs-string">&quot;deploy&quot;</span>, <span class="hljs-number">3</span>)
        .build();
</code></pre>
<ul>
<li>Uzasadniony, gdy budowa drzewa jest wieloetapowa i ma <strong>własne niezmienniki</strong>.</li>
<li><code>PlanBuilder</code> jest jednorazowy: każde wywołanie po <code>build()</code> rzuca <code>IllegalStateException</code>; wynik kopiuje listę.</li>
<li>Lambda grupy ma kontrakt synchroniczny - odroczenie lub ponowne wywołanie zmienia zachowanie.</li>
<li>Ustal: pusta grupa, unikalność nazw, kolejność dzieci; współdzielony podplan (DAG) liczy się dla każdej ścieżki.</li>
</ul>
</section>

<h2 id="132-builder---kiedy-i-ryzyka">13.2. Builder - kiedy i ryzyka</h2>
<ul>
<li>Kandydat: konstruktor teleskopowy, wiele opcjonalnych parametrów, budowa drzewa lub grafu z niezmiennikami.</li>
<li>Nie dla rekordu z trzema wymaganymi polami - kanoniczny konstruktor jest czytelniejszy.</li>
<li>Walidacja w każdym kroku (szybki błąd) czy w <code>build()</code> (niezmienniki całości) - wybór zmienia moment wyjątku.</li>
<li>Jednorazowość albo kopia przy <code>build()</code>; wynik niemutowalny; brak wycieku wewnętrznej listy.</li>
<li>Test Data Builder w testach to inna rola - tu chodzi o produkcyjne API tworzenia.</li>
</ul>
<p>CineLegacy s06: Builder dla drzewa repertuaru dzień - sala - seans.</p>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">CopyOnWriteArrayList</span>&lt;Registration&gt; <span class="hljs-variable">listeners</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">CopyOnWriteArrayList</span>&lt;&gt;();

<h2 id="142-observer---kontrakt-i-migracja">14.2. Observer - kontrakt i migracja</h2>
<ul>
<li>Subject zna tylko interfejs listenera; pierwszy krok zachowuje relację <strong>jeden do jednego</strong>.</li>
<li>Wielu odbiorców to często <strong>rozszerzenie</strong> zachowania, nie refaktoryzacja.</li>
<li>Kontrakt: synchroniczność i wątek, kolejność, duplikaty, wyjątki (tu fail-fast), wyrejestrowanie.</li>
<li>Iterator na migawce: listener usunięty w trakcie publikacji może być jeszcze wywołany w bieżącej.</li>
<li>Niezamknięty uchwyt wydłuża życie grafu obiektów; globalna szyna zdarzeń ukrywa zależności.</li>
</ul>
<p>CineLegacy s09: mail, SMS i punkty lojalnościowe wołane na sztywno po opłaceniu.</p>
</section>

<h2 id="153-mediator---procedura-i-ryzyka">15.3. Mediator - procedura i ryzyka</h2>
<ul>
<li>Test: ta sama sekwencja zdarzeń daje tę samą migawkę <code>FormState</code> po każdym kroku, także dla zdarzeń ignorowanych.</li>
<li>Procedura: interfejs mediatora → reguły jednego komponentu do mediatora → referencje do sąsiadów zastąpione wywołaniem mediatora → powtórz → usuń <code>connect</code>.</li>
<li>Kolejność aktualizacji bywa zachowaniem - rozstrzyga test migawek, nie intuicja; uważaj na reentrancję.</li>
<li>Ryzyko: <strong>God Mediator</strong> dla całego ekranu lub systemu - dziel według spójnych grup reguł.</li>
<li>Dwa komponenty i jedna zależność - zwykłe wywołanie wystarczy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<th></th>
<th>Observer</th>

</tr>
<tr>
<td>reguły współpracy</td>
<td>rozproszone w odbiorcach</td>
<td>skupione w mediatorze</td>
</tr>
<tr>

<td>odbiorcy nie znają się nawzajem</td>

<h2 id="162-do-i-od-visitora">16.2. Do i od Visitora</h2>
<ul>
<li>Do Visitora: łańcuchy <code>instanceof</code> lub <code>switch</code> po rodzaju węzła powtarzane w wielu operacjach, stabilny zestaw węzłów.</li>
<li>Java 21+: <code>switch</code> z dopasowaniem wzorców po <code>sealed</code> daje wyczerpujące sprawdzenie bez podwójnej dyspozycji - często prostsza alternatywa.</li>
<li>Od Visitora: nowe węzły częstsze niż nowe operacje albo jeden Visitor w całym kodzie.</li>
<li>Ryzyka: publiczny dostęp do danych węzła, rekurencja (głębokość, cykle), wynik opakowany (<code>Long</code>).</li>
<li>Dwie równoległe ścieżki akumulacji (metoda węzła i Visitor) - po decyzji zostaw jedną.</li>
</ul>
<p>CineLegacy: s18 (Collecting Parameter), s19 (Visitor).</p>

<h2 id="174-jeden-lub-wiele-i-extract-composite">17.4. Jeden lub wiele i Extract Composite</h2>
<ul>
<li><strong>Replace One/Many Distinctions with Composite:</strong> jeden kontrakt <code>execute(PlanComponent)</code> zamiast <code>execute</code> i <code>executeAll</code> z powielonymi regułami.</li>
<li>Nie zmieniaj: kolejności (preorder), pustej grupy, przerwania po pierwszym błędzie, liczby transakcji.</li>
<li>Safe Composite: zarządzanie dziećmi tylko w grupie; Transparent: we wspólnym kontrakcie, więc <code>add</code> na liściu wymaga wyjątku.</li>
<li><strong>Extract Composite:</strong> kilka klas hierarchii powiela obsługę dzieci (<code>ReleaseGroup</code>, <code>RollbackGroup</code>) → wspólna <code>CompositePlanNode</code>.</li>
<li>Podobne pętle mogą znaczyć co innego (pomijanie, kontynuacja po błędzie) - porównaj kontrakty. CineLegacy s12-s13.</li>
</ul>
</section>

<h2 id="175-collecting-parameter">17.5. Collecting Parameter</h2>
<ul>
<li>Metoda mutująca lokalny wynik → elementy same dopisują wynik do <strong>przekazanego akumulatora</strong>.</li>
<li><code>collectTasks(Collection&lt;? super DeploymentTask&gt;)</code>: liść dodaje siebie, grupa przekazuje akumulator dzieciom.</li>
<li>Wywołujący zachowuje własność kolekcji; ustal, czy metoda czyści, czy dopisuje.</li>
<li>Po wyjątku może zostać <strong>wynik częściowy</strong> - to część kontraktu.</li>
<li>Dobry parametr zbierający ma wąski typ; ogólna mutowalna mapa ukrywa zbyt wiele.</li>
</ul>
</section>

<h2 id="%C4%87wiczenie-2-command-strategy-czy-state-60-min">Ćwiczenie 2: Command, Strategy czy State (60 min)</h2>
<ul>
<li>Cel: w <code>LegacyReleaseConsole</code> przypisać każdą oś do mechanizmu i wprowadzić jeden kontrakt naraz.</li>
<li>Test równoważności dla kosztu, logu poleceń, cofania, cyklu życia i komunikatów błędów - przed pierwszą zmianą.</li>
<li>Stan przejściowy nie jest strategią; polecenie nie pamięta danych poprzedniego żądania.</li>
<li>Wariant CineLegacy: scena s26 (pulpit kasjera).</li>
</ul>
<p>Szczegóły: zadania modułu 5, Ćwiczenie 2.</p>
</section>

<ul>
<li><strong>A:</strong> <code>LegacyReleaseNotesExporter</code> z czterema podklasami → jeden eksporter i dwie strategie; nowa kombinacja bez nowej klasy.</li>
<li><strong>B:</strong> <code>LegacyApprovalRouter</code> → łańcuch ogniw; test na granicach progów przed zmianą.</li>

<h2 id="%C4%87wiczenie-4-granice---adapter-boundary-object-facade-acl-60-min">Ćwiczenie 4: granice - Adapter, Boundary Object, Facade, ACL (60 min)</h2>
<ul>
<li><strong>A:</strong> surowy ładunek CI → port, adapter i <code>BuildReport</code> (<code>boundaryobject/before</code>).</li>
<li><strong>B:</strong> orkiestracja skopiowana w dwóch klientach → fasada z ukrytymi podsystemami (<code>facade/before</code>).</li>
<li><strong>C:</strong> kody CMDB w regułach planowania → port domenowy i tłumacz (<code>anticorruptionlayer/before</code>).</li>
<li>Każda zmiana typu lub momentu błędu na granicy zapisana jako decyzja.</li>
<li>Wariant CineLegacy: sceny s29 (terminal), s30 (sklep i kasa), s31 (dystrybutor).</li>

<h2 id="kluczowe-wnioski-z-om%C3%B3wienia">Kluczowe wnioski z omówienia</h2>
<ul>
<li>Pośrednik i singleton bywają wartościowe - usuwamy je dopiero po pisemnej ocenie, co naprawdę robią.</li>
<li>Ten sam <code>switch</code> w <code>LegacyReleaseConsole</code> to trzy osie: o mechanizmie decyduje, <strong>kto wybiera wariant i kiedy</strong>.</li>
<li>Dwie osie w hakach Template Method to sygnał do Strategy: N + M zamiast N × M.</li>
<li>Ogniwa łańcucha zależą od kolejności; audyt decyzji to Decorator, nie ogniwo.</li>
<li>Walidacja na granicy (Boundary Object, ACL) zmienia zachowanie dla danych błędnych - to decyzja, nie skutek uboczny.</li>
</ul>
<p>Pełne omówienie: rozwiązania modułu 5.</p>

<h2 id="lista-kontrolna">Lista kontrolna</h2>
<ul>
<li><strong>Decyzja:</strong> problem opisany bez nazwy wzorca; wariant istnieje dziś; rozważona prostsza alternatywa i kierunek „od wzorca”.</li>
<li><strong>Kontrakt:</strong> testy obejmują każdą gałąź, <code>null</code>, wartość nieznaną i granice progów; zachowane wyjątki, stan po błędzie, kolejność efektów.</li>
<li><strong>Kroki:</strong> jeden kontrakt naraz, automat IDE tam, gdzie się da; użycia dynamiczne (refleksja, konfiguracja) sprawdzone ręcznie.</li>
<li><strong>Granice:</strong> obcy model i surowe dane nie przechodzą do domeny; zmiana typu lub momentu błędu zatwierdzona osobno.</li>
<li><strong>Na koniec:</strong> stary warunek i elementy przejściowe usunięte; nowy podtyp <code>sealed</code> sprawdzony we wszystkich <code>switch</code>; klienci binarni i refleksyjni uwzględnieni.</li>
</ul>
</section>

<h2 id="sprawdzenie-wiedzy">Sprawdzenie wiedzy</h2>
<ol>
<li>Jakie sygnały wskazują, że wzorzec należy usunąć?</li>
<li>Co trzeba sprawdzić przed Remove Middle Man?</li>
<li>Dlaczego Inline Singleton może być zmianą kontraktu?</li>
<li>Kto wybiera wariant w Strategy, w Command i w State?</li>
<li>Kiedy Template Method warto zastąpić Strategy?</li>
<li>Czym różni się Chain of Responsibility od Decoratora?</li>
<li>Co odróżnia Boundary Object od Adaptera, a Facade od ACL?</li>
<li>Czego nie widzi automatyczny Rename w IDE?</li>
<li>Kiedy prosty <code>switch</code> jest lepszy od wzorca?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="podsumowanie---najwa%C5%BCniejsze-wnioski">Podsumowanie - najważniejsze wnioski</h2>
<ul>
<li>Refaktoryzacja do wzorca zaczyna się od <strong>kontraktu i osi zmienności</strong>, nie od diagramu klas.</li>
<li>Kierunek „od wzorca” jest równie ważny: Remove Middle Man, Inline Singleton, Collapse Hierarchy.</li>
<li>Podobne wzorce rozstrzygają proste pytania: kto wybiera wariant, ile elementów pracuje, który model chronimy.</li>
<li>Granice (Adapter, Boundary Object, Facade, ACL) przesuwają błędy bliżej źródła - to świadoma zmiana kontraktu.</li>
<li>IDE i testy równoważności dają małe, odwracalne kroki; rozszerzenia zachowania zatwierdzamy osobno.</li>
<li>Wzorzec zostaje tylko, gdy upraszcza <strong>realny</strong> problem.</li>
</ul>
</section>
