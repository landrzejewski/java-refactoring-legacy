<h2 id="11-wzorzec-projektowy">1.1. Wzorzec projektowy</h2>
<ul>
<li>Odkrywany na bazie doświadczenia <strong>szablon sprawdzonego rozwiązania</strong> powszechnie występującego problemu.</li>
<li>Koncepcja architekta Christophera Alexandra (język wzorców), przeniesiona m.in. do inżynierii oprogramowania.</li>
<li>Katalog obiektowy: „Design Patterns: Elements of Reusable Object-Oriented Software” - Gamma, Helm, Johnson, Vlissides, tzw. banda czworga (GoF).</li>
<li>Opis wzorca: <strong>nazwa, problem i kontekst, rozwiązanie (role i współpraca), konsekwencje</strong>.</li>
<li>Wzorzec opisuje siły i kompromis - <strong>nie jest kodem do skopiowania</strong> ani biblioteką.</li>
<li>Wspólny słownik skraca rozmowę („tu jest Strategy”), o ile obie strony mają na myśli tę samą intencję.</li>
</ul>
</section>

<h2 id="13-katalog-gof---23-wzorce">1.3. Katalog GoF - 23 wzorce</h2>

<h2 id="14-najpierw-rodzaj-zmienno%C5%9Bci">1.4. Najpierw rodzaj zmienności</h2>
<table>
<thead>
<tr>
<th>Pytanie</th>
<th>Kierunek</th>
</tr>
</thead>
<tbody>
<tr>
<td>Czy zmienia się algorytm wybierany dla operacji?</td>
<td>Strategy</td>
</tr>
<tr>
<td>Czy zachowanie zależy od bieżącego stanu i przejść?</td>
<td>State</td>
</tr>
<tr>
<td>Czy żądanie trzeba przechować, zakolejkować albo cofnąć?</td>
<td>Command</td>
</tr>
<tr>
<td>Czy kod jedynie wybiera i tworzy właściwy obiekt?</td>
<td>Factory Method, Abstract Factory</td>
</tr>
<tr>
<td>Czy dodatki owijają rdzeń w dowolnych kombinacjach?</td>
<td>Decorator</td>
</tr>
<tr>
<td>Czy wiele obiektów reaguje na zmianę jednego?</td>
<td>Observer</td>
</tr>
<tr>
<td>Czy mamy drzewo części i całości?</td>
<td>Composite</td>
</tr>
</tbody>
</table>
<p>Ten sam <code>switch</code> może sygnalizować różne problemy - najpierw ustal, <strong>co naprawdę się zmienia</strong> i czy zestaw wariantów jest otwarty, czy zamknięty.</p>
</section>

<h2 id="15-wzorzec-ma-koszt---i-mo%C5%BCna-go-usun%C4%85%C4%87">1.5. Wzorzec ma koszt - i można go usunąć</h2>
<ul>
<li>Przed użyciem: znany problem, <strong>istniejące dziś</strong> warianty, prostsza alternatywa, warunek, w którym wzorzec przestanie być potrzebny.</li>
<li>Koszt: dodatkowe typy i pośredniość, trudniejsza nawigacja, kontrakt do utrzymania i testowania.</li>
<li>Kierunek: zabezpiecz zachowanie → nazwij oś zmienności → odsłoń role → najwęższy kontrakt; <strong>zatrzymaj się</strong>, gdy problem jest rozwiązany.</li>
<li>Sygnały nadmiaru: jedna implementacja od lat, fabryka z jednym <code>new</code>, implementacje rzucające <code>UnsupportedOperationException</code>, nowy wariant nadal wymaga zmian w wielu miejscach.</li>
<li>Refaktoryzacja <strong>od</strong> wzorca jest równie poprawna jak <strong>do</strong> wzorca - sekwencje kroków w module 5.</li>
</ul>
</section>

<h2 id="16-wzorce-a-j%C4%99zyk-java-25">1.6. Wzorce a język: Java 25</h2>
<table>
<thead>
<tr>
<th>Mechanizm</th>
<th>Co upraszcza</th>
</tr>
</thead>
<tbody>
<tr>
<td>lambda, referencja do metody</td>
<td>jednometodowe role: Strategy, Command, fabryka (<code>Supplier</code>), krok szablonu, odbiorca zdarzeń</td>
</tr>
<tr>
<td><code>Function.andThen</code></td>
<td>łańcuch przekształceń: Decorator, potok</td>
</tr>
<tr>
<td><code>enum</code> z ciałami stałych</td>
<td>zamknięty zestaw stanów lub strategii; Singleton (<code>INSTANCE</code>)</td>
</tr>
<tr>
<td><code>record</code></td>
<td>niemutowalne produkty, migawki Memento, klucze Flyweight</td>
</tr>
<tr>
<td><code>sealed</code> + <code>switch</code> z dopasowaniem</td>
<td>zamknięta hierarchia: alternatywa dla Visitora i Interpretera</td>
</tr>
<tr>
<td><code>Iterable</code>, <code>Stream</code></td>
<td>iterator zewnętrzny i wewnętrzny</td>
</tr>
</tbody>
</table>
<p>Wzorzec nie znika - zmienia się <strong>zapis roli</strong>. Intencja i konsekwencje (kolejność, stan, tożsamość, błędy) zostają.</p>

<h2 id="21-factory-method-klasowy-kreacyjny">2.1. Factory Method (klasowy, kreacyjny)</h2>
<ul>
<li><strong>Intencja:</strong> interfejs tworzenia obiektu bez wskazywania konkretnej klasy - typ produktu określa podklasa implementująca metodę wytwórczą.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Creator.anOperation()            → product = factoryMethod()
ConcreteCreator.factoryMethod()  → return new ConcreteProduct()
Client zna Creator i Product, nie zna ConcreteProduct
</code></pre>
<ul>
<li><strong>Kiedy:</strong> nie wiadomo, która implementacja będzie używana, i potrzebna jest jej elastyczna podmiana; łączenie równoległych hierarchii klas.</li>
<li><strong>Konsekwencje:</strong> niezależność od konkretnej implementacji; nowa podklasa twórcy na każdy nowy produkt.</li>
<li><strong>Powiązane:</strong> Abstract Factory (zbiór metod wytwórczych), Template Method (metoda wytwórcza jako krok), Prototype.</li>
<li><strong>Java 25:</strong> <code>Supplier&lt;T&gt;</code>, referencja do konstruktora <code>Square::new</code> (<code>fn-factory</code>).</li>
<li><strong>Kod:</strong> <code>creational.factorymethod</code> (<code>factory-method</code>).</li>
</ul>
</section>

<h2 id="22-abstract-factory-obiektowy-kreacyjny">2.2. Abstract Factory (obiektowy, kreacyjny)</h2>
<ul>
<li><strong>Intencja:</strong> interfejs tworzenia <strong>rodzin</strong> zależnych i powiązanych obiektów bez określania ich konkretnych klas.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">ConnectionAbstractFactory: createConnection(), createSecuredConnection()
FtpConnectionFactory  → FtpConnection (21),  SftpConnection (22)
HttpConnectionFactory → HttpConnection (80), HttpsConnection (443)
Service zna tylko fabrykę abstrakcyjną i interfejsy produktów
</code></pre>
<ul>
<li><strong>Kiedy:</strong> system ma działać z jedną z kilku rodzin produktów; rodzina ma być używana <strong>w całości</strong> (nie mieszamy FTP z HTTPS).</li>
<li><strong>Konsekwencje:</strong> izolacja klientów, prosta podmiana rodziny, łatwa nowa rodzina - <strong>trudny nowy rodzaj produktu</strong> (zmiana interfejsu i wszystkich fabryk).</li>
<li><strong>Powiązane:</strong> Factory Method (realizacja metod), Singleton (jedna fabryka na rodzinę), Prototype.</li>
<li><strong>Kod:</strong> <code>creational.abstractfactory</code> (<code>abstract-factory</code>), test <code>usesTheRegisteredFtpControlPort</code>.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">IdGeneratorFactory</span> { <span class="hljs-type">IdGenerator</span> <span class="hljs-title function_">create</span><span class="hljs-params">()</span>; }

<li>Twórca jest tu <strong>wstrzykiwanym obiektem</strong>, nie podklasą <code>Service</code> - kompozycyjny wariant Factory Method.</li>
<li>Dwie fabryki, dwa kontrakty: instancja współdzielona czy nowa przy każdym <code>create()</code>? Licznik testowy startuje od 1 przy każdym <code>run()</code>.</li>
<li>Ryzyka: fabryka jako globalny rejestr usług; fabryka z jednym <code>new</code> (YAGNI); tworzenie kosztownych obiektów „na zapas”.</li>

<h2 id="24-builder---intencja-i-struktura">2.4. Builder - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> oddziela sposób tworzenia złożonego obiektu od jego reprezentacji - jeden proces konstrukcji może dać różne reprezentacje.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Director ──▶ Builder: buildPart() ...    ConcreteBuilder.getResult() → Product
ConnectionUrlBuilder: host, port, protocol, database, encoding, build()
Generic | MySql | PostgresSql ConnectionUrlBuilder → ConnectionUrl
</code></pre>
<ul>
<li><strong>Kiedy:</strong> algorytm tworzenia niezależny od składników i sposobu ich łączenia; obiekty w różnych konfiguracjach; wiele parametrów opcjonalnych.</li>
<li><strong>Konsekwencje:</strong> elastyczność wewnętrznej konfiguracji, kontrola nad procesem wytwórczym i odizolowanie go od reprezentacji; dodatkowy typ do utrzymania.</li>
<li><strong>Powiązane:</strong> Abstract Factory (rodzina naraz vs krok po kroku), Composite (budowa drzewa).</li>
<li><strong>Java 25:</strong> dla kilku pól wystarczy <code>record</code> z walidacją w konstruktorze kanonicznym albo statyczne fabryki z nazwami.</li>
</ul>
</section>

<h2 id="25-builder---kod-i-pu%C5%82apki">2.5. Builder - kod i pułapki</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">var</span> <span class="hljs-variable">builder</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PostgresSqlConnectionUrlBuilder</span>()
        .host(<span class="hljs-string">&quot;localhost&quot;</span>)
        .database(<span class="hljs-string">&quot;test&quot;</span>);
<span class="hljs-keyword">new</span> <span class="hljs-title class_">Director</span>(builder).run();
<span class="hljs-comment">// INFO: Connection url: jdbc:postgres://localhost:5432/test?encoding=UTF-8</span>
</code></pre>
<ul>
<li>Wartości domyślne ustawia konkretny builder: <code>MySql...</code> przez <strong>dziedziczenie</strong>, <code>PostgresSql...</code> przez <strong>delegację</strong> do <code>Generic...</code>.</li>
<li><code>build()</code> zwraca <strong>tę samą, mutowalną</strong> instancję <code>ConnectionUrl</code> - <code>host(...)</code> po <code>build()</code> zmienia już zbudowany produkt.</li>
<li>Brak walidacji: bez hosta powstanie <code>jdbc:postgres://null:5432/...</code>. Builder to dobre miejsce na niezmienniki całości.</li>
<li><code>Director</code> tylko wywołuje <code>build()</code> - w GoF to on decyduje o kolejności kroków.</li>
<li>Kierunek poprawy: niemutowalny produkt (<code>record</code>), kopia w <code>build()</code>, walidacja, builder jednorazowy.</li>
</ul>
</section>

<h2 id="26-prototype-obiektowy-kreacyjny">2.6. Prototype (obiektowy, kreacyjny)</h2>
<ul>
<li><strong>Intencja:</strong> rodzaj obiektu określa instancja prototypu; nowe obiekty powstają przez jego <strong>klonowanie</strong>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client ── p = prototype.clone() ──▶ Prototype.clone()
                                      ▲ ConcretePrototype1, ConcretePrototype2
</code></pre>
<ul>
<li><strong>Kiedy:</strong> klasy dostarczane dynamicznie w czasie działania; instancja ma kilka typowych kombinacji stanu; unikamy hierarchii fabryk równoległej do hierarchii produktów.</li>
<li><strong>Konsekwencje:</strong> dodawanie i usuwanie produktów w czasie działania, nowe obiekty przez zmianę wartości, mniej klas niż przy Factory Method; decyzja: <strong>kopia płytka czy głęboka</strong>.</li>
<li><strong>W kodzie:</strong> <code>Window implements Cloneable</code>; pola są <code>final</code> i niemutowalne, więc klon niczego nie zyskuje względem współdzielenia instancji.</li>
<li><strong>Java 25:</strong> kontrakt <code>Cloneable</code> jest wadliwy (wyjątek kontrolowany, płytkie <code>super.clone()</code>) - wolimy konstruktor kopiujący, <code>copy()</code> albo rekord z metodami <code>withX(...)</code>.</li>
<li><strong>Kod:</strong> <code>creational.prototype</code> (<code>prototype</code>).</li>
</ul>
</section>

<h2 id="27-singleton-obiektowy-kreacyjny">2.7. Singleton (obiektowy, kreacyjny)</h2>
<ul>
<li><strong>Intencja:</strong> tylko jedna instancja klasy i globalny punkt dostępu do niej.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">synchronized</span> <span class="hljs-keyword">static</span> <span class="hljs-type">Logger</span> <span class="hljs-title function_">getInstance</span><span class="hljs-params">()</span> {
    <span class="hljs-keyword">if</span> (LOGGER == <span class="hljs-literal">null</span>) { LOGGER = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Logger</span>(); }
    <span class="hljs-keyword">return</span> LOGGER;
}
</code></pre>
<ul>
<li><strong>Kiedy:</strong> musi istnieć dokładnie jedna instancja, dostępna klientom w dobrze znany sposób.</li>
<li><strong>Konsekwencje (GoF):</strong> kontrola dostępu do jedynego egzemplarza, mniej zmiennych globalnych, więcej elastyczności niż operacje statyczne.</li>
<li><strong>Koszt:</strong> <strong>ukryta zależność i globalny stan</strong> - testy wpływają na siebie, trudna podmiana; <code>synchronized</code> przy każdym odczycie.</li>
<li><strong>Alternatywy:</strong> <code>enum INSTANCE</code> (jedna instancja na loader klas), idiom holder, <code>memoize(Supplier)</code> (<code>fn-singleton</code>), a najczęściej <strong>jedna instancja tworzona w composition root i wstrzykiwana</strong>.</li>
<li><strong>Kod:</strong> <code>creational.singleton</code> (<code>singleton</code>).</li>
</ul>
</section>

<h2 id="31-adapter---intencja-i-struktura">3.1. Adapter - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> konwersja interfejsu klasy na taki, jakiego spodziewa się klient; współpraca klas niekompatybilnych pod względem interfejsów.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client ──▶ Target: temperatureUp(°C), temperatureDown(°C)
             ▲
           Adapter ──adaptee──▶ Adaptee: changeTemperature(delta °F)
</code></pre>
<ul>
<li><strong>Kiedy:</strong> istniejąca klasa ma niepasujący interfejs; reużywalna klasa ma współpracować z niepowiązanymi klasami; dopasowanie przez podklasy jest niepraktyczne.</li>
<li><strong>Warianty:</strong> obiektowy (kompozycja, jak w kodzie) i klasowy (dziedziczenie po klasie adaptowanej).</li>
<li><strong>Konsekwencje:</strong> użycie niekompatybilnych komponentów, opakowanie istniejącego interfejsu w nowy; utrudnione przesłanianie zachowań klasy adaptowanej.</li>
<li><strong>Powiązane:</strong> Bridge (projektowany z góry, Adapter po fakcie), Decorator (ten sam interfejs), Facade (nowy, prostszy interfejs), Proxy.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="32-adapter---kod-i-semantyka">3.2. Adapter - kod i semantyka</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TemperatureControllerAdapter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">TemperatureController</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> AirConditioningController controller;
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">temperatureUp</span><span class="hljs-params">(<span class="hljs-type">double</span> value)</span> {
        controller.changeTemperature(celsiusDeltaToFahrenheit(value));
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">temperatureDown</span><span class="hljs-params">(<span class="hljs-type">double</span> value)</span> {
        controller.changeTemperature(-celsiusDeltaToFahrenheit(value));
    }
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> <span class="hljs-title function_">celsiusDeltaToFahrenheit</span><span class="hljs-params">(<span class="hljs-type">double</span> value)</span> { <span class="hljs-keyword">return</span> value * <span class="hljs-number">1.8</span>; }
}
</code></pre>
<ul>
<li>Przelicza <strong>różnicę</strong> temperatur: <code>× 1.8</code> bez <code>+ 32</code> (test <code>convertsTemperatureDifferencesWithoutAnAbsoluteScaleOffset</code>: 10 °C → 18.0 °F).</li>
<li>Podobna sygnatura to nie podobny kontrakt: jednostki, znak, <code>null</code>, błędy, własność zasobów.</li>
<li>Adapter tłumaczy, ale <strong>nie dodaje logiki domenowej</strong>. Adapter na granicy systemu a Anti-Corruption Layer - moduł 5.</li>
<li><strong>Kod:</strong> <code>structural.adapter</code> (<code>adapter</code>).</li>
</ul>
</section>

<h2 id="33-bridge-obiektowy-strukturalny">3.3. Bridge (obiektowy, strukturalny)</h2>
<ul>
<li><strong>Intencja:</strong> oddziela abstrakcję od implementacji tak, aby mogły być <strong>niezależnie</strong> modyfikowane i rozszerzane.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Message (abstrakcja) ──sender──▶ MessageSender (implementacja)
  ▲ TextMessage, UrgentMessage      ▲ EmailSender, SmsSender
2 rodzaje + 2 kanały = 4 klasy dla 4 kombinacji; przy 3 × 3: 6 klas zamiast 9
</code></pre>
<ul>
<li><strong>Kiedy:</strong> obie hierarchie rozwijają się niezależnie; implementację wybieramy w czasie działania; zmiana implementacji nie może dotykać klientów.</li>
<li><strong>Konsekwencje:</strong> rozdzielenie interfejsu abstrakcji od implementacji, rozszerzalność, izolacja klientów; koszt - dwie hierarchie i pośredniość od początku.</li>
<li><strong>Powiązane:</strong> Adapter (po fakcie), Strategy (implementacja wstrzykiwana jak strategia), Abstract Factory (tworzy pasujący most).</li>
<li><strong>Java 25:</strong> <code>MessageSender</code> ma jedną metodę - kanał może być lambdą.</li>
<li><strong>Kod:</strong> <code>structural.bridge</code> (<code>bridge</code>), test <code>bridgeCombinesEveryMessageKindWithEverySender</code>.</li>
</ul>
</section>

<h2 id="34-composite---intencja-i-struktura">3.4. Composite - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> kompozycja obiektów w strukturę drzewiastą; obiekty indywidualne i złożone traktowane <strong>w jednakowy sposób</strong>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client ──▶ Component: operation(), add(), remove(), getChild()
             ▲                    ▲
           Leaf              Composite ──children──▶ Component*
                             operation(): for (c : children) c.operation()
</code></pre>
<ul>
<li><strong>Kiedy:</strong> hierarchia wzajemnie zagnieżdżonych elementów (liści i kompozytów), które mają być obsługiwane tym samym kodem.</li>
<li><strong>Konsekwencje:</strong> definiowanie i zarządzanie hierarchiami obiektów pierwotnych i złożonych, łatwe operacje na fragmentach, prostszy kod klienta.</li>
<li><strong>Koszt:</strong> ogólny <code>Component</code> utrudnia ograniczenie, kto może być dzieckiem; cykle, głębokość rekurencji, kolejność dzieci.</li>
<li><strong>Powiązane:</strong> Iterator (przejście), Visitor (operacje), Decorator (jedno dziecko), Builder (budowa), Flyweight (współdzielone liście).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="35-composite---wariant-przezroczysty-i-bezpieczny">3.5. Composite - wariant przezroczysty i bezpieczny</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Node</span> {
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">final</span> String name;
    <span class="hljs-keyword">protected</span> <span class="hljs-type">List</span>&lt;Node&gt; <span class="hljs-variable">children</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">addChild</span><span class="hljs-params">(Node node)</span> { children.add(node); }
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">void</span> <span class="hljs-title function_">printInfo</span><span class="hljs-params">()</span>;
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Employee</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Node</span> {
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">addChild</span><span class="hljs-params">(Node node)</span> { <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnsupportedOperationException</span>(); }
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">printInfo</span><span class="hljs-params">()</span> { System.out.println(<span class="hljs-string">&quot; - Employee &quot;</span> + name); }
}
</code></pre>
<ul>
<li><strong>Przezroczysty</strong> (jak tu): zarządzanie dziećmi we wspólnym typie - jednolitość kosztem wyjątku na liściu (napięcie z LSP).</li>
<li><strong>Bezpieczny:</strong> <code>addChild</code> tylko w kompozycie - pilnuje kompilator, ale klient czasem musi rozróżniać typy.</li>
<li>Publiczny <code>setChildren</code> i chroniona, mutowalna lista osłabiają hermetyzację drzewa.</li>
<li><strong>Java 25:</strong> <code>sealed interface</code> + rekordy z <code>List.copyOf</code>. <strong>Kod:</strong> <code>structural.composite</code> (<code>composite</code>).</li>
</ul>
</section>

<h2 id="36-decorator---intencja-i-struktura">3.6. Decorator - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> dynamiczne dodawanie odpowiedzialności do obiektu; elastyczna alternatywa dla dziedziczenia.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Component.operation() ◀──component── Decorator.operation(): component.operation()
  ▲ ConcreteComponent                   ▲ ConcreteDecoratorA, B: dodatek + delegacja
Reader ◀── ReaderDecorator ◀── LowerCaseReaderDecorator, UnderscoreReaderDecorator
</code></pre>
<ul>
<li><strong>Kiedy:</strong> nowe odpowiedzialności mają być dodawane dynamicznie i przezroczyście, bez zmian w pozostałym kodzie; dziedziczenie dałoby ogromną liczbę podklas.</li>
<li><strong>Konsekwencje:</strong> większa elastyczność niż dziedziczenie, dynamiczna modyfikacja zachowań, brak przeładowanych klas; wiele małych obiektów, trudniejsze debugowanie.</li>
<li><strong>Powiązane:</strong> Proxy (ta sama struktura, inna intencja), Adapter (zmienia interfejs), Composite (wiele dzieci), Chain of Responsibility, Strategy (zmienia „wnętrze”, dekorator - „skórę”).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="37-decorator---kod-i-kolejno%C5%9B%C4%87">3.7. Decorator - kod i kolejność</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Reader</span> <span class="hljs-variable">reader</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">LowerCaseReaderDecorator</span>(
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnderscoreReaderDecorator</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">SystemInReader</span>()));
reader.getText();  <span class="hljs-comment">// &quot;Hello Decorator Pattern&quot; → &quot;hello_decorator_pattern&quot;</span>

<span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">getText</span><span class="hljs-params">()</span> {                    <span class="hljs-comment">// UnderscoreReaderDecorator</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">super</span>.getText().replaceAll(<span class="hljs-string">&quot;\\s&quot;</span>, <span class="hljs-string">&quot;_&quot;</span>);
}
</code></pre>
<ul>
<li>Najpierw działa dekorator <strong>najbliżej rdzenia</strong> (podkreślenia), potem zewnętrzny (małe litery).</li>
<li><strong>Kolejność to zachowanie:</strong> <code>audit(retry(core))</code> zapisze jedną operację, <code>retry(audit(core))</code> każdą próbę.</li>
<li>Dekorator nie jest przezroczysty dla tożsamości, <code>getClass()</code> i <code>equals</code>.</li>
<li><strong>Funkcyjnie:</strong> <code>base.andThen(trim).andThen(upper)</code> - kolejność <strong>od lewej do prawej</strong> (<code>fn-decorator</code>).</li>
<li><strong>Kod:</strong> <code>structural.decorator</code> (<code>decorator</code>; czyta linię ze standardowego wejścia, przy pustym używa tekstu domyślnego).</li>
</ul>
</section>

<h2 id="38-facade-obiektowy-strukturalny">3.8. Facade (obiektowy, strukturalny)</h2>
<ul>
<li><strong>Intencja:</strong> jeden, zunifikowany interfejs wyższego poziomu dla zbioru interfejsów podsystemów, ułatwiający korzystanie z systemu.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client ──▶ Facade.run() ──▶ FirstService.run()    INFO: Step 1
                        └─▶ SecondService.run()   INFO: Step 2
</code></pre>
<ul>
<li><strong>Kiedy:</strong> prosty interfejs dla złożonego podsystemu; wiele zależności między klientami a podsystemami; centralny punkt wejścia.</li>
<li><strong>Konsekwencje:</strong> izolacja klientów od podsystemów i szczegółów niskiego poziomu, niskie sprzężenie; podsystem nadal dostępny bezpośrednio.</li>
<li><strong>Ryzyka:</strong> fasada-bóg rosnąca o każdą operację; fasada przekazująca wywołania 1:1 niczego nie upraszcza.</li>
<li><strong>Powiązane:</strong> Mediator (koordynuje w obie strony), Adapter, Abstract Factory, Singleton. Facade a Anti-Corruption Layer - moduł 5.</li>
<li><strong>Kod:</strong> <code>structural.facade</code> (<code>facade</code>).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="39-flyweight-obiektowy-strukturalny">3.9. Flyweight (obiektowy, strukturalny)</h2>
<ul>
<li><strong>Intencja:</strong> wydajna obsługa dużej liczby małych obiektów przez <strong>współdzielenie</strong> stanu wewnętrznego.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">TreeType</span> <span class="hljs-title function_">getTreeType</span><span class="hljs-params">(String name, String color)</span> {
    <span class="hljs-keyword">return</span> TYPES.computeIfAbsent(name + <span class="hljs-string">&quot;:&quot;</span> + color, key -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">TreeType</span>(name, color));
}
<span class="hljs-comment">// Tree(x, y, type): x, y - stan zewnętrzny; TreeType - wewnętrzny, współdzielony</span>
</code></pre>
<ul>
<li><strong>Kiedy:</strong> bardzo dużo obiektów, wysoki koszt ich przechowywania, większość stanu da się wydzielić; aplikacja <strong>nie zależy od tożsamości</strong> obiektów.</li>
<li><strong>Konsekwencje:</strong> oszczędność zależna od liczby obiektów i rozmiaru współdzielonego stanu; stan współdzielony musi być niemutowalny.</li>
<li><strong>W kodzie:</strong> statyczna <code>HashMap</code> bez synchronizacji i bez usuwania; klucz z konkatenacji - <code>(&quot;a:b&quot;, &quot;c&quot;)</code> i <code>(&quot;a&quot;, &quot;b:c&quot;)</code> dają ten sam klucz. Lepszy klucz: <code>record</code>.</li>
<li><strong>JDK:</strong> <code>Integer.valueOf</code> (pamięć podręczna -128..127). <strong>Kod:</strong> <code>structural.flyweight</code> (<code>flyweight</code>).</li>
</ul>
</section>

<h2 id="310-proxy-obiektowy-strukturalny">3.10. Proxy (obiektowy, strukturalny)</h2>
<ul>
<li><strong>Intencja:</strong> pośrednik dla obiektu, który <strong>kontroluje dostęp</strong> do niego.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client ──▶ Subject.pay() ◀── RealSubject (RemotePaymentsService)
               ▲
             Proxy ──realSubject──▶ ...; realSubject.pay(); ...
PaymentLoggerProxy(PaymentSecurityProxy(RemotePaymentsService))
</code></pre>
<ul>
<li><strong>Kiedy:</strong> dostęp zdalny, wirtualny (leniwe tworzenie), ochronny (uprawnienia), inteligentny; izolacja klienta od zbędnej złożoności.</li>
<li><strong>Konsekwencje:</strong> optymalizacja, ukrycie złożoności mechanizmów, kontrola dostępu, dynamiczne wzbogacanie funkcjonalności.</li>
<li><strong>W kodzie:</strong> <code>PaymentSecurityProxy</code> tylko loguje - prawdziwy proxy ochronny może <strong>odmówić</strong> delegacji; <code>PaymentLoggerProxy</code> loguje tylko po sukcesie.</li>
<li><strong>Java:</strong> <code>java.lang.reflect.Proxy</code>, proxy frameworków (transakcje, leniwe encje) - wywołanie wewnątrz tej samej klasy omija proxy.</li>
<li><strong>Kod:</strong> <code>structural.proxy</code> (<code>proxy</code>).</li>
</ul>
</section>

<h2 id="311-rodzina-opakowa%C5%84-ta-sama-struktura-r%C3%B3%C5%BCne-intencje">3.11. Rodzina opakowań: ta sama struktura, różne intencje</h2>
<table>
<thead>
<tr>
<th>Wzorzec</th>
<th>Interfejs wobec opakowanego obiektu</th>
<th>Intencja</th>
</tr>
</thead>
<tbody>
<tr>
<td>Adapter</td>
<td><strong>inny</strong></td>
<td>dopasować do oczekiwań klienta</td>
</tr>
<tr>
<td>Decorator</td>
<td><strong>ten sam</strong></td>
<td>dodać odpowiedzialność, składać warstwy</td>
</tr>
<tr>
<td>Proxy</td>
<td><strong>ten sam</strong></td>
<td>kontrolować dostęp, opóźnić, wywołać zdalnie</td>
</tr>
<tr>
<td>Facade</td>
<td><strong>nowy, prostszy</strong>, nad wieloma obiektami</td>
<td>uprościć użycie podsystemu</td>
</tr>
<tr>
<td>Bridge</td>
<td>abstrakcja deleguje do implementacji</td>
<td>rozwijać dwie hierarchie niezależnie</td>
</tr>
</tbody>
</table>
<p>Strukturalnie to często „klasa z polem i delegacją” - <strong>o wzorcu decyduje intencja</strong>, nie diagram ani nazwa klasy.</p>
</section>

<h2 id="41-chain-of-responsibility-obiektowy-behawioralny">4.1. Chain of Responsibility (obiektowy, behawioralny)</h2>
<ul>
<li><strong>Intencja:</strong> odseparowanie nadawcy od odbiorcy; żądanie przechodzi przez łańcuch obiektów, z których każdy może je obsłużyć lub przekazać dalej.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">var</span> <span class="hljs-variable">chain</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Validator</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Logger</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Processor</span>()));
chain.handleRequest(<span class="hljs-string">&quot;Test&quot;</span>);      <span class="hljs-comment">// INFO: Test, INFO: Processing: Test</span>

<span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">handleRequest</span><span class="hljs-params">(String request)</span> {   <span class="hljs-comment">// Validator</span>
    <span class="hljs-keyword">if</span> (request.length() &lt; <span class="hljs-number">3</span>) { <span class="hljs-keyword">return</span>; }      <span class="hljs-comment">// przerwanie łańcucha</span>
    nextHandler.handleRequest(request);
}
</code></pre>
<ul>
<li><strong>Kiedy:</strong> wielu możliwych odbiorców, zbiór ustalany dynamicznie. <strong>Warianty:</strong> „pierwszy obsługujący kończy” albo potok filtrów.</li>
<li><strong>Konsekwencje:</strong> niskie sprzężenie nadawcy i odbiorcy; <strong>brak gwarancji odbioru</strong> - <code>&quot;Te&quot;</code> znika bez śladu.</li>
<li><strong>Powiązane:</strong> Decorator, Composite, Command. <strong>Kod:</strong> <code>behavioral.chainofresponsibility</code> (<code>chain-of-responsibility</code>).</li>
</ul>
</section>

<h2 id="42-command---intencja-i-struktura">4.2. Command - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> hermetyzuje żądanie w formie obiektu; różne operacje wykonywane w taki sam sposób; możliwość cofania kroków.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Client ──tworzy──▶ ConcreteCommand(receiver, state)
Invoker ──▶ Command.execute()     ConcreteCommand.execute(): receiver.action()
Invoker: register(cmd), invoke(cmd), invokeAll() nad Queue&lt;Command&gt;
</code></pre>
<ul>
<li><strong>Kiedy:</strong> potrzebny mechanizm typu callback; zadania trzeba kolejkować i wywoływać w odpowiednim momencie; rejestrowanie, powtarzanie i cofanie zmian.</li>
<li><strong>Konsekwencje:</strong> separacja obiektu wywołującego od obiektu, który wie, jak wykonać operację; przekazywanie komend, łatwe dodawanie nowych, makra.</li>
<li><strong>Powiązane:</strong> Memento (stan do cofnięcia), Strategy (jak liczyć vs co i kiedy wykonać), Composite (makro), Chain of Responsibility.</li>
</ul>
</section>

<h2 id="43-command---kod-kolejka-i-undo">4.3. Command - kod, kolejka i undo</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Command</span> { <span class="hljs-type">void</span> <span class="hljs-title function_">execute</span><span class="hljs-params">()</span>; }

<span class="hljs-type">var</span> <span class="hljs-variable">invoker</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Invoker</span>();
invoker.invoke(<span class="hljs-keyword">new</span> <span class="hljs-title class_">PrintTime</span>());        <span class="hljs-comment">// INFO: 2026-10-20T13:47:34.438274</span>
invoker.invoke(<span class="hljs-keyword">new</span> <span class="hljs-title class_">ConnectToServer</span>());  <span class="hljs-comment">// INFO: Connecting... / INFO: Connected...</span>
</code></pre>
<ul>
<li>Komendy same wykonują pracę - brak roli <strong>Receiver</strong>; <code>register</code> i <code>invokeAll</code> istnieją, ale demo ich nie używa.</li>
<li>Undo wymaga drugiej operacji (<code>undo()</code>) albo migawki (Memento) - samo <code>execute()</code> go nie daje.</li>
<li>Command nie daje automatycznie asynchroniczności ani retry; komenda współdzielona powinna być bezstanowa, dane żądania to argument.</li>
<li><strong>Java 25:</strong> <code>Runnable</code>, <code>Consumer&lt;T&gt;</code> (<code>fn-command</code>); klasa wraca, gdy komenda ma nazwę, metadane, <code>undo</code> lub jest utrwalana.</li>
<li><strong>Kod:</strong> <code>behavioral.command</code> (<code>command</code>).</li>
</ul>
</section>

<h2 id="44-interpreter-klasowy-behawioralny">4.4. Interpreter (klasowy, behawioralny)</h2>
<ul>
<li><strong>Intencja:</strong> reprezentacja gramatyki języka oraz interpreter, który na jej podstawie interpretuje zdania tego języka.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 2a * 3 + 1, gdzie a = 4</span>
<span class="hljs-type">var</span> <span class="hljs-variable">expression</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Operation</span>(
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">Operation</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Operation</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Literal</span>(<span class="hljs-number">2</span>), <span class="hljs-keyword">new</span> <span class="hljs-title class_">Variable</span>(<span class="hljs-string">&quot;a&quot;</span>), op(<span class="hljs-string">&quot;*&quot;</span>)),
                <span class="hljs-keyword">new</span> <span class="hljs-title class_">Literal</span>(<span class="hljs-number">3</span>), op(<span class="hljs-string">&quot;*&quot;</span>)),
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">Literal</span>(<span class="hljs-number">1</span>), op(<span class="hljs-string">&quot;+&quot;</span>));
expression.evaluate(Map.of(<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-number">4.0</span>));   <span class="hljs-comment">// 25.0</span>
</code></pre>
<ul>
<li><strong>Struktura:</strong> <code>Expression.evaluate(context)</code>; terminalne <code>Literal</code>, <code>Variable</code>; nieterminalne <code>Operation(left, right, BiOperator)</code>.</li>
<li><strong>Kiedy:</strong> gramatyka jest prosta, a wydajność nie jest najważniejsza. <strong>Konsekwencje:</strong> łatwe rozszerzanie gramatyki; trudne zarządzanie złożoną gramatyką.</li>
<li>Brak parsera - drzewo budowane ręcznie; brak zmiennej w kontekście kończy się <code>NullPointerException</code>.</li>
<li><strong>Powiązane:</strong> Composite (drzewo składni), Visitor, Flyweight (<code>op(...)</code> współdzieli operatory). <strong>Kod:</strong> <code>behavioral.interpreter</code> (<code>interpreter</code>).</li>
</ul>
</section>

<h2 id="45-iterator-obiektowy-behawioralny">4.5. Iterator (obiektowy, behawioralny)</h2>
<ul>
<li><strong>Intencja:</strong> sekwencyjny dostęp do elementów złożonego obiektu niezależnie od jego implementacji i wewnętrznej struktury.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">Iterator</span>&lt;Song&gt; <span class="hljs-title function_">iterator</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PlaylistIterator</span>(<span class="hljs-number">0</span>, <span class="hljs-number">1</span>); }
<span class="hljs-keyword">public</span> <span class="hljs-type">Iterable</span>&lt;Song&gt; <span class="hljs-title function_">reversed</span><span class="hljs-params">()</span>  { <span class="hljs-keyword">return</span> () -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">PlaylistIterator</span>(size - <span class="hljs-number">1</span>, -<span class="hljs-number">1</span>); }

<span class="hljs-keyword">for</span> (<span class="hljs-keyword">var</span> song : playlist.reversed()) { System.out.println(<span class="hljs-string">&quot;Reversed: &quot;</span> + song.title()); }
</code></pre>
<ul>
<li><strong>Kiedy:</strong> dostęp bez ujawniania struktury (<code>Playlist</code> trzyma tablicę); jednolity interfejs dla różnych agregatów; kilka sposobów przejścia.</li>
<li><strong>Konsekwencje:</strong> spójny sposób poruszania się po agregatach; wiele niezależnych kursorów naraz.</li>
<li>Brak wykrywania modyfikacji w trakcie przejścia (kolekcje JDK są fail-fast dzięki <code>modCount</code>).</li>
<li>Iterator <strong>zewnętrzny</strong> (klient steruje, może przerwać) vs <strong>wewnętrzny</strong> (<code>forEach</code>, jednorazowy <code>Stream</code> - <code>fn-iterator</code>).</li>
<li><strong>Kod:</strong> <code>behavioral.iterator</code> (<code>iterator</code>), testy <code>iteratorDemoWalksThePlaylistForwardAndBackward</code>, <code>playlistIteratorIsExhaustedAfterTheLastSong</code>.</li>
</ul>
</section>

<h2 id="46-mediator-obiektowy-behawioralny">4.6. Mediator (obiektowy, behawioralny)</h2>
<ul>
<li><strong>Intencja:</strong> luźne powiązanie współpracujących obiektów - mediator bierze na siebie komunikację między nimi; interakcje można zmieniać niezależnie.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Participant (colleague) ──mediator──▶ ChatMediator: join(), broadcast()
ChatRoom (ConcreteMediator) ──▶ wszyscy uczestnicy poza nadawcą
alice.send(&quot;Hello everyone&quot;) → Bob, Carol: received from Alice
</code></pre>
<ul>
<li><strong>Kiedy:</strong> obiekty komunikują się w dobrze zdefiniowany, ale skomplikowany sposób; powiązania „każdy z każdym” utrudniają modyfikację.</li>
<li><strong>Konsekwencje:</strong> rozdzielenie współpracowników, prostszy protokół (n powiązań zamiast n²), centralizacja sterowania - ryzyko <strong>mediatora-boga</strong>.</li>
<li><strong>W kodzie:</strong> <code>Participant</code> rejestruje się w konstruktorze (wyciek <code>this</code>), brak wyjścia z pokoju.</li>
<li><strong>Powiązane:</strong> Observer (mediator często opiera się na zdarzeniach), Facade (jednokierunkowa).</li>
<li><strong>Kod:</strong> <code>behavioral.mediator</code> (<code>mediator</code>), test <code>mediatorDeliversMessagesToEveryoneExceptTheSender</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="47-memento-obiektowy-behawioralny">4.7. Memento (obiektowy, behawioralny)</h2>
<ul>
<li><strong>Intencja:</strong> rejestruje i zapisuje wewnętrzny stan obiektu na zewnątrz <strong>bez naruszenia kapsułkowania</strong>; umożliwia przywrócenie tego stanu.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">var</span> <span class="hljs-variable">account</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Account</span>(UUID.randomUUID());
<span class="hljs-type">var</span> <span class="hljs-variable">caretaker</span> <span class="hljs-operator">=</span> List.of(account.createMemento());   <span class="hljs-comment">// migawka: balance = 0</span>
account.deposit(BigDecimal.TEN);                     <span class="hljs-comment">// Deposited balance: 10</span>
account.restoreMemento(caretaker.getFirst());        <span class="hljs-comment">// Restored balance: 0</span>
</code></pre>
<ul>
<li><strong>Role:</strong> Originator (<code>Account</code>), Memento, Caretaker (lista w <code>Application</code>).</li>
<li>Konstruktor i <code>balance()</code> w <code>Memento</code> są <strong>pakietowe</strong> (<code>memento.accounts</code>) - opiekun przechowuje migawkę, ale jej nie odczyta.</li>
<li><strong>Konsekwencje:</strong> zachowanie hermetyzacji, przywracanie stanu; potencjalnie duże zużycie zasobów; mutowalne pola wymagają kopii głębokiej.</li>
<li><strong>Powiązane:</strong> Command (undo), Iterator, Prototype. <strong>Java 25:</strong> rekord jako migawka, domknięcie <code>Supplier</code> (<code>fn-memento</code>).</li>
<li><strong>Kod:</strong> <code>behavioral.memento</code> (<code>memento</code>), test <code>restoresTheBalanceRecordedInTheMemento</code>.</li>
</ul>
</section>

<h2 id="48-observer---intencja-i-struktura">4.8. Observer - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> zależność jeden do wielu - gdy zmienia się stan jednego obiektu, wszystkie obiekty zależne są informowane w ustandaryzowany sposób.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Subject: attach(o), detach(o), notify() { for (o : observers) o.update(); }
ConcreteObserver.update(): stan z ConcreteSubject (pull) albo z danych zdarzenia (push)
EventsBus: addConsumer(Consumer&lt;ServerEvent&gt;), publish(ServerEvent)
</code></pre>
<ul>
<li><strong>Kiedy:</strong> zmiana stanu jednego obiektu ma wywołać działanie w innych, <strong>nie wiadomo ilu i jakich</strong>; dwa aspekty abstrakcji łatwiej zmieniać w oddzielnych obiektach.</li>
<li><strong>Konsekwencje:</strong> grupowe rozsyłanie komunikatów, luźne powiązanie obiektów; przepływ sterowania mniej widoczny w kodzie.</li>
<li><strong>Powiązane:</strong> Mediator, Command; szyna zdarzeń i strumienie reaktywne jako warianty.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

;" data-marpit-pagination-total="59" data-size="16:9">
<h2 id="49-observer---kod-i-kontrakt-powiadomie%C5%84">4.9. Observer - kod i kontrakt powiadomień</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">EventsBus</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Set</span>&lt;Consumer&lt;ServerEvent&gt;&gt; <span class="hljs-variable">consumers</span> <span class="hljs-operator">=</span> synchronizedSet(<span class="hljs-keyword">new</span> <span class="hljs-title class_">HashSet</span>&lt;&gt;());
    <span class="hljs-type">void</span> <span class="hljs-title function_">addConsumer</span><span class="hljs-params">(Consumer&lt;ServerEvent&gt; consumer)</span> { consumers.add(consumer); }
    <span class="hljs-type">void</span> <span class="hljs-title function_">publish</span><span class="hljs-params">(ServerEvent event)</span> {
        consumers.forEach(consumer -&gt; consumer.accept(event));
    }
}
</code></pre>
<ul>
<li><code>HashSet</code>: <strong>kolejność powiadomień nieokreślona</strong>; drugi <code>add</code> tego samego obiektu nic nie zmienia.</li>
<li><code>forEach</code> na <code>synchronizedSet</code> wywołuje odbiorców <strong>pod blokadą</strong> - wolny odbiorca blokuje publikację i rejestrację.</li>
<li>Brak <code>detach</code>: odbiorca żyje tak długo jak szyna; lambda nie ma stabilnej tożsamości do wyrejestrowania.</li>
<li>Do ustalenia: wątek, kolejność, polityka wyjątków (tu pierwszy wyjątek przerywa pętlę), wyrejestrowanie w trakcie publikacji.</li>
<li><strong>Kod:</strong> <code>behavioral.observer</code> (<code>observer</code>), <code>fn-observer</code>.</li>
</ul>
</section>

<h2 id="410-state---intencja-i-struktura">4.10. State - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> zmiana zachowania obiektu w zależności od jego aktualnego stanu - wygląda to tak, jakby obiekt zmienił swoją klasę.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Context (Order) ──state──▶ State: pay(), ship(), cancel()
Order.pay(): state = state.pay()     ConcreteState zwraca następny stan
NEW --pay--&gt; PAID --ship--&gt; SHIPPED;  NEW, PAID --cancel--&gt; CANCELLED
</code></pre>
<ul>
<li><strong>Kiedy:</strong> zachowanie obiektu zależy od jego stanu; operacje są długie i składają się z wielu instrukcji warunkowych po polu statusu.</li>
<li><strong>Konsekwencje:</strong> separacja zachowania i stanu, współużytkowanie obiektów stanu, <strong>jawna zmiana stanu</strong>; więcej typów, tabela przejść rozproszona po klasach.</li>
<li><strong>Powiązane:</strong> Strategy (ta sama struktura - kto zmienia wariant?), Flyweight i Singleton (bezstanowe, współdzielone stany).</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">OrderState</span> {

}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">OrderStatus</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">OrderState</span> {

    PAID { <span class="hljs-keyword">public</span> <span class="hljs-type">OrderState</span> <span class="hljs-title function_">ship</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> SHIPPED; } <span class="hljs-comment">/* cancel() → CANCELLED */</span> },

<h2 id="412-strategy---intencja-i-struktura">4.12. Strategy - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> rodzina algorytmów rozwiązujących ten sam problem, wymiennych w zależności od potrzeby; różne algorytmy dla różnych klientów.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Context ──strategy──▶ Strategy.algorithmInterface()
                        ▲ ConcreteStrategyA, B, C
Service(IdGenerator) ──▶ UuidGenerator | IncrementalIdGenerator
</code></pre>
<ul>
<li><strong>Kiedy:</strong> powiązane klasy różnią się tylko zachowaniem; potrzebne różne implementacje jednego algorytmu; ukrycie złożoności algorytmu i jego danych; wiele zachowań w złożonych warunkach.</li>
<li><strong>Konsekwencje:</strong> algorytmy zgrupowane w rodziny, łatwa podmiana, niskie sprzężenie, eliminacja instrukcji warunkowych; klient musi znać różnice, by wybrać.</li>
<li><strong>Powiązane:</strong> State (kto i kiedy zmienia wariant), Template Method (dziedziczenie vs kompozycja), Bridge, Flyweight (bezstanowe strategie).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="413-strategy---kod-obiekt-enum-lambda">4.13. Strategy - kod: obiekt, enum, lambda</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">new</span> <span class="hljs-title class_">Service</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">UuidGenerator</span>()).run();           <span class="hljs-comment">// Id: 6eae08aa-784f-...</span>
<span class="hljs-keyword">new</span> <span class="hljs-title class_">Service</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">IncrementalIdGenerator</span>()).run();  <span class="hljs-comment">// Id: 00000000000000000001</span>

<span class="hljs-keyword">public</span> <span class="hljs-keyword">enum</span> <span class="hljs-title class_">MovieType</span> {                           <span class="hljs-comment">// strategia jako dane</span>
    REGULAR(<span class="hljs-number">2</span>, <span class="hljs-number">2</span>, <span class="hljs-number">1.5</span>), CHILDREN(<span class="hljs-number">3</span>, <span class="hljs-number">1.5</span>, <span class="hljs-number">1.5</span>), NEW_RELEASE(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">3</span>);
    <span class="hljs-comment">// getValueFor(days) = initialCost + płatne dni × costPerDay</span>
}
<span class="hljs-type">Function</span>&lt;String, String&gt; <span class="hljs-variable">reverse</span> <span class="hljs-operator">=</span> s -&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringBuilder</span>(s).reverse().toString();

<ul>
<li>Wybór strategii w konstruktorze <strong>zamraża</strong> decyzję na czas życia kontekstu.</li>
<li><code>IncrementalIdGenerator</code> ma stan (licznik bez synchronizacji) - nie współdziel go między wątkami.</li>
<li>Enum z parametrami: zamknięty zestaw wariantów różniących się <strong>danymi</strong> (<code>movies</code>, test <code>doesNotSubtractAChargeDuringTheFreeRentalPeriod</code>).</li>
<li>Lambda (<code>fn-strategy</code>) wystarcza dla jednej metody bez stanu. <strong>Kod:</strong> <code>behavioral.strategy</code> (<code>strategy</code>).</li>
</ul>

<h2 id="414-template-method-klasowy-behawioralny">4.14. Template Method (klasowy, behawioralny)</h2>
<ul>
<li><strong>Intencja:</strong> szkielet algorytmu w klasie bazowej, kroki delegowane do podklas - zmienne kroki, stała sekwencja.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Processor</span>&lt;V, PV&gt; {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-type">void</span> <span class="hljs-title function_">run</span><span class="hljs-params">()</span> {      <span class="hljs-comment">// final: sekwencji nie da się nadpisać</span>
        <span class="hljs-type">var</span> <span class="hljs-variable">data</span> <span class="hljs-operator">=</span> read();
        <span class="hljs-type">var</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> process(data);
        write(result);
    }
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">V</span> <span class="hljs-title function_">read</span><span class="hljs-params">()</span>;
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">PV</span> <span class="hljs-title function_">process</span><span class="hljs-params">(V data)</span>;
    <span class="hljs-keyword">protected</span> <span class="hljs-keyword">abstract</span> <span class="hljs-type">void</span> <span class="hljs-title function_">write</span><span class="hljs-params">(PV data)</span>;
}
</code></pre>
<ul>
<li><strong>Kiedy:</strong> niezmienna część algorytmu raz, zmienne kroki w podklasach; kontrola rozszerzalności klas.</li>
<li><strong>Konsekwencje:</strong> redukcja duplikacji, <strong>odwrócenie sterowania</strong>, niezmienność kroków; kruche hooki.</li>
<li><strong>Kod:</strong> <code>behavioral.templatemethod</code> (<code>template-method</code>); funkcyjnie: <code>fn-template</code>.</li>
</ul>
</section>

<h2 id="415-visitor---intencja-i-struktura">4.15. Visitor - intencja i struktura</h2>
<ul>
<li><strong>Intencja:</strong> reprezentuje operacje wykonywane na elementach struktury obiektów; nowe operacje <strong>bez zmian w klasach elementów</strong>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Element.accept(Visitor v)                  ConcreteElementA.accept(v): v.visit(this)
Visitor: visit(ElementA), visit(ElementB)   nowa operacja = nowa klasa gościa
Node ▲ Department, SuperDepartment, Employee      goście: NameValidator, Reporter
</code></pre>
<ul>
<li><strong>Kiedy:</strong> struktura obejmuje wiele klas, operacje zależą od typu elementu; wiele niepowiązanych operacji bez zaśmiecania klas; klasy struktury <strong>rzadko</strong> się zmieniają.</li>
<li><strong>Konsekwencje:</strong> łatwe dodawanie i grupowanie operacji, odwiedzanie różnych hierarchii jednym gościem; <strong>trudne dodawanie nowych elementów</strong>.</li>
<li><strong>Mechanizm:</strong> podwójna dyspozycja - typ elementu wybiera <code>accept</code>, przeciążenie <code>visit(this)</code> wybiera metodę gościa.</li>
<li><strong>Powiązane:</strong> Composite (struktura), Interpreter, Iterator (przejście).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" data-style="section { font-size: 24px; }

<h2 id="416-visitor---kod-i-pu%C5%82apka-metod-domy%C5%9Blnych">4.16. Visitor - kod i pułapka metod domyślnych</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Visitor</span> {
    <span class="hljs-keyword">default</span> <span class="hljs-type">void</span> <span class="hljs-title function_">visit</span><span class="hljs-params">(Department department)</span> { }
    <span class="hljs-keyword">default</span> <span class="hljs-type">void</span> <span class="hljs-title function_">visit</span><span class="hljs-params">(SuperDepartment department)</span> { }
    <span class="hljs-keyword">default</span> <span class="hljs-type">void</span> <span class="hljs-title function_">visit</span><span class="hljs-params">(Employee employee)</span> { }
}
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Department</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Node</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">accept</span><span class="hljs-params">(Visitor visitor)</span> {
        visitor.visit(<span class="hljs-built_in">this</span>);     <span class="hljs-comment">// przeciążenie wybrane w kompilacji</span>
        <span class="hljs-built_in">super</span>.accept(visitor);   <span class="hljs-comment">// potem dzieci</span>
    }
}
</code></pre>
<ul>
<li>Puste metody domyślne: gość nadpisuje tylko to, czego potrzebuje, ale kompilator <strong>nie wymusi</strong> obsługi nowego typu.</li>
<li><code>Reporter</code> nie nadpisuje <code>visit(SuperDepartment)</code> - taki dział <strong>znika z raportu</strong> (pracownicy zostają).</li>
<li><strong>Java 25:</strong> <code>sealed</code> + <code>switch</code> z dopasowaniem sprawdza wyczerpująco. <strong>Kod:</strong> <code>behavioral.visitor</code> (<code>visitor</code>).</li>
</ul>
</section>

<h2 id="420-wariant-funkcyjny-22-co-tracimy">4.20. Wariant funkcyjny (2/2): co tracimy</h2>
<ul>
<li><strong>Semantyka:</strong> <code>fn-chain</code> (<code>step1.andThen(step2)</code>) wykonuje <strong>każdy</strong> krok - nie przerwie jak <code>Validator</code>; to potok, nie Chain of Responsibility.</li>
<li><strong>Tożsamość:</strong> lambda nie ma stabilnej tożsamości - nie wyrejestrujesz „tej samej” lambdy z listy odbiorców.</li>
<li><strong>Nazwa i kontrakt:</strong> <code>Function&lt;String, String&gt;</code> nie mówi, co obiecuje; własny interfejs funkcyjny niesie nazwę domenową.</li>
<li><strong>Stan i wyjątki:</strong> stanowa strategia potrzebuje domknięcia nad zmiennym obiektem; <code>Function</code> nie deklaruje wyjątków kontrolowanych.</li>
<li><strong>Rozszerzalność:</strong> druga operacja (<code>undo</code>, <code>describe</code>) wymusza powrót do klasy.</li>
<li><strong>Diagnostyka:</strong> ślady stosu z <code>lambda$main$0</code> są mniej czytelne niż nazwa klasy.</li>
</ul>
<p>Funkcja dla <strong>jednej, bezstanowej</strong> roli; klasa, gdy rola ma nazwę, stan, kilka operacji lub cykl życia.</p>
</section>

<h2 id="%C4%87wiczenie-1-rozpoznawanie-wzorc%C3%B3w-w-kodzie-20--10-min">Ćwiczenie 1: rozpoznawanie wzorców w kodzie (20 + 10 min)</h2>
<ul>
<li>Cel: rozpoznać wzorzec po <strong>intencji</strong>, nie po nazwie pakietu - w kodzie <code>pl.training.module4</code> i w JDK.</li>
<li>Dla 12 fragmentów: wzorzec (lub kilka), role z katalogu, intencja jednym zdaniem, koszt lub ryzyko widoczne w kodzie.</li>
<li>Szukaj wzorców „ukrytych”: builder w <code>ServerEvent</code>, Flyweight w interpreterze, proxy, które jest dekoratorem.</li>
</ul>
<p>Szczegóły: zadania modułu 4, Ćwiczenie 1.</p>
</section>

<ul>
<li>Cel: dodać kanał <code>PushSender</code> i rodzaj <code>SignedMessage</code> w Bridge oraz operację <code>EmployeeCounter</code> w Visitor - <strong>bez zmiany</strong> istniejących klas.</li>

<ul>
<li>Cel: porównać trzy pary z katalogu i pakietu <code>fn</code> (nazwa, stan, tożsamość, rozszerzalność, testowalność, semantyka).</li>

<h2 id="kluczowe-wnioski-z-om%C3%B3wienia">Kluczowe wnioski z omówienia</h2>
<ul>
<li><code>PaymentLoggerProxy</code> jest strukturalnie dekoratorem - nazwa klasy nie przesądza o wzorcu.</li>
<li>Nowy kanał w Bridge i nowa operacja w Visitor nie wymagają zmian istniejących klas; nowy rodzaj węzła wymaga zmiany <code>Visitor</code>.</li>
<li>Puste metody domyślne w <code>Visitor</code> ukrywają brak obsługi <code>SuperDepartment</code> - kompilator nie pomoże.</li>
<li><code>fn-chain</code> nie jest Chain of Responsibility - <code>andThen</code> nie przerywa; potrzebny <code>Optional</code> lub jawny warunek.</li>
<li>Command z <code>undo</code> i Observer z wyrejestrowaniem wracają do klas; bezstanowa Strategy zostaje lambdą.</li>
<li>Część kart problemów najlepiej rozwiązuje zwykły <code>if</code>, <code>enum</code> lub <code>record</code>.</li>
</ul>
<p>Pełne omówienie: rozwiązania modułu 4.</p>
</section>

<h2 id="sprawdzenie-wiedzy">Sprawdzenie wiedzy</h2>
<ol>
<li>Z jakich elementów składa się opis wzorca i dlaczego wzorzec to nie gotowy kod?</li>
<li>Czym różnią się wzorce klasowe od obiektowych? Podaj przykłady.</li>
<li>Co jest trudne do dodania w Abstract Factory?</li>
<li>Co odróżnia Adapter, Decorator i Proxy, skoro wszystkie opakowują obiekt?</li>
<li>Co odróżnia State od Strategy?</li>
<li>Jaki wymiar zmian preferuje Visitor i co go psuje?</li>
<li>Kiedy wariant funkcyjny wzorca zmienia jego semantykę?</li>
<li>Jakie sygnały mówią, że wzorzec jest zbędny?</li>
</ol>
</section>

<h2 id="lista-kontrolna">Lista kontrolna</h2>
<ul>
<li><strong>Problem:</strong> opisany bez nazwy wzorca; nazwany rodzaj zmienności; warianty istnieją dziś, nie „kiedyś”.</li>
<li><strong>Wybór:</strong> sprawdzona prostsza alternatywa (<code>if</code>, <code>enum</code>, <code>record</code>, lambda); znane konsekwencje z katalogu, także negatywne.</li>
<li><strong>Kontrakt:</strong> jawna kolejność (dekoratory, odbiorcy), polityka błędów, stan po wyjątku, tożsamość i cykl życia instancji.</li>
<li><strong>Rozszerzenie:</strong> wiadomo, która oś jest otwarta (nowa operacja czy nowy typ); test kontraktowy dla implementacji.</li>
<li><strong>Wyjście:</strong> wiadomo, kiedy wzorzec uprościć lub usunąć (moduł 5).</li>
</ul>
</section>

<h2 id="podsumowanie---najwa%C5%BCniejsze-wnioski">Podsumowanie - najważniejsze wnioski</h2>
<ul>
<li>Wzorzec to nazwane rozwiązanie problemu w kontekście - liczy się <strong>intencja i konsekwencje</strong>, nie diagram.</li>
<li>Klasyfikacja GoF: kreacyjne, strukturalne, behawioralne; klasowe (dziedziczenie) i obiektowe (kompozycja).</li>
<li>Te same struktury (opakowanie, delegacja, kontekst z polimorficznym polem) realizują różne intencje - rozróżnia je pytanie <strong>co się zmienia i kto o tym decyduje</strong>.</li>
<li>Każdy wzorzec ma cenę: typy, pośredniość, kontrakt do utrzymania.</li>
<li>Java 25 skraca zapis wielu ról (lambda, <code>enum</code>, <code>record</code>, <code>sealed</code>) - intencja zostaje, ale część semantyki trzeba zapewnić jawnie.</li>
<li>Moduł 5: jak dojść do wzorca (i od niego odejść) bezpiecznymi krokami.</li>
</ul>
</section>
